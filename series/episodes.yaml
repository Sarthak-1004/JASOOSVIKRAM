  black_lotus: "The deadly ivory box was delivered by a boy from Pankaj Seva Sadan hospital as a 'get-well gift'. Earlier, Devendranath had visited the 'dying' Vikram: the room smelled of kewra; he picked up a pen with his LEFT hand and wrote 'जल्दी ठीक हो जाओ' in violet ink. After Sood's arrest Vikram stares at that note for a long time: 'अब मुझे यक़ीन है।' He says no name."
  beats:
    - "HOOK: 'जासूस विक्रम मर रहे हैं।' Amma ji runs to Savitri at night: Vikram has not eaten for three days and is delirious with a rare Sumatran fever. He forbids Savitri to touch him: 'पास मत आना! ये बीमारी छूने से फैलती है!'"
    - "Vikram raves about oysters and coins, and insists only one man can cure him: Kulwant Sood. Savitri fetches him; Sood comes eagerly."
    - "Vikram tells Savitri to hide behind the head of the bed."
    - "Alone with the 'dying' Vikram, Sood gloats: he killed his own nephew with this disease and sent Vikram an ivory box with a hidden spring needle; he pockets the box to destroy the evidence."
    - "Vikram asks him to turn up the gas lamp - the signal. Bhairav bursts in and arrests Sood."
    - "Vikram sits up and eats: three days of starving, belladonna drops, wax on his lips - and he kept Savitri away because a doctor would have seen through it. 'माफ़ करना, सावित्री। तुम्हारे आँसू ही इस नाटक को सच बना सकते थे।' Black Lotus moment. Question: 'विक्रम किसके बारे में सोच रहे थे?'"
  shorts:
    - "'पास मत आना!' Ends on: 'क्या ये विक्रम का अंत है?'"
    - "An ivory box with a hidden needle. Ends on: 'ये तोहफ़ा किसने भेजा?'"
    - "Sood gloats beside the bed. Cut before the lamp signal."
  thumbnail:
    text: "विक्रम की आख़िरी साँसें?"
    prompt: >-
      Detective Vikram pale and sweating in bed in a lamp-lit room, a woman doctor in tears reaching out,
      a plump man's sinister shadow at the door, an ivory box on the side table, deep red accent.

# ------------------------------------------------------------------ EP 27
- n: 27
  source: The Adventure of the Sussex Vampire
  title: "क्या माँ चुड़ैल थी?"
  setting: A coffee-estate bungalow in Coorg, 1924, misty and remote.
  characters:
    - "Rohit Kariappa: a coffee planter, Vikram's old college friend"
    - "Leela: his second wife, who grew up in Rangoon, quiet and proud"
    - "Jai: his 15-year-old son from his first marriage, lame after a childhood fall, jealous"
    - "The baby; Dai Gangamma, the nurse; the family dog, strangely paralysed"
  black_lotus: "While Vikram is away, a Black Lotus letter arrives at his lodgings: 'खेल ख़त्म होने वाला है, विक्रम। अगली चाल आख़िरी होगी।' Savitri notices that the violet ink and the kewra smell match Devendranath's party invitation lying on the same table. She freezes."
  beats:
    - "HOOK: the nurse screams - the young mother is bent over her baby, lips at the baby's neck, a red stain at her mouth (no gore). The village whispers: 'चुड़ैल!'"
    - "She has also twice struck her stepson Jai for no reason. She refuses to explain and locks herself in."
    - "Vikram arrives: Burmese weapons on the wall and a quiver with darts missing; the family dog strangely paralysed; Jai's reflection in the window as he watches the baby with hatred."
    - "Reveal: Jai, jealous of the baby, pricked it with a poisoned Burmese dart (he had tested it on the dog). The mother sucked the poison out to save her baby and kept silent to spare her husband the truth about his son."
    - "No chudail, only a mother's love. Jai is sent to a school by the sea. Black Lotus letter. Question."
  shorts:
    - "The mother at the baby's neck. Ends on: 'क्या वो सच में चुड़ैल थी?'"
    - "The paralysed dog. Ends on: 'कुत्ते को क्या हुआ?'"
    - "Jai's reflection in the window glass. Ends on: 'आपने भी देखा?'"
  thumbnail:
    text: "क्या माँ चुड़ैल थी?"
    prompt: >-
      A young mother in a sari bent over a cradle in a dark lamp-lit room, a nurse screaming in the doorway,
      a witch-like shadow on the wall, deep red accent, no blood.

# ------------------------------------------------------------------ EP 28
- n: 28
  source: The Adventure of the Beryl Coronet
  title: "टूटा हुआ मुकुट"
  setting: Banaras, 1924, just after heavy rain. A banker's house with a mud courtyard.
  characters:
    - "Seth Dwarkadas Agarwal: a respectable banker"
    - "Arun: his wild but honest son"
    - "Meenu: his sweet niece, secretly in love with a scoundrel"
    - "Kunwar Shamsher Singh: a charming gambler and famous marksman (the Black Lotus's right hand)"
  black_lotus: "BIG TWIST: the CID arrests Inspector Bhairav as the Black Lotus - a black lotus seal and letters 'found' in his house. Headlines: 'काला कमल पकड़ा गया!' Devendranath publicly congratulates the police. Vikram to Savitri: 'भैरव बेवकूफ़ है, बेईमान नहीं। असली कमल अब भी खुला घूम रहा है... और आज रात वो मुस्कुरा रहा होगा।'"
  beats:
    - "HOOK: midnight. The banker wakes to find his son holding the Maharaja's priceless topaz crown, left with the bank as security - one corner broken off, three stones missing. 'आधी रात, बेटे के हाथ में टूटा मुकुट।'"
    - "The son refuses to explain and is arrested."
    - "Vikram reads the footprints in the rain-wet courtyard mud: a woman to the side door, a man waiting, then bare feet chasing in a hurry."
    - "Vikram disguised as a loafer buys a servant's old shoes and confronts Shamsher, who draws a pistol; Vikram's cane is faster."
    - "Reveal: Meenu stole the crown for Shamsher; Arun saw, chased him and wrestled the crown back, a piece breaking off; he stayed silent to protect his cousin. Meenu runs away with Shamsher."
    - "Vikram buys back the stones. Then the twist: Bhairav arrested as the Black Lotus. Question: 'क्या भैरव ही काला कमल है?'"
  shorts:
    - "The son with the broken crown at midnight. Ends on: 'क्या बेटा ही चोर था?'"
    - "Footprints in the wet mud. Ends on: 'आप पढ़ पाए?'"
    - "Bhairav in handcuffs, 'काला कमल पकड़ा गया!' Ends on: 'क्या भैरव ही काला कमल है? कमेंट करें।'"
  thumbnail:
    text: "टूटा हुआ मुकुट"
    prompt: >-
      A young man in nightclothes holding a broken jewelled crown in a dark room, his father in the doorway
      with a candle in shock, rain on the window, deep red accent.

# ------------------------------------------------------------------ EP 29
- n: 29
  source: The Final Problem
  title: "मौत का झरना"
  setting: Banaras, then a night train east, Shillong, and the thundering waterfall at Cherrapunji in the monsoon, 1924.
  characters:
    - "The Black Lotus: only a voice in the dark and a cloaked silhouette"
    - "Raghav: arranges the escape"
    - "A boy messenger in Cherrapunji"
  black_lotus: "Final image: back in Banaras, at the Pankaj Seva Sadan charity gala, Devendranath raises a glass 'to the memory of the great detective Vikram' and lightly touches the handle of his ivory walking stick."
  beats:
    - "HOOK: a rain-lashed cliff at Cherrapunji. Two figures struggle at the edge of a roaring waterfall - one in a navy coat with a brass-handled cane, one in a long black cloak. Then both are gone. 'उस दिन झरने ने दो आदमियों को निगल लिया।'"
    - "Flashback: Vikram arrives at Savitri's clinic at night and closes the shutters; his knuckles are bruised. 'आज तीन बार मुझे मारने की कोशिश हुई।' He knows who the Black Lotus is; in three days the police will close the whole network - but he must survive three days."
    - "The Black Lotus had visited him - a voice in the dark: 'मेरा रास्ता छोड़ दो, विक्रम।' Vikram: 'तो हम दोनों गिरेंगे।'"
    - "The escape by Raghav's plan: separate train carriages, a sudden stop at a small station while a special train hired by their enemy thunders past."
    - "Cherrapunji: a boy brings a message that a sick Englishwoman at the hotel needs a doctor. Savitri goes, realises it is a trick, and runs back through the rain."
    - "At the waterfall: only Vikram's cane and a note under his silver case: 'सावित्री, वो यहाँ आया। आज हमारा हिसाब होगा। मेरी फ़ाइल राघव के पास है।' Two sets of footprints to the edge, none coming back."
    - "Savitri's grief: 'उस दिन मैंने अपना सबसे अच्छा दोस्त खो दिया।' The gala image. Question: 'क्या विक्रम सच में चले गए? कल आख़िरी एपिसोड।'"
  shorts:
    - "Two figures at the waterfall's edge. Ends on: 'क्या विक्रम मर गए?'"
    - "'आज तीन बार मुझे मारने की कोशिश हुई।' A bullet hole in the shutter. Ends on: 'कौन है ये?'"
    - "The cane and the note at the edge. Ends on: 'क्या ये अंत है? कल आख़िरी एपिसोड।'"
  thumbnail:
    text: "मौत का झरना"
    prompt: >-
      A roaring waterfall in heavy monsoon rain, two struggling silhouettes at the cliff edge, a brass-handled
      cane lying on the wet rocks, deep red accent.

# ------------------------------------------------------------------ EP 30
- n: 30
  source: The Adventure of the Empty House
  title: "काला कमल कौन?"
  setting: Banaras, three months later, 1924. Vikram's lodging, the empty house opposite it, and the glittering Pankaj Seva Sadan gala at Devendranath's palace.
  note: "Season finale. Reveal the Black Lotus as Rai Bahadur Devendranath through all the clues planted across the season. End with a Season 2 tease."
  characters:
    - "Kunwar Shamsher Singh: the marksman with a silent air-rifle"
    - "Inspector Bhairav: released, wants to redeem himself"
    - "Raghav, Amma ji, Devendranath"
  black_lotus: "THE REVEAL. Vikram lays out the clues in order: kewra on every letter (Ep 1, 5, 6, 19, 27); violet ink and a left-handed slant (Ep 2, 8, 20, 26); 'पंकज' means lotus - Pankaj Seva Sadan behind the crimes (Ep 3, 10, 14, 18, 23, 24, 25); then he unscrews the ivory handle of Devendranath's walking stick - the black lotus seal is inside."
  beats:
    - "HOOK: three months after Vikram's 'death', a young nobleman is shot dead in a locked room in Banaras and no one heard a shot. Savitri investigates alone; an old hunchbacked bookseller bumps into her... in her clinic he straightens up - it is Vikram! Savitri faints for the only time in her life. 'जिसे सारी दुनिया मरा समझ रही थी... वो मेरे सामने खड़ा था।'"
    - "Vikram explains: at the waterfall a wrestling trick sent the cloaked agent over the edge; Vikram climbed the cliff and played dead to catch the network. Only Raghav knew."
    - "The locked-room shooting was done with Shamsher's silent air-rifle - and Shamsher will now come for Vikram."
    - "The trap: in the empty house opposite, Vikram and Savitri wait in darkness while a wax bust of Vikram sits in his lit window, Amma ji turning it every fifteen minutes. Shamsher fires - the wax head shatters - Vikram and the released Bhairav seize him. Shamsher laughs: 'मुझे पकड़ लिया, पर कमल को कभी नहीं पकड़ पाओगे।'"
    - "The gala: Vikram walks in alive; the room falls silent. He lays out every clue, unscrews the walking stick: the black lotus seal. 'राय बहादुर देवेंद्रनाथ... आप ही काला कमल हैं।'"
    - "Devendranath's calm smile: 'पहली चाल तुम्हारी थी, विक्रम... और आख़िरी भी।' Bhairav, redeemed, arrests him."
    - "Season 2 tease: in his cell Devendranath lets a single black petal fall: 'कमल एक नहीं होता, विक्रम... कीचड़ में सौ उगते हैं।' Question: 'क्या आपने पहले ही पहचान लिया था? किस एपिसोड में? कमेंट में बताइए।'"
  shorts:
    - "The old bookseller straightens up. Ends on: 'विक्रम ज़िंदा हैं?!'"
    - "The wax head in the window shatters. Ends on: 'गोली किसने चलाई?'"
    - "Vikram begins to unscrew the walking stick handle. Cut before the reveal. Ends on: 'काला कमल कौन? पूरा एपिसोड चैनल पर।'"
  thumbnail:
    text: "काला कमल कौन?"
    prompt: >-
      Detective Vikram in a grand chandelier-lit hall holding up an ivory walking stick whose handle is unscrewed,
      revealing a black lotus seal; shocked guests in shadow, one silver-haired figure turned away, deep red accent.
