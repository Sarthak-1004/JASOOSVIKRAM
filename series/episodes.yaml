# ==================================================================
# SEASON 1 - जासूस विक्रम - 30 episodes, one per day, in order.
#
# Fields (only "source" is required):
#   title / setting / characters / beats  -> what Gemini must write
#   black_lotus  -> this episode's clue in the season mystery (see bible.yaml secret_arc)
#   shorts       -> the 3 Shorts moments (Gemini picks the scene ranges)
#   clips        -> exact scene ranges for the Shorts (only used with a fixed script)
#   thumbnail    -> text + image prompt for the thumbnail
#   script       -> a fully written narration, one entry per scene; Gemini then only draws it
#
# Every story is adapted from a public-domain Arthur Conan Doyle story.
# ==================================================================

# ------------------------------------------------------------------ EP 1
- n: 1
  source: The Adventure of the Speckled Band
  title: "आधी रात की सीटी"
  setting: Banaras, 1921 and 1923. A crumbling haveli on the edge of the city, a cheetah loose in the compound at night.
  characters:
    - "Meera: terrified young woman (early 20s), pale, simple white-and-red cotton sari; her wedding is near"
    - "Kamla: Meera's identical twin sister, died two years ago (same face as Meera, nightclothes, long open hair)"
    - "Thakur Raghuvendra Singh: their huge, violent stepfather, 50s, thick grey moustache, dark angarkha, back from Burma"
  black_lotus: "The final letter is sealed with a black lotus, written in violet ink, and smells faintly of kewra."
  beats:
    - "HOOK: midnight scream; Kamla stumbles out of her locked room and dies whispering 'वो पट्टी... चितकबरी पट्टी!'"
    - "Two years later Meera comes to Vikram: her wedding is near, and last night she heard the same whistle."
    - "Backstory: the cruel Thakur, the animals, the inheritance condition, Kamla's death two weeks before her wedding."
    - "The Thakur threatens Vikram and bends an iron poker; Vikram straightens it."
    - "Clues: dummy bell-rope, vent into the Thakur's room, bed bolted to the floor, iron safe, saucer of milk, a leather leash tied in a loop."
    - "Night watch in darkness; the whistle; Vikram strikes the rope; a scream from the next room."
    - "Reveal: the snake; the motive; Vikram's signature line. The black lotus letter. A question to viewers."
  clips:
    - {start_scene: 1, end_scene: 3, hook_text: "मरते वक़्त आख़िरी शब्द", title: "बंद कमरे में मौत... आख़िरी शब्द 'चितकबरी पट्टी'", end_question: "चितकबरी पट्टी का मतलब क्या था?"}
    - {start_scene: 12, end_scene: 15, hook_text: "4 अजीब सुराग", title: "नकली रस्सी, जड़ा हुआ बिस्तर, दूध की तश्तरी... आप पहचान पाए?", end_question: "क्या आप पहचान पाए?"}
    - {start_scene: 16, end_scene: 18, hook_text: "अँधेरे में वो सीटी", title: "आधी रात, घुप अँधेरा... और फिर वो सीटी", end_question: "आगे क्या हुआ?"}
  thumbnail:
    text: "आधी रात की सीटी"
    prompt: >-
      Close-up of Meera's terrified face lit by a single candle in a dark haveli room,
      a snake silhouette coiled on a bell-rope behind her in deep red accent colour.
  script:
    - >-
      आधी रात थी। बनारस की उस पुरानी हवेली में अचानक एक चीख गूँजी। कमला का दरवाज़ा अंदर से बंद था।
      वो लड़खड़ाती हुई बाहर निकली, ज़मीन पर गिर पड़ी, और आख़िरी साँस में बस इतना बोली... "वो पट्टी... चितकबरी पट्टी!"
    - >-
      न कोई ज़ख़्म था, न ज़हर का निशान। कमरा अंदर से बंद, खिड़कियों पर लोहे की सलाखें।
      लोग कहते थे, हवेली पर किसी प्रेत का साया है। पर अगर ये प्रेत नहीं था... तो कमला को मारा किसने?
    - >-
      मैं सावित्री हूँ। ये कहानी है जासूस विक्रम की, और उस रात की, जिसे मैं आज तक नहीं भूल पाई।
      दो साल बाद, एक धुंध भरी सुबह, विक्रम के दरवाज़े पर एक लड़की खड़ी थी। चेहरा सफ़ेद, हाथ काँपते हुए।
    - >-
      उसने कहा, "मेरा नाम मीरा है। कमला मेरी जुड़वाँ बहन थी।" विक्रम की नज़र उसकी कलाई के नीले निशानों पर ठहर गई।
      उन्होंने धीरे से पूछा, "ये निशान तुम्हारे सौतेले पिता ने दिए हैं?" मीरा ने नज़रें झुका लीं।
    - >-
      फिर मीरा ने वो बात कही, जिससे मेरी रीढ़ में सिहरन दौड़ गई। "अगले महीने मेरी शादी है।
      मुझे कमला के कमरे में सुलाया जा रहा है। और कल रात... मैंने वही सीटी सुनी।
      ठीक वैसी, जैसी कमला ने मरने से पहले सुनी थी।"
    - >-
      मीरा के सौतेले पिता थे ठाकुर रघुवेंद्र सिंह। बर्मा से लौटा एक गुस्सैल आदमी, जिससे पूरा मोहल्ला डरता था।
      नौकर एक-एक करके हवेली छोड़कर भाग गए थे।
    - >-
      हवेली के अहाते में रात को एक चीता खुला घूमता था। बर्मा से लाए अजीब जानवर पिंजरों में बंद रहते थे।
      और ठाकुर के कमरे से, आधी रात को, ऐसी आवाज़ आती थी, जैसे कोई लोहे का दरवाज़ा धीरे से बंद कर रहा हो।
    - >-
      दोनों बहनों की माँ बहुत दौलत छोड़ गई थीं, पर सारी दौलत ठाकुर के हाथ में थी। वसीयत में एक शर्त थी...
      जिस दिन बेटी की शादी होगी, उसका हिस्सा उसे मिल जाएगा। ये सुनते ही विक्रम की आँखें सिकुड़ गईं।
    - >-
      कमला की भी शादी तय हुई थी। शादी से ठीक दो हफ़्ते पहले, वो मर गई। मरने से एक रात पहले उसने मीरा से पूछा था,
      "क्या तुझे भी रात में सीटी सुनाई देती है? और उसके बाद... धातु की एक खनक?"
    - >-
      मीरा के जाते ही दरवाज़ा धड़ाम से खुला। ठाकुर रघुवेंद्र खुद आ गया था। उसने विक्रम को धमकाया,
      और लोहे की छड़ मोड़कर फ़र्श पर फेंक दी। उसके जाते ही विक्रम ने छड़ उठाई, और मुस्कराते हुए उसे वापस सीधा कर दिया।
    - >-
      उसी दोपहर हम हवेली पहुँचे। ठाकुर शहर गया था। विक्रम ने कमला के कमरे को ऐसे देखा,
      जैसे दीवारें उनसे बातें कर रही हों। फिर उनकी नज़र बिस्तर के ऊपर लटकी घंटी की रस्सी पर ठहर गई।
    - >-
      उन्होंने रस्सी खींची। कोई घंटी नहीं बजी। रस्सी किसी घंटी से जुड़ी ही नहीं थी! वो छत के पास,
      एक छोटे से रोशनदान के कुंडे से बँधी थी। मैंने पूछा, "ऐसी रस्सी कोई क्यों लगाएगा?" विक्रम चुप रहे।
    - >-
      और वो रोशनदान बाहर हवा में नहीं खुलता था। वो खुलता था सीधे ठाकुर के कमरे में। फिर विक्रम ने बिस्तर को
      हिलाने की कोशिश की। वो हिला ही नहीं। बिस्तर फ़र्श में लोहे की कीलों से जड़ा हुआ था।
    - >-
      ठाकुर के कमरे में एक भारी लोहे की तिजोरी थी। उस पर रखी थी दूध की एक तश्तरी।
      और कुर्सी पर पड़ा था चमड़े का एक पट्टा, जिसका सिरा फंदे की तरह बँधा था। विक्रम का चेहरा पत्थर हो गया।
    - >-
      रुकिए। एक नकली रस्सी। एक रोशनदान, जो बगल के कमरे में खुलता है। ज़मीन में जड़ा बिस्तर। और दूध की तश्तरी।
      क्या आपने वो सुराग पकड़ा, जो विक्रम पकड़ चुके थे? सोचिए... जवाब इसी कमरे में है।
    - >-
      उस रात हमने मीरा को दूसरे कमरे में भेज दिया, और हम दोनों कमला के कमरे में अँधेरे में बैठ गए।
      न दीया, न लालटेन। विक्रम ने फुसफुसाकर कहा, "सोना मत, सावित्री। हमारी जान इसी पर टिकी है।"
    - >-
      घड़ी ने बारह बजाए। फिर एक। फिर दो। बाहर अहाते में चीते के घूमने की आहट थी।
      अचानक रोशनदान से एक पल को रोशनी चमकी, और जलते तेल की गंध आई। बगल के कमरे में कोई जाग रहा था।
    - >-
      और तभी... वो सीटी। धीमी, लंबी, ठंडी सीटी। अगले ही पल विक्रम उछले, माचिस जलाई,
      और अपनी छड़ी से रस्सी पर ताबड़तोड़ वार करने लगे। "देखा तुमने, सावित्री? देखा?"
    - >-
      मैंने कुछ नहीं देखा। बस किसी चीज़ के सरकने की हल्की सी आवाज़ सुनी। फिर बगल के कमरे से एक ऐसी भयानक चीख उठी,
      जो आज भी मेरे सपनों में गूँजती है। और फिर... सन्नाटा।
    - >-
      हम लालटेन लेकर ठाकुर के कमरे में घुसे। तिजोरी का दरवाज़ा खुला था। ठाकुर कुर्सी पर बेजान बैठा था,
      आँखें छत पर टिकी हुईं। और उसके माथे के चारों ओर लिपटी थी एक पीली, चितकबरी पट्टी... जो धीरे-धीरे हिलने लगी।
    - >-
      "ये पट्टी नहीं, सावित्री। बर्मा का सबसे ज़हरीला साँप है," विक्रम बोले। "ठाकुर इसे रोशनदान से रस्सी के सहारे
      बिस्तर तक भेजता, और सीटी बजाकर वापस बुला लेता। बेटियों की शादी होती, तो दौलत हाथ से जाती।
      आज मेरी छड़ी की मार से साँप पलटा... और अपने ही मालिक पर टूट पड़ा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
    - >-
      जाते-जाते विक्रम की नज़र मेज़ पर पड़ी। काले कमल की मुहर वाला एक लिफ़ाफ़ा। अंदर बैंगनी स्याही में लिखा था...
      "पहली चाल तुम्हारी, विक्रम... अगली मेरी।" कागज़ से केवड़े की हल्की ख़ुशबू आ रही थी।
      कौन है ये काला कमल? अपना शक कमेंट में लिखिए।

# ------------------------------------------------------------------ EP 2
- n: 2
  source: The Red-Headed League
  title: "दीवार के अंदर कौन?"
  setting: Banaras, Chowk bazaar, 1923. A small pawnshop wall-to-wall with the Kashi Imperial Bank.
  characters:
    - "Lala Ramdas: fat, cheerful pawnbroker, 50s, with a striking white streak in his black hair"
    - "Jaidev: his eager young assistant who works for half pay and spends hours in the cellar 'developing photographs'"
    - "A smooth-talking man who runs the 'सफ़ेद लट सभा' (Society of the White Streak)"
  black_lotus: "Jaidev hisses 'काले कमल को ख़बर पहुँच जाएगी, विक्रम।' as he is taken away. Devendranath, the bank's owner, signs Vikram's reward cheque with his LEFT hand (just shown, never commented on)."
  beats:
    - "HOOK: midnight; behind the bank vault wall a faint 'ठक... ठक... ठक'. The night watchman swears it is the ghost of a robber buried in the wall."
    - "Ramdas comes laughing and confused: for eight weeks the 'सफ़ेद लट सभा' paid him four rupees a day just to copy an old book by hand from 10 to 2. Only men with a white streak could apply. Today the office is locked with a note: 'सभा भंग'."
    - "Vikram asks about the assistant: half pay, always in the cellar, the knees of his pyjama worn and muddy."
    - "Vikram taps the pavement outside the shop with his cane, listening; checks what is behind the shop - the bank."
    - "Introduce Rai Bahadur Devendranath, the bank's gentle owner, and Inspector Bhairav. They wait in the pitch-dark vault on Saturday night."
    - "A floor stone lifts; a hand with a lantern; Jaidev climbs out of a tunnel. Bhairav grabs the wrong man first (comic), Vikram catches Jaidev."
    - "Reveal: the society was a trick to keep Ramdas out of his shop four hours a day while they dug. Signature line. Black Lotus moment. Question to viewers."
  shorts:
    - "The knocking inside the vault wall at midnight. Ends on: 'दीवार के अंदर कौन था?'"
    - "The strange job: paid only for having a white streak in your hair. Ends on: 'ये नौकरी असली थी या जाल?'"
    - "The dark vault; a floor stone slowly starts to lift. Cut before anyone appears."
  thumbnail:
    text: "दीवार के अंदर कौन?"
    prompt: >-
      Frightened night watchman pressing his ear to a cracked bank vault wall, holding a lantern,
      a glowing hand-shaped shadow behind the cracks, deep red accent.

# ------------------------------------------------------------------ EP 3
- n: 3
  source: The Adventure of the Copper Beeches
  title: "नीली साड़ी का राज़"
  setting: A lonely bungalow called 'देवदार कोठी' on a foggy hill outside Shimla, 1923, pine forest all around.
  characters:
    - "Anjali: brave young governess, 22, long hair at first, then cut short"
    - "Seth Kishorilal: plump, over-smiling employer who laughs too loudly"
    - "Mrs Kishorilal: pale, silent second wife"
    - "Tolu: drunk caretaker; Bagha: a huge half-starved mastiff released at night"
    - "Alka: Seth's daughter from his first marriage (unseen until the end); her fiance waiting on the road"
  black_lotus: "The Seth's ledger shows a large loan from 'पंकज सेवा सदन, बनारस'. Savitri thinks it is just the charity's kindness."
  beats:
    - "HOOK: through a keyhole in the 'empty' locked wing, Anjali sees a shadow pacing. The family says no one lives there. 'उस बंद कमरे में कोई था।'"
    - "Flashback: before taking the job Anjali asked Vikram's advice - three times the normal pay, but she must cut her long hair, wear a particular blue sari, sit with her back to the window and laugh at the Seth's stories."
    - "At the bungalow: using a mirror hidden in her handkerchief she sees a man watching from the road. In a locked drawer she finds a coil of long hair exactly like her own."
    - "She telegraphs Vikram. Vikram and Savitri arrive in Shimla."
    - "Deduction: Anjali is playing someone - Alka, the daughter, locked in the wing so her fiance believes she no longer cares. The Seth wants her inheritance."
    - "Night rescue: the wing is empty, the skylight open - Alka has escaped with her fiance. The Seth chases them and releases Bagha; the starving dog turns on its own master (off-screen; he survives, crippled)."
    - "Ending: Anjali safe, Alka married. Signature line. Black Lotus clue. Question."
  shorts:
    - "The keyhole and the pacing shadow. Ends on: 'उस बंद कमरे में कौन था?'"
    - "The strange conditions: cut your hair, wear the blue sari, laugh, sit with your back to the window. Ends on: 'आख़िर क्यों?'"
    - "The night rescue; the chain of the dog clinks loose. Cut."
  thumbnail:
    text: "नीली साड़ी का राज़"
    prompt: >-
      Young woman in a blue sari with freshly cut short hair peering through the keyhole of a locked
      wooden door in a foggy hill bungalow, a tall shadow behind the door, deep red accent.

# ------------------------------------------------------------------ EP 4
- n: 4
  source: The Adventure of the Engineer's Thumb
  title: "अनजान कोठी का बुलावा"
  setting: Mirzapur, 1923. A decaying kothi in the forest, reached by a closed carriage at midnight.
  characters:
    - "Sameer: young, poor, ambitious hydraulic engineer"
    - "Colonel Pratap: very thin man with a hollow voice and cold eyes"
    - "A frightened young woman in the kothi who tries to warn Sameer"
  black_lotus: "In the ashes Vikram finds a counterfeit silver coin with a tiny lotus where the King's head should be. Inspector Bhairav pockets one coin 'as evidence' (red herring)."
  beats:
    - "HOOK: Sameer is locked inside a giant machine room as the iron ceiling slowly comes down; a woman's voice screams 'भागो!'"
    - "Morning: Sameer reaches Savitri's clinic with his right hand bandaged - he has lost his thumb (only the bandage is shown). She brings him to Vikram."
    - "His story: Colonel Pratap offered fifty rupees for one night repairing a 'multani mitti' press, in total secrecy. A closed carriage with frosted windows drove for an hour, but the horse was fresh - Vikram deduces they went in circles and the kothi is near the station."
    - "Inside: the press leaks; Sameer notices a metal crust on the floor, not mud, and asks one question too many. The Colonel locks him in and starts the press."
    - "He escapes through a gap in the wooden wall; the woman leads him to a window; as he hangs from the sill a cleaver swings (off-screen). He wakes in bushes near the station."
    - "Vikram, Savitri and Bhairav go back: the kothi is burning from the lamp Sameer dropped; the gang has fled. The press was making counterfeit silver coins."
    - "Signature line, Black Lotus coin, question to viewers."
  shorts:
    - "The iron ceiling coming down. Ends on: 'क्या समीर बच पाया?'"
    - "The puzzle: an hour's drive but the horse was fresh. Ends on: 'कोठी असल में कितनी दूर थी?'"
    - "Hanging from the window, the shadow of a raised cleaver. Cut."
  thumbnail:
    text: "मौत की मशीन"
    prompt: >-
      Young Indian engineer in a 1920s waistcoat pushing against a descending iron ceiling in a dark
      machine room lit by one lantern, a woman's silhouette at a small door, deep red accent.

# ------------------------------------------------------------------ EP 5
- n: 5
  source: The Five Orange Pips
  title: "पाँच काली पंखुड़ियाँ"
  setting: Banaras in a violent monsoon, 1923. Flooded ghats, the old Malhotra family house.
  note: "In place of the original secret society, use the Black Lotus network. Vikram FAILS to save his client - the season's emotional turning point."
  characters:
    - "Arjun Malhotra: polite, frightened 19-year-old"
    - "His late uncle Ishwar (got rich in Rangoon, paranoid) and late father Madan"
