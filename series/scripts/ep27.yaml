# EP 27 - क्या माँ चुड़ैल थी? (The Adventure of the Sussex Vampire)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पालने पर झुकी माँ", title: "आधी रात, माँ अपने ही बच्चे की गर्दन पर झुकी थी...", end_question: "क्या वो सच में चुड़ैल थी?"}
  - {start_scene: 7, end_scene: 8, hook_text: "कुत्ते को अचानक लकवा", title: "बूढ़े कुत्ते को अचानक लकवा... और गर्दन पर एक छोटा सा घाव", end_question: "कुत्ते को क्या हुआ?"}
  - {start_scene: 9, end_scene: 11, hook_text: "खिड़की के काँच में", title: "जासूस बातें नहीं, खिड़की का काँच देख रहे थे...", end_question: "आपने भी देखा?"}
script:
  - >-
    कुर्ग के उस बंगले में आधी रात को दाई गंगम्मा की चीख गूँजी। उसने दरवाज़े से देखा... जवान माँ, लीला, अपने बच्चे के पालने पर झुकी हुई थी, होंठ बच्चे की गर्दन से लगे हुए। और जब उसने सिर उठाया, उसके होंठों पर एक लाल निशान था।
  - >-
    पूरा बंगला जाग गया। नौकर फुसफुसाने लगे, फिर पूरा गाँव। "चुड़ैल है! दूर देश से आई बहू, अपने ही बच्चे का ख़ून पीती है!" पर क्या वो सच में चुड़ैल थी?
  - >-
    मैं सावित्री हूँ। रोहित करियप्पा, कुर्ग के कॉफ़ी बाग़ान के मालिक, विक्रम के कॉलेज के पुराने दोस्त थे। उनकी चिट्ठी काँपते हाथों से लिखी गई थी। "विक्रम, मेरी पत्नी... मुझे डर है, मैं पागल हो जाऊँगा।"
  - >-
    रोहित की पहली पत्नी गुज़र चुकी थी। उनसे एक बेटा था, जय। पंद्रह साल का, बचपन में गिरने से एक पैर से लँगड़ा, बेहद भावुक। फिर रोहित ने लीला से शादी की, जो रंगून में पली-बढ़ी थी। अब उनका एक साल का बच्चा था।
  - >-
    रोहित बोले, "लीला बहुत प्यार करने वाली औरत है, विक्रम। पर दो बार उसने जय को बिना किसी वजह के मारा। और अब ये... वो कुछ नहीं बताती। बस अपने कमरे में बंद है।"
  - >-
    हम कुर्ग पहुँचे। धुंध में लिपटा, सुनसान बंगला। दीवारों पर रोहित के जुटाए बर्मा के पुराने हथियार टँगे थे। भाले, धनुष, और ज़हर बुझे तीरों का एक तरकश।
  - >-
    दरवाज़े पर परिवार का बूढ़ा कुत्ता, रॉकी, हमें देखने आया। पर वो अजीब तरह से चल रहा था, पिछली टाँगें घसीटते हुए। रोहित बोले, "कुछ हफ़्ते पहले अचानक लकवा मार गया। डॉक्टर भी नहीं समझ पाए।"
  - >-
    विक्रम ने तरकश को ग़ौर से देखा। कुछ तीर ग़ायब थे। फिर वो कुत्ते के पास बैठे, और उसकी गर्दन सहलाने लगे। मैंने देखा, उनकी उँगलियाँ कुत्ते की गर्दन पर एक छोटे से, भरे हुए घाव पर रुक गईं।
  - >-
    तभी जय कमरे में आया। प्यारा, विनम्र लड़का। उसने अपने पिता को गले लगाया, और बहुत प्यार से उनसे बातें करने लगा। पर विक्रम उसकी बातें नहीं सुन रहे थे। वो खिड़की का काँच देख रहे थे।
  - >-
    रुकिए। बर्मा के तीर, जिनमें से कुछ ग़ायब हैं। एक कुत्ता, जिसे अचानक लकवा मार गया। और एक माँ, जो चुप है। क्या आपने पहचाना, उस खिड़की के काँच में विक्रम ने क्या देखा?
  - >-
    खिड़की के काँच में जय की परछाईं दिख रही थी। जब वो अपने पिता से बात कर रहा था, उसकी नज़र बग़ल के कमरे में रखे पालने पर थी। और उस नज़र में... ऐसी नफ़रत थी, जिसे देखकर मेरा ख़ून जम गया।
  - >-
    विक्रम ने रोहित से कहा, "मुझे लीला से मिलना है।" लीला ने पहले दरवाज़ा नहीं खोला। फिर विक्रम ने बाहर से बस इतना कहा, "मैं जानता हूँ, आपने क्या किया। और क्यों किया।" दरवाज़ा धीरे से खुल गया।
  - >-
    लीला की आँखें रो-रोकर सूजी हुई थीं। विक्रम ने रोहित को भी अंदर बुलाया, और कहा, "रोहित, तुम्हारी पत्नी चुड़ैल नहीं है। वो इस घर की सबसे बहादुर इंसान है।"
  - >-
    "किसी ने तुम्हारे बच्चे को ज़हर बुझे तीर से चुभोया था। बर्मा का वो ज़हर, जो धीरे-धीरे लकवा मार देता है। लीला ने अपने बच्चे की गर्दन से वो ज़हर चूसकर निकाला। रंगून में पली-बढ़ी लीला ये तरीक़ा जानती थी।"
  - >-
    "उसके होंठों पर जो लाल निशान था, वो उस छोटे से घाव का था। उसने तुम्हारे बच्चे की जान बचाई।" रोहित ने काँपती आवाज़ में पूछा, "पर... किसने? किसने मेरे बच्चे को चुभोया?"
  - >-
    लीला ने विक्रम की तरफ़ देखा, और सिर हिलाया, जैसे कह रही हो, मत बताइए। पर विक्रम बोले, "माफ़ करना, रोहित। ये सच तुम्हें जानना होगा।"
  - >-
    "जय। तुम्हारा बेटा। उसे लगता है कि छोटे भाई ने उससे पिता का प्यार छीन लिया। उसने पहले ये ज़हर कुत्ते पर आज़माया, फिर बच्चे पर। लीला ने उसे पकड़ लिया, इसलिए उसने जय को मारा। पर तुमसे कुछ नहीं कहा, क्योंकि वो जानती थी, ये सच तुम्हें तोड़ देगा।"
  - >-
    रोहित अपनी कुर्सी में ढह गए। बहुत देर तक कोई कुछ नहीं बोला। फिर रोहित उठे, और लीला के सामने हाथ जोड़कर बैठ गए। "मुझे माफ़ कर दो।"
  - >-
    जय को समुंदर किनारे के एक दूर के स्कूल भेज दिया गया, जहाँ उसकी अच्छी देखभाल हो सके। बच्चा पूरी तरह ठीक हो गया। और रॉकी, धीरे-धीरे फिर से चलने लगा।
  - >-
    "एक ग़ायब तीर, एक लँगड़ा कुत्ता, और खिड़की में एक परछाईं," विक्रम बोले। "कोई चुड़ैल नहीं थी। बस एक माँ का प्यार था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जब हम बनारस लौटे, तो अम्मा जी ने एक लिफ़ाफ़ा दिया। "तुम्हारे जाने के बाद आया था।" काले कमल की मुहर। बैंगनी स्याही। "खेल ख़त्म होने वाला है, विक्रम। अगली चाल आख़िरी होगी।"
  - >-
    उसी मेज़ पर, राय बहादुर देवेंद्रनाथ की दावत का निमंत्रण पत्र भी रखा था। मैंने दोनों को उठाया। वही बैंगनी स्याही। वही केवड़े की ख़ुशबू। मेरे हाथ काँपने लगे। क्या आप भी वही सोच रहे हैं, जो मैं सोच रही थी? कमेंट करें।
