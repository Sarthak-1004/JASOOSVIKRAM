# EP 27 - क्या माँ चुड़ैल थी? (The Adventure of the Sussex Vampire)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पालने पर झुकी माँ", title: "आधी रात, माँ अपने ही बच्चे की गर्दन पर झुकी थी...", end_question: "क्या वो सच में चुड़ैल थी?"}
  - {start_scene: 7, end_scene: 8, hook_text: "कुत्ते को अचानक लकवा", title: "बूढ़े कुत्ते को अचानक लकवा... और गर्दन पर एक छोटा सा घाव", end_question: "कुत्ते को क्या हुआ?"}
  - {start_scene: 9, end_scene: 11, hook_text: "खिड़की के काँच में", title: "जासूस बातें नहीं, खिड़की का काँच देख रहे थे...", end_question: "आपने भी देखा?"}
script:
  - >-
    कुर्ग के उस बंगले में आधी रात को दाई गंगम्मा की चीख गूँज उठी। उसने दरवाज़े से देखा कि जवान माँ लीला अपने बच्चे के पालने पर झुकी हुई थी और उसके होंठ बच्चे की गर्दन से लगे थे। जब लीला ने सिर उठाया, तो उसके होंठों पर एक लाल निशान था।
  - >-
    पूरा बंगला जाग गया और नौकरों के बाद पूरा गाँव फुसफुसाने लगा। लोग कहने लगे, "यह चुड़ैल है! दूर देश से आई यह बहू अपने ही बच्चे का ख़ून पीती है!" लेकिन क्या वह सच में चुड़ैल थी?
  - >-
    कुर्ग के कॉफ़ी बाग़ान के मालिक रोहित करियप्पा जासूस विक्रम के कॉलेज के पुराने दोस्त थे। उन्होंने विक्रम को काँपते हाथों से एक चिट्ठी लिखी, जिसे डॉक्टर सावित्री ने भी पढ़ा। उसमें लिखा था, "विक्रम, मुझे अपनी पत्नी को लेकर डर है कि मैं पागल हो जाऊँगा।"
  - >-
    रोहित की पहली पत्नी गुज़र चुकी थीं और उनसे जय नाम का एक बेटा था। वह पंद्रह साल का बेहद भावुक लड़का था, जो बचपन में गिरने की वजह से एक पैर से लँगड़ाता था। फिर रोहित ने रंगून में पली-बढ़ी लीला से शादी की, और अब उनका एक साल का बच्चा था।
  - >-
    रोहित बोले, "लीला बहुत प्यार करने वाली औरत है, विक्रम, लेकिन उसने दो बार जय को बिना किसी वजह के मारा है। अब यह घटना हुई है और वह कुछ नहीं बताती। वह बस अपने कमरे में बंद रहती है।"
  - >-
    विक्रम और सावित्री कुर्ग पहुँचे, जहाँ वह सुनसान बंगला धुंध में लिपटा हुआ था। उसकी दीवारों पर रोहित के जुटाए हुए बर्मा के पुराने हथियार टँगे थे। उनमें भाले, धनुष और ज़हर बुझे तीरों का एक तरकश भी था।
  - >-
    दरवाज़े पर परिवार का बूढ़ा कुत्ता रॉकी उन्हें देखने आया, लेकिन वह अपनी पिछली टाँगें घसीटते हुए अजीब तरह से चल रहा था। रोहित बोले, "कुछ हफ़्ते पहले इसे अचानक लकवा मार गया और डॉक्टर भी इसकी वजह नहीं समझ पाए।"
  - >-
    विक्रम ने तरकश को ग़ौर से देखा, जिसमें से कुछ तीर ग़ायब थे। फिर वह कुत्ते के पास बैठकर उसकी गर्दन सहलाने लगे। सावित्री ने देखा कि उनकी उँगलियाँ कुत्ते की गर्दन पर एक छोटे से भरे हुए घाव पर रुक गईं।
  - >-
    तभी जय कमरे में आया, जो एक प्यारा और विनम्र लड़का था। उसने अपने पिता को गले लगाया और बहुत प्यार से उनसे बातें करने लगा। लेकिन विक्रम उसकी बातें नहीं सुन रहे थे, वह खिड़की के काँच को देख रहे थे।
  - >-
    यहाँ एक पल रुककर सोचिए। बर्मा के कुछ ज़हरीले तीर ग़ायब थे और एक कुत्ते को अचानक लकवा मार गया था। बच्चे की माँ सब कुछ जानकर भी चुप थी। क्या आपने पहचाना कि विक्रम ने उस खिड़की के काँच में क्या देखा था?
  - >-
    खिड़की के काँच में जय की परछाईं दिख रही थी। जब वह अपने पिता से बात कर रहा था, तब उसकी नज़र बग़ल के कमरे में रखे पालने पर टिकी थी। उस नज़र में ऐसी नफ़रत थी, जिसे देखकर सावित्री का ख़ून जम गया।
  - >-
    विक्रम ने रोहित से कहा, "मुझे लीला से मिलना है।" लीला ने पहले दरवाज़ा नहीं खोला। फिर विक्रम ने बाहर से बस इतना कहा, "मैं जानता हूँ कि आपने क्या किया और क्यों किया।" यह सुनकर दरवाज़ा धीरे से खुल गया।
  - >-
    लीला की आँखें रो-रोकर सूज चुकी थीं। विक्रम ने रोहित को भी अंदर बुलाया और कहा, "रोहित, तुम्हारी पत्नी चुड़ैल नहीं है। वह इस घर की सबसे बहादुर इंसान है।"
  - >-
    विक्रम ने बताया, "किसी ने तुम्हारे बच्चे को ज़हर बुझे तीर से चुभोया था। वह बर्मा का ऐसा ज़हर है, जो धीरे-धीरे लकवा मार देता है। लीला ने अपने बच्चे की गर्दन से वह ज़हर चूसकर निकाला, क्योंकि रंगून में पली-बढ़ी लीला यह तरीक़ा जानती थी।"
  - >-
    उन्होंने कहा, "उसके होंठों पर जो लाल निशान था, वह उसी छोटे से घाव का था। उसने तुम्हारे बच्चे की जान बचाई है।" रोहित ने काँपती आवाज़ में पूछा, "लेकिन मेरे बच्चे को तीर किसने चुभोया था?"
  - >-
    लीला ने विक्रम की तरफ़ देखकर सिर हिलाया, जैसे वह कह रही हो कि यह बात मत बताइए। लेकिन विक्रम बोले, "मुझे माफ़ करना, रोहित, पर यह सच तुम्हें जानना ही होगा।"
  - >-
    विक्रम ने कहा, "यह तुम्हारे बेटे जय ने किया है। उसे लगता है कि छोटे भाई ने उससे पिता का प्यार छीन लिया है। उसने पहले यह ज़हर कुत्ते पर आज़माया और फिर बच्चे पर। लीला ने उसे पकड़ लिया था, इसलिए उसने जय को मारा, लेकिन उसने तुमसे कुछ नहीं कहा, क्योंकि वह जानती थी कि यह सच तुम्हें तोड़ देगा।"
  - >-
    रोहित अपनी कुर्सी में ढह गए और बहुत देर तक कोई कुछ नहीं बोला। फिर रोहित उठे और लीला के सामने हाथ जोड़कर बैठ गए। उन्होंने कहा, "मुझे माफ़ कर दो।"
  - >-
    जय को समुंदर किनारे के एक दूर के स्कूल में भेज दिया गया, जहाँ उसकी अच्छी देखभाल हो सके। बच्चा पूरी तरह ठीक हो गया और रॉकी भी धीरे-धीरे फिर से चलने लगा।
  - >-
    विक्रम बोले, "यह मामला एक ग़ायब तीर, एक लँगड़े कुत्ते और खिड़की में दिखी एक परछाईं से सुलझा। यहाँ कोई चुड़ैल नहीं थी, बस एक माँ का प्यार था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जब वे बनारस लौटे, तो अम्मा जी ने उन्हें एक लिफ़ाफ़ा दिया, जो उनके जाने के बाद आया था। उस पर काले कमल की मुहर थी और अंदर बैंगनी स्याही में लिखा था, "खेल ख़त्म होने वाला है, विक्रम, और अगली चाल आख़िरी होगी।"
  - >-
    उसी मेज़ पर राय बहादुर देवेंद्रनाथ की दावत का निमंत्रण पत्र भी रखा था। सावित्री ने दोनों काग़ज़ उठाए, तो उनमें वही बैंगनी स्याही और वही केवड़े की ख़ुशबू थी। उनके हाथ काँपने लगे। क्या आप भी वही सोच रहे हैं, जो सावित्री सोच रही थीं? अपना जवाब कमेंट में लिखिए।
