# EP 10 - तहखाने का मंत्र (The Musgrave Ritual)
clips:
  - {start_scene: 5, end_scene: 6, hook_text: "पुरखों की पहेली", title: "सदियों पुराना मंत्र: 'सूरज कहाँ था? बरगद के ऊपर...'", end_question: "क्या आप ये पहेली सुलझा सकते हैं? कमेंट करें।"}
  - {start_scene: 7, end_scene: 8, hook_text: "जो पेड़ अब नहीं है", title: "पचास साल पहले गिरे पेड़ की छाया कैसे नापें?", end_question: "पेड़ नहीं, तो छाया कैसे?"}
  - {start_scene: 12, end_scene: 14, hook_text: "तहखाने की पटिया", title: "पहेली ने तहखाने तक पहुँचाया... और पटिया के नीचे...", end_question: "नीचे क्या था?"}
script:
  - >-
    लखनऊ की रायज़ादा हवेली का पुराना मुंशी भोलानाथ एक रात अचानक ग़ायब हो गया। उसका बिस्तर वैसा ही बिछा था और उसके जूते भी वहीं रखे थे। ऐसा लगता था, जैसे वह हवा में घुल गया हो।
  - >-
    दो दिन बाद नौकरानी लाजवंती पागलों की तरह हँसने लगी और फिर वह भी ग़ायब हो गई। झील से एक बोरा निकला, जो जंग लगी धातु और कंकड़ों से भरा था। उस हवेली के तहखाने में एक मंत्र छिपा था और एक लाश भी छिपी थी।
  - >-
    कुँवर आदित्य रायज़ादा जासूस विक्रम के कॉलेज के पुराने दोस्त थे। उन्होंने विक्रम को लखनऊ बुलाया और डॉक्टर सावित्री भी उनके साथ गईं। आदित्य ने कहा, "विक्रम, मेरी हवेली में कुछ बहुत ग़लत हो रहा है।"
  - >-
    आदित्य ने बताया कि भोलानाथ बरसों से उनका मुंशी था और बेहद चालाक था। कुछ दिन पहले उन्होंने उसे आधी रात को लाइब्रेरी में परिवार के पुराने काग़ज़ात पढ़ते हुए पकड़ा था। इसके बाद आदित्य ने उसे नौकरी से निकाल दिया।
  - >-
    विक्रम ने पूछा, "वह कौन सा काग़ज़ पढ़ रहा था?" आदित्य हँसकर बोले, "वह बस हमारे परिवार का एक पुराना मंत्र है। हर वारिस को बड़ा होने पर इसे दोहराना पड़ता है। यह एक रस्म है, जिसका कोई मतलब नहीं है।"
  - >-
    आदित्य ने वह मंत्र पढ़कर सुनाया, "वह किसका था? उसका, जो चला गया। वह किसका होगा? उसका, जो आएगा। सूरज बरगद के ऊपर था और छाया बरगद के नीचे थी। उत्तर में दस क़दम, पूरब में पाँच और दक्षिण में दो क़दम चलो, और फिर नीचे जाओ।"
  - >-
    विक्रम ने कहा, "आदित्य, यह कोई रस्म नहीं, बल्कि एक नक़्शा है, और भोलानाथ यह बात समझ गया था।" आदित्य चौंककर बोले, "लेकिन वह बरगद तो पचास साल पहले बिजली गिरने से ख़त्म हो गया था। अब बस उसका ठूँठ बचा है।"
  - >-
    सावित्री ने पूछा, "तो फिर आप उसकी छाया कैसे नापेंगे?" विक्रम मुस्कराकर बोले, "बरगद की ऊँचाई पुराने काग़ज़ात में लिखी होगी और बाक़ी काम सूरज कर देगा।" आदित्य ने एक पुरानी बही खोली, जिसमें लिखा था कि बरगद पैंसठ फ़ुट ऊँचा था।
  - >-
    विक्रम ने ज़मीन में छह फ़ुट की एक छड़ गाड़ दी। उन्होंने कहा, "मंत्र के मुताबिक़, जब सूरज बरगद की चोटी के ठीक ऊपर हो, उस वक़्त की छाया नापनी है।" उस घड़ी छड़ की छाया नौ फ़ुट लंबी निकली।
  - >-
    विक्रम बोले, "छह फ़ुट की छड़ की छाया नौ फ़ुट की है, तो पैंसठ फ़ुट के बरगद की छाया साढ़े सत्तानवे फ़ुट की रही होगी।" उन्होंने ठूँठ से उसी दिशा में फ़ीता खींचा, जो सीधा हवेली की पुरानी दीवार तक पहुँच गया।
  - >-
    यहाँ एक पल रुककर सोचिए। एक पेड़ था, जो अब नहीं है, उसकी छाया थी और गिनती के कुछ क़दम थे। क्या आप यह पहेली ख़ुद सुलझा पाते? अपना जवाब कमेंट में बताइए और देखिए कि यह रास्ता कहाँ ले जाता है।
  - >-
    वहाँ से वे उत्तर में दस क़दम, पूरब में पाँच और दक्षिण में दो क़दम चले। इस तरह वे हवेली के सबसे पुराने हिस्से के एक दरवाज़े पर पहुँच गए, जिसके अंदर सीढ़ियाँ नीचे अँधेरे में उतरती थीं। विक्रम ने धीरे से कहा, "और अब हमें नीचे जाना है।"
  - >-
    तहखाना ठंडा था और सीलन से भरा हुआ था। लालटेन की रोशनी में फ़र्श पर पत्थर की एक भारी पटिया दिखी, जिस पर लोहे का कड़ा लगा था। पास ही लकड़ी का एक मोटा टुकड़ा पड़ा था, जैसे किसी ने उसे टेक की तरह इस्तेमाल किया हो।
  - >-
    इंस्पेक्टर भैरव भी वहाँ आ पहुँचे थे। विक्रम, भैरव और आदित्य ने मिलकर वह पटिया उठाई और सावित्री ने लालटेन नीचे की। अगले ही पल सावित्री की चीख निकल गई, क्योंकि नीचे के गड्ढे से एक हाथ बाहर झाँक रहा था।
  - >-
    वह भोलानाथ था और उसके पास लकड़ी का एक ख़ाली संदूक पड़ा था। विक्रम बोले, "भोलानाथ ने मंत्र सुलझा लिया था, लेकिन यह पटिया अकेले नहीं उठ सकती थी। उसे किसी की मदद चाहिए थी।"
  - >-
    आदित्य ने धीरे से कहा, "वह लाजवंती रही होगी। वह भोलानाथ से प्यार करती थी, लेकिन भोलानाथ ने हाल ही में उसे छोड़ दिया था।" विक्रम ने लकड़ी के उस टुकड़े को देखा, जिस पर किसी के नाख़ूनों के गहरे निशान थे।
  - >-
    विक्रम ने समझाया, "भोलानाथ नीचे उतरा और ख़ज़ाना ऊपर लाजवंती को थमाता गया। फिर लकड़ी की टेक खिसक गई। वह हादसा था या बदला, यह सिर्फ़ लाजवंती जानती है। पत्थर गिर गया और भोलानाथ नीचे बंद हो गया।"
  - >-
    सावित्री ने कहा, "इसीलिए वह पागलों की तरह हँसी थी। लेकिन ख़ज़ाना कहाँ गया?" विक्रम ने झील से निकले बोरे को खोला। उसके अंदर जंग लगी, मुड़ी-तुड़ी धातु और काँच जैसे कुछ धुंधले कंकड़ थे।
  - >-
    विक्रम ने एक मुड़े हुए टुकड़े को साफ़ किया, तो नीचे से सोना चमक उठा। उन्होंने कहा, "ये कंकड़ नहीं, आदित्य, बल्कि हीरे और पन्ने हैं। यह टूटा हुआ ताज अवध के पुराने राजाओं का मुकुट है। यह सदियों से तुम्हारे परिवार के पास था और किसी को इसका पता नहीं था।"
  - >-
    आदित्य की आँखें भर आईं। विक्रम बोले, "यह मामला एक रस्म, एक ठूँठ और लकड़ी पर बने नाख़ूनों के निशानों से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।" लाजवंती का फिर कभी कुछ पता नहीं चला।
  - >-
    रात को विक्रम परिवार के काग़ज़ात पलट रहे थे, तभी उनके हाथ एक नई चिट्ठी लगी। कुछ महीने पहले किसी ने वह हवेली ख़रीदने की बड़ी पेशकश की थी। चिट्ठी के नीचे 'पं. से. स. ट्रस्ट' के दस्तख़त थे।
  - >-
    सावित्री ने कहा, "यह तो वही भली संस्था, पंकज सेवा सदन है।" विक्रम कुछ देर चुप रहे और फिर बोले, "अनाथालय चलाने वाली एक संस्था कोई पुरानी हवेली क्यों ख़रीदना चाहेगी, सावित्री? क्या उन्हें पता था कि यहाँ क्या दबा है?" आपको क्या लगता है? अपना जवाब कमेंट में लिखिए।
