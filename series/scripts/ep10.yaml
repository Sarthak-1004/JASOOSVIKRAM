# EP 10 - तहखाने का मंत्र (The Musgrave Ritual)
clips:
  - {start_scene: 5, end_scene: 6, hook_text: "पुरखों की पहेली", title: "सदियों पुराना मंत्र: 'सूरज कहाँ था? बरगद के ऊपर...'", end_question: "क्या आप ये पहेली सुलझा सकते हैं? कमेंट करें।"}
  - {start_scene: 7, end_scene: 8, hook_text: "जो पेड़ अब नहीं है", title: "पचास साल पहले गिरे पेड़ की छाया कैसे नापें?", end_question: "पेड़ नहीं, तो छाया कैसे?"}
  - {start_scene: 12, end_scene: 14, hook_text: "तहखाने की पटिया", title: "पहेली ने तहखाने तक पहुँचाया... और पटिया के नीचे...", end_question: "नीचे क्या था?"}
script:
  - >-
    लखनऊ की रायज़ादा हवेली का पुराना मुंशी, भोलानाथ, एक रात अचानक ग़ायब हो गया। उसका बिस्तर वैसा ही था, जूते वहीं रखे थे। जैसे वो हवा में घुल गया हो।
  - >-
    दो दिन बाद नौकरानी लाजवंती पागलों की तरह हँसने लगी, और फिर वो भी ग़ायब हो गई। झील से जंग लगी धातु और कंकड़ों से भरा एक बोरा निकला। हवेली के तहखाने में एक मंत्र छिपा था... और एक लाश।
  - >-
    मैं सावित्री हूँ। कुँवर आदित्य रायज़ादा, विक्रम के कॉलेज के पुराने दोस्त थे। उन्होंने विक्रम को लखनऊ बुलाया। "विक्रम, मेरी हवेली में कुछ बहुत ग़लत हो रहा है।"
  - >-
    आदित्य ने बताया, भोलानाथ बरसों से उनका मुंशी था, बेहद चालाक। पर कुछ दिन पहले उन्होंने उसे आधी रात को लाइब्रेरी में पकड़ा था। वो परिवार के पुराने काग़ज़ात पढ़ रहा था। आदित्य ने उसे नौकरी से निकाल दिया।
  - >-
    "वो कौन सा काग़ज़ पढ़ रहा था?" विक्रम ने पूछा। आदित्य हँसे। "बस हमारे परिवार का एक पुराना मंत्र। हर वारिस को बड़ा होने पर इसे दोहराना पड़ता है। एक रस्म है, जिसका कोई मतलब नहीं।"
  - >-
    उन्होंने मंत्र पढ़ा... "किसका था? जो चला गया। किसका होगा? जो आएगा। सूरज कहाँ था? बरगद के ऊपर। छाया कहाँ थी? बरगद के नीचे। कितने क़दम? उत्तर में दस, पूरब में पाँच, दक्षिण में दो। और फिर... नीचे।"
  - >-
    विक्रम ने कहा, "आदित्य, ये रस्म नहीं, नक़्शा है। और भोलानाथ ये समझ गया था।" आदित्य चौंक गए। "पर बरगद तो पचास साल पहले बिजली गिरने से ख़त्म हो गया। अब बस उसका ठूँठ बचा है।"
  - >-
    "तो छाया कैसे नापोगे?" मैंने पूछा। विक्रम मुस्कराए। "बरगद की ऊँचाई पुराने काग़ज़ात में लिखी होगी। बाक़ी काम सूरज करेगा।" आदित्य ने एक पुरानी बही खोली। उसमें लिखा था, बरगद पैंसठ फ़ुट ऊँचा था।
  - >-
    विक्रम ने ज़मीन में छह फ़ुट की एक छड़ गाड़ी। "मंत्र के मुताबिक़, जब सूरज बरगद की चोटी के ठीक ऊपर हो, उस वक़्त छड़ की छाया नापो।" उस घड़ी, छड़ की छाया नौ फ़ुट निकली।
  - >-
    "छह फ़ुट की छड़, नौ फ़ुट की छाया। तो पैंसठ फ़ुट के बरगद की छाया होगी... साढ़े सत्तानवे फ़ुट।" विक्रम ने ठूँठ से उसी दिशा में फ़ीता खींचा। फ़ीता सीधा हवेली की पुरानी दीवार तक पहुँचा।
  - >-
    रुकिए। एक पेड़ जो अब नहीं है, उसकी छाया, और कुछ क़दम। क्या आप ये पहेली ख़ुद सुलझा पाते? कमेंट में बताइए, और देखिए, ये रास्ता कहाँ ले जाता है।
  - >-
    वहाँ से उत्तर में दस क़दम, पूरब में पाँच, दक्षिण में दो। हम हवेली के सबसे पुराने हिस्से के एक दरवाज़े पर पहुँचे। अंदर, सीढ़ियाँ नीचे अँधेरे में उतरती थीं। "और फिर... नीचे," विक्रम ने धीरे से कहा।
  - >-
    तहखाना ठंडा था, सीलन से भरा। लालटेन की रोशनी में फ़र्श पर पत्थर की एक भारी पटिया दिखी, जिस पर लोहे का कड़ा लगा था। पास ही लकड़ी का एक मोटा टुकड़ा पड़ा था, जैसे किसी ने उसे टेक के लिए इस्तेमाल किया हो।
  - >-
    इंस्पेक्टर भैरव भी आ पहुँचे थे। विक्रम, भैरव और आदित्य ने मिलकर पटिया उठाई। मैंने लालटेन नीचे की। और मेरी चीख निकल गई। नीचे के गड्ढे से एक हाथ बाहर झाँक रहा था।
  - >-
    वो भोलानाथ था। पास में लकड़ी का एक ख़ाली संदूक पड़ा था। विक्रम बोले, "भोलानाथ ने मंत्र सुलझा लिया था। पर ये पटिया अकेले नहीं उठ सकती थी। उसे किसी की मदद चाहिए थी।"
  - >-
    "लाजवंती," आदित्य ने धीरे से कहा। "वो भोलानाथ से प्यार करती थी। पर भोलानाथ ने हाल ही में उसे छोड़ दिया था।" विक्रम ने लकड़ी के टुकड़े को देखा। उस पर किसी के नाख़ूनों के गहरे निशान थे।
  - >-
    "भोलानाथ नीचे उतरा, और ख़ज़ाना ऊपर लाजवंती को थमाता गया। फिर लकड़ी की टेक खिसक गई। हादसा था, या बदला... ये सिर्फ़ लाजवंती जानती है। पत्थर गिरा, और भोलानाथ नीचे बंद हो गया।"
  - >-
    "इसीलिए वो पागलों की तरह हँसी थी," मैंने कहा। "और ख़ज़ाना?" विक्रम ने झील से निकले बोरे को खोला। अंदर जंग लगी, मुड़ी-तुड़ी धातु, और कुछ धुंधले, काँच जैसे कंकड़।
  - >-
    विक्रम ने एक मुड़े हुए टुकड़े को साफ़ किया। नीचे से सोना चमका। "कंकड़ नहीं, आदित्य। ये हीरे और पन्ने हैं। और ये टूटा हुआ ताज... अवध के पुराने राजाओं का मुकुट है। सदियों से तुम्हारे परिवार के पास था, और किसी को पता नहीं था।"
  - >-
    आदित्य की आँखें भर आईं। विक्रम बोले, "एक रस्म, एक ठूँठ, और लकड़ी पर नाख़ूनों के निशान... सच हमेशा छोटी चीज़ों में छिपा होता है।" लाजवंती का फिर कभी कुछ पता नहीं चला।
  - >-
    रात को विक्रम परिवार के काग़ज़ात पलट रहे थे, जब एक नई चिट्ठी हाथ लगी। कुछ महीने पहले किसी ने हवेली ख़रीदने की बड़ी पेशकश की थी। नीचे दस्तख़त थे... 'पं. से. स. ट्रस्ट'।
  - >-
    "पंकज सेवा सदन," मैंने कहा। "वही भली संस्था?" विक्रम चुप रहे। "एक अनाथालय चलाने वाली संस्था, एक पुरानी हवेली क्यों ख़रीदना चाहेगी, सावित्री? क्या उन्हें पता था कि यहाँ क्या दबा है?" आपको क्या लगता है? कमेंट करें।
