  - {start_scene: 10, end_scene: 11, hook_text: "कल नहीं था, आज है", title: "दीवार पर अँगूठे का निशान... जो कल वहाँ था ही नहीं", end_question: "ये कहाँ से आया?"}
  - {start_scene: 13, end_scene: 14, hook_text: "आग! आग!", title: "गलियारे में धुआँ, सब चिल्लाए 'आग!'... और दीवार काँपी", end_question: "दीवार के पीछे कौन था?"}
script:
  - >-
    एक नौजवान वकील हाँफता हुआ विक्रम के कमरे में घुसा, और दरवाज़ा बंद करके उससे टिक गया। "मुझे बचाइए! मुझ पर उस आदमी के क़त्ल का इल्ज़ाम है... जिससे मैं ज़िंदगी में सिर्फ़ एक बार मिला!"
  - >-
    बंबई के बांद्रा में, बूढ़े बिल्डर सेठ ईश्वरदास भाटिया के लकड़ी के गोदाम में रात को आग लगी थी। राख में कुछ जली हुई हड्डियाँ मिलीं। और उसी शाम, सेठ ने अपनी सारी दौलत की वसीयत इसी नौजवान के नाम कर दी थी।
  - >-
    मैं सावित्री हूँ। उन दिनों हम बंबई में थे। इंस्पेक्टर भैरव भी ट्रेनिंग के लिए बंबई आए हुए थे, और यही मामला उन्हें मिला। वो नौजवान था राजीव मेहता। और भैरव उसे गिरफ़्तार करने के लिए दरवाज़े पर खड़े थे।
  - >-
    राजीव ने बताया, उस शाम सेठ भाटिया ख़ुद उसके दफ़्तर आए। "मेरा कोई वारिस नहीं, बेटा। मैं तुम्हारी माँ को बरसों पहले जानता था।" और उन्होंने अपनी वसीयत राजीव के नाम कर दी। फिर उसे रात को अपने बंगले बुलाया।
  - >-
    राजीव बंगले गया, कुछ काग़ज़ों पर बात हुई, और वो अपनी छड़ी वहीं भूलकर लौट आया। सुबह पता चला, सेठ ग़ायब हैं, गोदाम जल चुका है, और उसकी छड़ी पर गहरे धब्बे हैं।
  - >-
    भैरव बोले, "और सबसे बड़ा सबूत... हॉल की दीवार पर इसके अँगूठे का निशान। क़ातिल ने लाश घसीटते हुए दीवार को छुआ था।" राजीव का चेहरा सफ़ेद पड़ गया। अँगूठे का निशान, सचमुच उसी का था।
  - >-
    विक्रम ने वसीयत का काग़ज़ देखा। "दिलचस्प। लिखावट कहीं साफ़ है, कहीं बुरी तरह काँपी हुई। ये वसीयत चलती ट्रेन में लिखी गई है। साफ़ हिस्से तब लिखे गए, जब ट्रेन स्टेशनों पर रुकी थी।"
  - >-
    "इतनी बड़ी वसीयत, कोई ट्रेन में जल्दबाज़ी में क्यों लिखेगा? क्योंकि उसके लिए ये वसीयत नहीं, एक हथियार थी।" फिर विक्रम ने राजीव से पूछा, "तुम्हारी माँ ने कभी सेठ भाटिया का ज़िक्र किया?"
  - >-
    राजीव ने याद किया। "माँ बताती थीं, जवानी में एक आदमी ने उनसे शादी का प्रस्ताव रखा था। माँ ने मना कर दिया, क्योंकि वो बहुत गुस्सैल और कीनाखोर था।" विक्रम मुस्कराए। "वही आदमी... सेठ भाटिया।"
  - >-
    फिर मैंने एक बात बताई, जो मैंने ख़ुद देखी थी। "विक्रम, कल दोपहर मैं भैरव के साथ उस हॉल में गई थी। उस दीवार पर कोई निशान नहीं था। मैंने अपनी आँखों से देखा था।"
  - >-
    रुकिए। एक अँगूठे का निशान, जो कल नहीं था, और आज है। एक वसीयत, जो ट्रेन में जल्दबाज़ी में लिखी गई। और एक ठुकराया हुआ आशिक़। आप क्या सोचते हैं, सेठ भाटिया कहाँ है?
  - >-
    विक्रम बंगले में गए, और ऊपर का गलियारा क़दमों से नापने लगे। फिर उसके ठीक नीचे वाला कमरा। "सावित्री, ऊपर का गलियारा, नीचे के कमरे से छह फ़ुट छोटा है।" "तो?" "तो कहीं छह फ़ुट की जगह छिपी है।"
  - >-
    विक्रम ने भैरव से गीली घास-फूस मँगवाई, और उसे गलियारे में सुलगा दिया। धुआँ भरने लगा। फिर उन्होंने सबसे कहा, "अब सब ज़ोर से चिल्लाइए... आग! आग!"
  - >-
    हम सब चीखे... "आग! आग!" धुआँ गलियारे की दीवारों से टकरा रहा था। तभी लकड़ी की एक दीवार में कुछ चरमराया। एक छिपा हुआ तख़्ता काँपने लगा।
  - >-
    तख़्ता भड़ाक से खुला, और खाँसता हुआ एक बूढ़ा आदमी बाहर गिरा। सेठ ईश्वरदास भाटिया। ज़िंदा। वो मुर्दा, जो ज़िंदा था। भैरव का मुँह खुला का खुला रह गया।
  - >-
    सेठ ने गुर्राकर विक्रम को देखा। विक्रम बोले, "आपने राख में क्या जलाया था, सेठ जी?" वो चुप रहा। बाद में पता चला, गोदाम में एक मरे हुए जानवर की हड्डियाँ जलाई गई थीं।
  - >-
    विक्रम ने समझाया। "सेठ पर भारी कर्ज़ था। वो दुनिया से ग़ायब होना चाहता था। और साथ ही, उस औरत से बदला लेना चाहता था, जिसने उसे ठुकराया था। उसके बेटे को फाँसी पर चढ़ाकर।"
  - >-
    "उस रात, बातों-बातों में, सेठ ने काग़ज़ों पर लगी लाख की मुहर पर राजीव का अँगूठा दबवा लिया था। फिर उसी लाख के साँचे से, कल रात चुपके से दीवार पर अँगूठे का निशान छाप दिया।"
  - >-
    "ग़लती बस इतनी हुई कि सावित्री ने कल वही दीवार देख ली थी।" विक्रम मुस्कराए। "ट्रेन वाली लिखावट, छह फ़ुट का फ़र्क़, और एक दीवार जो कल साफ़ थी... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    राजीव ने विक्रम के पैर छू लिए। भैरव ने सेठ भाटिया को हथकड़ी पहनाई, और बड़बड़ाए, "अब मुर्दे भी झूठ बोलने लगे।"
  - >-
    सेठ के काग़ज़ात से पता चला, उसका कर्ज़ बंबई के एक साहूकार का था। और उस लाख की मुहर का पैकेट... उस पर एक बहुत छोटा सा काला कमल छपा था।
  - >-
    विक्रम ने पैकेट को मुट्ठी में भींच लिया। "हर बार, सावित्री। हर अपराध के पीछे से ये कमल झाँक रहा है।" क्या आपने भी सोचा था कि सेठ ज़िंदा है? कमेंट में बताइए।
