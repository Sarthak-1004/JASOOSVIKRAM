  - {start_scene: 10, end_scene: 11, hook_text: "कल नहीं था, आज है", title: "दीवार पर अँगूठे का निशान... जो कल वहाँ था ही नहीं", end_question: "ये कहाँ से आया?"}
  - {start_scene: 13, end_scene: 14, hook_text: "आग! आग!", title: "गलियारे में धुआँ, सब चिल्लाए 'आग!'... और दीवार काँपी", end_question: "दीवार के पीछे कौन था?"}
script:
  - >-
    एक नौजवान वकील हाँफता हुआ जासूस विक्रम के कमरे में घुसा और दरवाज़ा बंद करके उससे टिक गया। उसने कहा, "मुझे बचाइए! मुझ पर उस आदमी के क़त्ल का इल्ज़ाम है, जिससे मैं ज़िंदगी में सिर्फ़ एक बार मिला हूँ!"
  - >-
    बंबई के बांद्रा में बूढ़े बिल्डर सेठ ईश्वरदास भाटिया के लकड़ी के गोदाम में रात को आग लगी थी और राख में कुछ जली हुई हड्डियाँ मिली थीं। उसी शाम सेठ ने अपनी सारी दौलत की वसीयत इसी नौजवान के नाम कर दी थी।
  - >-
    उन दिनों विक्रम और डॉक्टर सावित्री बंबई में थे। इंस्पेक्टर भैरव भी ट्रेनिंग के लिए बंबई आए हुए थे और यह मामला उन्हीं को मिला था। उस नौजवान का नाम राजीव मेहता था, और भैरव उसे गिरफ़्तार करने के लिए दरवाज़े पर खड़े थे।
  - >-
    राजीव ने बताया कि उस शाम सेठ भाटिया ख़ुद उसके दफ़्तर आए थे। सेठ ने कहा था, "मेरा कोई वारिस नहीं है, बेटा, और मैं तुम्हारी माँ को बरसों पहले जानता था।" यह कहकर उन्होंने अपनी वसीयत राजीव के नाम कर दी और उसे रात को अपने बंगले पर बुलाया।
  - >-
    राजीव बंगले पर गया, वहाँ कुछ काग़ज़ों पर बात हुई और वह अपनी छड़ी वहीं भूलकर लौट आया। सुबह उसे पता चला कि सेठ ग़ायब हैं, गोदाम जल चुका है और उसकी छड़ी पर गहरे धब्बे मिले हैं।
  - >-
    भैरव बोले, "सबसे बड़ा सबूत हॉल की दीवार पर मिला इसके अँगूठे का निशान है। क़ातिल ने लाश घसीटते हुए दीवार को छुआ था।" राजीव का चेहरा सफ़ेद पड़ गया, क्योंकि अँगूठे का वह निशान सचमुच उसी का था।
  - >-
    विक्रम ने वसीयत का काग़ज़ देखा और कहा, "यह बड़ी दिलचस्प बात है कि लिखावट कहीं साफ़ है और कहीं बुरी तरह काँपी हुई है। यह वसीयत चलती ट्रेन में लिखी गई है। साफ़ हिस्से तब लिखे गए थे, जब ट्रेन स्टेशनों पर रुकी थी।"
  - >-
    विक्रम बोले, "कोई इतनी बड़ी वसीयत ट्रेन में जल्दबाज़ी में तभी लिखेगा, जब उसके लिए वह वसीयत नहीं, बल्कि एक हथियार हो।" फिर उन्होंने राजीव से पूछा, "क्या तुम्हारी माँ ने कभी सेठ भाटिया का ज़िक्र किया था?"
  - >-
    राजीव ने याद करके बताया, "माँ बताती थीं कि जवानी में एक आदमी ने उनसे शादी का प्रस्ताव रखा था। माँ ने मना कर दिया था, क्योंकि वह बहुत गुस्सैल और कीनाखोर था।" विक्रम मुस्कराकर बोले, "वही आदमी सेठ भाटिया था।"
  - >-
    फिर सावित्री ने एक ऐसी बात बताई, जो उन्होंने ख़ुद देखी थी। उन्होंने कहा, "विक्रम, कल दोपहर मैं भैरव के साथ उस हॉल में गई थी। उस दीवार पर तब कोई निशान नहीं था और यह मैंने अपनी आँखों से देखा था।"
  - >-
    यहाँ एक पल रुककर सोचिए। अँगूठे का एक निशान था, जो कल नहीं था और आज मौजूद है। एक वसीयत थी, जो ट्रेन में जल्दबाज़ी में लिखी गई थी, और एक ठुकराया हुआ आशिक़ था। आपको क्या लगता है कि सेठ भाटिया कहाँ है?
  - >-
    विक्रम बंगले में गए और ऊपर के गलियारे को क़दमों से नापने लगे। फिर उन्होंने उसके ठीक नीचे वाला कमरा भी नापा। उन्होंने कहा, "सावित्री, ऊपर का गलियारा नीचे के कमरे से छह फ़ुट छोटा है। इसका मतलब है कि कहीं छह फ़ुट की जगह छिपी हुई है।"
  - >-
    विक्रम ने भैरव से गीली घास-फूस मँगवाई और उसे गलियारे में सुलगा दिया, जिससे वहाँ धुआँ भरने लगा। फिर उन्होंने सबसे कहा, "अब आप सब ज़ोर से चिल्लाइए कि आग लग गई है!"
  - >-
    सब लोग एक साथ चीखने लगे कि आग लग गई है। धुआँ गलियारे की दीवारों से टकरा रहा था। तभी लकड़ी की एक दीवार में कुछ चरमराया और एक छिपा हुआ तख़्ता काँपने लगा।
  - >-
    वह तख़्ता भड़ाक से खुला और खाँसता हुआ एक बूढ़ा आदमी बाहर आ गिरा। वह सेठ ईश्वरदास भाटिया था और वह ज़िंदा था। जिसे सब मुर्दा समझ रहे थे, वह ज़िंदा निकला, और भैरव का मुँह खुला का खुला रह गया।
  - >-
    सेठ ने गुर्राकर विक्रम को देखा। विक्रम ने पूछा, "आपने राख में क्या जलाया था, सेठ जी?" सेठ चुप रहा। बाद में पता चला कि गोदाम में एक मरे हुए जानवर की हड्डियाँ जलाई गई थीं।
  - >-
    विक्रम ने समझाया, "सेठ पर भारी कर्ज़ था और वह दुनिया से ग़ायब होना चाहता था। साथ ही वह उस औरत से बदला लेना चाहता था, जिसने उसे ठुकराया था। इसके लिए वह उसके बेटे को फाँसी पर चढ़वाना चाहता था।"
  - >-
    उन्होंने कहा, "उस रात सेठ ने बातों-बातों में काग़ज़ों पर लगी लाख की मुहर पर राजीव का अँगूठा दबवा लिया था। फिर कल रात उसने उसी लाख के साँचे से चुपके से दीवार पर अँगूठे का निशान छाप दिया।"
  - >-
    विक्रम मुस्कराकर बोले, "उससे ग़लती बस इतनी हुई कि सावित्री ने कल वही दीवार देख ली थी। यह मामला ट्रेन वाली लिखावट, छह फ़ुट के फ़र्क़ और कल तक साफ़ रही एक दीवार से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    राजीव ने विक्रम के पैर छू लिए। भैरव ने सेठ भाटिया को हथकड़ी पहनाई और बड़बड़ाए, "अब तो मुर्दे भी झूठ बोलने लगे हैं।"
  - >-
    सेठ के काग़ज़ात से पता चला कि उसका कर्ज़ बंबई के एक साहूकार का था। लाख की उस मुहर के पैकेट पर एक बहुत छोटा सा काला कमल छपा हुआ था।
  - >-
    विक्रम ने उस पैकेट को मुट्ठी में भींच लिया और कहा, "हर बार यही होता है, सावित्री। हर अपराध के पीछे से यह कमल झाँक रहा है।" क्या आपने भी सोचा था कि सेठ ज़िंदा है? अपना जवाब कमेंट में बताइए।
