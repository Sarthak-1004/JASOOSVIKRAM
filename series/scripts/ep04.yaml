# EP 4 - अनजान कोठी का बुलावा (The Engineer's Thumb)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "नीचे आती लोहे की छत", title: "बंद कमरा... और धीरे-धीरे नीचे उतरती लोहे की छत", end_question: "क्या समीर बच पाया?"}
  - {start_scene: 5, end_scene: 6, hook_text: "एक घंटे का सफ़र, ताज़ा घोड़ा", title: "एक घंटा चली बग्घी... पर घोड़ा ज़रा भी नहीं थका", end_question: "कोठी असल में कितनी दूर थी?"}
  - {start_scene: 12, end_scene: 13, hook_text: "खिड़की से लटकी जान", title: "खिड़की से लटका इंजीनियर... और ऊपर उठा गँड़ासा", end_question: "आगे क्या हुआ?"}
script:
  - >-
    लोहे की भारी छत धीरे-धीरे नीचे आ रही थी और समीर पूरी ताक़त से दरवाज़ा पीट रहा था। बाहर से कोई जवाब नहीं आ रहा था, बस मशीन की गड़गड़ाहट थी और ऊपर से अँधेरा उतर रहा था। तभी दीवार के उस पार से एक औरत चीखी, "यहाँ से भागो!"
  - >-
    सुबह छह बजे एक नौजवान डॉक्टर सावित्री के दवाख़ाने के दरवाज़े पर बेहोश होकर गिर पड़ा। उसका दाहिना हाथ कपड़े में कसकर लिपटा हुआ था। सावित्री ने जब वह पट्टी खोली, तो वह सन्न रह गईं, क्योंकि उस हाथ में अँगूठा नहीं था।
  - >-
    सावित्री ने उसकी मरहम-पट्टी की और उसे सीधे जासूस विक्रम के पास ले गईं। उस नौजवान का नाम समीर था। वह मिर्ज़ापुर का एक ग़रीब लेकिन होशियार इंजीनियर था, जो पानी से चलने वाली मशीनें ठीक करता था।
  - >-
    समीर ने बताया कि कल शाम उसके पास एक बहुत दुबला-पतला आदमी आया था, जिसकी आवाज़ खोखली और आँखें ठंडी थीं। उसने अपना नाम कर्नल प्रताप बताया और कहा, "यह बस एक रात का काम है और मैं इसके पचास रुपये दूँगा, पर तुम किसी को बताना मत।"
  - >-
    पचास रुपये समीर की तीन महीने की कमाई के बराबर थे। उसे मुल्तानी मिट्टी दबाने वाली एक मशीन ठीक करनी थी। आधी रात को स्टेशन पर एक बंद बग्घी आई, जिसकी खिड़कियों के शीशे इतने धुंधले थे कि बाहर कुछ भी दिखाई नहीं देता था।
  - >-
    वह बग्घी पूरे एक घंटे तक चलती रही और फिर जंगल के बीच एक टूटी-फूटी कोठी के सामने रुकी। उतरते वक़्त समीर ने एक बात पर ध्यान दिया कि घोड़ा ज़रा भी थका हुआ नहीं था। उसे न पसीना आया था और न ही वह हाँफ रहा था।
  - >-
    अंदर अँधेरे गलियारे में समीर को एक डरी हुई औरत मिली। उसने काँपती आवाज़ में फुसफुसाकर कहा, "यहाँ से अभी चले जाओ और बिल्कुल मत रुको।" लेकिन तभी कर्नल वहाँ आ गया और वह औरत अँधेरे में ग़ायब हो गई।
  - >-
    कर्नल उसे एक बड़े कमरे में ले गया, जो ख़ुद ही एक मशीन था। उसकी लोहे की भारी छत पानी के ज़ोर से नीचे दबती थी। समीर ने मशीन का रिसाव ढूँढ़ लिया, लेकिन फ़र्श पर उसे चमकती हुई धातु की पपड़ी दिखी, जो उसे अजीब लगी।
  - >-
    वहाँ मुल्तानी मिट्टी नहीं, बल्कि धातु थी। समीर ने भोलेपन में पूछ लिया, "कर्नल साहब, यह मशीन असल में क्या दबाती है?" कर्नल का चेहरा पत्थर की तरह सख़्त हो गया। वह बिना कुछ कहे बाहर निकला और उसने दरवाज़ा बाहर से बंद कर दिया।
  - >-
    फिर मशीन चल पड़ी और लोहे की छत धीरे-धीरे नीचे उतरने लगी। समीर की चीखें मशीन के शोर में डूब गईं। तभी उसे लकड़ी की दीवार में एक दरार दिखाई दी।
  - >-
    यहाँ एक पल रुककर सोचिए। सफ़र पूरे एक घंटे का था, लेकिन घोड़ा बिल्कुल ताज़ा था। मशीन मुल्तानी मिट्टी की बताई गई थी, लेकिन फ़र्श पर धातु पड़ी थी। आपको क्या लगता है कि वह कोठी असल में कितनी दूर थी और वहाँ क्या बन रहा था?
  - >-
    समीर ने उस दरार में उँगलियाँ फँसाईं और तख़्ता उखाड़ दिया, जिससे वह गलियारे में जा गिरा। वही औरत दौड़ती हुई आई और उसे एक खिड़की तक ले गई। उसने कहा, "यहाँ से कूद जाओ!" और समीर खिड़की से बाहर लटक गया।
  - >-
    ऊपर से कर्नल का चेहरा झाँका और उसके हाथ में एक भारी गँड़ासा था। चाँदनी में उसकी परछाईं ऊपर उठी। उसके बाद समीर को बस इतना याद है कि वह नीचे झाड़ियों में गिरा और बेहोश हो गया।
  - >-
    जब उसे होश आया, तो वह स्टेशन के पास की झाड़ियों में पड़ा था। उसके हाथ में असहनीय दर्द था और उसका अँगूठा ग़ायब था। आसपास उस कोठी का कहीं कोई निशान नहीं था।
  - >-
    विक्रम ने एक नक़्शा फैलाया और स्टेशन के चारों ओर एक छोटा सा गोला खींच दिया। उन्होंने कहा, "घोड़ा ताज़ा था, इसका मतलब है कि बग्घी एक घंटे तक गोल-गोल घूमती रही। वह कोठी स्टेशन से दूर नहीं, बल्कि बहुत पास है।"
  - >-
    इंस्पेक्टर भैरव पांडे भी उनके साथ हो लिए। मिर्ज़ापुर पहुँचते ही उन्हें आसमान में धुआँ उठता दिखाई दिया। जंगल के बीच एक कोठी धू-धू करके जल रही थी।
  - >-
    समीर चीखकर बोला, "यह वही कोठी है!" वह आग उसकी गिरी हुई लालटेन से लगी थी। पूरा गिरोह रातों-रात भाग चुका था, इसलिए वहाँ न कर्नल मिला और न ही वह औरत। वहाँ बस जलती हुई दीवारें और एक टूटी हुई मशीन बची थी।
  - >-
    राख में विक्रम को चाँदी के कुछ चमकते हुए सिक्के मिले। उन्होंने कहा, "ये नक़ली सिक्के हैं। वह मशीन मुल्तानी मिट्टी की नहीं, बल्कि नक़ली रुपये ढालने की थी। समीर ने वह धातु देख ली थी, इसलिए वे उसे मार देना चाहते थे।"
  - >-
    समीर ने धीरे से पूछा, "और मेरे अँगूठे का क्या होगा?" विक्रम ने उसके कंधे पर हाथ रखकर कहा, "तुम्हारा अँगूठा चला गया, समीर, लेकिन तुम्हारी जान बच गई। तुम्हारी वजह से ही आज एक पूरा गिरोह बेनक़ाब हुआ है।"
  - >-
    विक्रम बोले, "घोड़े के शरीर पर पसीना नहीं था, फ़र्श पर धातु की पपड़ी थी और समीर ने एक ऐसा सवाल पूछ लिया था, जो उसे नहीं पूछना था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    फिर विक्रम ने एक सिक्का रोशनी में उठाकर देखा। उस पर राजा का चेहरा नहीं था, बल्कि उसकी जगह कमल का एक बहुत छोटा सा फूल उभरा हुआ था। यह देखकर विक्रम की आँखें सिकुड़ गईं।
  - >-
    इंस्पेक्टर भैरव ने चुपचाप एक सिक्का अपनी जेब में डाल लिया और कहा कि वह उसे सबूत के लिए रख रहे हैं। विक्रम कुछ नहीं बोले, लेकिन सावित्री ने देखा कि उनकी नज़र भैरव की जेब पर टिकी रही। आख़िर इन सिक्कों पर कमल का निशान क्यों था? अपना जवाब कमेंट में बताइए।
