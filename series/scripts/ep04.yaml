# EP 4 - अनजान कोठी का बुलावा (The Engineer's Thumb)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "नीचे आती लोहे की छत", title: "बंद कमरा... और धीरे-धीरे नीचे उतरती लोहे की छत", end_question: "क्या समीर बच पाया?"}
  - {start_scene: 5, end_scene: 6, hook_text: "एक घंटे का सफ़र, ताज़ा घोड़ा", title: "एक घंटा चली बग्घी... पर घोड़ा ज़रा भी नहीं थका", end_question: "कोठी असल में कितनी दूर थी?"}
  - {start_scene: 12, end_scene: 13, hook_text: "खिड़की से लटकी जान", title: "खिड़की से लटका इंजीनियर... और ऊपर उठा गँड़ासा", end_question: "आगे क्या हुआ?"}
script:
  - >-
    लोहे की छत धीरे-धीरे नीचे आ रही थी। समीर ने पूरी ताक़त से दरवाज़ा पीटा। बाहर से कोई जवाब नहीं। बस मशीन की गड़गड़ाहट, और ऊपर से उतरता अँधेरा। तभी दीवार के उस पार एक औरत चीखी... "भागो!"
  - >-
    सुबह छह बजे, एक नौजवान मेरे दवाख़ाने के दरवाज़े पर बेहोश होकर गिर पड़ा। उसका दाहिना हाथ कसकर कपड़े में लिपटा था। मैंने पट्टी खोली, तो सन्न रह गई। उस हाथ में अँगूठा नहीं था।
  - >-
    मैं सावित्री हूँ। मैंने उसकी मरहम-पट्टी की, और सीधे विक्रम के पास ले गई। उसका नाम था समीर। मिर्ज़ापुर का एक ग़रीब, पर होशियार इंजीनियर, जो पानी से चलने वाली मशीनें ठीक करता था।
  - >-
    समीर ने बताया, कल शाम उसके पास एक बहुत दुबला-पतला आदमी आया था। खोखली आवाज़, ठंडी आँखें। नाम बताया... कर्नल प्रताप। "एक रात का काम है। पचास रुपये दूँगा। पर किसी को बताना मत।"
  - >-
    पचास रुपये! समीर की तीन महीने की कमाई। काम था, मुल्तानी मिट्टी दबाने वाली एक मशीन ठीक करना। आधी रात को स्टेशन पर एक बंद बग्घी आई, जिसकी खिड़कियों के शीशे धुंधले थे। बाहर कुछ दिखाई नहीं देता था।
  - >-
    बग्घी पूरे एक घंटे चली। फिर जंगल के बीच एक टूटी-फूटी कोठी के सामने रुकी। उतरते वक़्त समीर ने एक चीज़ पर ध्यान दिया... घोड़ा ज़रा भी थका नहीं था। न पसीना, न हाँफना।
  - >-
    अंदर, अँधेरे गलियारे में, एक डरी हुई औरत मिली। उसने काँपती आवाज़ में फुसफुसाया, "यहाँ से चले जाओ। अभी। रुकना मत।" पर तभी कर्नल आ गया, और वो औरत अँधेरे में ग़ायब हो गई।
  - >-
    कर्नल उसे एक बड़े कमरे में ले गया। वो कमरा ख़ुद एक मशीन था। लोहे की भारी छत, जो पानी के ज़ोर से नीचे दबती थी। समीर ने रिसाव ढूँढ़ लिया। पर फ़र्श पर उसे कुछ अजीब दिखा... चमकती हुई धातु की पपड़ी।
  - >-
    मुल्तानी मिट्टी नहीं... धातु। समीर ने भोलेपन में पूछ लिया, "कर्नल साहब, ये मशीन असल में दबाती क्या है?" कर्नल का चेहरा पत्थर हो गया। वो बिना कुछ कहे बाहर निकला... और दरवाज़ा बाहर से बंद कर दिया।
  - >-
    फिर मशीन चल पड़ी। लोहे की छत नीचे उतरने लगी। एक हाथ, दो हाथ... समीर की चीखें मशीन के शोर में डूब गईं। तभी उसे लकड़ी की दीवार में एक दरार दिखी।
  - >-
    रुकिए। एक घंटे का सफ़र, पर ताज़ा घोड़ा। मुल्तानी मिट्टी की मशीन, पर फ़र्श पर धातु। आप क्या सोचते हैं, ये कोठी असल में कितनी दूर थी? और वहाँ बन क्या रहा था?
  - >-
    समीर ने दरार में उँगलियाँ फँसाईं, और तख़्ता उखाड़ दिया। वो गलियारे में गिरा। वही औरत दौड़ती आई, और उसे एक खिड़की तक ले गई। "कूद जाओ!" समीर खिड़की से बाहर लटक गया।
  - >-
    ऊपर से कर्नल का चेहरा झाँका। उसके हाथ में एक भारी गँड़ासा था। चाँदनी में उसकी परछाईं उठी... और फिर समीर को बस इतना याद है कि वो नीचे झाड़ियों में गिरा, और बेहोश हो गया।
  - >-
    जब होश आया, तो वो स्टेशन के पास की झाड़ियों में पड़ा था। हाथ में असहनीय दर्द, और अँगूठा... ग़ायब। कोठी का कहीं कोई निशान नहीं।
  - >-
    विक्रम ने नक़्शा फैलाया, और स्टेशन के चारों ओर एक छोटा सा गोला खींच दिया। "घोड़ा ताज़ा था, यानी बग्घी एक घंटे तक गोल-गोल घूमती रही। कोठी स्टेशन से दूर नहीं... बहुत पास है।"
  - >-
    इंस्पेक्टर भैरव पांडे भी हमारे साथ हो लिए। मिर्ज़ापुर पहुँचते ही हमने आसमान में धुआँ देखा। जंगल के बीच, एक कोठी धू-धू कर जल रही थी।
  - >-
    समीर चीखा, "वही है!" उसकी गिरी हुई लालटेन से आग लगी थी। गिरोह रातों-रात भाग चुका था। न कर्नल, न वो औरत। बस जलती दीवारें, और टूटी हुई मशीन।
  - >-
    राख में विक्रम को चाँदी के कुछ चमकते सिक्के मिले। "नक़ली सिक्के," वो बोले। "ये मुल्तानी मिट्टी की नहीं, नक़ली रुपये ढालने की मशीन थी। समीर ने धातु देख ली थी, इसलिए उसे मरना था।"
  - >-
    समीर ने धीरे से पूछा, "और मेरा अँगूठा?" विक्रम ने उसके कंधे पर हाथ रखा। "तुम्हारा अँगूठा गया, समीर। पर तुम्हारी जान बच गई। और तुम्हारी वजह से एक पूरा गिरोह बेनक़ाब हुआ।"
  - >-
    "घोड़े का सूखा शरीर, फ़र्श की पपड़ी, और एक सवाल जो नहीं पूछना था..." विक्रम बोले, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    फिर उन्होंने एक सिक्का रोशनी में उठाया। उस पर राजा का चेहरा नहीं था। उसकी जगह, एक बहुत छोटा सा कमल का फूल उभरा हुआ था। विक्रम की आँखें सिकुड़ गईं।
  - >-
    इंस्पेक्टर भैरव ने चुपचाप एक सिक्का अपनी जेब में डाल लिया। "सबूत के लिए," उन्होंने कहा। विक्रम कुछ नहीं बोले। पर मैंने देखा, उनकी नज़र भैरव की जेब पर टिकी रही। इन सिक्कों पर कमल का निशान क्यों था? कमेंट में बताइए।
