script:
  - >-
    आधी रात। बनारस के बड़े साहूकार, सेठ द्वारकादास अग्रवाल की नींद एक आवाज़ से खुली। वो दबे पाँव अपने कमरे से निकले। और बैठक में, लालटेन की धीमी रोशनी में, उन्होंने अपने बेटे अरुण को देखा। उसके हाथ में था... एक महाराज का पुखराज मुकुट।
  - >-
    वो मुकुट, जो एक महाराज ने भारी क़र्ज़ के बदले गिरवी रखा था। देश की सबसे क़ीमती चीज़ों में से एक। और उसका एक कोना टूटा हुआ था। तीन पुखराज ग़ायब। आधी रात, बेटे के हाथ में टूटा मुकुट।
  - >-
    मैं सावित्री हूँ। सेठ द्वारकादास बदहवास होकर विक्रम के पास आए। "मेरा अपना बेटा, विक्रम बाबू! मेरा अपना ख़ून! मैंने ख़ुद उसे पुलिस के हवाले किया।" अरुण ने एक शब्द नहीं कहा था। न सफ़ाई, न माफ़ी। बस चुप्पी।
  - >-
    सेठ के घर में उनकी भतीजी मीनू भी रहती थी। प्यारी, शांत लड़की, जिसे सेठ अपनी बेटी की तरह मानते थे। और अरुण... थोड़ा बिगड़ा हुआ, जुआ खेलने वाला। पर क्या चोर?
  - >-
    इंस्पेक्टर भैरव फिर से बहाल हो चुके थे, और कुछ साबित करने को बेचैन थे। "मामला साफ़ है, विक्रम बाबू। जुआरी बेटा, क़र्ज़, और मुकुट।" विक्रम बोले, "अगर अरुण चोर था, तो वो मुकुट लेकर भागा क्यों नहीं? वहीं खड़ा क्यों था?"
  - >-
    रात भर बारिश हुई थी। सेठ के घर के आँगन और पिछली गली की कच्ची मिट्टी गीली थी। विक्रम घुटनों के बल बैठकर निशान पढ़ने लगे। "एक औरत के नंगे पैर, रसोई के दरवाज़े तक गए, और लौट आए।"
  - >-
    "यहाँ एक आदमी खड़ा था, बाहर, जूतों में, देर तक, इंतज़ार करता हुआ। फिर ये, दूसरे नंगे पैर, तेज़ी से दौड़ते हुए। कोई उस जूते वाले आदमी के पीछे भागा था। और यहाँ, दोनों के बीच हाथापाई हुई।"
  - >-
    विक्रम खड़े हुए। "अरुण चोर नहीं है, सेठ जी। वो चोर के पीछे भागा था। उसी हाथापाई में मुकुट टूटा। बड़ा हिस्सा अरुण के हाथ में आया। तीन पुखराज वाला टुकड़ा, उस आदमी के पास चला गया।"
  - >-
    "पर वो औरत के पैर किसके थे?" मैंने पूछा। विक्रम ने मीनू के कमरे की खिड़की की तरफ़ देखा, और चुप रहे।
  - >-
    रुकिए। आँगन की गीली मिट्टी में तीन तरह के निशान। औरत के नंगे पैर। जूते पहने, इंतज़ार करता आदमी। और दौड़ते हुए नंगे पैर। आप ये निशान पढ़ पाए? चोर कौन था?
  - >-
    उस शाम विक्रम एक आवारा, फटेहाल आदमी के भेष में निकल गए। रात को लौटे, तो हाथ में एक पुराना जूता था। "कुँवर शमशेर सिंह के नौकर से ख़रीदा है। आँगन के निशानों से बिल्कुल मिलता है।"
  - >-
    कुँवर शमशेर सिंह। बनारस का एक रईस, जुआरी, और मशहूर निशानेबाज़। ख़ूबसूरत, मीठी ज़ुबान, और बेहद ख़तरनाक। लोग कहते थे, वो उड़ती चिड़िया की आँख में गोली मार सकता है।
  - >-
    विक्रम सीधे उसकी कोठी पहुँचे। शमशेर ने मुस्कराकर उनका स्वागत किया। पर जैसे ही विक्रम ने मुकुट का नाम लिया, उसने दराज़ से पिस्तौल निकाली। विक्रम की छड़ी बिजली की तरह घूमी, और पिस्तौल फ़र्श पर जा गिरी।
  - >-
    विक्रम ने कहा, "पुखराज मुझे दे दो, शमशेर। उनकी क़ीमत मिलेगी, और पुलिस को कुछ नहीं बताऊँगा। वरना जेल।" शमशेर ने बहुत देर सोचा, फिर हँसा। "सौदा मंज़ूर, जासूस। पर ये हमारी आख़िरी मुलाक़ात नहीं है।"
  - >-
    विक्रम ने पुखराज सेठ के हाथ में रखे, और सच बताया। "मीनू शमशेर से प्यार करती है, सेठ जी। उसी के कहने पर, उस रात उसने मुकुट उठाकर खिड़की से उसे दे दिया। अरुण ने देख लिया, और शमशेर के पीछे भागा।"
  - >-
    "उसने मुकुट छीन लिया, पर एक टुकड़ा टूट गया। वो उसे वापस रखने बैठक में आया, तभी आपने उसे देख लिया। और वो चुप रहा, ताकि बहन जैसी मीनू की इज़्ज़त बची रहे।" सेठ फूट-फूटकर रो पड़े। अरुण रिहा कर दिया गया।
  - >-
    और मीनू? उसी रात वो घर से भाग गई। शमशेर के साथ। विक्रम बोले, "गीली मिट्टी, एक पुराना जूता, और एक बेटे की चुप्पी... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर उसी रात कुछ ऐसा हुआ, जिसने पूरे बनारस को हिला दिया। सरकार की ख़ुफ़िया पुलिस ने इंस्पेक्टर भैरव के घर पर छापा मारा। और उनकी अलमारी से निकली... काले कमल की मुहर। और बैंगनी स्याही वाली चिट्ठियों का एक बंडल।
  - >-
    अगली सुबह हर अख़बार की सुर्ख़ी थी... "काला कमल पकड़ा गया! पुलिस इंस्पेक्टर ही निकला सबसे बड़ा अपराधी!" भैरव को हथकड़ियों में ले जाते देख, उनकी पत्नी बेहोश हो गईं।
  - >-
    राय बहादुर देवेंद्रनाथ ने अख़बारों में बयान दिया। "मैं पुलिस को बधाई देता हूँ। बनारस आज चैन की साँस ले सकता है।" लोग उनकी तारीफ़ कर रहे थे। पर विक्रम ने अख़बार मेज़ पर पटक दिया।
  - >-
    "भैरव बेवकूफ़ है, सावित्री। बहुत बड़ा बेवकूफ़। पर बेईमान नहीं। ये मुहर उसके घर में रखी गई है। असली कमल अब भी खुला घूम रहा है।" उन्होंने खिड़की के बाहर देखा। "और आज रात वो मुस्कुरा रहा होगा।"
  - >-
    और शमशेर? वो मीनू को लेकर कहाँ गया, किसी को नहीं पता। पर विक्रम ने कहा, "वो निशानेबाज़ फिर लौटेगा। और इस बार, उसका निशाना मैं होऊँगा।" क्या भैरव ही काला कमल है? कमेंट में अपना फ़ैसला लिखिए।
