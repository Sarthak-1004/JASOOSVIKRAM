  - {start_scene: 18, end_scene: 19, hook_text: "काला कमल पकड़ा गया!", title: "'काला कमल पकड़ा गया!' - और वो निकला एक इंस्पेक्टर", end_question: "क्या भैरव ही काला कमल है? कमेंट करें।"}
script:
  - >-
    आधी रात को बनारस के बड़े साहूकार सेठ द्वारकादास अग्रवाल की नींद एक आवाज़ से खुल गई और वह दबे पाँव अपने कमरे से निकले। बैठक में लालटेन की धीमी रोशनी में उन्होंने अपने बेटे अरुण को देखा। उसके हाथ में एक महाराज का पुखराज वाला मुकुट था।
  - >-
    वह मुकुट एक महाराज ने भारी क़र्ज़ के बदले गिरवी रखा था और वह देश की सबसे क़ीमती चीज़ों में से एक था। उसका एक कोना टूटा हुआ था और उसमें से तीन पुखराज ग़ायब थे। आधी रात को वह टूटा हुआ मुकुट सेठ के अपने बेटे के हाथ में था।
  - >-
    सेठ द्वारकादास बदहवास होकर जासूस विक्रम और डॉक्टर सावित्री के पास आए। उन्होंने कहा, "वह मेरा अपना बेटा और मेरा अपना ख़ून है, विक्रम बाबू, और मैंने ख़ुद उसे पुलिस के हवाले किया है।" अरुण ने न कोई सफ़ाई दी थी और न माफ़ी माँगी थी, वह बस चुप रहा था।
  - >-
    सेठ के घर में उनकी भतीजी मीनू भी रहती थी, जो एक प्यारी और शांत लड़की थी और जिसे सेठ अपनी बेटी की तरह मानते थे। अरुण थोड़ा बिगड़ा हुआ था और जुआ खेलता था। लेकिन क्या वह चोर भी था?
  - >-
    इंस्पेक्टर भैरव फिर से बहाल हो चुके थे और ख़ुद को साबित करने के लिए बेचैन थे। उन्होंने कहा, "मामला साफ़ है, विक्रम बाबू, क्योंकि बेटा जुआरी है और उस पर क़र्ज़ है।" विक्रम बोले, "अगर अरुण चोर था, तो वह मुकुट लेकर भागा क्यों नहीं और वहीं क्यों खड़ा रहा?"
  - >-
    रात भर बारिश हुई थी, इसलिए सेठ के घर के आँगन और पिछली गली की कच्ची मिट्टी गीली थी। विक्रम घुटनों के बल बैठकर वहाँ के निशान पढ़ने लगे। उन्होंने कहा, "एक औरत के नंगे पैर रसोई के दरवाज़े तक गए और फिर लौट आए।"
  - >-
    विक्रम ने आगे कहा, "यहाँ बाहर एक आदमी जूते पहने देर तक खड़ा इंतज़ार करता रहा। फिर ये दूसरे नंगे पैर हैं, जो तेज़ी से दौड़ रहे थे, यानी कोई उस जूते वाले आदमी के पीछे भागा था। इस जगह पर दोनों के बीच हाथापाई हुई।"
  - >-
    विक्रम खड़े होकर बोले, "अरुण चोर नहीं है, सेठ जी, वह चोर के पीछे भागा था। उसी हाथापाई में मुकुट टूट गया। उसका बड़ा हिस्सा अरुण के हाथ में आया और तीन पुखराज वाला टुकड़ा उस आदमी के पास चला गया।"
  - >-
    सावित्री ने पूछा, "लेकिन औरत के वे पैर किसके थे?" विक्रम ने मीनू के कमरे की खिड़की की तरफ़ देखा और चुप रहे।
  - >-
    यहाँ एक पल रुककर सोचिए। आँगन की गीली मिट्टी में तीन तरह के निशान थे। एक औरत के नंगे पैर थे, जूते पहनकर इंतज़ार करता एक आदमी था और दौड़ते हुए नंगे पैर थे। क्या आप ये निशान पढ़ पाए और समझ गए कि चोर कौन था?
  - >-
    उस शाम विक्रम एक आवारा और फटेहाल आदमी के भेष में निकल गए। रात को जब वह लौटे, तो उनके हाथ में एक पुराना जूता था। उन्होंने कहा, "मैंने इसे कुँवर शमशेर सिंह के नौकर से ख़रीदा है और यह आँगन के निशानों से बिल्कुल मिलता है।"
  - >-
    कुँवर शमशेर सिंह बनारस का एक रईस, जुआरी और मशहूर निशानेबाज़ था। वह ख़ूबसूरत था, उसकी ज़ुबान मीठी थी और वह बेहद ख़तरनाक था। लोग कहते थे कि वह उड़ती चिड़िया की आँख में गोली मार सकता है।
  - >-
    विक्रम सीधे उसकी कोठी पर पहुँचे, जहाँ शमशेर ने मुस्कराकर उनका स्वागत किया। लेकिन जैसे ही विक्रम ने मुकुट का नाम लिया, उसने दराज़ से पिस्तौल निकाल ली। विक्रम की छड़ी बिजली की तरह घूमी और पिस्तौल फ़र्श पर जा गिरी।
  - >-
    विक्रम ने कहा, "वे पुखराज मुझे दे दो, शमशेर। तुम्हें उनकी क़ीमत मिल जाएगी और मैं पुलिस को कुछ नहीं बताऊँगा, वरना तुम जेल जाओगे।" शमशेर ने बहुत देर तक सोचा और फिर हँसकर बोला, "मुझे यह सौदा मंज़ूर है, जासूस, लेकिन यह हमारी आख़िरी मुलाक़ात नहीं है।"
  - >-
    विक्रम ने वे पुखराज सेठ के हाथ में रखे और उन्हें सच बताया। उन्होंने कहा, "मीनू शमशेर से प्यार करती है, सेठ जी। उसी के कहने पर उस रात उसने मुकुट उठाकर खिड़की से उसे दे दिया। अरुण ने यह देख लिया और वह शमशेर के पीछे भागा।"
  - >-
    विक्रम ने कहा, "उसने मुकुट छीन लिया, लेकिन उसका एक टुकड़ा टूट गया। वह उसे वापस रखने बैठक में आया और तभी आपने उसे देख लिया। वह इसलिए चुप रहा, ताकि बहन जैसी मीनू की इज़्ज़त बची रहे।" सेठ फूट-फूटकर रो पड़े और अरुण को रिहा कर दिया गया।
  - >-
    मीनू उसी रात शमशेर के साथ घर से भाग गई। विक्रम बोले, "यह मामला गीली मिट्टी, एक पुराने जूते और एक बेटे की चुप्पी से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन उसी रात कुछ ऐसा हुआ, जिसने पूरे बनारस को हिला दिया। सरकार की ख़ुफ़िया पुलिस ने इंस्पेक्टर भैरव के घर पर छापा मारा। उनकी अलमारी से काले कमल की मुहर और बैंगनी स्याही वाली चिट्ठियों का एक बंडल निकला।
  - >-
    अगली सुबह हर अख़बार की सुर्ख़ी यही थी कि काला कमल पकड़ा गया और एक पुलिस इंस्पेक्टर ही सबसे बड़ा अपराधी निकला। भैरव को हथकड़ियों में ले जाते देखकर उनकी पत्नी बेहोश हो गईं।
  - >-
    राय बहादुर देवेंद्रनाथ ने अख़बारों में बयान दिया, "मैं पुलिस को बधाई देता हूँ, क्योंकि बनारस आज चैन की साँस ले सकता है।" लोग उनकी तारीफ़ कर रहे थे, लेकिन विक्रम ने अख़बार मेज़ पर पटक दिया।
  - >-
    विक्रम बोले, "भैरव बहुत बड़ा बेवकूफ़ है, सावित्री, लेकिन वह बेईमान नहीं है। यह मुहर उसके घर में रखी गई है और असली कमल अब भी खुला घूम रहा है।" उन्होंने खिड़की के बाहर देखकर कहा, "आज रात वह मुस्कुरा रहा होगा।"
  - >-
    शमशेर मीनू को लेकर कहाँ गया, यह किसी को नहीं पता था। विक्रम ने कहा, "वह निशानेबाज़ फिर लौटेगा और इस बार उसका निशाना मैं होऊँगा।" क्या भैरव ही काला कमल हैं? अपना फ़ैसला कमेंट में लिखिए।
