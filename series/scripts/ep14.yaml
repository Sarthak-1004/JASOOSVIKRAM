# EP 14 - बीमार के कमरे में कौन? (The Naval Treaty)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "ख़ाली कमरे में बजती घंटी", title: "दस मिनट में गुप्त संधि ग़ायब... और ख़ाली कमरे में घंटी बजी", end_question: "घंटी किसने बजाई?"}
  - {start_scene: 6, end_scene: 7, hook_text: "खिड़की पर चाकू", title: "आधी रात, बीमार के कमरे की खिड़की पर चाँदनी में चाकू", end_question: "कौन था वो?"}
  - {start_scene: 13, end_scene: 14, hook_text: "रात दो बजे का तख़्ता", title: "रात दो बजे, फ़र्श का तख़्ता धीरे से उठा...", end_question: "नीचे क्या था?"}
script:
  - >-
    कलकत्ता का एक सरकारी दफ़्तर। एक क्लर्क सिर्फ़ दस मिनट के लिए चाय मँगवाने बाहर गया। लौटा, तो मेज़ से एक गुप्त संधि के काग़ज़ ग़ायब थे। और ख़ाली कमरे में... घंटी बज रही थी।
  - >-
    दफ़्तर का एक ही मुख्य दरवाज़ा था, और वहाँ चपरासी बैठा था। उसने किसी को अंदर जाते नहीं देखा। फिर काग़ज़ कहाँ गए? और उस ख़ाली कमरे में घंटी किसने बजाई?
  - >-
    मैं सावित्री हूँ। वो क्लर्क था प्रकाश मित्रा, कभी मेरा मरीज़ रह चुका था। बेहद होशियार, पर बेहद घबराने वाला। चोरी की उसी रात उसे दिमाग़ी बुख़ार चढ़ गया, और वो नौ हफ़्ते तक बिस्तर पर पड़ा रहा।
  - >-
    उसकी मंगेतर अनिमा उसे बैरकपुर में अपने घर ले आई, और दिन-रात उसकी सेवा करती रही। प्रकाश को उस कमरे में रखा गया, जो पहले अनिमा के भाई जोगेश का था। जोगेश बड़ा हँसमुख, मिलनसार नौजवान था।
  - >-
    होश में आते ही प्रकाश ने मुझे चिट्ठी लिखी। "दीदी, विक्रम बाबू को लेकर आइए। अगर वो संधि दुश्मन के हाथ लग गई, तो मेरी नौकरी ही नहीं, देश की इज़्ज़त जाएगी। और मेरे मामा, सर रमेश चटर्जी, की भी।"
  - >-
    हम बैरकपुर पहुँचे। प्रकाश ने काँपती आवाज़ में एक और बात बताई। "दो रात पहले... आधी रात को... मैंने खिड़की पर कुछ देखा। चाँदनी में एक चाकू की धार। कोई खिड़की की सिटकनी खोलने की कोशिश कर रहा था।"
  - >-
    "मैं चीखा, और वो भाग गया। पर विक्रम बाबू, कोई मुझे क्यों मारना चाहेगा? मेरे पास तो अब कुछ बचा ही नहीं।" विक्रम चुप रहे, और खिड़की के बाहर बगीचे को देखते रहे।
  - >-
    फिर वो बगीचे में गए, और एक गुलाब तोड़कर उसे देर तक देखते रहे। "कुदरत ने गुलाब को ख़ूबसूरती दी है, ख़ुशबू दी है। ये ज़रूरी नहीं थे। ये बस उम्मीद हैं, प्रकाश। और मुझे तुम्हारे मामले में भी उम्मीद दिखती है।"
  - >-
    कलकत्ता में विक्रम ने वो दफ़्तर देखा। सीढ़ियों के पास बग़ल का एक छोटा सा दरवाज़ा था, जिसे कोई इस्तेमाल नहीं करता था। "चोर इसी रास्ते से आया," वो बोले। "और घंटी उसने ख़ुद बजाई। क्योंकि उसे लगा था, कमरे में कोई होगा।"
  - >-
    "मतलब चोर कोई ऐसा था, जो प्रकाश को जानता था, और उससे मिलने आया था," विक्रम बोले। "कमरा ख़ाली देखा, मेज़ पर काग़ज़ देखे... और लालच में उठा लिए।"
  - >-
    रुकिए। एक चोर, जो प्रकाश से मिलने आया था। नौ हफ़्तों तक प्रकाश का बीमारी वाला कमरा एक पल को ख़ाली नहीं हुआ। और खिड़की पर चाकू। सोचिए, चोर को उसी कमरे में क्यों घुसना था?
  - >-
    अगले दिन विक्रम ने एक अजीब योजना बनाई। "प्रकाश, आज तुम हमारे साथ कलकत्ता चलोगे। जोगेश भी।" फिर उन्होंने अनिमा को अलग ले जाकर कहा, "तुम पूरे दिन इसी कमरे में रहना। और रात को सोने जाओ, तो कमरा बाहर से बंद कर देना।"
  - >-
    शाम को सब कलकत्ता चले गए। पर विक्रम आधे रास्ते से चुपचाप लौट आए, और अँधेरे में बगीचे की झाड़ियों में छिप गए। रात गहरी होती गई। ठंड, मच्छर, और सन्नाटा।
  - >-
    रात के दो बजे। एक परछाईं बगीचे में आई। उसने खिड़की की सिटकनी चाकू से खोली, और अंदर कूद गई। लालटेन की हल्की रोशनी में, फ़र्श का एक तख़्ता धीरे से ऊपर उठा।
  - >-
    उस तख़्ते के नीचे से एक लिपटा हुआ बंडल निकला... गुप्त संधि! और लालटेन की रोशनी में वो चेहरा... जोगेश। हँसमुख, मिलनसार जोगेश।
  - >-
    विक्रम खिड़की से अंदर कूदे। जोगेश ने चाकू घुमाया। दोनों गुत्थमगुत्था हो गए। विक्रम के हाथ पर खरोंच आई, पर उन्होंने बंडल छीन लिया। जोगेश खिड़की से कूदकर अँधेरे में भाग गया।
  - >-
    अगली सुबह, कलकत्ता में नाश्ते की मेज़ पर, विक्रम ने प्रकाश के सामने चाँदी का एक ढका हुआ बर्तन रखा। "खाइए, प्रकाश बाबू।" प्रकाश ने ढक्कन उठाया... और अंदर रखी थी, वो गुप्त संधि।
  - >-
    प्रकाश ख़ुशी से चीख पड़ा, और कुर्सी से उछल गया। मैं हँसते-हँसते रो पड़ी। विक्रम बोले, "माफ़ करना, मुझे थोड़ा नाटक करने का शौक़ है।"
  - >-
    "जोगेश पर भारी कर्ज़ था। उस दिन वो प्रकाश से मिलने दफ़्तर गया। कमरा ख़ाली मिला, तो काग़ज़ उठा लिए, और अपने कमरे के तख़्ते के नीचे छिपा दिए। पर उसी रात प्रकाश बीमार होकर उसी कमरे में आ गया। और नौ हफ़्तों तक वो कमरा कभी ख़ाली नहीं हुआ।"
  - >-
    "इसीलिए खिड़की पर चाकू था। वो प्रकाश को मारना नहीं, बस अपने छिपाए काग़ज़ निकालना चाहता था। बग़ल का दरवाज़ा, बजती घंटी, और एक कमरा जो कभी ख़ाली नहीं हुआ... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जोगेश की अलमारी से एक कार्ड मिला। उस पर लिखा था, 'कमल वाले ख़रीदार से मिलो।' और नीचे एक पता। कलकत्ता का एक पिछला दरवाज़ा... पंकज सेवा सदन अस्पताल की कलकत्ता शाखा का।
  - >-
    विक्रम ने कार्ड चुपचाप अपनी जेब में रख लिया। पहली बार मैंने उस भली संस्था के नाम पर उनके चेहरे पर एक अजीब सी परेशानी देखी। क्या आपको भी इस संस्था पर शक हो रहा है? कमेंट में बताइए।
