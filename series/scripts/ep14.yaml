# EP 14 - बीमार के कमरे में कौन? (The Naval Treaty)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "ख़ाली कमरे में बजती घंटी", title: "दस मिनट में गुप्त संधि ग़ायब... और ख़ाली कमरे में घंटी बजी", end_question: "घंटी किसने बजाई?"}
  - {start_scene: 6, end_scene: 7, hook_text: "खिड़की पर चाकू", title: "आधी रात, बीमार के कमरे की खिड़की पर चाँदनी में चाकू", end_question: "कौन था वो?"}
  - {start_scene: 13, end_scene: 14, hook_text: "रात दो बजे का तख़्ता", title: "रात दो बजे, फ़र्श का तख़्ता धीरे से उठा...", end_question: "नीचे क्या था?"}
script:
  - >-
    कलकत्ता के एक सरकारी दफ़्तर में एक क्लर्क सिर्फ़ दस मिनट के लिए चाय मँगवाने बाहर गया। जब वह लौटा, तो उसकी मेज़ से एक गुप्त संधि के काग़ज़ ग़ायब थे। उसी समय उस ख़ाली कमरे में घंटी बज रही थी।
  - >-
    उस दफ़्तर का एक ही मुख्य दरवाज़ा था, जहाँ एक चपरासी बैठा था, और उसने किसी को अंदर जाते नहीं देखा था। फिर वे काग़ज़ कहाँ गए, और उस ख़ाली कमरे में घंटी किसने बजाई थी?
  - >-
    उस क्लर्क का नाम प्रकाश मित्रा था और वह कभी डॉक्टर सावित्री का मरीज़ रह चुका था। वह बेहद होशियार था, लेकिन बहुत जल्दी घबरा जाता था। चोरी की उसी रात उसे दिमाग़ी बुख़ार चढ़ गया और वह नौ हफ़्ते तक बिस्तर पर पड़ा रहा।
  - >-
    उसकी मंगेतर अनिमा उसे बैरकपुर में अपने घर ले आई और दिन-रात उसकी सेवा करती रही। प्रकाश को उस कमरे में रखा गया, जो पहले अनिमा के भाई जोगेश का था। जोगेश एक बड़ा हँसमुख और मिलनसार नौजवान था।
  - >-
    होश में आते ही प्रकाश ने सावित्री को चिट्ठी लिखी, "दीदी, आप विक्रम बाबू को लेकर आइए। अगर वह संधि दुश्मन के हाथ लग गई, तो मेरी नौकरी ही नहीं, देश की इज़्ज़त भी जाएगी, और मेरे मामा सर रमेश चटर्जी की भी।"
  - >-
    जासूस विक्रम और सावित्री बैरकपुर पहुँचे, जहाँ प्रकाश ने काँपती आवाज़ में एक और बात बताई। उसने कहा, "दो रात पहले आधी रात को मैंने खिड़की पर चाँदनी में एक चाकू की धार देखी। कोई खिड़की की सिटकनी खोलने की कोशिश कर रहा था।"
  - >-
    प्रकाश बोला, "मैं चीखा और वह भाग गया। लेकिन विक्रम बाबू, कोई मुझे क्यों मारना चाहेगा, जबकि मेरे पास तो अब कुछ बचा ही नहीं है?" विक्रम चुप रहे और खिड़की के बाहर बगीचे को देखते रहे।
  - >-
    फिर वह बगीचे में गए और एक गुलाब तोड़कर उसे देर तक देखते रहे। उन्होंने कहा, "कुदरत ने गुलाब को ख़ूबसूरती और ख़ुशबू दी है, जो ज़रूरी नहीं थीं। ये बस उम्मीद की निशानी हैं, प्रकाश, और मुझे तुम्हारे मामले में भी उम्मीद दिखती है।"
  - >-
    कलकत्ता में विक्रम ने वह दफ़्तर देखा। सीढ़ियों के पास बग़ल का एक छोटा सा दरवाज़ा था, जिसे कोई इस्तेमाल नहीं करता था। विक्रम बोले, "चोर इसी रास्ते से आया था और घंटी उसने ख़ुद बजाई थी, क्योंकि उसे लगा था कि कमरे में कोई होगा।"
  - >-
    विक्रम ने आगे कहा, "इसका मतलब है कि चोर कोई ऐसा आदमी था, जो प्रकाश को जानता था और उससे मिलने आया था। उसने कमरा ख़ाली देखा, मेज़ पर काग़ज़ देखे और लालच में उन्हें उठा लिया।"
  - >-
    यहाँ एक पल रुककर सोचिए। चोर प्रकाश से मिलने आया था। नौ हफ़्तों तक प्रकाश का बीमारी वाला कमरा एक पल के लिए भी ख़ाली नहीं हुआ, और फिर खिड़की पर एक चाकू दिखा। सोचिए कि चोर को उसी कमरे में क्यों घुसना था?
  - >-
    अगले दिन विक्रम ने एक अजीब योजना बनाई। उन्होंने कहा, "प्रकाश, आज तुम और जोगेश हमारे साथ कलकत्ता चलोगे।" फिर उन्होंने अनिमा को अलग ले जाकर कहा, "तुम पूरे दिन इसी कमरे में रहना, और जब रात को सोने जाओ, तो कमरा बाहर से बंद कर देना।"
  - >-
    शाम को सब लोग कलकत्ता चले गए, लेकिन विक्रम आधे रास्ते से चुपचाप लौट आए और अँधेरे में बगीचे की झाड़ियों में छिप गए। रात गहरी होती गई और वह ठंड, मच्छरों और सन्नाटे के बीच इंतज़ार करते रहे।
  - >-
    रात के दो बजे एक परछाईं बगीचे में आई। उसने चाकू से खिड़की की सिटकनी खोली और अंदर कूद गई। लालटेन की हल्की रोशनी में फ़र्श का एक तख़्ता धीरे से ऊपर उठा।
  - >-
    उस तख़्ते के नीचे से एक लिपटा हुआ बंडल निकला, जो वही गुप्त संधि थी। लालटेन की रोशनी में जो चेहरा दिखा, वह हँसमुख और मिलनसार जोगेश का था।
  - >-
    विक्रम खिड़की से अंदर कूदे और जोगेश ने उन पर चाकू घुमाया। दोनों आपस में गुत्थमगुत्था हो गए। विक्रम के हाथ पर खरोंच आई, लेकिन उन्होंने बंडल छीन लिया, और जोगेश खिड़की से कूदकर अँधेरे में भाग गया।
  - >-
    अगली सुबह कलकत्ता में नाश्ते की मेज़ पर विक्रम ने प्रकाश के सामने चाँदी का एक ढका हुआ बर्तन रखा और कहा, "खाइए, प्रकाश बाबू।" प्रकाश ने ढक्कन उठाया, तो अंदर वही गुप्त संधि रखी थी।
  - >-
    प्रकाश ख़ुशी से चीख पड़ा और कुर्सी से उछल गया, जबकि सावित्री हँसते-हँसते रो पड़ीं। विक्रम बोले, "मुझे माफ़ करना, मुझे थोड़ा नाटक करने का शौक़ है।"
  - >-
    विक्रम ने समझाया, "जोगेश पर भारी कर्ज़ था। उस दिन वह प्रकाश से मिलने दफ़्तर गया, और कमरा ख़ाली मिलने पर उसने काग़ज़ उठाकर अपने कमरे के तख़्ते के नीचे छिपा दिए। लेकिन उसी रात प्रकाश बीमार होकर उसी कमरे में आ गया, और नौ हफ़्तों तक वह कमरा कभी ख़ाली नहीं हुआ।"
  - >-
    उन्होंने कहा, "इसीलिए खिड़की पर चाकू दिखा था। वह प्रकाश को मारना नहीं, बस अपने छिपाए हुए काग़ज़ निकालना चाहता था। यह मामला बग़ल के दरवाज़े, बजती हुई घंटी और कभी ख़ाली न होने वाले कमरे से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जोगेश की अलमारी से एक कार्ड मिला, जिस पर लिखा था कि कमल वाले ख़रीदार से मिलो। उसके नीचे कलकत्ता के एक पिछले दरवाज़े का पता लिखा था। वह दरवाज़ा पंकज सेवा सदन अस्पताल की कलकत्ता शाखा का था।
  - >-
    विक्रम ने वह कार्ड चुपचाप अपनी जेब में रख लिया। उस भली संस्था का नाम देखकर सावित्री ने पहली बार उनके चेहरे पर एक अजीब सी परेशानी देखी। क्या आपको भी इस संस्था पर शक हो रहा है? अपना जवाब कमेंट में बताइए।
