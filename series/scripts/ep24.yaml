# EP 24 - डर से मौत (The Adventure of the Devil's Foot)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "चेहरों पर जमा ख़ौफ़", title: "बहन मरी पड़ी, भाई पागलों की तरह हँसते... चेहरों पर जमा ख़ौफ़", end_question: "ऐसा क्या देखा उन्होंने?"}
  - {start_scene: 8, end_scene: 9, hook_text: "दिन में जलता लैंप", title: "दूसरी मौत, वही ख़ौफ़... और दिन की रोशनी में जलता लैंप", end_question: "तांत्रिक का श्राप या कुछ और?"}
  - {start_scene: 11, end_scene: 12, hook_text: "जासूस ने ख़ुद आज़माया", title: "जासूस ने वो रहस्यमय राख ख़ुद लैंप पर डाली...", end_question: "क्या वो बच पाएंगे?"}
script:
  - >-
    कालीगढ़ के उजड़े हुए क़िले के नीचे बने एक घर में मोमबत्तियाँ बुझ चुकी थीं। ताश की मेज़ के पास बिंदु नाम की एक औरत मरी पड़ी थी। उसके दो भाई, ज्ञान और ओम, पागलों की तरह हँस रहे थे और गा रहे थे, और उनके चेहरों पर ऐसा ख़ौफ़ था, जो किसी इंसान के चेहरे पर शायद ही कभी दिखा हो।
  - >-
    कमरे में एक अजीब और कड़वी गंध फैली थी। गाँव वाले काँपते हुए बोले, "यह कालीगढ़ के तांत्रिक का श्राप है। जो भी उस क़िले की तरफ़ देखता है, उसका यही हाल होता है।" सवाल यह था कि उन तीनों ने आख़िर ऐसा क्या देखा था?
  - >-
    उन दिनों जासूस विक्रम की तबीयत फिर बिगड़ गई थी और डॉक्टर सावित्री उन्हें आराम के लिए राजपूताना के रेगिस्तान में कालीगढ़ गाँव ले गई थीं। उन्हें क्या पता था कि वहाँ उन्हें मौत का सबसे डरावना चेहरा देखने को मिलेगा।
  - >-
    गाँव के पुजारी शिवदत्त सुबह-सुबह उनके दरवाज़े पर आए। उनके साथ मधुसूदन था, जो मरी हुई बहन और पागल हो चुके भाइयों का चौथा भाई था। उसकी बातें चिकनी-चुपड़ी थीं, लेकिन उसकी आँखें बेचैन थीं।
  - >-
    मधुसूदन ने बताया कि कल रात वह अपने भाई-बहनों के साथ ताश खेल रहा था और तब सब ठीक थे और हँस रहे थे। दस बजे वह अपने घर लौट आया। सुबह नौकरानी ने आकर वह भयानक दृश्य देखा।
  - >-
    विक्रम ने कमरे को देखा, जिसकी खिड़कियाँ बंद थीं और जिसमें घुटन भरी थी। मेज़ पर एक लैंप रखा था, जो रात भर जलकर बुझ गया था। विक्रम ने बस इतना पूछा, "जब आप गए थे, तब क्या यह लैंप जल रहा था?" मधुसूदन ने हाँ में सिर हिला दिया।
  - >-
    गाँव में डॉक्टर वर्धमान राय नाम के एक मशहूर आदमी भी ठहरे हुए थे। वह बर्मा के जंगलों के खोजी और शेरों के शिकारी थे, और लंबे, मज़बूत और बेहद चुप रहने वाले आदमी थे। बिंदु की मौत की ख़बर सुनकर वह स्टेशन से ही वापस लौट आए थे।
  - >-
    दो दिन बाद सुबह-सुबह पुजारी फिर भागते हुए आए और उन्होंने बताया कि मधुसूदन को कुछ हो गया है। विक्रम और सावित्री उसके घर पहुँचे। मधुसूदन अपनी कुर्सी पर मरा पड़ा था और उसका चेहरा उसी ख़ौफ़ में जमा हुआ था। मेज़ पर रखा लैंप दिन की रोशनी में भी जल रहा था।
  - >-
    अब पूरा गाँव डर से काँप रहा था और सबको लग रहा था कि तांत्रिक का श्राप हर घर पर है। लेकिन विक्रम लैंप के ऊपर लगी अभ्रक की परत पर झुके हुए थे। उन्होंने उस पर जमी राख को चाकू से खुरचा और एक काग़ज़ में बाँध लिया।
  - >-
    यहाँ एक पल रुककर सोचिए। दोनों बार कमरा बंद था और दोनों बार एक लैंप जल रहा था। दोनों बार मरने वालों के चेहरों पर वैसा ही ख़ौफ़ था। आपको क्या लगता है कि यह तांत्रिक का श्राप था या कुछ और था?
  - >-
    उस शाम विक्रम ने अपने कमरे की खिड़कियाँ बंद कीं, एक लैंप जलाया और उस राख को उसकी लौ पर डाल दिया। सावित्री ने पूछा, "विक्रम, आप यह क्या कर रहे हैं?" विक्रम बोले, "मुझे बस यह देखना है, सावित्री, कि उन लोगों ने क्या देखा था।"
  - >-
    लैंप से एक हरी सी लौ उठी और एक कड़वी-मीठी गंध फैल गई। फिर कमरे की दीवारें हिलने लगीं और कोनों में काली परछाइयाँ उगने लगीं, जो सावित्री की तरफ़ रेंग रही थीं। उन्हें लगा कि कोई उनका गला दबा रहा है। वह चीखना चाहती थीं, लेकिन उनकी आवाज़ नहीं निकली।
  - >-
    सावित्री ने विक्रम की ओर देखा, जिनका चेहरा पत्थर हो गया था और आँखें फटी हुई थीं। उनके चेहरे पर वही ख़ौफ़ था, जो उन लाशों पर दिखा था। सावित्री ने अपनी आख़िरी ताक़त से उनका हाथ पकड़ा और उन्हें घसीटते हुए दरवाज़े से बाहर ले गईं।
  - >-
    दोनों हाँफते हुए बाहर घास पर गिर पड़े और ठंडी हवा ने उन्हें वापस ज़िंदा कर दिया। विक्रम ने काँपती आवाज़ में कहा, "मुझे माफ़ करना, सावित्री, मैंने तुम्हें भी इसमें खींच लिया।" उस दिन सावित्री ने मौत को अपनी आँखों से देखा था।
  - >-
    विक्रम ने डॉक्टर वर्धमान राय को बुलाया और उनके सामने राख का वह काग़ज़ रखकर पूछा, "यह क्या है, डॉक्टर साहब?" राय का चेहरा उतर गया। उन्होंने कहा, "इसे शैतान की जड़ कहते हैं और यह बर्मा के जंगलों का एक पौधा है। इसका धुआँ इंसान को डर से पागल कर देता है या मार देता है।"
  - >-
    राय बोले, "यह पूरे हिंदुस्तान में सिर्फ़ मेरे पास है और मेरे संदूक़ में रखा है।" विक्रम ने कहा, "कुछ हफ़्ते पहले मधुसूदन आपसे मिलने आपके कमरे में आया था, है ना?" राय ने धीरे से सिर हिलाया।
  - >-
    विक्रम ने कहा, "मधुसूदन ने आपकी वह जड़ चुराई थी। उस रात जाने से पहले उसने भाई-बहनों की ज़मीन-जायदाद के लिए लैंप में वह पाउडर डाला और दरवाज़ा बंद करके चला गया।" फिर वह रुककर बोले, "लेकिन मधुसूदन को किसने मारा, डॉक्टर साहब?"
  - >-
    डॉक्टर राय बहुत देर तक चुप रहे और फिर उनकी आवाज़ टूट गई। उन्होंने कहा, "मैं बिंदु से प्यार करता था और हम शादी करने वाले थे। जब मैं समझ गया कि मधुसूदन ने क्या किया है, तो मैं उसके घर गया, उसे कुर्सी पर बिठाया और वही लैंप जला दिया।"
  - >-
    विक्रम ने खिड़की के बाहर उजड़े हुए क़िले को देखा और बहुत देर बाद बोले, "आप आज ही बर्मा लौट जाइए, डॉक्टर साहब।" राय ने हैरानी से उनकी ओर देखा। विक्रम बोले, "मैंने कभी किसी से ऐसा प्यार नहीं किया, लेकिन अगर करता, तो शायद मैं भी यही करता।"
  - >-
    विक्रम ने कहा, "यह मामला लैंप की परत पर जमी राख और दिन में जलते हुए लैंप से सुलझा। यहाँ कोई श्राप नहीं था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाते-जाते राय ने बताया कि उनकी बर्मा की खोज-यात्राओं का ख़र्च एक संस्था उठाती थी। उसी संस्था ने चिकित्सा शोध के नाम पर वह जड़ ख़ास तौर पर मँगवाई थी। उस संस्था का नाम पंकज सेवा सदन था।
  - >-
    बनारस लौटते ही राय बहादुर देवेंद्रनाथ ने उनके इलाज के लिए अपना निजी डॉक्टर भेजा, लेकिन सावित्री ने उसे दरवाज़े से ही लौटा दिया। उन्हें ख़ुद नहीं पता था कि उन्होंने ऐसा क्यों किया, बस उनके मन में एक अजीब सा डर था। क्या सावित्री ने सही किया? इस बारे में आपकी क्या राय है?
