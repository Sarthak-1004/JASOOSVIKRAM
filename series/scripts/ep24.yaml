  - {start_scene: 1, end_scene: 2, hook_text: "चेहरों पर जमा ख़ौफ़", title: "बहन मरी पड़ी, भाई पागलों की तरह हँसते... चेहरों पर जमा ख़ौफ़", end_question: "ऐसा क्या देखा उन्होंने?"}
  - {start_scene: 8, end_scene: 9, hook_text: "दिन में जलता लैंप", title: "दूसरी मौत, वही ख़ौफ़... और दिन की रोशनी में जलता लैंप", end_question: "तांत्रिक का श्राप या कुछ और?"}
  - {start_scene: 11, end_scene: 12, hook_text: "जासूस ने ख़ुद आज़माया", title: "जासूस ने वो रहस्यमय राख ख़ुद लैंप पर डाली...", end_question: "क्या वो बच पाएंगे?"}
script:
  - >-
    कालीगढ़ के उजड़े क़िले के नीचे, एक घर में मोमबत्तियाँ बुझ चुकी थीं। ताश की मेज़ के पास बहन बिंदु मरी पड़ी थी। और उसके दो भाई, ज्ञान और ओम, पागलों की तरह हँस रहे थे, गा रहे थे। उनके चेहरों पर ऐसा ख़ौफ़ था, जो मैंने कभी किसी इंसान के चेहरे पर नहीं देखा।
  - >-
    कमरे में एक अजीब, कड़वी गंध थी। गाँव वाले काँपते हुए बोले, "ये कालीगढ़ के तांत्रिक का श्राप है। जो भी उस क़िले की तरफ़ देखता है, उसका यही हाल होता है।" चेहरों पर ऐसा ख़ौफ़... उन्होंने क्या देखा था?
  - >-
    मैं सावित्री हूँ। उन दिनों विक्रम की तबीयत फिर बिगड़ी थी। मैं उन्हें आराम के लिए राजपूताना के रेगिस्तान में, कालीगढ़ गाँव ले गई थी। मुझे क्या पता था कि वहाँ हमें मौत का सबसे डरावना चेहरा मिलेगा।
  - >-
    गाँव के पुजारी, शिवदत्त, सुबह-सुबह हमारे दरवाज़े पर आए। साथ में मधुसूदन था। मरी हुई बहन और पागल भाइयों का चौथा भाई। चिकनी-चुपड़ी बातें, पर आँखें बेचैन।
  - >-
    मधुसूदन ने बताया, कल रात वो अपने भाई-बहनों के साथ ताश खेल रहा था। सब ठीक थे, हँस रहे थे। दस बजे वो अपने घर लौट आया। सुबह नौकरानी ने आकर ये भयानक दृश्य देखा।
  - >-
    विक्रम ने कमरा देखा। खिड़कियाँ बंद थीं, और कमरे में घुटन थी। मेज़ पर एक लैंप रखा था, जो रात भर जलकर बुझ गया था। विक्रम ने बस इतना पूछा, "जब आप गए, तो लैंप जल रहा था?" मधुसूदन ने हाँ में सिर हिलाया।
  - >-
    गाँव में एक मशहूर आदमी भी ठहरा हुआ था। डॉक्टर वर्धमान राय। बर्मा के जंगलों के खोजी, शेरों के शिकारी। लंबा, मज़बूत, और बेहद चुप। बिंदु की मौत की ख़बर सुनकर वो स्टेशन से वापस लौट आए थे।
  - >-
    दो दिन बाद, सुबह-सुबह पुजारी फिर भागते हुए आए। "विक्रम बाबू! मधुसूदन!" हम उसके घर पहुँचे। मधुसूदन अपनी कुर्सी पर मरा पड़ा था, चेहरा उसी ख़ौफ़ में जमा हुआ। और मेज़ पर लैंप... दिन की रोशनी में भी जल रहा था।
  - >-
    अब पूरा गाँव डर से काँप रहा था। तांत्रिक का श्राप अब हर घर पर था। पर विक्रम लैंप के ऊपर लगी अभ्रक की परत पर झुके हुए थे। उन्होंने उस पर जमी राख चाकू से खुरची, और एक काग़ज़ में बाँध ली।
  - >-
    रुकिए। दोनों बार एक बंद कमरा। दोनों बार एक जलता लैंप। और दोनों बार, चेहरों पर वैसा ही ख़ौफ़। आपको क्या लगता है... तांत्रिक का श्राप, या कुछ और?
  - >-
    उस शाम विक्रम ने हमारे कमरे की खिड़कियाँ बंद कीं, एक लैंप जलाया, और उस राख को उसकी लौ पर डाल दिया। "विक्रम, क्या कर रहे हो?" "बस देखना है, सावित्री, कि उन्होंने क्या देखा था।"
  - >-
    एक हरी सी लौ उठी। एक कड़वी, मीठी गंध। फिर... कमरे की दीवारें हिलने लगीं। कोनों में काली परछाइयाँ उगने लगीं, जो मेरी तरफ़ रेंग रही थीं। मुझे लगा, कोई मेरा गला दबा रहा है। मैं चीखना चाहती थी, पर आवाज़ नहीं निकली।
  - >-
    मैंने विक्रम को देखा। उनका चेहरा पत्थर हो गया था, आँखें फटी हुई। उसी ख़ौफ़ में, जो मैंने उन लाशों पर देखा था। अपनी आख़िरी ताक़त से मैंने उनका हाथ पकड़ा, और उन्हें घसीटते हुए दरवाज़े से बाहर ले गई।
  - >-
    हम दोनों बाहर घास पर गिर पड़े, हाँफते हुए। ठंडी हवा ने हमें वापस ज़िंदा किया। विक्रम ने काँपती आवाज़ में कहा, "माफ़ करना, सावित्री। मैंने तुम्हें भी इसमें खींच लिया।" उस दिन मैंने मौत को अपनी आँखों से देखा था।
  - >-
    विक्रम ने डॉक्टर वर्धमान राय को बुलाया, और उनके सामने राख का काग़ज़ रखा। "ये क्या है, डॉक्टर साहब?" राय का चेहरा उतर गया। "शैतान की जड़। बर्मा के जंगलों का एक पौधा। इसका धुआँ इंसान को डर से पागल कर देता है, या मार देता है।"
  - >-
    "ये पूरे हिंदुस्तान में सिर्फ़ मेरे पास है," राय बोले। "मेरे संदूक़ में।" विक्रम ने कहा, "और कुछ हफ़्ते पहले मधुसूदन आपसे मिलने आपके कमरे में आया था। है ना?" राय ने धीरे से सिर हिलाया।
  - >-
    "मधुसूदन ने आपकी जड़ चुराई। उस रात, जाने से पहले, उसने लैंप में वो पाउडर डाला, और दरवाज़ा बंद करके चला गया। भाई-बहनों की ज़मीन-जायदाद के लिए।" विक्रम रुके। "पर मधुसूदन को किसने मारा, डॉक्टर साहब?"
  - >-
    डॉक्टर राय बहुत देर चुप रहे। फिर उनकी आवाज़ टूट गई। "मैं बिंदु से प्यार करता था। हम शादी करने वाले थे। जब मैं समझ गया कि मधुसूदन ने क्या किया है, मैं उसके घर गया, उसे कुर्सी पर बिठाया, और वही लैंप जला दिया।"
  - >-
    विक्रम ने खिड़की के बाहर उजड़े क़िले को देखा। बहुत देर बाद बोले, "बर्मा लौट जाइए, डॉक्टर साहब। आज ही।" राय ने हैरानी से देखा। विक्रम बोले, "मैंने कभी किसी से ऐसा प्यार नहीं किया। पर अगर करता... तो शायद मैं भी यही करता।"
  - >-
    "लैंप की परत पर राख, और दिन में जलता लैंप," विक्रम ने कहा। "कोई श्राप नहीं था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाते-जाते राय ने बताया, उनकी बर्मा की खोज-यात्राओं का ख़र्च एक संस्था उठाती थी, और उसी ने 'चिकित्सा शोध' के नाम पर ये जड़ ख़ास तौर पर मँगवाई थी। पंकज सेवा सदन।
  - >-
    बनारस लौटते ही राय बहादुर देवेंद्रनाथ ने हमारे इलाज के लिए अपना निजी डॉक्टर भेजा। पर मैंने उसे दरवाज़े से ही लौटा दिया। मुझे ख़ुद नहीं पता था क्यों। बस एक अजीब सा डर था। क्या मैंने सही किया? आपकी क्या राय है?
