# EP 1 - आधी रात की सीटी (The Adventure of the Speckled Band)
script:
  - >-
    आधी रात का समय था, जब बनारस की उस पुरानी हवेली में अचानक एक चीख गूँज उठी। कमला के कमरे का दरवाज़ा अंदर से बंद था। वह लड़खड़ाती हुई बाहर निकली, ज़मीन पर गिर पड़ी और अपनी आख़िरी साँस में बस इतना बोल पाई, "वह पट्टी, वह चितकबरी पट्टी!"
  - >-
    कमला के शरीर पर न कोई ज़ख़्म था और न ही ज़हर का कोई निशान मिला। उसका कमरा अंदर से बंद था और खिड़कियों पर लोहे की सलाखें लगी थीं। लोग कहते थे कि हवेली पर किसी प्रेत का साया है। लेकिन अगर वह प्रेत नहीं था, तो फिर कमला को किसने मारा था?
  - >-
    यह कहानी जासूस विक्रम और उनकी साथी डॉक्टर सावित्री की है, और उस रात की है जिसे सावित्री कभी भूल नहीं पाईं। कमला की मौत के दो साल बाद, एक धुंध भरी सुबह विक्रम के दरवाज़े पर एक लड़की खड़ी थी। उसका चेहरा सफ़ेद पड़ चुका था और उसके हाथ काँप रहे थे।
  - >-
    उस लड़की ने कहा, "मेरा नाम मीरा है और कमला मेरी जुड़वाँ बहन थी।" विक्रम की नज़र उसकी कलाई पर पड़े नीले निशानों पर ठहर गई। उन्होंने धीरे से पूछा, "क्या ये निशान तुम्हारे सौतेले पिता ने दिए हैं?" मीरा ने जवाब देने के बजाय अपनी नज़रें झुका लीं।
  - >-
    फिर मीरा ने वह बात कही, जिसे सुनकर सावित्री की रीढ़ में सिहरन दौड़ गई। मीरा बोली, "अगले महीने मेरी शादी है और मुझे कमला के कमरे में सुलाया जा रहा है। कल रात मैंने वही सीटी सुनी, ठीक वैसी ही, जैसी कमला ने मरने से पहले सुनी थी।"
  - >-
    मीरा के सौतेले पिता का नाम ठाकुर रघुवेंद्र सिंह था। वह बर्मा से लौटा हुआ एक गुस्सैल आदमी था, जिससे पूरा मोहल्ला डरता था। उसके डर से हवेली के नौकर एक-एक करके काम छोड़कर भाग गए थे।
  - >-
    हवेली के अहाते में रात को एक चीता खुला घूमता था और बर्मा से लाए गए अजीब जानवर पिंजरों में बंद रहते थे। आधी रात को ठाकुर के कमरे से ऐसी आवाज़ आती थी, जैसे कोई लोहे का दरवाज़ा धीरे से बंद कर रहा हो।
  - >-
    दोनों बहनों की माँ बहुत दौलत छोड़ गई थीं, लेकिन वह सारी दौलत ठाकुर के हाथ में थी। वसीयत में एक शर्त लिखी थी कि जिस दिन किसी बेटी की शादी होगी, उसी दिन उसका हिस्सा उसे मिल जाएगा। यह बात सुनते ही विक्रम की आँखें सिकुड़ गईं।
  - >-
    कमला की शादी भी तय हो चुकी थी, लेकिन शादी से ठीक दो हफ़्ते पहले उसकी मौत हो गई। मरने से एक रात पहले उसने मीरा से पूछा था, "क्या तुझे भी रात में सीटी सुनाई देती है, और उसके बाद किसी धातु के खनकने की आवाज़ आती है?"
  - >-
    मीरा के जाते ही दरवाज़ा धड़ाम से खुला और ठाकुर रघुवेंद्र ख़ुद अंदर आ गया। उसने विक्रम को धमकाया और लोहे की एक छड़ को मोड़कर फ़र्श पर फेंक दिया। उसके जाने के बाद विक्रम ने वह छड़ उठाई और मुस्कराते हुए उसे वापस सीधा कर दिया।
  - >-
    उसी दोपहर विक्रम और सावित्री हवेली पहुँचे, क्योंकि ठाकुर उस समय शहर गया हुआ था। विक्रम ने कमला के कमरे को ऐसे देखा, जैसे उसकी दीवारें उनसे बातें कर रही हों। फिर उनकी नज़र बिस्तर के ऊपर लटकी घंटी की रस्सी पर ठहर गई।
  - >-
    विक्रम ने वह रस्सी खींची, लेकिन कहीं कोई घंटी नहीं बजी, क्योंकि वह रस्सी किसी घंटी से जुड़ी ही नहीं थी। वह छत के पास बने एक छोटे से रोशनदान के कुंडे से बँधी हुई थी। सावित्री ने पूछा, "ऐसी रस्सी कोई क्यों लगाएगा?" लेकिन विक्रम ने कोई जवाब नहीं दिया।
  - >-
    वह रोशनदान बाहर की हवा में नहीं, बल्कि सीधे ठाकुर के कमरे में खुलता था। इसके बाद विक्रम ने बिस्तर को हिलाने की कोशिश की, लेकिन वह अपनी जगह से ज़रा भी नहीं हिला। वह बिस्तर लोहे की कीलों से फ़र्श में जड़ा हुआ था।
  - >-
    ठाकुर के कमरे में लोहे की एक भारी तिजोरी थी, जिसके ऊपर दूध की एक तश्तरी रखी थी। पास की कुर्सी पर चमड़े का एक पट्टा पड़ा था, जिसका सिरा फंदे की तरह बँधा हुआ था। यह सब देखकर विक्रम का चेहरा पत्थर की तरह सख़्त हो गया।
  - >-
    यहाँ एक पल रुककर सोचिए। उस कमरे में एक नकली रस्सी थी, एक रोशनदान था जो बगल के कमरे में खुलता था, बिस्तर ज़मीन में जड़ा हुआ था और तिजोरी पर दूध की तश्तरी रखी थी। क्या आपने वह सुराग पकड़ लिया, जो विक्रम पकड़ चुके थे? इसका जवाब इसी कमरे में छिपा है।
  - >-
    उस रात मीरा को दूसरे कमरे में भेज दिया गया, और विक्रम और सावित्री कमला के कमरे में अँधेरे में बैठ गए। उन्होंने न कोई दीया जलाया और न ही कोई लालटेन। विक्रम ने फुसफुसाकर कहा, "सोना मत, सावित्री, क्योंकि हमारी जान इसी पर टिकी है।"
  - >-
    घड़ी ने पहले बारह बजाए, फिर एक और फिर दो। बाहर अहाते में चीते के घूमने की आहट सुनाई दे रही थी। अचानक रोशनदान से एक पल के लिए रोशनी चमकी और जलते हुए तेल की गंध आई। बगल के कमरे में कोई जाग रहा था।
  - >-
    और तभी कमरे में वही धीमी, लंबी और ठंडी सीटी सुनाई दी। अगले ही पल विक्रम उछलकर खड़े हुए, उन्होंने माचिस जलाई और अपनी छड़ी से रस्सी पर ताबड़तोड़ वार करने लगे। वह चिल्लाए, "क्या तुमने उसे देखा, सावित्री?"
  - >-
    सावित्री को कुछ दिखाई नहीं दिया, उन्होंने बस किसी चीज़ के सरकने की हल्की सी आवाज़ सुनी। फिर बगल के कमरे से एक ऐसी भयानक चीख उठी, जो बरसों तक सावित्री के सपनों में गूँजती रही। उसके बाद पूरी हवेली में सन्नाटा छा गया।
  - >-
    विक्रम और सावित्री लालटेन लेकर ठाकुर के कमरे में घुसे, जहाँ तिजोरी का दरवाज़ा खुला पड़ा था। ठाकुर कुर्सी पर बेजान बैठा था और उसकी आँखें छत पर टिकी हुई थीं। उसके माथे के चारों ओर एक पीली, चितकबरी पट्टी लिपटी थी, जो धीरे-धीरे हिलने लगी।
  - >-
    विक्रम ने कहा, "यह पट्टी नहीं है, सावित्री, यह बर्मा का सबसे ज़हरीला साँप है। ठाकुर इसे रोशनदान से रस्सी के सहारे बिस्तर तक भेजता था और सीटी बजाकर वापस बुला लेता था। बेटियों की शादी होती, तो दौलत उसके हाथ से निकल जाती। आज मेरी छड़ी की मार से साँप पलटा और अपने ही मालिक पर टूट पड़ा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाते-जाते विक्रम की नज़र मेज़ पर पड़े एक लिफ़ाफ़े पर गई, जिस पर काले कमल की मुहर लगी थी। अंदर बैंगनी स्याही में लिखा था, "पहली चाल तुम्हारी थी, विक्रम, लेकिन अगली चाल मेरी होगी।" उस कागज़ से केवड़े की हल्की ख़ुशबू आ रही थी। आख़िर यह काला कमल कौन है? अपना शक कमेंट में ज़रूर लिखिए।
