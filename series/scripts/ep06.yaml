# EP 6 - शापित नीलम (The Blue Carbuncle)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "शापित नीलम चोरी", title: "कहते हैं नीलम हर किसी को रास नहीं आता...", end_question: "क्या ये श्राप सच है?"}
  - {start_scene: 7, end_scene: 8, hook_text: "बत्तख़ के पेट में...!", title: "दिवाली की बत्तख़ काटी... और अंदर से निकला शापित नीलम", end_question: "बत्तख़ के पेट में नीलम कैसे पहुँचा?"}
  - {start_scene: 10, end_scene: 12, hook_text: "एक और आदमी भी पूछ रहा था", title: "मंडी वाली बोली: तुमसे पहले भी कोई इसी बत्तख़ को ढूँढ़ रहा था", end_question: "वो दूसरा आदमी कौन था?"}
script:
  - >-
    कहते हैं नीलम हर किसी को रास नहीं आता। जिसने उसे पहना, या तो राजा बन गया, या मिट्टी में मिल गया। और जिसने उसे चुराया... उसकी क़िस्मत फूट गई। उस दिवाली, बनारस में यही शापित नीलम चोरी हो गया।
  - >-
    गंगा व्यू होटल में ठहरी एक महारानी के कमरे से नीलम ग़ायब था। इंस्पेक्टर भैरव ने फ़ौरन एक प्लंबर, रमेश, को गिरफ़्तार कर लिया, जो उस दिन कमरे में नल ठीक करने आया था। रमेश रोता रहा, "मैंने कुछ नहीं किया!"
  - >-
    मैं सावित्री हूँ। दिवाली की रात थी। पूरा बनारस दीयों से जगमगा रहा था। एक सिपाही विक्रम के कमरे में आया, हाथ में एक मोटी सफ़ेद बत्तख़ और एक पुरानी, घिसी हुई टोपी लिए हुए।
  - >-
    उसने बताया, गली में कुछ बदमाशों ने एक आदमी को घेर लिया था। हाथापाई में वो आदमी बत्तख़ और टोपी छोड़कर भाग गया। "बाबू जी, बत्तख़ आप रख लीजिए, त्योहार है।" विक्रम हँसे, और बत्तख़ मेरे बावर्ची को दे दी।
  - >-
    विक्रम ने टोपी को रोशनी में घुमाया। "इसका मालिक कभी अमीर था, अब ग़रीब है। पढ़ा-लिखा है, विद्वान है। और... उसकी पत्नी अब उसकी परवाह नहीं करती।" मैं हँस पड़ी। "ये सब एक टोपी से?"
  - >-
    "टोपी बड़ी है, यानी सिर बड़ा, यानी बड़ा दिमाग़। कपड़ा महँगा, पर तीन साल पुराना। और देखो, इस पर हफ़्तों की धूल है, किसी ने इसे झाड़ा नहीं। जिस आदमी की पत्नी उसकी परवाह करती है, उसकी टोपी ऐसी नहीं होती।"
  - >-
    तभी बावर्ची चीखता हुआ अंदर आया। उसके हाथ में कुछ चमक रहा था। "बाबू जी! बत्तख़ के पेट में... ये मिला!" उसकी हथेली पर एक नीला पत्थर था, जो दीये की रोशनी में ऐसे दहक रहा था, जैसे उसके अंदर आग हो।
  - >-
    वही शापित नीलम! विक्रम उछल पड़े। "बत्तख़ के पेट में महारानी का नीलम? अब सवाल ये है, सावित्री... ये बत्तख़ आई कहाँ से?"
  - >-
    अगली सुबह विक्रम ने अख़बार में इश्तहार दिया। टोपी का मालिक आया... भोला, एक ग़रीब विद्वान। बिल्कुल वैसा, जैसा विक्रम ने कहा था। उसे नीलम के बारे में कुछ नहीं पता था। बत्तख़ उसे एक ढाबे के दिवाली क्लब से मिली थी।
  - >-
    ढाबे वाले ने बताया, उसने बत्तख़ें चौक की मुर्ग़ी मंडी से, गंगा बाई से ख़रीदी थीं। हम मंडी पहुँचे। गंगा बाई का पारा चढ़ा हुआ था। "आज तुम दूसरे आदमी हो, जो उन बत्तख़ों के बारे में पूछ रहा है!"
  - >-
    रुकिए। एक चोरी, एक बत्तख़, और एक दूसरा आदमी, जो उसी बत्तख़ को ढूँढ़ रहा है। आपने अंदाज़ा लगाया? नीलम बत्तख़ के पेट तक कैसे पहुँचा? और वो दूसरा आदमी कौन था?
  - >-
    "कौन था वो?" विक्रम ने पूछा। गंगा बाई बोली, "एक पतला सा, घबराया हुआ आदमी। बार-बार पूछ रहा था, वो बत्तख़ कहाँ गई, जिसकी पूँछ पर काली धारी थी।" तभी हमारे पीछे से कोई भागा।
  - >-
    विक्रम ने उसे गली के मोड़ पर पकड़ लिया। वो थर-थर काँप रहा था। "मैं... मैं हरिप्रसाद हूँ। गंगा व्यू होटल में काम करता हूँ।" विक्रम बोले, "चलो, मेरे कमरे में। वहीं बात करेंगे।"
  - >-
    कमरे में विक्रम ने नीलम मेज़ पर रखा। उसे देखते ही हरिप्रसाद घुटनों पर गिर पड़ा, और रोने लगा। "मुझे माफ़ कर दीजिए, बाबू जी! मैंने ही चुराया था!"
  - >-
    उसने सब बता दिया। चोरी के बाद वो डर गया था। पुलिस हर जगह थी। वो अपनी बहन के घर गया, जो बत्तख़ें पालती थी। उसने एक बत्तख़ पकड़ी, और नीलम उसे निगलवा दिया। सोचा था, बत्तख़ घर ले जाकर आराम से निकाल लेगा।
  - >-
    पर बहन के आँगन में दो बत्तख़ें बिल्कुल एक जैसी थीं। दोनों की पूँछ पर काली धारी। उसने ग़लत बत्तख़ उठा ली। और जिसके पेट में नीलम था, वो मंडी में बिक गई।
  - >-
    और प्लंबर रमेश? "मैंने ही उसे उस दिन कमरे में भेजा था," हरिप्रसाद ने सिर झुकाकर कहा, "ताकि शक उस पर जाए।" उसकी आवाज़ में अब सिर्फ़ शर्म थी।
  - >-
    विक्रम बहुत देर तक चुप रहे। फिर उठे, और दरवाज़ा खोल दिया। "जाओ। और फिर कभी इस शहर में मत दिखना।" हरिप्रसाद को अपने कानों पर यक़ीन नहीं हुआ। वो भाग खड़ा हुआ।
  - >-
    मैंने हैरानी से पूछा, "आपने उसे छोड़ दिया?" विक्रम मुस्कराए। "दिवाली है, सावित्री। माफ़ी का त्योहार। नीलम मिल गया, तो रमेश पर कोई मामला नहीं बचेगा। एक बेगुनाह छूटेगा, और एक डरा हुआ आदमी शायद सुधर जाएगा।"
  - >-
    "और श्राप?" "कोई श्राप नहीं था। बस लालच था। एक टोपी की धूल, बत्तख़ की पूँछ की धारी... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर एक बात रह गई थी। जाने से पहले हरिप्रसाद ने बताया था, उसे महारानी के कमरे और नीलम की जगह का पता किसी ने दिया था। "एक बड़े आदमी थे, बाबू जी। चेहरा नहीं देखा। बस उनसे केवड़े की ख़ुशबू आती थी।"
  - >-
    विक्रम ने चौंककर ऊपर देखा। केवड़ा। फिर से। उन्होंने कुछ नहीं कहा, बस खिड़की के बाहर दिवाली के दीयों को देखते रहे। क्या आपको याद है, केवड़े की ख़ुशबू पहले कहाँ आई थी? कमेंट में लिखिए।
