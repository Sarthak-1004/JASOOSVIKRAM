# EP 6 - शापित नीलम (The Blue Carbuncle)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "शापित नीलम चोरी", title: "कहते हैं नीलम हर किसी को रास नहीं आता...", end_question: "क्या ये श्राप सच है?"}
  - {start_scene: 7, end_scene: 8, hook_text: "बत्तख़ के पेट में...!", title: "दिवाली की बत्तख़ काटी... और अंदर से निकला शापित नीलम", end_question: "बत्तख़ के पेट में नीलम कैसे पहुँचा?"}
  - {start_scene: 10, end_scene: 12, hook_text: "एक और आदमी भी पूछ रहा था", title: "मंडी वाली बोली: तुमसे पहले भी कोई इसी बत्तख़ को ढूँढ़ रहा था", end_question: "वो दूसरा आदमी कौन था?"}
script:
  - >-
    कहते हैं कि नीलम हर किसी को रास नहीं आता। जिसने भी उसे पहना, वह या तो राजा बन गया या मिट्टी में मिल गया, और जिसने उसे चुराया, उसकी क़िस्मत ही फूट गई। उस दिवाली पर बनारस में ऐसा ही एक शापित नीलम चोरी हो गया।
  - >-
    गंगा व्यू होटल में ठहरी एक महारानी के कमरे से वह नीलम ग़ायब हो गया था। इंस्पेक्टर भैरव ने फ़ौरन रमेश नाम के एक प्लंबर को गिरफ़्तार कर लिया, जो उस दिन कमरे में नल ठीक करने आया था। रमेश रोते हुए कहता रहा, "मैंने कुछ नहीं किया है!"
  - >-
    वह दिवाली की रात थी और पूरा बनारस दीयों से जगमगा रहा था। जासूस विक्रम और डॉक्टर सावित्री कमरे में बैठे थे, तभी एक सिपाही अंदर आया। उसके हाथ में एक मोटी सफ़ेद बत्तख़ और एक पुरानी, घिसी हुई टोपी थी।
  - >-
    सिपाही ने बताया कि गली में कुछ बदमाशों ने एक आदमी को घेर लिया था और हाथापाई में वह आदमी बत्तख़ और टोपी छोड़कर भाग गया। सिपाही बोला, "बाबू जी, त्योहार का दिन है, यह बत्तख़ आप रख लीजिए।" विक्रम हँसे और उन्होंने वह बत्तख़ सावित्री के बावर्ची को दे दी।
  - >-
    विक्रम ने टोपी को रोशनी में घुमाकर देखा और कहा, "इसका मालिक कभी अमीर था, पर अब ग़रीब है। वह पढ़ा-लिखा विद्वान है और उसकी पत्नी अब उसकी परवाह नहीं करती।" सावित्री हँस पड़ीं और बोलीं, "आपने यह सब एक टोपी से जान लिया?"
  - >-
    विक्रम ने समझाया, "यह टोपी बड़ी है, यानी उसका सिर बड़ा है और दिमाग़ भी बड़ा होगा। इसका कपड़ा महँगा है, पर तीन साल पुराना है। इस पर हफ़्तों की धूल जमी है, जिसे किसी ने झाड़ा नहीं है। जिस आदमी की पत्नी उसकी परवाह करती है, उसकी टोपी ऐसी नहीं होती।"
  - >-
    तभी बावर्ची चीखता हुआ अंदर आया और उसके हाथ में कुछ चमक रहा था। वह बोला, "बाबू जी, बत्तख़ के पेट में यह मिला है!" उसकी हथेली पर एक नीला पत्थर था, जो दीये की रोशनी में ऐसे दहक रहा था, जैसे उसके अंदर आग जल रही हो।
  - >-
    वह वही शापित नीलम था, जिसे देखकर विक्रम उछल पड़े। उन्होंने कहा, "महारानी का नीलम एक बत्तख़ के पेट में मिला है। अब सवाल यह है, सावित्री, कि यह बत्तख़ आई कहाँ से थी?"
  - >-
    अगली सुबह विक्रम ने अख़बार में इश्तहार दिया और टोपी का मालिक उनके पास आ गया। उसका नाम भोला था और वह बिल्कुल वैसा ही ग़रीब विद्वान था, जैसा विक्रम ने बताया था। उसे नीलम के बारे में कुछ पता नहीं था, क्योंकि वह बत्तख़ उसे एक ढाबे के दिवाली क्लब से मिली थी।
  - >-
    ढाबे वाले ने बताया कि उसने वे बत्तख़ें चौक की मुर्ग़ी मंडी में गंगा बाई से ख़रीदी थीं। विक्रम और सावित्री मंडी पहुँचे, जहाँ गंगा बाई का पारा चढ़ा हुआ था। वह बोली, "आज तुम दूसरे आदमी हो, जो उन बत्तख़ों के बारे में पूछ रहा है!"
  - >-
    यहाँ एक पल रुककर सोचिए। एक चोरी हुई थी, एक बत्तख़ मिली थी और कोई दूसरा आदमी भी उसी बत्तख़ को ढूँढ़ रहा था। क्या आपने अंदाज़ा लगाया कि नीलम बत्तख़ के पेट तक कैसे पहुँचा और वह दूसरा आदमी कौन था?
  - >-
    विक्रम ने पूछा, "वह आदमी कौन था?" गंगा बाई बोली, "वह एक पतला सा, घबराया हुआ आदमी था। वह बार-बार पूछ रहा था कि वह बत्तख़ कहाँ गई, जिसकी पूँछ पर काली धारी थी।" तभी उन दोनों के पीछे से कोई भागने लगा।
  - >-
    विक्रम ने उस आदमी को गली के मोड़ पर पकड़ लिया। वह थर-थर काँप रहा था और बोला, "मेरा नाम हरिप्रसाद है और मैं गंगा व्यू होटल में काम करता हूँ।" विक्रम बोले, "मेरे कमरे में चलो, हम वहीं बात करेंगे।"
  - >-
    कमरे में पहुँचकर विक्रम ने नीलम मेज़ पर रख दिया। उसे देखते ही हरिप्रसाद घुटनों पर गिर पड़ा और रोने लगा। उसने कहा, "मुझे माफ़ कर दीजिए, बाबू जी, नीलम मैंने ही चुराया था!"
  - >-
    उसने सारी बात बता दी। चोरी के बाद वह डर गया था, क्योंकि पुलिस हर जगह थी। वह अपनी बहन के घर गया, जो बत्तख़ें पालती थी, और वहाँ उसने एक बत्तख़ को पकड़कर नीलम निगलवा दिया। उसने सोचा था कि वह बत्तख़ को घर ले जाकर आराम से नीलम निकाल लेगा।
  - >-
    लेकिन बहन के आँगन में दो बत्तख़ें बिल्कुल एक जैसी थीं और दोनों की पूँछ पर काली धारी थी। हरिप्रसाद ने ग़लत बत्तख़ उठा ली, और जिस बत्तख़ के पेट में नीलम था, वह मंडी में बिक गई।
  - >-
    प्लंबर रमेश के बारे में पूछने पर हरिप्रसाद ने सिर झुकाकर कहा, "मैंने ही उसे उस दिन कमरे में भेजा था, ताकि सारा शक उसी पर जाए।" अब उसकी आवाज़ में सिर्फ़ शर्म बची थी।
  - >-
    विक्रम बहुत देर तक चुप रहे। फिर वह उठे और उन्होंने दरवाज़ा खोलकर कहा, "यहाँ से चले जाओ और फिर कभी इस शहर में मत दिखना।" हरिप्रसाद को अपने कानों पर यक़ीन नहीं हुआ और वह वहाँ से भाग खड़ा हुआ।
  - >-
    सावित्री ने हैरानी से पूछा, "आपने उसे छोड़ दिया?" विक्रम मुस्कराकर बोले, "आज दिवाली है, सावित्री, और यह माफ़ी का त्योहार है। नीलम मिल गया है, इसलिए रमेश पर अब कोई मामला नहीं बचेगा। एक बेगुनाह छूट जाएगा और एक डरा हुआ आदमी शायद सुधर जाएगा।"
  - >-
    सावित्री ने पूछा, "और उस श्राप का क्या हुआ?" विक्रम बोले, "कोई श्राप नहीं था, बस लालच था। यह मामला एक टोपी की धूल और बत्तख़ की पूँछ की धारी से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन एक बात अभी बाक़ी थी। जाने से पहले हरिप्रसाद ने बताया था कि महारानी के कमरे और नीलम की जगह का पता उसे किसी ने दिया था। उसने कहा था, "वह कोई बड़े आदमी थे, बाबू जी। मैंने उनका चेहरा नहीं देखा, बस उनसे केवड़े की ख़ुशबू आती थी।"
  - >-
    केवड़े का नाम दोबारा सुनकर विक्रम ने चौंककर ऊपर देखा। उन्होंने कुछ नहीं कहा और बस खिड़की के बाहर दिवाली के दीयों को देखते रहे। क्या आपको याद है कि केवड़े की ख़ुशबू इससे पहले कहाँ आई थी? अपना जवाब कमेंट में लिखिए।
