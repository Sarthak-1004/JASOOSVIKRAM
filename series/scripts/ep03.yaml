# EP 3 - नीली साड़ी का राज़ (The Copper Beeches)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "ख़ाली कमरे में परछाईं", title: "चाबी के छेद से झाँका... और बंद कमरे में कोई टहल रहा था", end_question: "उस बंद कमरे में कौन था?"}
  - {start_scene: 4, end_scene: 7, hook_text: "तीन गुना तनख़्वाह, अजीब शर्तें", title: "बाल कटवाओ, नीली साड़ी पहनो, खिड़की की ओर पीठ करके हँसो", end_question: "आख़िर क्यों?"}
  - {start_scene: 15, end_scene: 17, hook_text: "भूखा कुत्ता खुल गया", title: "आधी रात का बचाव... और भूखे कुत्ते की ज़ंजीर खुली", end_question: "आगे क्या हुआ?"}
script:
  - >-
    देवदार कोठी का एक हिस्सा हमेशा बंद रहता था। एक रात अंजलि ने उसके दरवाज़े के चाबी के छेद से झाँका। अंदर लालटेन की धीमी रोशनी थी... और दीवार पर एक परछाईं, जो धीरे-धीरे इधर से उधर टहल रही थी।
  - >-
    पर सेठ किशोरीलाल ने हँसकर कहा था, "वो हिस्सा तो बरसों से ख़ाली है, बिटिया।" अगर वो हिस्सा ख़ाली था... तो उस बंद कमरे में टहल कौन रहा था?
  - >-
    मैं सावित्री हूँ। ये कहानी शुरू हुई थी एक महीने पहले, जब बाईस साल की अंजलि, शिमला से आई एक चिट्ठी लेकर विक्रम के पास आई। उसे एक अमीर परिवार में बच्चे को पढ़ाने की नौकरी मिल रही थी।
  - >-
    तनख़्वाह आम नौकरी से तीन गुना। पर शर्तें अजीब थीं। उसे अपने लंबे, घने बाल कटवाने होंगे। एक ख़ास नीली साड़ी पहननी होगी। और जब कहा जाए, खिड़की की तरफ़ पीठ करके बैठना होगा।
  - >-
    विक्रम ने चिट्ठी पढ़कर कहा, "इतनी तनख़्वाह के पीछे कोई वजह ज़रूर है। अगर कभी डर लगे, तो बस एक तार भेज देना।" अंजलि ने अपने बाल कटवाए, और शिमला चली गई।
  - >-
    देवदार कोठी पहाड़ी पर अकेली खड़ी थी, चारों ओर देवदार का घना जंगल और धुंध। सेठ बहुत हँसता था, ज़रूरत से ज़्यादा। उसकी पत्नी चुपचाप रहती, चेहरा पीला। और रात को अहाते में बघा नाम का एक भूखा, विशाल कुत्ता छोड़ दिया जाता था।
  - >-
    हर शाम सेठ अंजलि को नीली साड़ी पहनाकर खिड़की की ओर पीठ करके बिठाता, और मज़ेदार क़िस्से सुनाता। अंजलि को हँसना होता था। इतना ज़ोर से, कि बाहर सड़क से साफ़ दिखाई दे।
  - >-
    एक दिन अंजलि ने अपने रूमाल में एक छोटा सा शीशा छिपा लिया। हँसते-हँसते उसने शीशे में देखा... बाहर सड़क पर एक नौजवान खड़ा था, एकटक इसी खिड़की की तरफ़ देखता हुआ।
  - >-
    फिर एक रात, अपनी अलमारी की बंद दराज़ में उसे लंबे, काले बालों का एक गुच्छा मिला। बिल्कुल उसके अपने कटे हुए बालों जैसा। पर उसके अपने बाल तो उसके बक्से में रखे थे।
  - >-
    उसी रात उसने बंद हिस्से में वो परछाईं देखी। और अगली सुबह विक्रम को तार मिला... "तुरंत शिमला आइए।" हम उसी रात की गाड़ी से निकल पड़े।
  - >-
    रुकिए। कटे हुए बाल। एक ख़ास नीली साड़ी। खिड़की की ओर पीठ। सड़क पर खड़ा एक नौजवान। और बंद कमरे में परछाईं। क्या आपने अंदाज़ा लगाया, अंजलि से असल में क्या करवाया जा रहा था?
  - >-
    शिमला के एक होटल में विक्रम ने अंजलि से पूछा, "सेठ की पहली शादी से कोई बेटी है?" अंजलि चौंकी। "हाँ, अलका। लोग कहते हैं, वो विदेश चली गई है।" विक्रम बोले, "नहीं, अंजलि। वो विदेश नहीं गई। वो उसी बंद कमरे में है।"
  - >-
    "तुम्हें अलका बनाया जा रहा था। वही कटे बाल, वही नीली साड़ी, वही हँसी। सड़क वाला नौजवान अलका का मंगेतर है। उसे दिखाया जा रहा था कि अलका ख़ुश है, और अब उससे मिलना नहीं चाहती।"
  - >-
    "पर क्यों?" मैंने पूछा। "क्योंकि अलका की माँ की दौलत, उसकी शादी के दिन उसे मिल जाएगी," विक्रम बोले। "और सेठ वो दौलत अपने हाथ से जाने नहीं देना चाहता।"
  - >-
    उस रात सेठ और उसकी पत्नी शहर गए हुए थे। अंजलि ने चौकीदार तोलू को शराब पिलाकर सुला दिया। हम चुपचाप कोठी में घुसे। सीढ़ियाँ चरमरा रही थीं। बंद हिस्से का दरवाज़ा सामने था।
  - >-
    विक्रम ने ताला तोड़ा। कमरा ख़ाली था। एक बिस्तर, एक कुर्सी... और छत का रोशनदान खुला हुआ। ठंडी हवा अंदर आ रही थी। अलका जा चुकी थी।
  - >-
    तभी सीढ़ियों पर भारी क़दम। सेठ किशोरीलाल लौट आया था, हाथ में मोटा डंडा। "तुमने उसे भगा दिया!" वो दहाड़ा। "रुको, मैं अभी कुत्ते को खोलता हूँ!" और वो नीचे दौड़ पड़ा।
  - >-
    हम उसके पीछे भागे। अँधेरे अहाते में ज़ंजीर खुलने की खनक। फिर एक भयानक गुर्राहट... और फिर एक चीख। पर वो चीख हमारी नहीं थी। वो सेठ की अपनी चीख थी।
  - >-
    बघा कई दिन से भूखा रखा गया था। अँधेरे में उसने अपने ही मालिक को नहीं पहचाना। विक्रम ने किसी तरह कुत्ते को दूर किया। सेठ बच गया, पर ज़िंदगी भर के लिए अपाहिज हो गया।
  - >-
    बाद में पता चला, अलका का मंगेतर छत के रास्ते उसे निकाल ले गया था। उसी हफ़्ते दोनों की शादी हो गई। विक्रम बोले, "एक नीली साड़ी, कुछ कटे बाल, और एक हँसी... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाने से पहले विक्रम ने सेठ के बही-खाते पलटे। एक पन्ने पर बड़ी रक़म का उधार लिखा था... 'पंकज सेवा सदन, बनारस।' मैंने सोचा, कितनी भली संस्था है, जो मुसीबत में लोगों की मदद करती है।
  - >-
    अंजलि अब सुरक्षित थी। पर लौटती गाड़ी में विक्रम खिड़की से बाहर अँधेरे को घूरते रहे। आपको क्या लगता है, अगर अंजलि ने वो तार न भेजा होता, तो उसके साथ क्या होता? कमेंट में ज़रूर बताइए।
