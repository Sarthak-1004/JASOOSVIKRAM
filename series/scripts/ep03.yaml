# EP 3 - नीली साड़ी का राज़ (The Copper Beeches)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "ख़ाली कमरे में परछाईं", title: "चाबी के छेद से झाँका... और बंद कमरे में कोई टहल रहा था", end_question: "उस बंद कमरे में कौन था?"}
  - {start_scene: 4, end_scene: 7, hook_text: "तीन गुना तनख़्वाह, अजीब शर्तें", title: "बाल कटवाओ, नीली साड़ी पहनो, खिड़की की ओर पीठ करके हँसो", end_question: "आख़िर क्यों?"}
  - {start_scene: 15, end_scene: 17, hook_text: "भूखा कुत्ता खुल गया", title: "आधी रात का बचाव... और भूखे कुत्ते की ज़ंजीर खुली", end_question: "आगे क्या हुआ?"}
script:
  - >-
    देवदार कोठी का एक हिस्सा हमेशा बंद रहता था। एक रात अंजलि ने उस हिस्से के दरवाज़े में बने चाबी के छेद से अंदर झाँका। अंदर लालटेन की धीमी रोशनी जल रही थी और दीवार पर एक परछाईं धीरे-धीरे इधर से उधर टहल रही थी।
  - >-
    जबकि सेठ किशोरीलाल ने हँसकर कहा था, "वह हिस्सा तो बरसों से ख़ाली पड़ा है, बिटिया।" अगर वह हिस्सा सचमुच ख़ाली था, तो उस बंद कमरे में कौन टहल रहा था?
  - >-
    यह कहानी एक महीने पहले शुरू हुई थी, जब बाईस साल की अंजलि शिमला से आई एक चिट्ठी लेकर जासूस विक्रम और उनकी साथी डॉक्टर सावित्री के पास पहुँची थी। उसे एक अमीर परिवार में बच्चे को पढ़ाने की नौकरी मिल रही थी।
  - >-
    उस नौकरी की तनख़्वाह किसी आम नौकरी से तीन गुना थी, लेकिन उसकी शर्तें बहुत अजीब थीं। अंजलि को अपने लंबे और घने बाल कटवाने थे और एक ख़ास नीली साड़ी पहननी थी। जब भी उससे कहा जाता, उसे खिड़की की तरफ़ पीठ करके बैठना था।
  - >-
    विक्रम ने चिट्ठी पढ़कर कहा, "इतनी तनख़्वाह के पीछे कोई वजह ज़रूर है। अगर तुम्हें कभी डर लगे, तो बस एक तार भेज देना।" अंजलि ने अपने बाल कटवाए और शिमला चली गई।
  - >-
    देवदार कोठी एक पहाड़ी पर अकेली खड़ी थी और उसके चारों ओर देवदार का घना जंगल और धुंध थी। सेठ ज़रूरत से ज़्यादा हँसता था, जबकि उसकी पत्नी पीला चेहरा लिए चुपचाप रहती थी। रात को अहाते में बघा नाम का एक भूखा और विशाल कुत्ता छोड़ दिया जाता था।
  - >-
    हर शाम सेठ अंजलि को नीली साड़ी पहनाकर खिड़की की ओर पीठ करके बिठाता था और उसे मज़ेदार क़िस्से सुनाता था। अंजलि को इतनी ज़ोर से हँसना होता था कि उसकी हँसी बाहर सड़क से साफ़ दिखाई दे।
  - >-
    एक दिन अंजलि ने अपने रूमाल में एक छोटा सा शीशा छिपा लिया। हँसते-हँसते उसने उस शीशे में देखा कि बाहर सड़क पर एक नौजवान खड़ा था, जो एकटक इसी खिड़की की तरफ़ देख रहा था।
  - >-
    फिर एक रात उसे अपनी अलमारी की बंद दराज़ में लंबे और काले बालों का एक गुच्छा मिला। वह बिल्कुल उसके अपने कटे हुए बालों जैसा था, जबकि उसके अपने बाल तो उसके बक्से में रखे हुए थे।
  - >-
    उसी रात उसने कोठी के बंद हिस्से में वह परछाईं देखी। अगली सुबह विक्रम को उसका तार मिला, जिसमें लिखा था कि वे तुरंत शिमला आ जाएँ। विक्रम और सावित्री उसी रात की गाड़ी से निकल पड़े।
  - >-
    यहाँ एक पल रुककर सोचिए। अंजलि के बाल कटवाए गए थे, उसे एक ख़ास नीली साड़ी पहनाई जाती थी और खिड़की की ओर पीठ करके बिठाया जाता था। सड़क पर एक नौजवान खड़ा रहता था और बंद कमरे में एक परछाईं टहलती थी। क्या आपने अंदाज़ा लगाया कि अंजलि से असल में क्या करवाया जा रहा था?
  - >-
    शिमला के एक होटल में विक्रम ने अंजलि से पूछा, "क्या सेठ की पहली शादी से कोई बेटी है?" अंजलि चौंककर बोली, "हाँ, उसका नाम अलका है और लोग कहते हैं कि वह विदेश चली गई है।" विक्रम बोले, "नहीं, अंजलि, वह विदेश नहीं गई है। वह उसी बंद कमरे में है।"
  - >-
    विक्रम ने समझाया, "तुम्हें अलका बनाया जा रहा था, इसीलिए वही कटे बाल, वही नीली साड़ी और वही हँसी ज़रूरी थी। सड़क पर खड़ा नौजवान अलका का मंगेतर है। उसे यह दिखाया जा रहा था कि अलका ख़ुश है और अब उससे मिलना नहीं चाहती।"
  - >-
    सावित्री ने पूछा, "लेकिन सेठ ऐसा क्यों कर रहा है?" विक्रम बोले, "क्योंकि अलका की माँ की दौलत उसकी शादी के दिन उसे मिल जाएगी, और सेठ उस दौलत को अपने हाथ से जाने नहीं देना चाहता।"
  - >-
    उस रात सेठ और उसकी पत्नी शहर गए हुए थे। अंजलि ने चौकीदार तोलू को शराब पिलाकर सुला दिया और वे तीनों चुपचाप कोठी में घुस गए। उनके पैरों के नीचे सीढ़ियाँ चरमरा रही थीं और बंद हिस्से का दरवाज़ा ठीक सामने था।
  - >-
    विक्रम ने ताला तोड़ा, लेकिन कमरा ख़ाली था। वहाँ बस एक बिस्तर और एक कुर्सी थी, और छत का रोशनदान खुला हुआ था, जिससे ठंडी हवा अंदर आ रही थी। अलका वहाँ से जा चुकी थी।
  - >-
    तभी सीढ़ियों पर भारी क़दमों की आवाज़ आई। सेठ किशोरीलाल हाथ में एक मोटा डंडा लिए लौट आया था। वह दहाड़ा, "तुमने उसे भगा दिया! रुको, मैं अभी कुत्ते को खोलता हूँ!" इतना कहकर वह नीचे की ओर दौड़ पड़ा।
  - >-
    वे तीनों उसके पीछे भागे। अँधेरे अहाते में ज़ंजीर खुलने की खनक सुनाई दी, फिर एक भयानक गुर्राहट आई और उसके बाद एक चीख गूँज उठी। वह चीख उन तीनों में से किसी की नहीं, बल्कि ख़ुद सेठ की थी।
  - >-
    बघा को कई दिनों से भूखा रखा गया था, इसलिए अँधेरे में उसने अपने ही मालिक को नहीं पहचाना। विक्रम ने किसी तरह कुत्ते को दूर हटाया। सेठ की जान तो बच गई, लेकिन वह ज़िंदगी भर के लिए अपाहिज हो गया।
  - >-
    बाद में पता चला कि अलका का मंगेतर उसे छत के रास्ते निकाल ले गया था, और उसी हफ़्ते उन दोनों की शादी हो गई। विक्रम बोले, "यह मामला एक नीली साड़ी, कुछ कटे हुए बालों और एक हँसी से खुला। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाने से पहले विक्रम ने सेठ के बही-खाते पलटकर देखे। एक पन्ने पर 'पंकज सेवा सदन, बनारस' के नाम से बड़ी रक़म का उधार लिखा हुआ था। सावित्री को लगा कि वह कितनी भली संस्था है, जो मुसीबत में लोगों की मदद करती है।
  - >-
    अंजलि अब सुरक्षित थी, लेकिन लौटती गाड़ी में विक्रम खिड़की से बाहर के अँधेरे को घूरते रहे। आपको क्या लगता है कि अगर अंजलि ने वह तार न भेजा होता, तो उसके साथ क्या होता? अपना जवाब कमेंट में ज़रूर बताइए।
