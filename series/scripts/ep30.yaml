  - {start_scene: 12, end_scene: 13, hook_text: "खिड़की पर गोली", title: "आधी रात, ख़ाली मकान से विक्रम की खिड़की पर निशाना...", end_question: "गोली किसने चलाई?"}
  - {start_scene: 15, end_scene: 16, hook_text: "मुर्दा दावत में आया", title: "शहर की सबसे बड़ी दावत में ज़िंदा लौटे विक्रम", end_question: "काला कमल कौन? पूरा एपिसोड चैनल पर।"}
script:
  - >-
    विक्रम को गए तीन महीने हो चुके थे। फिर एक रात, बनारस की एक कोठी के बंद कमरे में, एक जवान रईस, कुँवर रणजीत, गोली से मरा मिला। दरवाज़ा अंदर से बंद। खिड़की खुली। और किसी ने गोली की आवाज़ तक नहीं सुनी।
  - >-
    मैं सावित्री हूँ। विक्रम के जाने के बाद मैंने ख़ुद से वादा किया था कि अब किसी मामले में नहीं पड़ूँगी। पर कुँवर रणजीत मेरे मरीज़ रह चुके थे। मैं अकेली उस कोठी के बाहर पहुँची, सुराग़ ढूँढ़ने।
  - >-
    तभी एक बूढ़ा, कुबड़ा किताब वाला मुझसे टकराया, और उसकी किताबें सड़क पर बिखर गईं। मैंने माफ़ी माँगी, और किताबें उठाने लगी। वो बड़बड़ाता हुआ चला गया। मैं अपने दवाख़ाने लौट आई।
  - >-
    कुछ देर बाद, वही किताब वाला मेरे दवाख़ाने में आया। "बेटी, एक किताब तुम्हारे पास रह गई।" फिर वो सीधा खड़ा हुआ। कूबड़ ग़ायब। दाढ़ी उतरी। और मेरे सामने... विक्रम खड़े थे। ज़िंदगी में पहली और आख़िरी बार, मैं बेहोश हो गई।
  - >-
    जब होश आया, विक्रम मेरे चेहरे पर पानी छिड़क रहे थे। "माफ़ करना, सावित्री। मुझे इतना नाटकीय नहीं होना चाहिए था।" मैंने उन्हें छुआ, जैसे यक़ीन करना चाहती थी कि वो भूत नहीं हैं। फिर मैंने उनके कंधे पर ज़ोर से एक मुक्का मारा।
  - >-
    विक्रम ने बताया। "झरने के किनारे, काले लबादे में कमल ख़ुद नहीं, उसका एक हत्यारा था। कुश्ती के एक दाँव से मैं बच गया, और वो गिर गया। मैं चट्टानों पर चढ़कर छिप गया। सबको मेरा मरा होना ज़रूरी था। सिर्फ़ राघव जानते थे।"
  - >-
    "एक मरा हुआ आदमी, सबसे अच्छा जासूस होता है, सावित्री। तीन महीने मैंने कमल के आदमियों को एक-एक करके पकड़वाया। अब सिर्फ़ दो बचे हैं। उसका निशानेबाज़, और वो ख़ुद।"
  - >-
    "और कुँवर रणजीत की मौत?" मैंने पूछा। "शमशेर," विक्रम बोले। "हवाई बंदूक़। कोई आवाज़ नहीं। रणजीत ने उसे ताश में बेईमानी करते पकड़ लिया था। और अब शमशेर जान गया है कि मैं ज़िंदा हूँ। वो आज रात मेरे लिए आएगा।"
  - >-
    उस रात, विक्रम के कमरे की खिड़की में लैंप जल रहा था। और खिड़की पर, बाहर से साफ़ दिखती, विक्रम की परछाईं। कुर्सी पर बैठे, किताब पढ़ते हुए। पर वो विक्रम नहीं थे। वो मोम का एक पुतला था।
  - >-
    रुकिए। तीस एपिसोड। केवड़े की ख़ुशबू। बैंगनी स्याही। बाएँ हाथ की लिखावट। और 'पंकज'। आपके पास सारे सुराग़ हैं। आख़िरी बार सोचिए... काला कमल कौन है?
  - >-
    हम गली के उस पार, एक ख़ाली मकान के अँधेरे कमरे में छिपे थे। अम्मा जी हर पंद्रह मिनट पर, घुटनों के बल चलकर, पुतले को हल्का सा घुमा देती थीं, ताकि वो ज़िंदा लगे। इंस्पेक्टर भैरव, जिन्हें राघव के सबूतों ने जेल से छुड़वाया था, हमारे साथ थे।
  - >-
    आधी रात। ख़ाली मकान की सीढ़ियों पर एक आहट। एक आदमी हमारे ठीक बग़ल वाली खिड़की पर आया। कुँवर शमशेर सिंह। उसने एक लंबी, अजीब सी बंदूक़ निकाली, और विक्रम की खिड़की पर निशाना साधा।
  - >-
    एक हल्की सी 'फट्' की आवाज़। सामने खिड़की में, मोम का सिर टुकड़े-टुकड़े हो गया। और उसी पल, विक्रम और भैरव उस पर टूट पड़े। भैरव ने उसकी बंदूक़ छीनी, और शमशेर को फ़र्श पर गिरा दिया।
  - >-
    शमशेर हँसा। "मुझे पकड़ लिया, जासूस। पर कमल को कभी नहीं पकड़ पाओगे। वो इस शहर का भगवान है।" विक्रम बोले, "भगवान नहीं, शमशेर। बस एक आदमी। और कल रात, सब उसका चेहरा देखेंगे।"
  - >-
    अगली रात, राय बहादुर देवेंद्रनाथ के महल में पंकज सेवा सदन की सालाना दावत थी। बनारस के सारे बड़े लोग। झूमर, संगीत, और चाँदी की थालियाँ। तभी दरवाज़े पर एक आदमी आकर खड़ा हुआ। संगीत रुक गया।
  - >-
    विक्रम। ज़िंदा। नेवी-नीले कोट में, पीतल की मूठ वाली छड़ी लिए। पूरी महफ़िल में सन्नाटा छा गया। राय बहादुर देवेंद्रनाथ के हाथ से जाम का गिलास गिरते-गिरते बचा। फिर वो मुस्कराए। "विक्रम जी! भगवान का शुक्र है!"
  - >-
    विक्रम महफ़िल के बीच आए। "राय बहादुर, आपकी संस्था का नाम... पंकज सेवा सदन। पंकज, यानी कमल। ठाकुर रघुवेंद्र की हवेली से लेकर नक़ली सिक्कों, मोती और तोप के नक़्शों तक... हर अपराध के पीछे आपकी संस्था का पैसा, आपकी संस्था का नाम।"
  - >-
    "हर चिट्ठी से केवड़े की ख़ुशबू, जो आप लगाते हैं। हर चिट्ठी बैंगनी स्याही में, जिससे आप लिखते हैं। और हर चिट्ठी के अक्षर पीछे की ओर झुके हुए। पहले ही दिन, बैंक में, आपने बाएँ हाथ से मेरे इनाम का चेक लिखा था। मुझे याद है।"
  - >-
    "ये सब इत्तफ़ाक़ भी हो सकते हैं," देवेंद्रनाथ ने शांति से कहा। "हो सकते हैं," विक्रम बोले, और उनकी हाथीदाँत की छड़ी की ओर हाथ बढ़ाया। "पर ये नहीं।" उन्होंने छड़ी की मूठ घुमाई। वो खुल गई। अंदर एक छोटी सी मुहर थी। एक काला कमल।
  - >-
    पूरी महफ़िल की साँस एक साथ रुक गई। विक्रम ने मुहर ऊपर उठाई। "राय बहादुर देवेंद्रनाथ... आप ही काला कमल हैं।" देवेंद्रनाथ बहुत देर तक विक्रम को देखते रहे। फिर मुस्कराए। एक ठंडी, थकी हुई मुस्कान।
  - >-
    "पहली चाल तुम्हारी थी, विक्रम... और आख़िरी भी।" इंस्पेक्टर भैरव आगे बढ़े, और बनारस के सबसे इज़्ज़तदार आदमी के हाथों में हथकड़ी डाल दी। "ये मेरी तरफ़ से, राय बहादुर साहब।" विक्रम बोले, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    उस रात, जेल की कोठरी में, देवेंद्रनाथ ने अपनी मुट्ठी खोली। उसमें से एक काली पंखुड़ी फ़र्श पर गिरी। "कमल एक नहीं होता, विक्रम... कीचड़ में सौ उगते हैं।" क्या आपने पहले ही पहचान लिया था? किस एपिसोड में? कमेंट में बताइए। और सीज़न दो के लिए... तैयार रहिए।
