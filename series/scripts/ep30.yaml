  - {start_scene: 3, end_scene: 4, hook_text: "मरा हुआ जासूस लौटा?!", title: "कुबड़ा किताब वाला सीधा खड़ा हुआ... और सामने थे विक्रम!", end_question: "विक्रम ज़िंदा हैं?!"}
  - {start_scene: 12, end_scene: 13, hook_text: "खिड़की पर गोली", title: "आधी रात, ख़ाली मकान से विक्रम की खिड़की पर निशाना...", end_question: "गोली किसने चलाई?"}
  - {start_scene: 15, end_scene: 16, hook_text: "मुर्दा दावत में आया", title: "शहर की सबसे बड़ी दावत में ज़िंदा लौटे विक्रम", end_question: "काला कमल कौन? पूरा एपिसोड चैनल पर।"}
script:
  - >-
    विक्रम को गए हुए तीन महीने हो चुके थे। फिर एक रात बनारस की एक कोठी के बंद कमरे में कुँवर रणजीत नाम का एक जवान रईस गोली से मरा हुआ मिला। दरवाज़ा अंदर से बंद था, खिड़की खुली थी और किसी ने गोली की आवाज़ तक नहीं सुनी थी।
  - >-
    विक्रम के जाने के बाद डॉक्टर सावित्री ने ख़ुद से वादा किया था कि वह अब किसी मामले में नहीं पड़ेंगी। लेकिन कुँवर रणजीत उनके मरीज़ रह चुके थे। इसलिए वह सुराग़ ढूँढ़ने के लिए अकेली उस कोठी के बाहर पहुँच गईं।
  - >-
    तभी एक बूढ़ा और कुबड़ा किताब वाला उनसे टकरा गया और उसकी किताबें सड़क पर बिखर गईं। सावित्री ने माफ़ी माँगी और किताबें उठाने लगीं। वह बड़बड़ाता हुआ चला गया और सावित्री अपने दवाख़ाने लौट आईं।
  - >-
    कुछ देर बाद वही किताब वाला उनके दवाख़ाने में आया और बोला, "बेटी, एक किताब तुम्हारे पास रह गई है।" फिर वह सीधा खड़ा हो गया, उसका कूबड़ ग़ायब हो गया और उसने अपनी दाढ़ी उतार दी। सावित्री के सामने विक्रम खड़े थे। अपनी ज़िंदगी में पहली और आख़िरी बार सावित्री बेहोश हो गईं।
  - >-
    जब उन्हें होश आया, तब विक्रम उनके चेहरे पर पानी छिड़क रहे थे। उन्होंने कहा, "मुझे माफ़ करना, सावित्री, मुझे इतना नाटकीय नहीं होना चाहिए था।" सावित्री ने उन्हें छूकर देखा, जैसे वह यक़ीन करना चाहती हों कि वह भूत नहीं हैं। फिर उन्होंने विक्रम के कंधे पर ज़ोर से एक मुक्का मारा।
  - >-
    विक्रम ने बताया, "झरने के किनारे काले लबादे में कमल ख़ुद नहीं, बल्कि उसका एक हत्यारा था। मैं कुश्ती के एक दाँव से बच गया और वह नीचे गिर गया। फिर मैं चट्टानों पर चढ़कर छिप गया, क्योंकि सबको यह लगना ज़रूरी था कि मैं मर चुका हूँ। यह बात सिर्फ़ राघव जानते थे।"
  - >-
    उन्होंने कहा, "एक मरा हुआ आदमी सबसे अच्छा जासूस होता है, सावित्री। इन तीन महीनों में मैंने कमल के आदमियों को एक-एक करके पकड़वाया है। अब सिर्फ़ दो लोग बचे हैं, जिनमें एक उसका निशानेबाज़ है और दूसरा वह ख़ुद है।"
  - >-
    सावित्री ने पूछा, "और कुँवर रणजीत को किसने मारा?" विक्रम बोले, "उसे शमशेर ने हवाई बंदूक़ से मारा, जिसकी कोई आवाज़ नहीं होती। रणजीत ने उसे ताश में बेईमानी करते हुए पकड़ लिया था। अब शमशेर जान गया है कि मैं ज़िंदा हूँ, और वह आज रात मेरे लिए आएगा।"
  - >-
    उस रात विक्रम के कमरे की खिड़की में एक लैंप जल रहा था। खिड़की पर बाहर से विक्रम की परछाईं साफ़ दिख रही थी, जो कुर्सी पर बैठकर किताब पढ़ रही थी। लेकिन वह विक्रम नहीं थे, वह मोम का एक पुतला था।
  - >-
    यहाँ एक पल रुककर सोचिए। तीस एपिसोड में आपने केवड़े की ख़ुशबू, बैंगनी स्याही, बाएँ हाथ की लिखावट और 'पंकज' नाम के सुराग़ देखे हैं। अब आपके पास सारे सुराग़ हैं। आख़िरी बार सोचकर बताइए कि काला कमल कौन है?
  - >-
    विक्रम और सावित्री गली के उस पार एक ख़ाली मकान के अँधेरे कमरे में छिपे थे। अम्मा जी हर पंद्रह मिनट पर घुटनों के बल चलकर पुतले को हल्का सा घुमा देती थीं, ताकि वह ज़िंदा लगे। इंस्पेक्टर भैरव भी उनके साथ थे, जिन्हें राघव के सबूतों ने जेल से छुड़वाया था।
  - >-
    आधी रात को उस ख़ाली मकान की सीढ़ियों पर एक आहट हुई। कुँवर शमशेर सिंह उनके ठीक बग़ल वाली खिड़की पर आकर खड़ा हो गया। उसने एक लंबी और अजीब सी बंदूक़ निकाली और विक्रम की खिड़की पर निशाना साधा।
  - >-
    बंदूक़ से बस एक हल्की सी आवाज़ आई और सामने की खिड़की में मोम का सिर टुकड़े-टुकड़े हो गया। उसी पल विक्रम और भैरव उस पर टूट पड़े। भैरव ने उसकी बंदूक़ छीन ली और शमशेर को फ़र्श पर गिरा दिया।
  - >-
    शमशेर हँसकर बोला, "तुमने मुझे पकड़ लिया, जासूस, लेकिन कमल को कभी नहीं पकड़ पाओगे, क्योंकि वह इस शहर का भगवान है।" विक्रम बोले, "वह भगवान नहीं, बस एक आदमी है, शमशेर, और कल रात सब लोग उसका चेहरा देखेंगे।"
  - >-
    अगली रात राय बहादुर देवेंद्रनाथ के महल में पंकज सेवा सदन की सालाना दावत थी, जिसमें बनारस के सारे बड़े लोग आए थे। वहाँ झूमर जगमगा रहे थे, संगीत बज रहा था और चाँदी की थालियाँ सजी थीं। तभी दरवाज़े पर एक आदमी आकर खड़ा हुआ और संगीत रुक गया।
  - >-
    वह विक्रम थे, जो नेवी-नीले कोट में पीतल की मूठ वाली छड़ी लिए ज़िंदा खड़े थे। पूरी महफ़िल में सन्नाटा छा गया और राय बहादुर देवेंद्रनाथ के हाथ से जाम का गिलास गिरते-गिरते बचा। फिर वह मुस्कराकर बोले, "विक्रम जी, भगवान का शुक्र है कि आप ज़िंदा हैं!"
  - >-
    विक्रम महफ़िल के बीच आकर बोले, "राय बहादुर, आपकी संस्था का नाम पंकज सेवा सदन है, और पंकज का मतलब कमल होता है। ठाकुर रघुवेंद्र की हवेली से लेकर नक़ली सिक्कों, काले मोती और तोप के नक़्शों तक, हर अपराध के पीछे आपकी संस्था का पैसा और आपकी संस्था का नाम था।"
  - >-
    उन्होंने कहा, "हर चिट्ठी से उसी केवड़े की ख़ुशबू आती थी, जो आप लगाते हैं, और हर चिट्ठी उसी बैंगनी स्याही में थी, जिससे आप लिखते हैं। हर चिट्ठी के अक्षर पीछे की ओर झुके हुए थे। मुझे याद है कि पहले ही दिन बैंक में आपने बाएँ हाथ से मेरे इनाम का चेक लिखा था।"
  - >-
    देवेंद्रनाथ ने शांति से कहा, "ये सब बातें इत्तफ़ाक़ भी हो सकती हैं।" विक्रम बोले, "हो सकती हैं, लेकिन यह इत्तफ़ाक़ नहीं है।" उन्होंने देवेंद्रनाथ की हाथीदाँत की छड़ी की ओर हाथ बढ़ाया और उसकी मूठ घुमाई, जो खुल गई। उसके अंदर काले कमल की एक छोटी सी मुहर थी।
  - >-
    पूरी महफ़िल की साँस एक साथ रुक गई। विक्रम ने वह मुहर ऊपर उठाकर कहा, "राय बहादुर देवेंद्रनाथ, आप ही काला कमल हैं।" देवेंद्रनाथ बहुत देर तक विक्रम को देखते रहे। फिर उनके चेहरे पर एक ठंडी और थकी हुई मुस्कान आ गई।
  - >-
    देवेंद्रनाथ ने कहा, "पहली चाल तुम्हारी थी, विक्रम, और आख़िरी चाल भी तुम्हारी ही रही।" इंस्पेक्टर भैरव आगे बढ़े और उन्होंने बनारस के सबसे इज़्ज़तदार आदमी के हाथों में हथकड़ी डालकर कहा, "यह मेरी तरफ़ से है, राय बहादुर साहब।" विक्रम बोले, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    उस रात जेल की कोठरी में देवेंद्रनाथ ने अपनी मुट्ठी खोली और उसमें से एक काली पंखुड़ी फ़र्श पर गिर पड़ी। वह बुदबुदाया, "कमल एक नहीं होता, विक्रम, कीचड़ में सौ कमल उगते हैं।" क्या आपने उसे पहले ही पहचान लिया था, और किस एपिसोड में पहचाना था? अपना जवाब कमेंट में बताइए और सीज़न दो के लिए तैयार रहिए।
