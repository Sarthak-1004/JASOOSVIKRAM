  - {start_scene: 1, end_scene: 2, hook_text: "सुबह पूरा घर ख़ाली", title: "रात को सोया... सुबह पूरी हवेली ख़ाली, और मेज़बान की लाश", end_question: "सब कहाँ गए?"}
  - {start_scene: 6, end_scene: 6, hook_text: "हरा खुला, सफ़ेद बंद", title: "मरे हुए आदमी की जेब में अजीब पर्ची: 'हरा खुला, सफ़ेद बंद'", end_question: "इसका मतलब क्या है?"}
  - {start_scene: 19, end_scene: 21, hook_text: "पंकज यानी...", title: "हर केस में आया एक नाम... और आज उसका मतलब खुला", end_question: "क्या आप पहले ही समझ गए थे?"}
script:
  - >-
    रात के एक बजे गोवा के उस सुनसान विला में हेमंत जोशी की नींद खुल गई। चारों तरफ़ ऐसा सन्नाटा था, जैसे पूरा घर साँस लेना भूल गया हो। उसने करवट बदली और वह फिर सो गया।
  - >-
    सुबह जब वह जागा, तो पूरा विला ख़ाली था और वहाँ न मेज़बान था, न नौकर और न रसोइया। सारे दरवाज़े खुले पड़े थे और पर्दे हवा में उड़ रहे थे। कुछ घंटे बाद मेज़बान सेन्योर अल्वारो गोम्स की लाश पास के मैदान में मिली। हेमंत रात को एक भरे हुए घर में सोया था और सुबह पूरी हवेली ख़ाली हो चुकी थी।
  - >-
    हेमंत जोशी बंबई के एक बेहद इज़्ज़तदार और अकड़ू व्यापारी थे। वह गुस्से से लाल-पीले होकर जासूस विक्रम और डॉक्टर सावित्री के पास आए। उन्होंने कहा, "यह मेरी बेइज़्ज़ती है, विक्रम साहब, कि मुझे बुलाकर वे लोग ऐसे छोड़कर भाग गए!"
  - >-
    उन्होंने बताया कि गोम्स से उनकी दोस्ती हाल ही में बंबई में हुई थी और गोम्स ने उन्हें बड़े प्यार से गोवा के अपने विला में बुलाया था। लेकिन उस रात गोम्स बहुत बेचैन था। वह बार-बार घड़ी देखता रहा और उसने एक चिट्ठी पढ़कर उसे जला दिया।
  - >-
    विक्रम और सावित्री गोवा पहुँचे, जहाँ के इंस्पेक्टर फ़र्नांडिस बेहद होशियार निकले। उनकी नज़र तेज़ थी और आवाज़ शांत थी। उन्होंने विक्रम से हाथ मिलाते हुए कहा, "देखते हैं, बनारस वाले जासूस, कि यह मामला पहले कौन सुलझाता है।"
  - >-
    फ़र्नांडिस ने गोम्स की जेब से मिली एक पर्ची दिखाई। उस पर लिखा था, "हमारे रंग हरे और सफ़ेद हैं। हरा मतलब खुला है और सफ़ेद मतलब बंद है। मुख्य सीढ़ी से पहले गलियारे में जाओ, जहाँ दाहिनी ओर सातवें कमरे पर हरा परदा है। भगवान तुम्हारे साथ हो।"
  - >-
    विक्रम ने उस पर्ची को बार-बार पढ़ा और फिर बोले, "हेमंत जी, गोम्स ने आपको दोस्ती के लिए नहीं, बल्कि गवाह बनाने के लिए बुलाया था। उसे बंबई का एक ऐसा इज़्ज़तदार आदमी चाहिए था, जो क़सम खाकर कहे कि गोम्स पूरी रात घर पर था।"
  - >-
    हेमंत का मुँह खुला रह गया और उन्होंने पूछा, "इसका मतलब है कि मैं बस एक बहाना था?" विक्रम ने सिर हिलाकर कहा, "गोम्स उस रात कहीं और जाने वाला था, और वह कुछ बहुत ख़तरनाक करने वाला था।"
  - >-
    विला के पास ही एक आलीशान जागीर थी, जिसका मालिक 'मिस्टर हरीश' कुछ साल पहले गोवा आया था। कोई नहीं जानता था कि वह कहाँ से आया है। उसके पास बहुत दौलत और बहुत पहरेदार थे, लेकिन उसके घर मेहमान बहुत कम आते थे।
  - >-
    यहाँ एक पल रुककर सोचिए। एक पर्ची थी, जिसमें हरे और सफ़ेद रंग और दाहिनी ओर के सातवें कमरे का ज़िक्र था। एक मेज़बान था, जिसे गवाह चाहिए था, और पास में एक रहस्यमय अमीर आदमी रहता था। आप बताइए कि वह पर्ची किसने लिखी थी और किसके लिए लिखी थी?
  - >-
    विक्रम बोले, "यह पर्ची हरीश की जागीर के अंदर से लिखी गई है और कोई अंदर से गोम्स को इशारे कर रहा था। खिड़की पर हरे परदे का मतलब था कि रास्ता साफ़ है, और सफ़ेद परदे का मतलब ख़तरा था। दाहिनी ओर का सातवाँ कमरा वह है, जहाँ हरीश सोता है।"
  - >-
    सावित्री ने हरीश के घर में काम करने वाली एक दाई से दोस्ती कर ली। उसने बताया कि घर की अंग्रेज़ गवर्नेस मिस बर्नेट कुछ दिनों से दिखाई नहीं दे रही हैं। दाई ने कहा, "मालिक कहते हैं कि वह छुट्टी पर हैं, लेकिन उनका सामान वहीं पड़ा है।"
  - >-
    उस रात विक्रम और सावित्री हरीश की जागीर में घुसे। ऊपर के एक कमरे में मिस बर्नेट बेहोशी की दवा से बेसुध बँधी पड़ी थीं। सावित्री उन्हें होश में लाईं, तो उनकी पहली बात थी, "वह भाग रहा है, उसे रोको!"
  - >-
    मिस बर्नेट ने सारी बात बताई। मिस्टर हरीश असल में केसरगढ़ रियासत का ज़ालिम राजा उदयभान था। उसने अपनी प्रजा पर ऐसे ज़ुल्म किए थे कि लोगों ने उसे गद्दी से उतार दिया, और वह रियासत का ख़ज़ाना लेकर भाग आया था।
  - >-
    मिस बर्नेट बोलीं, "उसने मेरे पति को फाँसी दिलवाई थी और मैं बदला लेने के लिए उसकी गवर्नेस बनी थी। गोम्स और उसके साथी भी केसरगढ़ के ही लोग थे। उस रात गोम्स उससे हिसाब चुकाने आने वाला था और मैं खिड़की से इशारे कर रही थी।"
  - >-
    उन्होंने आगे कहा, "लेकिन उदयभान को शक हो गया। उसने मुझे बंद कर दिया और गोम्स को रास्ते में ही मरवा दिया। गोम्स के डरे हुए नौकर रातों-रात भाग गए, और इसीलिए विला ख़ाली मिला।"
  - >-
    वे सब बंदरगाह की ओर भागे, लेकिन तब तक देर हो चुकी थी। एक जहाज़ धुआँ छोड़ता हुआ समुंदर में जा चुका था और उदयभान उसी पर सवार था। फ़र्नांडिस ने दाँत पीसकर कहा, "इस बार हम दोनों हार गए, विक्रम।"
  - >-
    महीनों बाद ख़बर आई कि लिस्बन के एक होटल में किसी ने गद्दी से निकाले गए एक हिंदुस्तानी राजा को मार डाला है। केसरगढ़ के लोगों ने अपना इंसाफ़ ढूँढ़ ही लिया था। विक्रम बोले, "यह मामला एक हरे परदे और सातवें कमरे से खुला। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन जाने से पहले फ़र्नांडिस ने विक्रम को एक काग़ज़ दिया। उन्होंने कहा, "उदयभान के जहाज़ का टिकट और पैसा बनारस की एक संस्था ने भिजवाया था। वह 'पंकज' नाम की कोई संस्था है।"
  - >-
    विक्रम वहीं रुक गए और उन्होंने धीरे से 'पंकज' शब्द दोहराया। फिर वह सावित्री की तरफ़ मुड़कर बोले, "सावित्री, क्या तुम जानती हो कि संस्कृत में पंकज का क्या मतलब होता है? पंकज वह है, जो कीचड़ में उगता है, यानी कमल।"
  - >-
    पंकज का मतलब कमल था और पंकज सेवा सदन का मतलब कमल सेवा सदन था। यह समझते ही सावित्री के पूरे शरीर में सिहरन दौड़ गई। जिस भली संस्था का नाम हर मामले में आ रहा था, उसके नाम में ही कमल छिपा हुआ था।
  - >-
    लेकिन उस ट्रस्ट में बनारस के बड़े-बड़े लोग ट्रस्टी थे। उनमें इंस्पेक्टर भैरव के साले सेठ गिरधारी, राय बहादुर देवेंद्रनाथ और कई और लोग शामिल थे। विक्रम ने ख़ुद से पूछा, "इनमें से वह कौन है?" क्या आप पहले ही समझ गए थे कि पंकज का मतलब कमल है? अपना जवाब कमेंट में लिखिए।
