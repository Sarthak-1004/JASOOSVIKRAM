  - {start_scene: 19, end_scene: 21, hook_text: "पंकज यानी...", title: "हर केस में आया एक नाम... और आज उसका मतलब खुला", end_question: "क्या आप पहले ही समझ गए थे?"}
script:
  - >-
    रात के एक बजे, गोवा के उस सुनसान विला में हेमंत जोशी की नींद खुली। चारों तरफ़ ऐसा सन्नाटा था, जैसे घर साँस लेना भूल गया हो। उसने करवट बदली, और फिर सो गया।
  - >-
    सुबह जब वो जागा, तो पूरा विला ख़ाली था। मेज़बान, नौकर, रसोइया... कोई नहीं। सारे दरवाज़े खुले, पर्दे हवा में उड़ते हुए। और कुछ घंटे बाद, मेज़बान सेन्योर अल्वारो गोम्स की लाश पास के मैदान में मिली। रात को सोया, सुबह पूरी हवेली ख़ाली।
  - >-
    मैं सावित्री हूँ। हेमंत जोशी, बंबई के एक बेहद इज़्ज़तदार, और बेहद अकड़ू व्यापारी, गुस्से से लाल-पीले होकर विक्रम के पास आए। "ये मेरी बेइज़्ज़ती है, विक्रम साहब! मुझे बुलाकर, ऐसे छोड़कर भाग जाना!"
  - >-
    उन्होंने बताया, गोम्स से उनकी हाल ही में बंबई में दोस्ती हुई थी। गोम्स ने बड़े प्यार से उन्हें गोवा के अपने विला में बुलाया। पर उस रात गोम्स बहुत बेचैन था। बार-बार घड़ी देखता, और एक चिट्ठी पढ़कर उसे जला दिया।
  - >-
    हम गोवा पहुँचे। वहाँ के इंस्पेक्टर फ़र्नांडिस बेहद होशियार निकले। तेज़ नज़र, शांत आवाज़। उन्होंने विक्रम से हाथ मिलाते हुए कहा, "देखते हैं, बनारस वाले जासूस, ये मामला पहले कौन सुलझाता है।"
  - >-
    फ़र्नांडिस ने गोम्स की जेब से मिली एक पर्ची दिखाई। उस पर लिखा था... "हमारे रंग हरे और सफ़ेद। हरा खुला, सफ़ेद बंद। मुख्य सीढ़ी, पहला गलियारा, दाहिने सातवाँ, हरा परदा। भगवान तुम्हारे साथ हो।"
  - >-
    विक्रम ने पर्ची को बार-बार पढ़ा। फिर बोले, "हेमंत जी, गोम्स ने आपको दोस्ती के लिए नहीं बुलाया था। आपको गवाह बनाने के लिए बुलाया था। बंबई का एक इज़्ज़तदार आदमी, जो क़सम खाएगा कि गोम्स पूरी रात घर पर था।"
  - >-
    हेमंत का मुँह खुला रह गया। "मतलब... मैं बस एक बहाना था?" विक्रम ने सिर हिलाया। "गोम्स उस रात कहीं और जाने वाला था। कुछ बहुत ख़तरनाक करने।"
  - >-
    विला के पास ही एक आलीशान जागीर थी। उसका मालिक, 'मिस्टर हरीश', कुछ साल पहले गोवा आया था। कोई नहीं जानता था, कहाँ से। बहुत दौलत, बहुत पहरेदार, और बहुत कम मेहमान।
  - >-
    रुकिए। एक पर्ची... 'हरा खुला, सफ़ेद बंद। दाहिने सातवाँ।' एक मेज़बान, जिसे गवाह चाहिए था। और पास में एक रहस्यमय अमीर आदमी। आप बताइए, ये पर्ची किसने लिखी, और किसके लिए?
  - >-
    "ये पर्ची हरीश की जागीर के अंदर से लिखी गई है," विक्रम बोले। "कोई अंदर से गोम्स को इशारे कर रहा था। खिड़की पर हरा परदा, मतलब रास्ता साफ़। सफ़ेद, मतलब ख़तरा। और दाहिने सातवाँ कमरा... जहाँ हरीश सोता है।"
  - >-
    मैंने हरीश के घर में काम करने वाली एक दाई से दोस्ती की। उसने बताया, घर की अंग्रेज़ गवर्नेस, मिस बर्नेट, कुछ दिनों से दिखाई नहीं दे रहीं। "मालिक कहते हैं, वो छुट्टी पर हैं। पर उनका सामान वहीं पड़ा है।"
  - >-
    उस रात हम हरीश की जागीर में घुसे। ऊपर के एक कमरे में, बेहोशी की दवा से बेसुध, मिस बर्नेट बँधी पड़ी थीं। मैंने उन्हें होश में लाया। उनकी पहली बात थी, "वो भाग रहा है... उसे रोको!"
  - >-
    मिस बर्नेट ने सब बताया। 'मिस्टर हरीश' असल में केसरगढ़ रियासत का ज़ालिम राजा उदयभान था। उसने अपनी प्रजा पर ऐसे ज़ुल्म किए थे कि लोगों ने उसे गद्दी से उतार दिया। वो रियासत का ख़ज़ाना लेकर भाग आया था।
  - >-
    "उसने मेरे पति को फाँसी दिलवाई थी," मिस बर्नेट बोलीं। "मैं बदला लेने के लिए उसकी गवर्नेस बनी। गोम्स और उसके साथी, केसरगढ़ के ही लोग थे। उस रात गोम्स उसका हिसाब करने आने वाला था। मैं खिड़की से इशारे कर रही थी।"
  - >-
    "पर उदयभान को शक हो गया। उसने मुझे बंद कर दिया, और गोम्स को रास्ते में ही मरवा दिया। गोम्स के डरे हुए नौकर रातों-रात भाग गए। इसीलिए विला ख़ाली मिला।"
  - >-
    हम बंदरगाह की ओर भागे। पर देर हो चुकी थी। एक जहाज़ धुआँ छोड़ता हुआ समुंदर में जा चुका था। उदयभान उस पर था। फ़र्नांडिस ने दाँत पीसकर कहा, "इस बार हम दोनों हार गए, विक्रम।"
  - >-
    महीनों बाद ख़बर आई, लिस्बन के एक होटल में किसी ने एक निकाले हुए हिंदुस्तानी राजा को मार डाला था। केसरगढ़ के लोगों ने अपना इंसाफ़ ढूँढ़ ही लिया था। विक्रम बोले, "हरा परदा, सातवाँ कमरा... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर जाने से पहले फ़र्नांडिस ने विक्रम को एक काग़ज़ दिया। "उदयभान के जहाज़ का टिकट और पैसा, सब बनारस की एक संस्था ने भिजवाया था। कोई 'पंकज' नाम की संस्था।"
  - >-
    विक्रम वहीं रुक गए। उन्होंने धीरे से दोहराया, "पंकज..." फिर मेरी तरफ़ मुड़े। "सावित्री, संस्कृत में पंकज का मतलब जानती हो? जो कीचड़ में उगे... कमल।"
  - >-
    पंकज यानी कमल। पंकज सेवा सदन... यानी कमल सेवा सदन। मेरे पूरे शरीर में सिहरन दौड़ गई। वो भली संस्था, जिसका नाम हर मामले में आ रहा था... उसके नाम में ही कमल छिपा था।
  - >-
    पर ट्रस्ट में बहुत से ट्रस्टी थे। बनारस के बड़े-बड़े लोग। इंस्पेक्टर भैरव के साले, सेठ गिरधारी। राय बहादुर देवेंद्रनाथ। और कई और। "इनमें से कौन?" विक्रम ने ख़ुद से पूछा। क्या आप पहले ही समझ गए थे कि पंकज का मतलब कमल है? कमेंट करें।
