  - {start_scene: 11, end_scene: 12, hook_text: "सराय से बच्चे की आवाज़", title: "सराय के अस्तबल के पीछे से एक बच्चे के रोने की आवाज़", end_question: "अंदर कौन था?"}
script:
  - >-
    मसूरी। बर्फ़ीली रात। हिमालय प्रायरी स्कूल के बंद छात्रावास से, सूरजगढ़ के महाराज का दस साल का बेटा, कुँवर ललित, ग़ायब हो गया। खिड़की खुली थी, बिस्तर ठंडा। और स्कूल के ड्रॉइंग मास्टर, मिस्टर डिमेलो की साइकिल भी ग़ायब थी।
  - >-
    अगले दिन, पहाड़ी ढलान पर डिमेलो की लाश मिली। चारों ओर ताज़ा बर्फ़। पर लाश के आसपास किसी इंसान के पैरों के निशान नहीं थे। सिर्फ़ गाय के खुरों के निशान। और उस बर्फ़ीली ढलान पर, कोई गाय थी ही नहीं।
  - >-
    मैं सावित्री हूँ। स्कूल के घबराए हुए प्रिंसिपल, डॉक्टर भागवत, ख़ुद बनारस आए। "विक्रम बाबू, महाराज बहुत ताक़तवर हैं। अगर बच्चा नहीं मिला, तो मेरा स्कूल, मेरी इज़्ज़त, सब ख़त्म।"
  - >-
    मसूरी पहुँचकर हम महाराज से मिले। ठंडे, घमंडी आदमी। बेटे के ग़ायब होने पर भी चेहरे पर कोई भाव नहीं। उनका सचिव, जयवंत, उनके पीछे खड़ा था। जवान, तेज़, और बेहद विनम्र।
  - >-
    विक्रम ने बर्फ़ में साइकिल के टायरों के निशान ढूँढ़े। "देखो, सावित्री। जब साइकिल मुड़ती है, तो पिछला पहिया अगले पहिये के निशान को काटता है। इससे पता चलता है कि साइकिल किस तरफ़ जा रही थी।"
  - >-
    निशान ऊपर की ओर जाते थे, पहाड़ी सड़क पर बनी एक सराय की तरफ़। और जहाँ डिमेलो की लाश मिली थी, वहीं से खुरों के निशान शुरू होते थे। विक्रम उन निशानों पर झुके, और बहुत देर तक उन्हें देखते रहे।
  - >-
    "अजीब," वो बोले। "ये गाय कभी चलती है, कभी दौड़ती है, और कभी सरपट भागती है। गाय सरपट नहीं भागती, सावित्री। घोड़े भागते हैं।"
  - >-
    पहाड़ी सराय का मालिक था हुकम सिंह। भारी शरीर, क्रूर आँखें, और शराब की बू। उसने हमें देखते ही दरवाज़ा बंद करने की कोशिश की। "यहाँ कोई कमरा नहीं है!" विक्रम मुस्कराए। "हमें कमरा नहीं, आपका अस्तबल देखना है।"
  - >-
    अस्तबल में तीन घोड़े थे। तीनों के खुरों पर हाल ही में नई नालें ठोकी गई थीं। कोने में विक्रम को एक पुरानी नाल मिली। उसका आकार अजीब था... गाय के फटे खुर जैसा।
  - >-
    रुकिए। बर्फ़ में गाय के खुर, पर कोई गाय नहीं। एक गाय, जो सरपट भागती है। और अस्तबल में अजीब नालें। आप बताइए, ये कैसे हुआ? कमेंट में लिखिए।
  - >-
    "पुराने डाकुओं की तरकीब," विक्रम बोले। "घोड़ों के पैरों में गाय के खुर जैसी नालें, ताकि पीछा करने वाले धोखा खा जाएँ।" तभी सराय के अंदर से एक दबी हुई आवाज़ आई। जैसे कोई बच्चा रो रहा हो।
  - >-
    विक्रम ने अस्तबल के पीछे वाला दरवाज़ा तोड़ा। एक ठंडी, अँधेरी कोठरी। कोने में कंबल में लिपटा, काँपता हुआ, कुँवर ललित। मैंने उसे गले से लगा लिया। वो इतना डरा हुआ था कि रो भी नहीं पा रहा था।
  - >-
    हुकम सिंह भागने लगा, पर पुलिस बाहर पहुँच चुकी थी। विक्रम ने ललित से प्यार से पूछा, "बेटा, तुम्हें यहाँ कौन लाया?" ललित ने धीरे से कहा, "जयवंत भैया।"
  - >-
    हम महाराज के महल लौटे। विक्रम ने सबके सामने कहा, "महाराज, आपका बेटा सुरक्षित है। पर उसे अग़वा करने वाला आपके घर में ही है।" जयवंत का चेहरा सफ़ेद पड़ गया।
  - >-
    महाराज बहुत देर चुप रहे। फिर उन्होंने वो कहा, जिसकी किसी को उम्मीद नहीं थी। "जयवंत... मेरा बेटा है। मेरी पहली शादी से, जो कभी दुनिया के सामने नहीं आई। मैंने उसे सचिव बनाकर अपने पास रखा।"
  - >-
    "पर वारिस ललित है," जयवंत चीखा। "मैं बड़ा हूँ, फिर भी मेरे लिए कुछ नहीं!" उसने हुकम सिंह के साथ मिलकर ललित को अग़वा किया था, ताकि महाराज पर दबाव डालकर वसीयत बदलवा सके।
  - >-
    "और डिमेलो?" मैंने पूछा। विक्रम बोले, "डिमेलो ने बच्चे को खिड़की से जाते देख लिया था। वो साइकिल से पीछे गया। हुकम सिंह ने उसे रास्ते में ही मार दिया।" जयवंत रो पड़ा। "मैंने किसी को मारने को नहीं कहा था!"
  - >-
    महाराज ने विक्रम के सामने नोटों की एक मोटी गड्डी रखी। "ये आपका इनाम है। और ये... आपकी चुप्पी का दाम। जयवंत के बारे में दुनिया को कुछ पता नहीं चलना चाहिए।"
  - >-
    विक्रम ने गड्डी उठाई, मुस्कराए, और मेरे हाथ में रख दी। "सावित्री के दवाख़ाने के लिए। ग़रीबों का मुफ़्त इलाज होगा।" फिर महाराज से बोले, "चुप्पी का कोई दाम नहीं होता, महाराज। हुकम सिंह को फाँसी होगी।"
  - >-
    "साइकिल के निशान, सरपट दौड़ती गाय, और नई नालें..." विक्रम बोले, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाने से पहले विक्रम ने सराय की अजीब नालें ग़ौर से देखीं। हर नाल पर, ढलाई का एक बहुत छोटा निशान था। एक कमल। "मिर्ज़ापुर वाली कोठी," वो बोले। "नक़ली सिक्के भी ऐसे ही निशान वाले साँचों में ढले थे।"
  - >-
    उसी शाम कलकत्ता से राघव का तार आया... "भाई, सावधान। कमल तुम्हें चारों ओर से घेर रहा है।" विक्रम ने तार को मोड़ा, और आग में डाल दिया। क्या आपने गाय के खुरों वाली पहेली सुलझाई थी? कमेंट में बताइए।
