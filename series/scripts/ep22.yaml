# EP 22 - बर्फ़ में खुरों के निशान (The Adventure of the Priory School)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "बर्फ़ में गाय के खुर", title: "ग़ायब राजकुमार... और बर्फ़ में गाय के खुर, पर गाय कहीं नहीं", end_question: "ये निशान किसके थे?"}
  - {start_scene: 6, end_scene: 7, hook_text: "गाय जो सरपट भागती है", title: "ये 'गाय' कभी चलती है, कभी सरपट भागती है...", end_question: "आप बताइए, ये कैसे हुआ?"}
  - {start_scene: 11, end_scene: 12, hook_text: "सराय से बच्चे की आवाज़", title: "सराय के अस्तबल के पीछे से एक बच्चे के रोने की आवाज़", end_question: "अंदर कौन था?"}
script:
  - >-
    मसूरी की एक बर्फ़ीली रात में हिमालय प्रायरी स्कूल के बंद छात्रावास से सूरजगढ़ के महाराज का दस साल का बेटा, कुँवर ललित, ग़ायब हो गया। उसकी खिड़की खुली थी और बिस्तर ठंडा पड़ा था। स्कूल के ड्रॉइंग मास्टर मिस्टर डिमेलो की साइकिल भी ग़ायब थी।
  - >-
    अगले दिन पहाड़ी ढलान पर डिमेलो की लाश मिली, जिसके चारों ओर ताज़ा बर्फ़ थी। लाश के आसपास किसी इंसान के पैरों के निशान नहीं थे, वहाँ सिर्फ़ गाय के खुरों के निशान थे। जबकि उस बर्फ़ीली ढलान पर कोई गाय थी ही नहीं।
  - >-
    स्कूल के घबराए हुए प्रिंसिपल डॉक्टर भागवत ख़ुद बनारस आकर जासूस विक्रम और डॉक्टर सावित्री से मिले। उन्होंने कहा, "विक्रम बाबू, महाराज बहुत ताक़तवर हैं। अगर बच्चा नहीं मिला, तो मेरा स्कूल और मेरी इज़्ज़त, सब ख़त्म हो जाएगा।"
  - >-
    मसूरी पहुँचकर वे दोनों महाराज से मिले, जो एक ठंडे और घमंडी आदमी थे। बेटे के ग़ायब होने पर भी उनके चेहरे पर कोई भाव नहीं था। उनके पीछे उनका सचिव जयवंत खड़ा था, जो जवान, तेज़ और बेहद विनम्र था।
  - >-
    विक्रम ने बर्फ़ में साइकिल के टायरों के निशान ढूँढ़े। उन्होंने कहा, "देखो, सावित्री, जब साइकिल मुड़ती है, तो पिछला पहिया अगले पहिये के निशान को काटता है। इससे पता चलता है कि साइकिल किस तरफ़ जा रही थी।"
  - >-
    वे निशान ऊपर की ओर, पहाड़ी सड़क पर बनी एक सराय की तरफ़ जाते थे। जहाँ डिमेलो की लाश मिली थी, वहीं से खुरों के निशान शुरू होते थे। विक्रम उन निशानों पर झुके और बहुत देर तक उन्हें देखते रहे।
  - >-
    विक्रम बोले, "यह अजीब बात है कि यह गाय कभी चलती है, कभी दौड़ती है और कभी सरपट भागती है। गाय सरपट नहीं भागती, सावित्री, सरपट तो घोड़े भागते हैं।"
  - >-
    उस पहाड़ी सराय का मालिक हुकम सिंह था, जिसका शरीर भारी था, आँखें क्रूर थीं और जिससे शराब की बू आती थी। उसने उन्हें देखते ही दरवाज़ा बंद करने की कोशिश की और कहा, "यहाँ कोई कमरा ख़ाली नहीं है!" विक्रम मुस्कराकर बोले, "हमें कमरा नहीं, आपका अस्तबल देखना है।"
  - >-
    अस्तबल में तीन घोड़े थे और तीनों के खुरों पर हाल ही में नई नालें ठोकी गई थीं। एक कोने में विक्रम को एक पुरानी नाल मिली। उसका आकार अजीब था और वह गाय के फटे हुए खुर जैसी दिखती थी।
  - >-
    यहाँ एक पल रुककर सोचिए। बर्फ़ में गाय के खुरों के निशान थे, लेकिन वहाँ कोई गाय नहीं थी। वह गाय सरपट भागती थी और अस्तबल में अजीब नालें मिली थीं। आप बताइए कि यह सब कैसे हुआ? अपना जवाब कमेंट में लिखिए।
  - >-
    विक्रम बोले, "यह पुराने डाकुओं की तरकीब है। वे घोड़ों के पैरों में गाय के खुर जैसी नालें लगाते थे, ताकि पीछा करने वाले धोखा खा जाएँ।" तभी सराय के अंदर से एक दबी हुई आवाज़ आई, जैसे कोई बच्चा रो रहा हो।
  - >-
    विक्रम ने अस्तबल के पीछे वाला दरवाज़ा तोड़ दिया। अंदर एक ठंडी और अँधेरी कोठरी थी, जिसके कोने में कुँवर ललित कंबल में लिपटा काँप रहा था। सावित्री ने उसे गले से लगा लिया। वह इतना डरा हुआ था कि रो भी नहीं पा रहा था।
  - >-
    हुकम सिंह भागने लगा, लेकिन तब तक पुलिस बाहर पहुँच चुकी थी। विक्रम ने ललित से प्यार से पूछा, "बेटा, तुम्हें यहाँ कौन लाया था?" ललित ने धीरे से कहा, "मुझे जयवंत भैया लाए थे।"
  - >-
    वे महाराज के महल लौटे। विक्रम ने सबके सामने कहा, "महाराज, आपका बेटा सुरक्षित है, लेकिन उसे अग़वा करने वाला आपके घर में ही है।" यह सुनकर जयवंत का चेहरा सफ़ेद पड़ गया।
  - >-
    महाराज बहुत देर तक चुप रहे और फिर उन्होंने वह बात कही, जिसकी किसी को उम्मीद नहीं थी। उन्होंने कहा, "जयवंत मेरा बेटा है। वह मेरी पहली शादी से है, जो कभी दुनिया के सामने नहीं आई। मैंने उसे सचिव बनाकर अपने पास रखा था।"
  - >-
    जयवंत चीखकर बोला, "लेकिन वारिस तो ललित है! मैं बड़ा हूँ, फिर भी मेरे लिए कुछ नहीं है!" उसने हुकम सिंह के साथ मिलकर ललित को अग़वा किया था, ताकि वह महाराज पर दबाव डालकर वसीयत बदलवा सके।
  - >-
    सावित्री ने पूछा, "और डिमेलो को किसने मारा?" विक्रम बोले, "डिमेलो ने बच्चे को खिड़की से जाते हुए देख लिया था और वह साइकिल से उसके पीछे गया। हुकम सिंह ने उसे रास्ते में ही मार दिया।" जयवंत रो पड़ा और बोला, "मैंने किसी को मारने को नहीं कहा था!"
  - >-
    महाराज ने विक्रम के सामने नोटों की एक मोटी गड्डी रखकर कहा, "यह आपका इनाम है और आपकी चुप्पी का दाम भी है। जयवंत के बारे में दुनिया को कुछ पता नहीं चलना चाहिए।"
  - >-
    विक्रम ने वह गड्डी उठाई और मुस्कराते हुए सावित्री के हाथ में रख दी। उन्होंने कहा, "यह सावित्री के दवाख़ाने के लिए है, जहाँ ग़रीबों का मुफ़्त इलाज होगा।" फिर वह महाराज से बोले, "चुप्पी का कोई दाम नहीं होता, महाराज, और हुकम सिंह को फाँसी होगी।"
  - >-
    विक्रम बोले, "यह मामला साइकिल के निशानों, सरपट दौड़ती गाय और नई नालों से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाने से पहले विक्रम ने सराय की उन अजीब नालों को ग़ौर से देखा। हर नाल पर ढलाई का एक बहुत छोटा निशान था, जो कमल का था। उन्होंने कहा, "मिर्ज़ापुर वाली कोठी के नक़ली सिक्के भी ऐसे ही निशान वाले साँचों में ढले थे।"
  - >-
    उसी शाम कलकत्ता से राघव का तार आया, जिसमें लिखा था, "भाई, सावधान रहो, कमल तुम्हें चारों ओर से घेर रहा है।" विक्रम ने तार को मोड़ा और आग में डाल दिया। क्या आपने गाय के खुरों वाली पहेली सुलझा ली थी? अपना जवाब कमेंट में बताइए।
