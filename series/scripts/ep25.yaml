# EP 25 - आख़िरी ट्रेन की लाश (The Adventure of the Bruce-Partington Plans)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पटरी पर लाश, जेब में राज़", title: "पटरी पर लाश... और जेब में देश की गुप्त तोप के नक़्शे", end_question: "वो यहाँ कैसे पहुँचा?"}
  - {start_scene: 5, end_scene: 6, hook_text: "न टिकट, न ख़ून", title: "पटरी पर लाश, पर न टिकट, न ख़ून की एक बूँद", end_question: "आप बताइए, ऐसा क्यों?"}
  - {start_scene: 11, end_scene: 12, hook_text: "पटरी के ठीक ऊपर खिड़की", title: "जासूस की रात की चोरी... और पटरी के ठीक ऊपर खुलती खिड़की", end_question: "इस खिड़की पर क्या मिला?"}
script:
  - >-
    कोहरे में डूबी एक सुबह। कलकत्ता के बाहर, एक सुरंग के मुहाने पर, रेल की पटरी पर एक नौजवान की लाश पड़ी थी। उसके पास कोई टिकट नहीं था। पर उसकी जेब में थे... एक गुप्त तोप के नक़्शे के सात पन्ने।
  - >-
    नई 'अर्जुन' तोप। जिसके नक़्शे सरकार की सबसे सुरक्षित तिजोरी में बंद रहते थे। दस में से सात पन्ने लाश की जेब में थे। बाक़ी तीन... ग़ायब। रेल की पटरी पर लाश, और जेब में देश का सबसे बड़ा राज़।
  - >-
    मैं सावित्री हूँ। उस सुबह बनारस में कुछ ऐसा हुआ, जो पहले कभी नहीं हुआ था। राघव, जो अपनी कुर्सी से नहीं उठते थे, ख़ुद कलकत्ता से चलकर विक्रम के कमरे तक आए। मैं समझ गई, मामला बहुत बड़ा है।
  - >-
    लाश थी आकाश बनर्जी की। तोप कारख़ाने का एक जवान क्लर्क, ईमानदार, देशभक्त। उसकी मंगेतर बेला ने रोते हुए बताया, "उस रात हम थिएटर जा रहे थे। अचानक आकाश ने कोहरे में किसी को देखा, और बिना कुछ कहे भाग गया। फिर कभी नहीं लौटा।"
  - >-
    सरकार मान रही थी कि आकाश ही ग़द्दार था। नक़्शे बेचने जा रहा था, और ट्रेन से गिर पड़ा। पर विक्रम ने राघव से पूछा, "अगर वो ट्रेन से गिरा, तो उसके पास टिकट क्यों नहीं था?"
  - >-
    हम उस सुरंग पर पहुँचे। विक्रम ने पटरियों को ग़ौर से देखा। "पटरी पर ख़ून नहीं है, सावित्री। इतनी चोट के बाद ख़ून होना चाहिए था। यानी उसकी मौत यहाँ नहीं हुई। उसकी लाश यहाँ लाई गई।"
  - >-
    फिर उन्होंने देखा, लाश ठीक उस जगह मिली थी, जहाँ पटरियाँ बदलती हैं, और ट्रेन झटका खाती है। विक्रम की आँखें चमकीं। "लाश ट्रेन के अंदर नहीं थी, सावित्री। लाश ट्रेन की छत पर थी। झटका लगा, और वो नीचे गिर गई।"
  - >-
    "छत पर?" मैं चौंकी। "लाश छत पर पहुँची कैसे?" विक्रम ने नक़्शा खोला। "शहर में कुछ जगहें हैं, जहाँ घरों की खिड़कियाँ ठीक पटरी के ऊपर खुलती हैं, और ट्रेनें सिग्नल पर वहीं रुकती हैं।"
  - >-
    राघव ने एक सूची दी। विदेशी जासूस, जो उस वक़्त कलकत्ता में थे। उनमें से एक, मिस्टर ओबेरॉय, ठीक ऐसे ही एक घर में रहता था। जिसकी खिड़कियाँ पटरी के ऊपर खुलती थीं।
  - >-
    रुकिए। पटरी पर कोई ख़ून नहीं। जेब में कोई टिकट नहीं। और लाश वहाँ, जहाँ ट्रेन झटका खाती है। क्या आपने समझा, आकाश की मौत असल में कहाँ हुई थी? कमेंट में बताइए।
  - >-
    उस रात मैं और विक्रम ओबेरॉय के घर में चोरी से घुसे। मुझे बाहर पहरे पर रहना था। अँधेरी गली में खड़ी, हर आहट पर मेरा दिल उछल रहा था। विक्रम खिड़की से अंदर गए।
  - >-
    कुछ देर बाद उन्होंने मुझे अंदर बुलाया। ऊपर के कमरे की खिड़की... ठीक पटरी के ऊपर। और खिड़की की चौखट पर एक काला, सूखा धब्बा। तभी नीचे से एक ट्रेन गरजती हुई आई, और ठीक खिड़की के नीचे आकर रुक गई।
  - >-
    विक्रम ने ओबेरॉय की मेज़ से अख़बार के कुछ कटे हुए इश्तहार निकाले। ओबेरॉय और कोई और, अख़बार के ज़रिए गुप्त संदेशों में बात करते थे। विक्रम ने उसी अंदाज़ में एक इश्तहार छपवाया। "आज रात। वही जगह। ज़रूरी।"
  - >-
    रात को एक आदमी ओबेरॉय के घर आया। विक्रम, राघव और पुलिस ने उसे दबोच लिया। उसकी शक्ल देखकर राघव का चेहरा उतर गया। वो था विनय। तोप कारख़ाने के बड़े अफ़सर, सर जगदीश का अपना भाई।
  - >-
    विनय टूट गया। "मुझ पर जुए का भारी कर्ज़ था। मैंने भाई की चाबियाँ चुराकर नक़्शे निकाले, ओबेरॉय को बेचने के लिए। उस रात आकाश ने मुझे कोहरे में देख लिया। वो मेरे पीछे-पीछे ओबेरॉय के घर तक आ गया।"
  - >-
    "ओबेरॉय ने उस पर वार किया। वो वहीं ख़त्म हो गया। हम घबरा गए। लाश का क्या करें? तभी नीचे एक ट्रेन आकर रुकी। ओबेरॉय ने कहा, इसे छत पर डाल दो।"
  - >-
    "उसने तीन सबसे ज़रूरी पन्ने रख लिए, और सात आकाश की जेब में ठूँस दिए, ताकि सब उसे ग़द्दार समझें।" बेला ये सुनकर फूट-फूटकर रो पड़ी। आकाश ग़द्दार नहीं था। वो देश के लिए जान देने वाला था।
  - >-
    विक्रम ने विनय से ओबेरॉय को एक आख़िरी ख़त लिखवाया... "बाक़ी पन्नों का अच्छा ख़रीदार मिला है। ग्रैंड होटल आओ।" लालच ने ओबेरॉय को खींच लिया। होटल के कमरे में वो पकड़ा गया, और उसके सामान से तीनों पन्ने मिले।
  - >-
    "बिना ख़ून की पटरी, बिना टिकट की जेब, और पटरी के ऊपर एक खिड़की..." विक्रम ने कहा, "सच हमेशा छोटी चीज़ों में छिपा होता है।" सरकार ने आकाश बनर्जी को पूरे सम्मान के साथ विदा किया।
  - >-
    विनय ने एक और बात बताई। ओबेरॉय से उसकी पहली मुलाक़ात पंकज सेवा सदन के एक चैरिटी डिनर में हुई थी। "मेज़बान को मैंने कभी देखा नहीं। बस उनका एक आदमी मुझे ओबेरॉय तक ले गया था।"
  - >-
    राघव ने चश्मा उतारा, और विक्रम से अकेले में कहा, "मुझे एक नाम पर शक है, भाई। पर सबूत नहीं। और बिना सबूत के, ये आदमी इतना ताक़तवर है कि हम दोनों को निगल जाएगा।"
  - >-
    उसी हफ़्ते बनारस से एक ख़बर आई। इंस्पेक्टर भैरव के दफ़्तर की दराज़ से काले कमल की एक चिट्ठी मिली थी। भैरव को नौकरी से निलंबित कर दिया गया। क्या भैरव ही काला कमल है? या किसी ने उन्हें फँसाया? कमेंट करें।
