# EP 25 - आख़िरी ट्रेन की लाश (The Adventure of the Bruce-Partington Plans)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पटरी पर लाश, जेब में राज़", title: "पटरी पर लाश... और जेब में देश की गुप्त तोप के नक़्शे", end_question: "वो यहाँ कैसे पहुँचा?"}
  - {start_scene: 5, end_scene: 6, hook_text: "न टिकट, न ख़ून", title: "पटरी पर लाश, पर न टिकट, न ख़ून की एक बूँद", end_question: "आप बताइए, ऐसा क्यों?"}
  - {start_scene: 11, end_scene: 12, hook_text: "पटरी के ठीक ऊपर खिड़की", title: "जासूस की रात की चोरी... और पटरी के ठीक ऊपर खुलती खिड़की", end_question: "इस खिड़की पर क्या मिला?"}
script:
  - >-
    कोहरे में डूबी एक सुबह कलकत्ता के बाहर एक सुरंग के मुहाने पर रेल की पटरी पर एक नौजवान की लाश पड़ी थी। उसके पास कोई टिकट नहीं था। लेकिन उसकी जेब में एक गुप्त तोप के नक़्शे के सात पन्ने रखे थे।
  - >-
    वह नई 'अर्जुन' तोप थी, जिसके नक़्शे सरकार की सबसे सुरक्षित तिजोरी में बंद रहते थे। दस में से सात पन्ने लाश की जेब में मिले थे और बाक़ी तीन ग़ायब थे। रेल की पटरी पर एक लाश पड़ी थी और उसकी जेब में देश का सबसे बड़ा राज़ था।
  - >-
    उस सुबह बनारस में कुछ ऐसा हुआ, जो पहले कभी नहीं हुआ था। राघव, जो अपनी कुर्सी से कभी नहीं उठते थे, ख़ुद कलकत्ता से चलकर जासूस विक्रम के कमरे तक आए। डॉक्टर सावित्री समझ गईं कि मामला बहुत बड़ा है।
  - >-
    वह लाश आकाश बनर्जी की थी, जो तोप कारख़ाने का एक जवान, ईमानदार और देशभक्त क्लर्क था। उसकी मंगेतर बेला ने रोते हुए बताया, "उस रात हम थिएटर जा रहे थे। अचानक आकाश ने कोहरे में किसी को देखा और बिना कुछ कहे उसके पीछे भाग गया। वह फिर कभी नहीं लौटा।"
  - >-
    सरकार यह मान रही थी कि आकाश ही ग़द्दार था, जो नक़्शे बेचने जा रहा था और ट्रेन से गिर पड़ा। लेकिन विक्रम ने राघव से पूछा, "अगर वह ट्रेन से गिरा था, तो उसके पास टिकट क्यों नहीं था?"
  - >-
    वे तीनों उस सुरंग पर पहुँचे, जहाँ विक्रम ने पटरियों को ग़ौर से देखा। उन्होंने कहा, "पटरी पर ख़ून नहीं है, सावित्री, जबकि इतनी चोट के बाद ख़ून होना चाहिए था। इसका मतलब है कि उसकी मौत यहाँ नहीं हुई और उसकी लाश यहाँ लाई गई थी।"
  - >-
    फिर उन्होंने देखा कि लाश ठीक उस जगह मिली थी, जहाँ पटरियाँ बदलती हैं और ट्रेन झटका खाती है। विक्रम की आँखें चमक उठीं और वह बोले, "लाश ट्रेन के अंदर नहीं, बल्कि ट्रेन की छत पर थी, सावित्री। झटका लगने पर वह नीचे गिर गई।"
  - >-
    सावित्री ने चौंककर पूछा, "लेकिन लाश छत पर कैसे पहुँची?" विक्रम ने नक़्शा खोलकर कहा, "शहर में कुछ जगहें ऐसी हैं, जहाँ घरों की खिड़कियाँ ठीक पटरी के ऊपर खुलती हैं और ट्रेनें सिग्नल पर वहीं रुकती हैं।"
  - >-
    राघव ने उन विदेशी जासूसों की एक सूची दी, जो उस वक़्त कलकत्ता में थे। उनमें से एक, मिस्टर ओबेरॉय, ठीक ऐसे ही एक घर में रहता था। उसके घर की खिड़कियाँ पटरी के ऊपर खुलती थीं।
  - >-
    यहाँ एक पल रुककर सोचिए। पटरी पर कोई ख़ून नहीं था और जेब में कोई टिकट नहीं था। लाश वहीं मिली थी, जहाँ ट्रेन झटका खाती है। क्या आप समझ गए कि आकाश की मौत असल में कहाँ हुई थी? अपना जवाब कमेंट में बताइए।
  - >-
    उस रात विक्रम और सावित्री ओबेरॉय के घर में चोरी से घुसे। सावित्री को बाहर पहरे पर रहना था। वह अँधेरी गली में खड़ी थीं और हर आहट पर उनका दिल उछल रहा था, जबकि विक्रम खिड़की से अंदर चले गए।
  - >-
    कुछ देर बाद विक्रम ने सावित्री को अंदर बुलाया। ऊपर के कमरे की खिड़की ठीक पटरी के ऊपर खुलती थी और उसकी चौखट पर एक काला, सूखा धब्बा था। तभी नीचे से एक ट्रेन गरजती हुई आई और ठीक खिड़की के नीचे आकर रुक गई।
  - >-
    विक्रम ने ओबेरॉय की मेज़ से अख़बार के कुछ कटे हुए इश्तहार निकाले। ओबेरॉय और कोई दूसरा आदमी अख़बार के इश्तहारों के ज़रिए गुप्त संदेश भेजते थे। विक्रम ने उसी अंदाज़ में एक इश्तहार छपवाया कि आज रात उसी जगह मिलना ज़रूरी है।
  - >-
    रात को एक आदमी ओबेरॉय के घर आया और विक्रम, राघव और पुलिस ने उसे दबोच लिया। उसकी शक्ल देखकर राघव का चेहरा उतर गया। वह विनय था, जो तोप कारख़ाने के बड़े अफ़सर सर जगदीश का सगा भाई था।
  - >-
    विनय टूट गया और बोला, "मुझ पर जुए का भारी कर्ज़ था। मैंने भाई की चाबियाँ चुराकर नक़्शे निकाले, ताकि उन्हें ओबेरॉय को बेच सकूँ। उस रात आकाश ने मुझे कोहरे में देख लिया और वह मेरे पीछे-पीछे ओबेरॉय के घर तक आ गया।"
  - >-
    उसने आगे बताया, "ओबेरॉय ने उस पर वार किया और वह वहीं ख़त्म हो गया। हम घबरा गए कि अब लाश का क्या करें। तभी नीचे एक ट्रेन आकर रुकी और ओबेरॉय ने कहा कि इसे छत पर डाल दो।"
  - >-
    विनय बोला, "उसने तीन सबसे ज़रूरी पन्ने अपने पास रख लिए और सात पन्ने आकाश की जेब में ठूँस दिए, ताकि सब उसे ग़द्दार समझें।" यह सुनकर बेला फूट-फूटकर रो पड़ी। आकाश ग़द्दार नहीं था, बल्कि उसने देश के लिए अपनी जान दी थी।
  - >-
    विक्रम ने विनय से ओबेरॉय को एक आख़िरी ख़त लिखवाया कि बाक़ी पन्नों का एक अच्छा ख़रीदार मिला है और वह ग्रैंड होटल आ जाए। लालच ओबेरॉय को वहाँ खींच लाया। वह होटल के कमरे में पकड़ा गया और उसके सामान से तीनों पन्ने मिल गए।
  - >-
    विक्रम ने कहा, "यह मामला बिना ख़ून की पटरी, बिना टिकट की जेब और पटरी के ऊपर खुलती एक खिड़की से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।" सरकार ने आकाश बनर्जी को पूरे सम्मान के साथ विदा किया।
  - >-
    विनय ने एक और बात बताई कि ओबेरॉय से उसकी पहली मुलाक़ात पंकज सेवा सदन के एक चैरिटी डिनर में हुई थी। उसने कहा, "मैंने मेज़बान को कभी नहीं देखा। बस उनका एक आदमी मुझे ओबेरॉय तक ले गया था।"
  - >-
    राघव ने चश्मा उतारा और विक्रम से अकेले में कहा, "मुझे एक नाम पर शक है, भाई, लेकिन मेरे पास सबूत नहीं है। बिना सबूत के यह आदमी इतना ताक़तवर है कि हम दोनों को निगल जाएगा।"
  - >-
    उसी हफ़्ते बनारस से ख़बर आई कि इंस्पेक्टर भैरव के दफ़्तर की दराज़ से काले कमल की एक चिट्ठी मिली है। भैरव को नौकरी से निलंबित कर दिया गया। क्या भैरव ही काला कमल हैं, या किसी ने उन्हें फँसाया है? अपना जवाब कमेंट में लिखिए।
