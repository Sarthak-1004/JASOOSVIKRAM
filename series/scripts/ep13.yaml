# EP 13 - बँधी आँखों का सफ़र (The Greek Interpreter)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "मुँह बँधा, आँखें माँग रही थीं मदद", title: "आधी रात का अनुवादक... और कुर्सी से बँधा एक भूखा आदमी", end_question: "वो क्या कहना चाहता था?"}
  - {start_scene: 4, end_scene: 5, hook_text: "भाई बनाम भाई", title: "विक्रम से भी तेज़ दिमाग़... उनके अपने बड़े भाई", end_question: "किसका अंदाज़ा सही था?"}
  - {start_scene: 13, end_scene: 14, hook_text: "दरवाज़े के नीचे से धुआँ", title: "सुनसान कोठी, बंद कमरा, और दरवाज़े के नीचे से निकलता धुआँ", end_question: "अंदर कौन था?"}
script:
  - >-
    रात के अँधेरे में एक बग्घी कलकत्ता की गलियों से गुज़र रही थी। उसकी खिड़कियों पर कागज़ चिपका था। अंदर एक डरा हुआ आदमी बैठा था, और उसके कंधे पर दस्ताने वाला एक हाथ। "आवाज़ मत करना, पंडित जी।"
  - >-
    बग्घी एक सुनसान कोठी में रुकी। अंदर, लालटेन की रोशनी में, एक आदमी कुर्सी से बँधा था। भूख से सूखा हुआ, चेहरे पर पट्टियाँ, मुँह पर कपड़ा चिपका हुआ। पर उसकी आँखें... उसकी आँखें मदद माँग रही थीं।
  - >-
    मैं सावित्री हूँ। उस हफ़्ते मैं और विक्रम कलकत्ता में थे। और वहीं मैंने पहली बार विक्रम के बड़े भाई को देखा। राघव। पार्क स्ट्रीट के एक ऐसे क्लब में, जहाँ बोलना मना था।
  - >-
    राघव सरकार के लिए कुछ ऐसा काम करते थे, जिसके बारे में कोई नहीं जानता था। भारी शरीर, गोल काला चश्मा, और विक्रम जैसी ही तेज़ आँखें। विक्रम ने कहा, "मेरे भाई मुझसे ज़्यादा होशियार हैं, सावित्री। बस कुर्सी से उठना पसंद नहीं करते।"
  - >-
    राघव खिड़की से बाहर एक राहगीर को देखकर बोले, "रिटायर्ड फ़ौजी।" विक्रम ने जोड़ा, "और दो बच्चों का पिता।" राघव मुस्कराए, "तीन। तीसरा अभी गोद में है, इसलिए वो खिलौने की दुकान से निकल रहा है।" मैं बस मुँह खोले देखती रह गई।
  - >-
    फिर राघव ने हमें एक आदमी से मिलवाया। पंडित हरिदास बोस। बर्मी और तिब्बती भाषाओं के अनुवादक। डरपोक, सीधे-सादे। "मेरे साथ कल रात जो हुआ, वो मैं किसी को बताने की हिम्मत नहीं कर पा रहा था।"
  - >-
    हरिदास ने बताया, एक मुस्कराता आदमी, मिस्टर लाहिड़ी, उन्हें अनुवाद के काम के लिए ले गया था। बग्घी में उसका एक साथी भी था, जो कुछ बोलता नहीं था, बस बीच-बीच में हँसता था। एक अजीब, डरावनी हँसी।
  - >-
    कोठी में उस बँधे आदमी से सवाल पूछने थे, और उसके जवाब तिब्बती में लिखवाने थे। "इन काग़ज़ों पर दस्तख़त करो।" बँधा आदमी हर बार स्लेट पर लिखता... "नहीं।"
  - >-
    हरिदास ने हिम्मत की। हर सवाल के साथ, वो तिब्बती में अपना एक छोटा सा सवाल जोड़ने लगे। लाहिड़ी तिब्बती नहीं समझता था। "तुम कौन हो?" जवाब आया... "तेनज़िंग। व्यापारी।" "कब से यहाँ हो?" "तीन हफ़्ते। बिना खाने के।"
  - >-
    "ये लोग क्या चाहते हैं?" "मेरी फ़िरोज़े की खदान के काग़ज़। और मेरी बहन, डोलमा।" तभी दरवाज़ा खुला, और हरिदास को फ़ौरन बाहर ले जाया गया। जाते-जाते लाहिड़ी ने धमकी दी, "किसी को बताया, तो ज़ुबान काट दूँगा।"
  - >-
    रुकिए। एक अनुवादक, जिसने अपने अपहरण करने वालों की नाक के नीचे सच निकलवा लिया। आप उसकी जगह होते, तो क्या करते? और अब उस बँधे आदमी का क्या होगा?
  - >-
    राघव ने अख़बार में एक इश्तहार दिया... 'जो कोई तिब्बती व्यापारी तेनज़िंग, या उसकी बहन डोलमा के बारे में जानता हो, संपर्क करे।' अगले दिन जवाब आया। बेहाला के बाहर, एक सुनसान कोठी।
  - >-
    हम हरिदास को साथ ले जाने उनके घर पहुँचे। पर दरवाज़ा खुला था, कमरा उलट-पलट। पड़ोसी ने बताया, कुछ देर पहले एक मुस्कराता आदमी उन्हें बग्घी में बिठाकर ले गया। इश्तहार उन लोगों ने भी पढ़ लिया था।
  - >-
    हम घोड़ागाड़ी में बेहाला की तरफ़ भागे। रात हो चुकी थी। कोठी अँधेरी थी, ख़ाली। पर एक बंद कमरे के दरवाज़े के नीचे से धुआँ निकल रहा था। कोयले का ज़हरीला धुआँ।
  - >-
    विक्रम ने कंधे से दरवाज़ा तोड़ा। अंदर कोयले की अँगीठी धधक रही थी, और दो आदमी फ़र्श पर पड़े थे। हरिदास, और तेनज़िंग। मैंने खिड़कियाँ तोड़ीं, और हम दोनों को बाहर खींच लाए।
  - >-
    हरिदास की साँसें लौट आईं। पर तेनज़िंग... तीन हफ़्ते की भूख ने उसे पहले ही बहुत कमज़ोर कर दिया था। मैंने पूरी कोशिश की। पर उस रात उसकी आँखें हमेशा के लिए बंद हो गईं।
  - >-
    लाहिड़ी और उसका साथी डोलमा को लेकर भाग चुके थे। विक्रम बहुत देर तक उस कमरे में खड़े रहे। फिर बोले, "मैं हमेशा एक क़दम पीछे रह जाता हूँ, राघव।"
  - >-
    राघव ने अपना चश्मा उतारा। "क्योंकि तुम्हारे सामने कोई मामूली अपराधी नहीं है, भाई।" फिर उन्होंने अपनी जेब से एक पतली सी फ़ाइल निकाली। फ़ाइल पर एक काले कमल का निशान बना था।
  - >-
    "सरकार बरसों से इसे ढूँढ़ रही है। काला कमल। ऊँचे समाज का आदमी, जिसका चेहरा किसी ने नहीं देखा। वो कभी अपने हाथ से कुछ नहीं करता। लाहिड़ी जैसे लोग बस उसके मोहरे हैं।"
  - >-
    विक्रम ने फ़ाइल पढ़ी, और बोले, "उसकी चिट्ठियाँ, उसका पैसा, उसके मोहरे... कहीं न कहीं वो एक निशान ज़रूर छोड़ेगा, राघव। सच हमेशा छोटी चीज़ों में छिपा होता है। और मैं उसे ढूँढ़ लूँगा।"
  - >-
    कुछ हफ़्ते बाद, अख़बार में एक छोटी सी ख़बर छपी। गंगा में एक नाव पर दो आदमी मरे मिले थे। एक मुस्कराता हुआ, दूसरा, जिसके बारे में कहा गया कि वो कभी कुछ नहीं बोलता था। साथ में कोई लड़की नहीं थी।
  - >-
    डोलमा का बदला? या काले कमल ने अपने मोहरे साफ़ कर दिए? राघव ने बस इतना कहा, "कमल कभी अपना निशान नहीं छोड़ता।" आपको क्या लगता है, उन दोनों को किसने मारा? कमेंट में लिखिए।
