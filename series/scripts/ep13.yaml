# EP 13 - बँधी आँखों का सफ़र (The Greek Interpreter)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "मुँह बँधा, आँखें माँग रही थीं मदद", title: "आधी रात का अनुवादक... और कुर्सी से बँधा एक भूखा आदमी", end_question: "वो क्या कहना चाहता था?"}
  - {start_scene: 4, end_scene: 5, hook_text: "भाई बनाम भाई", title: "विक्रम से भी तेज़ दिमाग़... उनके अपने बड़े भाई", end_question: "किसका अंदाज़ा सही था?"}
  - {start_scene: 13, end_scene: 14, hook_text: "दरवाज़े के नीचे से धुआँ", title: "सुनसान कोठी, बंद कमरा, और दरवाज़े के नीचे से निकलता धुआँ", end_question: "अंदर कौन था?"}
script:
  - >-
    रात के अँधेरे में एक बग्घी कलकत्ता की गलियों से गुज़र रही थी और उसकी खिड़कियों पर कागज़ चिपका हुआ था। अंदर एक डरा हुआ आदमी बैठा था, जिसके कंधे पर दस्ताने वाला एक हाथ रखा था। किसी ने उससे कहा, "आवाज़ मत करना, पंडित जी।"
  - >-
    वह बग्घी एक सुनसान कोठी के सामने रुकी। अंदर लालटेन की रोशनी में एक आदमी कुर्सी से बँधा हुआ था। वह भूख से सूख चुका था, उसके चेहरे पर पट्टियाँ थीं और मुँह पर कपड़ा चिपका हुआ था, लेकिन उसकी आँखें मदद माँग रही थीं।
  - >-
    उस हफ़्ते जासूस विक्रम और डॉक्टर सावित्री कलकत्ता में थे। वहीं सावित्री ने पहली बार विक्रम के बड़े भाई राघव को देखा। वे पार्क स्ट्रीट के एक ऐसे क्लब में मिले, जहाँ बोलना मना था।
  - >-
    राघव सरकार के लिए कोई ऐसा काम करते थे, जिसके बारे में कोई नहीं जानता था। उनका शरीर भारी था, आँखों पर गोल काला चश्मा था और उनकी आँखें विक्रम जैसी ही तेज़ थीं। विक्रम ने कहा, "मेरे भाई मुझसे ज़्यादा होशियार हैं, सावित्री, बस उन्हें कुर्सी से उठना पसंद नहीं है।"
  - >-
    राघव ने खिड़की से बाहर एक राहगीर को देखकर कहा, "वह एक रिटायर्ड फ़ौजी है।" विक्रम ने जोड़ा, "और वह दो बच्चों का पिता है।" राघव मुस्कराकर बोले, "उसके तीन बच्चे हैं। तीसरा अभी गोद में है, इसीलिए वह खिलौने की दुकान से निकल रहा है।" सावित्री हैरानी से बस देखती रह गईं।
  - >-
    फिर राघव ने उन्हें पंडित हरिदास बोस नाम के एक आदमी से मिलवाया। वह बर्मी और तिब्बती भाषाओं के अनुवादक थे और बड़े डरपोक और सीधे-सादे आदमी थे। उन्होंने कहा, "कल रात मेरे साथ जो हुआ, वह किसी को बताने की मेरी हिम्मत नहीं हो रही थी।"
  - >-
    हरिदास ने बताया कि मिस्टर लाहिड़ी नाम का एक मुस्कराता हुआ आदमी उन्हें अनुवाद के काम के लिए ले गया था। बग्घी में उसका एक साथी भी था, जो कुछ बोलता नहीं था। वह बस बीच-बीच में एक अजीब और डरावनी हँसी हँसता था।
  - >-
    कोठी में हरिदास को उस बँधे हुए आदमी से सवाल पूछने थे और उसके जवाब तिब्बती में लिखवाने थे। लाहिड़ी उससे बार-बार कहता था कि इन काग़ज़ों पर दस्तख़त करो। बँधा हुआ आदमी हर बार स्लेट पर लिख देता था कि वह दस्तख़त नहीं करेगा।
  - >-
    तब हरिदास ने हिम्मत की और हर सवाल के साथ तिब्बती में अपना एक छोटा सा सवाल जोड़ने लगे, क्योंकि लाहिड़ी तिब्बती नहीं समझता था। उन्होंने पूछा कि तुम कौन हो, तो जवाब आया कि वह तेनज़िंग नाम का एक व्यापारी है। उसने यह भी बताया कि वह तीन हफ़्ते से वहाँ बिना खाने के बंद है।
  - >-
    हरिदास ने पूछा कि ये लोग क्या चाहते हैं, तो तेनज़िंग ने लिखा कि उन्हें उसकी फ़िरोज़े की खदान के काग़ज़ और उसकी बहन डोलमा चाहिए। तभी दरवाज़ा खुला और हरिदास को फ़ौरन बाहर ले जाया गया। जाते-जाते लाहिड़ी ने धमकी दी, "अगर तुमने किसी को बताया, तो मैं तुम्हारी ज़ुबान काट दूँगा।"
  - >-
    यहाँ एक पल रुककर सोचिए। एक अनुवादक ने अपने अपहरण करने वालों की नाक के नीचे से सच निकलवा लिया था। अगर आप उसकी जगह होते, तो क्या करते? और अब उस बँधे हुए आदमी का क्या होगा?
  - >-
    राघव ने अख़बार में एक इश्तहार दिया कि जो कोई तिब्बती व्यापारी तेनज़िंग या उसकी बहन डोलमा के बारे में जानता हो, वह संपर्क करे। अगले दिन उसका जवाब आ गया। उसमें बेहाला के बाहर एक सुनसान कोठी का पता लिखा था।
  - >-
    वे तीनों हरिदास को साथ ले जाने के लिए उनके घर पहुँचे, लेकिन दरवाज़ा खुला पड़ा था और कमरा उलट-पलट था। पड़ोसी ने बताया कि कुछ देर पहले एक मुस्कराता हुआ आदमी उन्हें बग्घी में बिठाकर ले गया। वह इश्तहार उन लोगों ने भी पढ़ लिया था।
  - >-
    वे घोड़ागाड़ी में बेहाला की तरफ़ भागे, लेकिन तब तक रात हो चुकी थी। कोठी अँधेरी और ख़ाली थी। पर एक बंद कमरे के दरवाज़े के नीचे से कोयले का ज़हरीला धुआँ निकल रहा था।
  - >-
    विक्रम ने कंधे की टक्कर से दरवाज़ा तोड़ दिया। अंदर कोयले की अँगीठी धधक रही थी और हरिदास और तेनज़िंग फ़र्श पर बेसुध पड़े थे। सावित्री ने खिड़कियाँ तोड़ीं और वे उन दोनों को बाहर खींच लाए।
  - >-
    हरिदास की साँसें लौट आईं, लेकिन तीन हफ़्ते की भूख ने तेनज़िंग को पहले ही बहुत कमज़ोर कर दिया था। सावित्री ने उसे बचाने की पूरी कोशिश की। फिर भी उस रात उसकी आँखें हमेशा के लिए बंद हो गईं।
  - >-
    लाहिड़ी और उसका साथी डोलमा को लेकर भाग चुके थे। विक्रम बहुत देर तक उस कमरे में खड़े रहे। फिर वह बोले, "मैं हमेशा एक क़दम पीछे रह जाता हूँ, राघव।"
  - >-
    राघव ने अपना चश्मा उतारकर कहा, "ऐसा इसलिए है, क्योंकि तुम्हारे सामने कोई मामूली अपराधी नहीं है, भाई।" फिर उन्होंने अपनी जेब से एक पतली सी फ़ाइल निकाली। उस फ़ाइल पर एक काले कमल का निशान बना हुआ था।
  - >-
    राघव ने बताया, "सरकार बरसों से इस काले कमल को ढूँढ़ रही है। वह ऊँचे समाज का आदमी है, जिसका चेहरा किसी ने नहीं देखा। वह कभी अपने हाथ से कुछ नहीं करता और लाहिड़ी जैसे लोग बस उसके मोहरे हैं।"
  - >-
    विक्रम ने फ़ाइल पढ़ी और बोले, "उसकी चिट्ठियों, उसके पैसे या उसके मोहरों में वह कहीं न कहीं एक निशान ज़रूर छोड़ेगा, राघव। सच हमेशा छोटी चीज़ों में छिपा होता है, और मैं उसे ढूँढ़ लूँगा।"
  - >-
    कुछ हफ़्ते बाद अख़बार में एक छोटी सी ख़बर छपी कि गंगा में एक नाव पर दो आदमी मरे हुए मिले हैं। उनमें से एक मुस्कराता रहता था और दूसरे के बारे में कहा गया कि वह कभी कुछ नहीं बोलता था। उनके साथ कोई लड़की नहीं थी।
  - >-
    क्या यह डोलमा का बदला था, या काले कमल ने अपने मोहरे साफ़ कर दिए थे? राघव ने बस इतना कहा, "कमल कभी अपना निशान नहीं छोड़ता।" आपको क्या लगता है कि उन दोनों को किसने मारा? अपना जवाब कमेंट में लिखिए।
