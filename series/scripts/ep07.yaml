# EP 7 - खिड़की में दिखा चेहरा (The Man with the Twisted Lip)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "खिड़की में पति का चेहरा", title: "पत्नी ने अफ़ीमख़ाने की खिड़की में पति को देखा... फिर वो ग़ायब", end_question: "वो वहाँ क्या कर रहा था?"}
  - {start_scene: 7, end_scene: 8, hook_text: "मरे हुए आदमी की चिट्ठी", title: "ग़ायब पति की चिट्ठी आई... उसके जाने के एक दिन बाद की", end_question: "क्या वो ज़िंदा है?"}
  - {start_scene: 10, end_scene: 12, hook_text: "एक गीला स्पंज", title: "जासूस गीला स्पंज लेकर हवालात क्यों पहुँचा?", end_question: "स्पंज से क्या निकलेगा?"}
script:
  - >-
    सुशीला एक अनजान गली से गुज़र रही थी, जब उसकी नज़र अचानक ऊपर की ओर उठी। एक पुरानी इमारत की धुंधली खिड़की में उसे अपने पति का चेहरा दिखाई दिया। उसका पति ऐसे चीखा, जैसे किसी ने उसे पीछे से खींच लिया हो, और अगले ही पल वह खिड़की से ग़ायब हो गया।
  - >-
    सुशीला सीढ़ियाँ चढ़कर ऊपर भागी, जहाँ 'स्वर्ग लोक' नाम का एक अफ़ीमख़ाना था। ऊपर के कमरे में उसका पति नहीं था, वहाँ बस राख से सना एक गंदा भिखारी बैठा था। अगले दिन नदी से उसके पति का कोट निकला, जिसकी जेबें सिक्कों से भरी हुई थीं, ताकि वह कोट पानी में डूब जाए।
  - >-
    यह कहानी जासूस विक्रम और उनकी साथी डॉक्टर सावित्री के एक बेहद अजीब मामले की है। सुशीला सक्सेना ने रोते हुए विक्रम को सारी बात बताई। उसके पति नीरज एक इज़्ज़तदार व्यापारी थे और उस दिन काम से शहर गए थे। सवाल यह था कि उस गली के अफ़ीमख़ाने में उनका क्या काम था?
  - >-
    उस भिखारी को पूरा बनारस लालू बाबा के नाम से जानता था। उसके चेहरे पर राख मली रहती थी, होंठ पर एक टेढ़ा और डरावना निशान था और उसके नारंगी बाल उलझे रहते थे। वह घाट पर बैठता था और ऐसे चुटीले जवाब देता था कि लोग हँसते-हँसते उसके कटोरे में सिक्के डाल जाते थे।
  - >-
    इंस्पेक्टर भैरव ने लालू बाबा को क़त्ल के इल्ज़ाम में गिरफ़्तार कर लिया। उन्होंने कहा, "यही क़ातिल है और इसी ने नीरज बाबू को मारकर नदी में फेंका है!" खिड़की के पास ख़ून की हल्की बूँदें मिली थीं और लालू बाबा की एक उँगली कटी हुई थी।
  - >-
    भैरव ख़ुद उस दोपहर उसी गली में मौजूद थे, और उनका कहना था कि वह बस इत्तफ़ाक़ से वहाँ थे। यह सुनकर विक्रम ने भौंहें उठाईं, लेकिन वह कुछ नहीं बोले। अफ़ीमख़ाने का मालिक एक चुप्पा नाविक था, जो कुछ भी बताने को तैयार नहीं था।
  - >-
    उसी शाम सुशीला हाथ में एक चिट्ठी लिए दौड़ती हुई आई और बोली, "यह नीरज की लिखावट है!" चिट्ठी में बस दो पंक्तियाँ लिखी थीं, "घबराना मत, मैं ठीक हूँ।" उस पर लगी डाक की मुहर नीरज के ग़ायब होने के एक दिन बाद की थी।
  - >-
    सावित्री ने कहा, "इसका मतलब है कि नीरज ज़िंदा हैं!" विक्रम ने चिट्ठी को ध्यान से देखा और बोले, "या फिर किसी ने उनसे मरने से पहले यह लिखवा लिया था।" यह सुनकर कमरे में सन्नाटा छा गया और सुशीला की आँखें फिर भर आईं।
  - >-
    उस रात विक्रम ने कमरे के सारे तकिए और गद्दे ज़मीन पर इकट्ठे किए और उन पर पालथी मारकर बैठ गए। उन्होंने आँखें बंद करके कहा, "मुझे सोचना है, सावित्री।" सावित्री सो गईं, और जब वह सुबह उठीं, तब भी विक्रम उसी तरह बैठे हुए थे।
  - >-
    अचानक विक्रम की आँखें खुलीं और वह उछलकर खड़े हो गए। उन्होंने कहा, "मैं बनारस का सबसे बड़ा मूर्ख हूँ, सावित्री!" फिर उन्होंने अलमारी से एक स्पंज निकाला, उसे पानी में भिगोया और अपने थैले में रख लिया।
  - >-
    यहाँ एक पल रुककर सोचिए। खिड़की में पति का चेहरा दिखा था, लेकिन ऊपर सिर्फ़ एक भिखारी मिला था। नदी से कोट निकला था, और फिर एक मरे हुए आदमी की चिट्ठी आई थी। आपको क्या लगता है कि विक्रम एक गीला स्पंज लेकर कहाँ जा रहे थे?
  - >-
    विक्रम और सावित्री सीधे हवालात पहुँचे, जहाँ बेहद गंदा लालू बाबा अपनी कोठरी में सो रहा था। सावित्री ने ग़ौर किया कि उसके हाथ जितने गंदे थे, उसके नाख़ून उतने ही सफ़ाई से कटे हुए थे। भैरव ने नाक सिकोड़कर कहा, "इसे नहलाने की ज़रूरत है, विक्रम बाबू।" विक्रम मुस्कराकर बोले, "मैं बिल्कुल यही करने आया हूँ।"
  - >-
    विक्रम ने कोठरी खोली और सोते हुए भिखारी के चेहरे पर गीला स्पंज रगड़ दिया। उन्होंने स्पंज दो बार फेरा और चेहरे की राख उतरने लगी। होंठ का टेढ़ा निशान पिघलकर बह गया और नारंगी बाल किसी नक़ली टोपी की तरह खिसक गए।
  - >-
    उसके नीचे से एक साफ़, गोरा और इज़्ज़तदार चेहरा निकल आया। भैरव का मुँह खुला का खुला रह गया और वह बोले, "यह तो नीरज सक्सेना है!" भिखारी ने आँखें खोलीं और शर्म से अपना चेहरा हाथों में छिपा लिया।
  - >-
    नीरज ने सारी बात बता दी। बरसों पहले वह एक अख़बार में रिपोर्टर था और एक कहानी के लिए एक दिन भिखारी बनकर घाट पर बैठा था। शाम तक उसने उतना कमा लिया था, जितना वह पूरे हफ़्ते में कमाता था।
  - >-
    धीरे-धीरे यह उसकी आदत बन गई। सुबह इज़्ज़तदार नीरज घर से निकलता था, अफ़ीमख़ाने के कमरे में लालू बाबा बन जाता था और शाम को फिर नीरज बनकर घर लौट आता था। शहर का उसका कारोबार बस एक दिखावा था।
  - >-
    उस दिन जब सुशीला ने उसे खिड़की में देखा, तो वह घबरा गया। उसने जल्दी से अपना कोट सिक्कों समेत नदी में फेंक दिया और लालू बाबा बन गया। उसकी उँगली खिड़की के शीशे से कटी थी। वह क़ातिल नहीं था, बल्कि वह ख़ुद ही वह मरा हुआ आदमी था।
  - >-
    विक्रम ने पूछा, "और वह चिट्ठी किसने भेजी थी?" नीरज ने जवाब दिया, "हवालात जाने से पहले मैंने वह चिट्ठी नाविक को दे दी थी, क्योंकि मैं सुशीला को तड़पता हुआ नहीं देख सकता था।"
  - >-
    विक्रम ने भैरव से कहा, "यहाँ कोई क़त्ल नहीं हुआ है, इंस्पेक्टर साहब। अगर नीरज वादा करे कि लालू बाबा हमेशा के लिए मर जाएगा, तो यह राज़ इसी कोठरी में रहेगा।" नीरज ने सिर झुकाकर हामी भर दी।
  - >-
    विक्रम बोले, "खिड़की पर ख़ून था, उँगली कटी हुई थी और एक भिखारी के नाख़ून किसी बाबू जैसे साफ़ थे। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाते-जाते सावित्री की नज़र अफ़ीमख़ाने की उस दीवार पर पड़ी, जिसके पास से वे पहले दिन गुज़रे थे। धुएँ से काली पड़ चुकी उस दीवार पर एक छोटा सा चित्र बना हुआ था। वह चित्र एक काले कमल का था।
  - >-
    सावित्री को याद आया कि उस दोपहर इसी गली में इंस्पेक्टर भैरव भी इत्तफ़ाक़ से मौजूद थे। उन्होंने विक्रम की तरफ़ देखा, तो विक्रम ने बस इतना कहा, "हर इत्तफ़ाक़ इत्तफ़ाक़ नहीं होता।" क्या आपको भी भैरव पर शक है? अपना जवाब कमेंट में लिखिए।
