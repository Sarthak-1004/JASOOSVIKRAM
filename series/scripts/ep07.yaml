# EP 7 - खिड़की में दिखा चेहरा (The Man with the Twisted Lip)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "खिड़की में पति का चेहरा", title: "पत्नी ने अफ़ीमख़ाने की खिड़की में पति को देखा... फिर वो ग़ायब", end_question: "वो वहाँ क्या कर रहा था?"}
  - {start_scene: 7, end_scene: 8, hook_text: "मरे हुए आदमी की चिट्ठी", title: "ग़ायब पति की चिट्ठी आई... उसके जाने के एक दिन बाद की", end_question: "क्या वो ज़िंदा है?"}
  - {start_scene: 10, end_scene: 12, hook_text: "एक गीला स्पंज", title: "जासूस गीला स्पंज लेकर हवालात क्यों पहुँचा?", end_question: "स्पंज से क्या निकलेगा?"}
script:
  - >-
    सुशीला एक अनजान गली से गुज़र रही थी, जब उसने ऊपर देखा। एक पुरानी इमारत की धुंधली खिड़की में उसके पति का चेहरा था। वो चीखा, जैसे किसी ने पीछे से खींच लिया हो... और खिड़की से ग़ायब हो गया।
  - >-
    सुशीला सीढ़ियाँ चढ़कर ऊपर भागी। वो एक अफ़ीमख़ाना था... 'स्वर्ग लोक'। ऊपर के कमरे में उसका पति नहीं था। बस एक गंदा, राख से सना भिखारी बैठा था। अगले दिन नदी से उसके पति का कोट निकला। जेबें सिक्कों से भरी हुईं, ताकि कोट डूब जाए।
  - >-
    मैं सावित्री हूँ। सुशीला सक्सेना ने रोते हुए विक्रम को सब बताया। उसके पति नीरज, एक इज़्ज़तदार व्यापारी, उस दिन शहर गए थे। उस गली में, उस अफ़ीमख़ाने में, उनका क्या काम था?
  - >-
    उस भिखारी को पूरा बनारस जानता था। लालू बाबा। चेहरे पर राख, होंठ पर एक टेढ़ा, डरावना निशान, और नारंगी उलझे बाल। घाट पर बैठता था, और ऐसे चुटीले जवाब देता था कि लोग हँसते-हँसते सिक्के डाल जाते।
  - >-
    इंस्पेक्टर भैरव ने लालू बाबा को क़त्ल के इल्ज़ाम में गिरफ़्तार कर लिया। "यही है क़ातिल! इसी ने नीरज बाबू को मारकर नदी में फेंका!" खिड़की के पास ख़ून की हल्की बूँदें थीं, और लालू बाबा की उँगली कटी हुई थी।
  - >-
    भैरव ख़ुद उस दोपहर उसी गली में मौजूद थे। "बस इत्तफ़ाक़ से," उन्होंने कहा। विक्रम ने भौंहें उठाईं, पर कुछ नहीं बोले। अफ़ीमख़ाने का मालिक, एक चुप्पा नाविक, कुछ भी बताने को तैयार नहीं था।
  - >-
    उसी शाम सुशीला दौड़ती हुई आई, हाथ में एक चिट्ठी। "ये नीरज की लिखावट है!" चिट्ठी पर बस दो पंक्तियाँ थीं... "घबराना मत। मैं ठीक हूँ।" और डाक की मुहर, उनके ग़ायब होने के एक दिन बाद की थी।
  - >-
    मैंने कहा, "तो नीरज ज़िंदा हैं!" विक्रम ने चिट्ठी देखी। "या फिर किसी ने उनसे मरने से पहले ये लिखवा लिया।" कमरे में सन्नाटा छा गया। सुशीला की आँखें फिर भर आईं।
  - >-
    उस रात विक्रम ने कमरे के सारे तकिए और गद्दे ज़मीन पर इकट्ठे किए, और उन पर पालथी मारकर बैठ गए। आँखें बंद। "मुझे सोचना है, सावित्री।" मैं सो गई। जब सुबह उठी, वो उसी तरह बैठे थे।
  - >-
    अचानक उनकी आँखें खुलीं, और वो उछलकर खड़े हो गए। "मैं बनारस का सबसे बड़ा मूर्ख हूँ, सावित्री! सबसे बड़ा!" उन्होंने अलमारी से एक स्पंज निकाला, उसे पानी में भिगोया, और अपने थैले में रख लिया।
  - >-
    रुकिए। खिड़की में पति का चेहरा। ऊपर सिर्फ़ एक भिखारी। नदी में कोट। और एक 'मरे हुए' आदमी की चिट्ठी। आपको क्या लगता है, विक्रम एक गीला स्पंज लेकर कहाँ जा रहे थे?
  - >-
    हम सीधे हवालात पहुँचे। लालू बाबा अपनी कोठरी में सो रहा था, बेहद गंदा। पर मैंने ग़ौर किया, उसके हाथ जितने गंदे थे, नाख़ून उतने ही साफ़-सुथरे कटे हुए। भैरव ने नाक सिकोड़ी। "इसे नहलाने की ज़रूरत है, विक्रम बाबू।" विक्रम मुस्कराए, "बिल्कुल यही करने आया हूँ।"
  - >-
    विक्रम ने कोठरी खोली, और सोते हुए भिखारी के चेहरे पर गीला स्पंज रगड़ दिया। एक बार। दो बार। राख उतरने लगी। टेढ़ा निशान पिघलकर बह गया। नारंगी बाल एक नक़ली टोपी की तरह खिसक गए।
  - >-
    नीचे से एक साफ़, गोरा, इज़्ज़तदार चेहरा निकला। भैरव का मुँह खुला का खुला रह गया। "ये... ये तो नीरज सक्सेना है!" भिखारी ने आँखें खोलीं, और शर्म से अपना चेहरा हाथों में छिपा लिया।
  - >-
    नीरज ने सब बताया। बरसों पहले वो एक अख़बार में रिपोर्टर था। एक कहानी के लिए वो एक दिन भिखारी बनकर घाट पर बैठा। शाम तक उसने उतना कमा लिया, जितना वो हफ़्ते भर में कमाता था।
  - >-
    धीरे-धीरे ये आदत बन गई। सुबह इज़्ज़तदार नीरज घर से निकलता, अफ़ीमख़ाने के कमरे में लालू बाबा बनता, और शाम को फिर नीरज बनकर घर लौटता। शहर का कारोबार बस एक दिखावा था।
  - >-
    उस दिन जब सुशीला ने उसे खिड़की में देखा, वो घबरा गया। उसने जल्दी से अपना कोट, सिक्कों समेत, नदी में फेंका, और लालू बाबा बन गया। उँगली खिड़की के शीशे से कटी थी। वो क़ातिल नहीं था। वो ख़ुद ही वो 'मरा हुआ' आदमी था।
  - >-
    "और वो चिट्ठी?" विक्रम ने पूछा। "हवालात जाने से पहले मैंने नाविक को दी थी," नीरज बोला। "मैं सुशीला को तड़पता नहीं देख सकता था।"
  - >-
    विक्रम ने भैरव से कहा, "कोई क़त्ल नहीं हुआ, इंस्पेक्टर साहब। अगर नीरज वादा करे कि लालू बाबा हमेशा के लिए मर जाएगा, तो ये राज़ इसी कोठरी में रहेगा।" नीरज ने सिर झुकाकर हामी भरी।
  - >-
    "खिड़की पर ख़ून, कटी उँगली, और एक भिखारी, जिसके नाख़ून किसी बाबू जैसे साफ़ थे," विक्रम बोले। "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जाते-जाते मेरी नज़र उस अफ़ीमख़ाने की दीवार पर पड़ी, जहाँ हम पहले दिन गए थे। धुएँ से काली दीवार पर एक छोटा सा चित्र बना था। एक काला कमल।
  - >-
    और उस दोपहर, इसी गली में, इंस्पेक्टर भैरव 'इत्तफ़ाक़ से' मौजूद थे। मैंने विक्रम की तरफ़ देखा। उन्होंने बस इतना कहा, "हर इत्तफ़ाक़ इत्तफ़ाक़ नहीं होता।" क्या आपको भैरव पर शक है? कमेंट में लिखिए।
