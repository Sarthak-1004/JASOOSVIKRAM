# EP 29 - मौत का झरना (The Final Problem)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "झरने के किनारे दो साये", title: "गरजते झरने के किनारे दो आदमी... और फिर दोनों ग़ायब", end_question: "क्या विक्रम मर गए?"}
  - {start_scene: 3, end_scene: 4, hook_text: "आज तीन बार हमला", title: "'आज तीन बार मुझे मारने की कोशिश हुई' - और शटर में गोली का छेद", end_question: "कौन है ये?"}
  - {start_scene: 18, end_scene: 20, hook_text: "छड़ी और एक पर्ची", title: "झरने के किनारे सिर्फ़ उनकी छड़ी, और एक आख़िरी पर्ची", end_question: "क्या ये अंत है? कल आख़िरी एपिसोड।"}
script:
  - >-
    चेरापूँजी। मूसलाधार बारिश। एक गरजते झरने के किनारे, फिसलती चट्टानों पर, दो आदमी गुत्थमगुत्था थे। एक, नेवी-नीले कोट में, पीतल की मूठ वाली छड़ी लिए। दूसरा, लंबे काले लबादे में। फिर... दोनों ग़ायब हो गए।
  - >-
    उस दिन झरने ने दो आदमियों को निगल लिया। और जब मैं, सावित्री, वहाँ पहुँची, तो सिर्फ़ बारिश थी, गरजता पानी था, और चट्टान पर पड़ी एक छड़ी। पर ये कहानी शुरू हुई थी तीन दिन पहले, बनारस में।
  - >-
    तीन दिन पहले, रात के ग्यारह बजे, विक्रम मेरे दवाख़ाने में आए। उन्होंने आते ही सारी खिड़कियाँ बंद कीं, और शटर गिरा दिए। "हवाई बंदूक़ों से डर लगता है, सावित्री।" उनकी उँगलियों के जोड़ छिले हुए थे।
  - >-
    "आज तीन बार मुझे मारने की कोशिश हुई। सुबह एक बेक़ाबू बग्घी, दोपहर छत से गिरती एक ईंट, और शाम को गली में एक लठैत।" उन्होंने खिड़की के शटर की तरफ़ इशारा किया। उसमें एक छोटा सा, गोल छेद था। "और ये, अभी, यहाँ आते हुए।"
  - >-
    "मैं जानता हूँ, काला कमल कौन है," विक्रम ने धीरे से कहा। मैं जम गई। "मैंने सारे सबूत राघव को दे दिए हैं। तीन दिन बाद, पुलिस उसके पूरे जाल पर एक साथ छापा मारेगी। पर तब तक मुझे ज़िंदा रहना है।"
  - >-
    "कौन है वो, विक्रम?" मैंने पूछा। उन्होंने सिर हिलाया। "तुम्हें अभी नहीं बता सकता, सावित्री। जितना कम जानोगी, उतनी सुरक्षित रहोगी।"
  - >-
    फिर उन्होंने बताया, कल रात काला कमल ख़ुद उनके कमरे में आया था। अँधेरे में, चेहरा छिपाए। बस एक आवाज़। "मेरा रास्ता छोड़ दो, विक्रम। तुम अच्छे आदमी हो। मैं तुम्हें मारना नहीं चाहता।"
  - >-
    "मैंने कहा, 'अगर तुम्हें गिराने के लिए मुझे भी गिरना पड़े, तो मैं तैयार हूँ।' और उसने कहा... 'तो हम दोनों गिरेंगे।'" कमरे में बाहर की बारिश के सिवा कोई आवाज़ नहीं थी।
  - >-
    राघव की योजना के मुताबिक़, अगली सुबह हम अलग-अलग डिब्बों में पूरब जाने वाली ट्रेन में बैठे। विक्रम एक बूढ़े पंडित के भेष में थे। मुझे कहा गया था, किसी से बात मत करना।
  - >-
    रुकिए। एक जासूस, जो जानता है कि दुश्मन कौन है, पर बताता नहीं। एक भागती ट्रेन। और सिर्फ़ तीन दिन। क्या आपको पता है, काला कमल कौन है? अपना जवाब अभी कमेंट में लिखिए, कल सच सामने होगा।
  - >-
    ट्रेन चल पड़ी। तभी प्लेटफ़ॉर्म पर मैंने एक आदमी को दौड़ते देखा। लंबा कोट, तेज़ आँखें। वो ट्रेन तक नहीं पहुँच पाया। विक्रम ने खिड़की से झाँककर कहा, "अब वो एक ख़ास ट्रेन किराए पर लेगा, और हमारा पीछा करेगा।"
  - >-
    "तो हम क्या करेंगे?" "हम अगले छोटे स्टेशन पर उतर जाएँगे।" हम एक सुनसान स्टेशन पर उतरे, और एक खंभे के पीछे छिप गए। कुछ मिनट बाद, एक अकेला इंजन, एक डिब्बे के साथ, गरजता हुआ हमारे सामने से गुज़र गया।
  - >-
    दो दिन बाद हम शिलॉन्ग होते हुए चेरापूँजी पहुँचे। बादलों का देश। पहाड़ों पर बारिश ऐसे गिरती थी, जैसे आसमान फट गया हो। पास ही एक विशाल झरना था, जिसकी गरज मीलों तक सुनाई देती थी।
  - >-
    विक्रम उस शाम शांत थे। अजीब तरह से शांत। बोले, "सावित्री, अगर कल पुलिस ने कमल को पकड़ लिया, तो मैं जासूसी छोड़ दूँगा। पहाड़ों में मधुमक्खियाँ पालूँगा।" मैं हँस पड़ी। मुझे क्या पता था, वो हँसी आख़िरी थी।
  - >-
    अगली दोपहर हम झरना देखने गए। रास्ते में एक लड़का दौड़ता आया। "डॉक्टर दीदी! होटल में एक अंग्रेज़ औरत बहुत बीमार है। उसे डॉक्टर चाहिए, अभी!" मैं ठिठकी। विक्रम ने कहा, "जाओ, सावित्री। मैं यहीं हूँ।"
  - >-
    मैं होटल की ओर भागी। आधे रास्ते में, बारिश में भीगते हुए, अचानक मेरे क़दम रुक गए। होटल में कोई अंग्रेज़ औरत ठहरी ही नहीं थी। मैंने कल ही रजिस्टर देखा था। ये एक चाल थी। मुझे विक्रम से दूर करने की।
  - >-
    मैं वापस भागी। जितना तेज़ भाग सकती थी। फिसलती चट्टानें, गरजता झरना, और बारिश। "विक्रम! विक्रम!" मेरी आवाज़ पानी के शोर में डूब गई।
  - >-
    झरने के किनारे, चट्टान पर, सिर्फ़ विक्रम की छड़ी पड़ी थी। पीतल की मूठ वाली। और उसके नीचे, उनकी चाँदी की डिबिया से दबी, एक भीगी पर्ची। उनकी लिखावट।
  - >-
    "सावित्री, वो यहाँ आया। आज हमारा हिसाब होगा। माफ़ करना कि तुम्हें बताए बिना जा रहा हूँ। मेरी फ़ाइल राघव के पास है। तुम मेरी सबसे अच्छी दोस्त रही हो।"
  - >-
    कीचड़ में दो लोगों के पैरों के निशान थे, जो झरने के किनारे तक जाते थे। और लौटता हुआ... एक भी नहीं। मैं वहीं घुटनों पर गिर पड़ी। बारिश मेरे आँसुओं को धोती रही।
  - >-
    उस दिन मैंने अपना सबसे अच्छा दोस्त खो दिया। पुलिस ने कई दिन झरने के नीचे तलाश की। कुछ नहीं मिला। राघव के छापों में काले कमल के बहुत से आदमी पकड़े गए। पर कमल ख़ुद... कहीं नहीं मिला।
  - >-
    एक महीने बाद, बनारस में, पंकज सेवा सदन की एक भव्य दावत में, राय बहादुर देवेंद्रनाथ ने जाम उठाया। "महान जासूस विक्रम की याद में।" और जाम पीते हुए, उन्होंने अपनी हाथीदाँत की छड़ी की मूठ को हल्के से सहलाया। क्या विक्रम सच में चले गए? कल... आख़िरी एपिसोड।
