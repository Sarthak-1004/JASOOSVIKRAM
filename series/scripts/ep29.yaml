# EP 29 - मौत का झरना (The Final Problem)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "झरने के किनारे दो साये", title: "गरजते झरने के किनारे दो आदमी... और फिर दोनों ग़ायब", end_question: "क्या विक्रम मर गए?"}
  - {start_scene: 3, end_scene: 4, hook_text: "आज तीन बार हमला", title: "'आज तीन बार मुझे मारने की कोशिश हुई' - और शटर में गोली का छेद", end_question: "कौन है ये?"}
  - {start_scene: 18, end_scene: 20, hook_text: "छड़ी और एक पर्ची", title: "झरने के किनारे सिर्फ़ उनकी छड़ी, और एक आख़िरी पर्ची", end_question: "क्या ये अंत है? कल आख़िरी एपिसोड।"}
script:
  - >-
    चेरापूँजी में मूसलाधार बारिश हो रही थी और एक गरजते हुए झरने के किनारे फिसलती चट्टानों पर दो आदमी गुत्थमगुत्था थे। उनमें से एक ने नेवी-नीला कोट पहना था और उसके हाथ में पीतल की मूठ वाली छड़ी थी, जबकि दूसरा लंबे काले लबादे में था। फिर अचानक वे दोनों ग़ायब हो गए।
  - >-
    उस दिन झरने ने दो आदमियों को निगल लिया था। जब डॉक्टर सावित्री वहाँ पहुँचीं, तो वहाँ सिर्फ़ बारिश थी, गरजता हुआ पानी था और चट्टान पर एक छड़ी पड़ी थी। लेकिन यह कहानी तीन दिन पहले बनारस में शुरू हुई थी।
  - >-
    तीन दिन पहले रात के ग्यारह बजे जासूस विक्रम सावित्री के दवाख़ाने में आए थे। उन्होंने आते ही सारी खिड़कियाँ बंद कर दीं और शटर गिरा दिए। उन्होंने कहा, "मुझे हवाई बंदूक़ों से डर लगता है, सावित्री।" उनकी उँगलियों के जोड़ छिले हुए थे।
  - >-
    विक्रम ने बताया, "आज तीन बार मुझे मारने की कोशिश हुई है। सुबह एक बेक़ाबू बग्घी मुझ पर चढ़ने वाली थी, दोपहर को छत से एक ईंट गिरी और शाम को गली में एक लठैत मिला।" उन्होंने खिड़की के शटर की तरफ़ इशारा किया, जिसमें एक छोटा सा गोल छेद था। वह बोले, "और यह छेद अभी यहाँ आते समय हुआ है।"
  - >-
    विक्रम ने धीरे से कहा, "मैं जानता हूँ कि काला कमल कौन है।" यह सुनकर सावित्री जहाँ थीं, वहीं जम गईं। विक्रम बोले, "मैंने सारे सबूत राघव को दे दिए हैं। तीन दिन बाद पुलिस उसके पूरे जाल पर एक साथ छापा मारेगी, लेकिन तब तक मुझे ज़िंदा रहना है।"
  - >-
    सावित्री ने पूछा, "वह कौन है, विक्रम?" विक्रम ने सिर हिलाकर कहा, "मैं तुम्हें अभी नहीं बता सकता, सावित्री। तुम जितना कम जानोगी, उतनी ही सुरक्षित रहोगी।"
  - >-
    फिर उन्होंने बताया कि कल रात काला कमल ख़ुद अँधेरे में चेहरा छिपाए उनके कमरे में आया था। विक्रम को बस उसकी आवाज़ सुनाई दी थी। उसने कहा था, "मेरा रास्ता छोड़ दो, विक्रम। तुम अच्छे आदमी हो और मैं तुम्हें मारना नहीं चाहता।"
  - >-
    विक्रम बोले, "मैंने उससे कहा कि अगर तुम्हें गिराने के लिए मुझे भी गिरना पड़े, तो मैं तैयार हूँ। उसने जवाब दिया कि तब हम दोनों गिरेंगे।" उस समय कमरे में बाहर की बारिश के सिवा कोई आवाज़ नहीं थी।
  - >-
    राघव की योजना के मुताबिक़ अगली सुबह वे दोनों पूरब जाने वाली ट्रेन के अलग-अलग डिब्बों में बैठे। विक्रम एक बूढ़े पंडित के भेष में थे। सावित्री से कहा गया था कि वह किसी से बात न करें।
  - >-
    यहाँ एक पल रुककर सोचिए। एक जासूस जानता है कि दुश्मन कौन है, लेकिन वह किसी को बताता नहीं है। वह एक भागती हुई ट्रेन में है और उसके पास सिर्फ़ तीन दिन हैं। क्या आपको पता है कि काला कमल कौन है? अपना जवाब अभी कमेंट में लिखिए, क्योंकि कल सच सामने आ जाएगा।
  - >-
    ट्रेन चल पड़ी और तभी सावित्री ने प्लेटफ़ॉर्म पर लंबे कोट और तेज़ आँखों वाले एक आदमी को दौड़ते हुए देखा। वह ट्रेन तक नहीं पहुँच पाया। विक्रम ने खिड़की से झाँककर कहा, "अब वह एक ख़ास ट्रेन किराए पर लेगा और हमारा पीछा करेगा।"
  - >-
    सावित्री ने पूछा, "तो अब हम क्या करेंगे?" विक्रम बोले, "हम अगले छोटे स्टेशन पर उतर जाएँगे।" वे एक सुनसान स्टेशन पर उतरे और एक खंभे के पीछे छिप गए। कुछ मिनट बाद एक अकेला इंजन एक डिब्बे के साथ गरजता हुआ उनके सामने से गुज़र गया।
  - >-
    दो दिन बाद वे शिलॉन्ग होते हुए चेरापूँजी पहुँचे, जिसे बादलों का देश कहा जाता है। वहाँ पहाड़ों पर बारिश ऐसे गिरती थी, जैसे आसमान फट गया हो। पास ही एक विशाल झरना था, जिसकी गरज मीलों तक सुनाई देती थी।
  - >-
    उस शाम विक्रम अजीब तरह से शांत थे। उन्होंने कहा, "सावित्री, अगर कल पुलिस ने कमल को पकड़ लिया, तो मैं जासूसी छोड़ दूँगा और पहाड़ों में मधुमक्खियाँ पालूँगा।" सावित्री हँस पड़ीं। उन्हें क्या पता था कि वह उन दोनों की आख़िरी हँसी थी।
  - >-
    अगली दोपहर वे झरना देखने गए। रास्ते में एक लड़का दौड़ता हुआ आया और बोला, "डॉक्टर दीदी, होटल में एक अंग्रेज़ औरत बहुत बीमार है और उसे अभी डॉक्टर चाहिए!" सावित्री ठिठक गईं, लेकिन विक्रम ने कहा, "तुम जाओ, सावित्री, मैं यहीं हूँ।"
  - >-
    सावित्री होटल की ओर भागीं। आधे रास्ते में बारिश में भीगते हुए अचानक उनके क़दम रुक गए, क्योंकि होटल में कोई अंग्रेज़ औरत ठहरी ही नहीं थी और उन्होंने कल ही रजिस्टर देखा था। यह उन्हें विक्रम से दूर करने की एक चाल थी।
  - >-
    सावित्री जितना तेज़ भाग सकती थीं, उतनी तेज़ी से वापस भागीं। चट्टानें फिसल रही थीं, झरना गरज रहा था और बारिश हो रही थी। वह विक्रम का नाम लेकर पुकारती रहीं, लेकिन उनकी आवाज़ पानी के शोर में डूब गई।
  - >-
    झरने के किनारे चट्टान पर सिर्फ़ विक्रम की पीतल की मूठ वाली छड़ी पड़ी थी। उसके नीचे उनकी चाँदी की डिबिया से दबी एक भीगी हुई पर्ची थी। वह पर्ची विक्रम की लिखावट में थी।
  - >-
    उसमें लिखा था, "सावित्री, वह यहाँ आ गया है और आज हमारा हिसाब होगा। मुझे माफ़ करना कि मैं तुम्हें बताए बिना जा रहा हूँ। मेरी फ़ाइल राघव के पास है। तुम मेरी सबसे अच्छी दोस्त रही हो।"
  - >-
    कीचड़ में दो लोगों के पैरों के निशान थे, जो झरने के किनारे तक जाते थे, लेकिन वहाँ से लौटता हुआ एक भी निशान नहीं था। सावित्री वहीं घुटनों पर गिर पड़ीं। बारिश उनके आँसुओं को धोती रही।
  - >-
    उस दिन सावित्री ने अपना सबसे अच्छा दोस्त खो दिया। पुलिस ने कई दिन तक झरने के नीचे तलाश की, लेकिन उन्हें कुछ नहीं मिला। राघव के छापों में काले कमल के बहुत से आदमी पकड़े गए, लेकिन कमल ख़ुद कहीं नहीं मिला।
  - >-
    एक महीने बाद बनारस में पंकज सेवा सदन की एक भव्य दावत में राय बहादुर देवेंद्रनाथ ने जाम उठाया और कहा, "यह जाम महान जासूस विक्रम की याद में है।" जाम पीते हुए उन्होंने अपनी हाथीदाँत की छड़ी की मूठ को हल्के से सहलाया। क्या विक्रम सच में चले गए? इसका जवाब कल आख़िरी एपिसोड में मिलेगा।
