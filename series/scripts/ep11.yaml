# EP 11 - मुट्ठी में फटा कागज़ (The Reigate Squire)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "मुर्दे की मुट्ठी में पर्ची", title: "आधी रात की गोली... और मरे हुए कोचवान की मुट्ठी में फटा कागज़", end_question: "बाक़ी कागज़ कहाँ है?"}
  - {start_scene: 7, end_scene: 9, hook_text: "एक कागज़, दो लिखावटें", title: "एक ही पर्ची, बारी-बारी से दो लोगों ने लिखी", end_question: "ये दो लोग कौन थे?"}
  - {start_scene: 11, end_scene: 12, hook_text: "जासूस अचानक गिर पड़ा", title: "जाँच के बीच विक्रम अचानक गिर पड़े...", end_question: "क्या विक्रम सच में बीमार हैं?"}
script:
  - >-
    आधी रात को मेरठ में गोली की आवाज़ गूँज उठी। ज़मींदार कैलाशनाथ कपूर के आँगन में उनका कोचवान गुलज़ार मरा हुआ पड़ा था। उसकी अकड़ी हुई मुट्ठी में एक फटे हुए कागज़ का कोना दबा था।
  - >-
    उस कोने पर बस कुछ टूटे-फूटे शब्द लिखे थे, जिनमें पौने बारह बजे का समय था और यह लिखा था कि शायद कुछ पता चल जाएगा। सवाल यह था कि उस कागज़ का बाक़ी हिस्सा कहाँ गया और एक कोचवान को आधी रात को आँगन में किसने बुलाया था?
  - >-
    उन दिनों जासूस विक्रम बहुत बीमार पड़ गए थे, क्योंकि लगातार काम ने उन्हें तोड़ दिया था। डॉक्टर सावित्री उन्हें ज़बरदस्ती आराम के लिए मेरठ ले आई थीं। उन्हें क्या पता था कि वहाँ आराम की जगह एक क़त्ल उनका इंतज़ार कर रहा था।
  - >-
    ज़मींदार कैलाशनाथ और उनके बेटे विकास, दोनों ने कहा कि उन्होंने एक चोर को भागते हुए देखा था। विकास बोला, "मैं खिड़की पर खड़ा था, जब चोर ने गुलज़ार पर गोली चलाई और वह खेतों की तरफ़ भाग गया।"
  - >-
    कुछ ही दिन पहले पड़ोस के एक घर में चोरी हुई थी, लेकिन वह चोरी बड़ी अजीब थी। इतनी बड़ी हवेली में से चोर बस धागे का एक गोला, एक पेपरवेट और एक पुराना पंचांग ले गया था, जो बिल्कुल बेकार चीज़ें थीं।
  - >-
    इंस्पेक्टर भैरव भी किसी सरकारी काम से मेरठ आए हुए थे और जाँच में मदद कर रहे थे। उन्होंने चोरी वाले घर की तलाशी ली और एक पेपरवेट ग़लती से अपनी जेब में रख लिया। विक्रम ने यह देखा, लेकिन वह चुप रहे।
  - >-
    सावित्री ने विक्रम को बिस्तर पर ही रहने को कहा था, लेकिन उन्होंने वह फटा हुआ कागज़ मँगवा लिया और घंटों उसे घूरते रहे। फिर वह बोले, "सावित्री, इसे एक आदमी ने नहीं लिखा है। इसे दो आदमियों ने मिलकर लिखा है।"
  - >-
    विक्रम ने समझाया, "देखो, कुछ शब्द किसी कड़क, ताक़तवर और जवान हाथ ने लिखे हैं, जबकि बाक़ी शब्द किसी काँपते हुए बूढ़े हाथ के हैं। दो लोग बारी-बारी से एक-एक शब्द लिख रहे थे, ताकि कोई अकेला न पकड़ा जाए।"
  - >-
    उन्होंने आगे कहा, "दोनों की लिखावट का ढंग एक जैसा है और दोनों की मात्राएँ एक जैसी घुमावदार हैं। ये दोनों आपस में रिश्तेदार हैं, सावित्री, और शायद बाप और बेटा हैं।"
  - >-
    यहाँ एक पल रुककर सोचिए। एक फटा हुआ कागज़ था, जिस पर दो लिखावटें थीं, और एक बाप-बेटा थे, जिन्होंने चोर को भागते हुए देखने का दावा किया था। आप बताइए कि उस कागज़ का बाक़ी हिस्सा कहाँ होगा?
  - >-
    अगले दिन वे दोनों कपूर साहब की हवेली पहुँचे, जहाँ विक्रम बहुत सारे सवाल पूछते रहे। फिर अचानक वह लड़खड़ाए और ज़मीन पर गिर पड़े। यह देखकर कमरे में भगदड़ मच गई।
  - >-
    गिरते-गिरते उन्होंने संतरों से भरी एक मेज़ उलट दी, जिससे संतरे फ़र्श पर लुढ़क गए और पानी का जग टूट गया। सावित्री घबराकर उनकी तरफ़ भागीं। लेकिन जैसे ही वह झुकीं, विक्रम ने उन्हें चुपके से आँख मार दी।
  - >-
    सब लोग संतरे उठाने में लग गए और उसी बीच विक्रम कमरे से ग़ायब हो गए। कुछ मिनट बाद वह बिल्कुल ठीक हालत में लौटे और बोले, "माफ़ कीजिए, मुझे बीमारी का दौरा पड़ गया था।" सावित्री समझ गईं कि वह दौरा नहीं, बल्कि एक नाटक था।
  - >-
    फिर विक्रम ने एक बयान लिखा और उसमें जानबूझकर समय ग़लत लिख दिया। बूढ़े कैलाशनाथ ने तुरंत क़लम उठाई और अपने हाथ से उस ग़लती को सुधार दिया। विक्रम ने वह बयान मोड़कर सावधानी से अपनी जेब में रख लिया।
  - >-
    रात को विक्रम चुपके से विकास के कमरे में घुसे। उन्होंने अलमारी में टँगे एक रेशमी गाउन की जेब में हाथ डाला। उस जेब से कागज़ का बाक़ी हिस्सा निकल आया।
  - >-
    तभी दरवाज़ा भड़ाक से खुला और बाप-बेटा दोनों अंदर घुस आए। विकास ने विक्रम का गला पकड़ लिया और बूढ़ा कैलाशनाथ उनके हाथ से कागज़ छीनने लगा। विक्रम की साँस अटकने लगी।
  - >-
    सावित्री ने चीखकर इंस्पेक्टर भैरव को बुलाया। भैरव दो सिपाहियों के साथ दौड़ते हुए आए और उन्होंने बाप-बेटे को धर दबोचा। विक्रम ज़मीन पर बैठे अपना गला सहला रहे थे और मुस्कराकर बोले, "मेरी बीमारी अब ठीक हो गई है, सावित्री।"
  - >-
    विक्रम ने सारी बात समझाई, "पड़ोसी से इनका ज़मीन का मुक़दमा चल रहा है और पड़ोसी के पास ऐसे काग़ज़ात थे, जो इनका दावा झूठा साबित कर देते। पिछली चोरी इन्हीं दोनों ने वे काग़ज़ ढूँढ़ने के लिए की थी। बेकार चीज़ें तो बस दिखावे के लिए उठाई गई थीं।"
  - >-
    उन्होंने कहा, "गुलज़ार ने उस रात इन्हें देख लिया था और वह इन्हें ब्लैकमेल करने लगा। इसलिए दोनों ने मिलकर यह चिट्ठी लिखी, उसे पौने बारह बजे आँगन में बुलाया और गोली मार दी।"
  - >-
    विक्रम बोले, "मरते-मरते गुलज़ार ने चिट्ठी छीनने की कोशिश की और उसका एक कोना उसकी मुट्ठी में रह गया। मैंने संतरे गिराकर सबका ध्यान बँटाया और विकास का कमरा देख आया। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    मुक़दमे के काग़ज़ात में एक नाम बार-बार आता था। वह कपूर परिवार का वकील था, जिसने उन्हें यह चोरी करने की सलाह दी थी। वही आदमी बनारस की एक बड़ी संस्था, पंकज सेवा सदन का क़ानूनी सलाहकार भी था।
  - >-
    भैरव ने अपनी जेब वाला पेपरवेट हँसते हुए लौटा दिया और कहा कि उन्होंने उसे ग़लती से रख लिया था। विक्रम ने पेपरवेट को उलटकर देखा, तो उसके नीचे एक छोटा सा कमल खुदा हुआ था। क्या भैरव सच में उसे लौटाना भूल गए थे? इस बारे में आपकी क्या राय है?
