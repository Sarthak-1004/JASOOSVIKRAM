# EP 11 - मुट्ठी में फटा कागज़ (The Reigate Squire)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "मुर्दे की मुट्ठी में पर्ची", title: "आधी रात की गोली... और मरे हुए कोचवान की मुट्ठी में फटा कागज़", end_question: "बाक़ी कागज़ कहाँ है?"}
  - {start_scene: 7, end_scene: 9, hook_text: "एक कागज़, दो लिखावटें", title: "एक ही पर्ची, बारी-बारी से दो लोगों ने लिखी", end_question: "ये दो लोग कौन थे?"}
  - {start_scene: 11, end_scene: 12, hook_text: "जासूस अचानक गिर पड़ा", title: "जाँच के बीच विक्रम अचानक गिर पड़े...", end_question: "क्या विक्रम सच में बीमार हैं?"}
script:
  - >-
    आधी रात को गोली की आवाज़ गूँजी। मेरठ के ज़मींदार कैलाशनाथ कपूर के आँगन में उनका कोचवान, गुलज़ार, मरा पड़ा था। और उसकी अकड़ी हुई मुट्ठी में एक फटे कागज़ का कोना था।
  - >-
    उस पर बस कुछ टूटे-फूटे शब्द थे... "...पौने बारह बजे... पता चल जाएगा... शायद।" बाक़ी कागज़ कहाँ गया? और एक कोचवान को आधी रात को आँगन में किसने बुलाया था?
  - >-
    मैं सावित्री हूँ। उन दिनों विक्रम बहुत बीमार पड़ गए थे। लगातार काम ने उन्हें तोड़ दिया था। मैंने ज़बरदस्ती उन्हें आराम के लिए मेरठ भेजा। मुझे क्या पता था, आराम की जगह एक क़त्ल हमारा इंतज़ार कर रहा था।
  - >-
    ज़मींदार कैलाशनाथ और उनके बेटे विकास, दोनों ने कहा, उन्होंने एक चोर को भागते देखा। विकास बोला, "मैं खिड़की पर था। चोर ने गुलज़ार पर गोली चलाई, और खेतों की तरफ़ भाग गया।"
  - >-
    कुछ ही दिन पहले पड़ोस के एक घर में चोरी हुई थी। पर चोरी अजीब थी। चोर ले गया... एक धागे का गोला, एक पेपरवेट, और एक पुराना पंचांग। बस। इतनी बड़ी हवेली में से, ये बेकार चीज़ें।
  - >-
    इंस्पेक्टर भैरव भी किसी सरकारी काम से मेरठ आए हुए थे, और जाँच में मदद कर रहे थे। उन्होंने चोरी वाले घर की तलाशी ली, और एक पेपरवेट 'ग़लती से' अपनी जेब में रख लिया। विक्रम ने देखा, पर चुप रहे।
  - >-
    मैंने विक्रम को बिस्तर पर रहने को कहा। पर उन्होंने वो फटा कागज़ मँगवा लिया, और घंटों उसे घूरते रहे। फिर बोले, "सावित्री, ये एक आदमी ने नहीं लिखा। ये दो आदमियों ने मिलकर लिखा है।"
  - >-
    "देखो, 'पौने' और 'बजे'... कड़क, ताक़तवर, जवान हाथ। पर 'पता' और 'शायद'... काँपता हुआ, बूढ़ा हाथ। दो लोग, बारी-बारी से एक-एक शब्द लिख रहे थे, ताकि कोई अकेला पकड़ा न जाए।"
  - >-
    "और दोनों की लिखावट में एक ही ढंग है। मात्राएँ एक जैसी घुमावदार। ये दोनों रिश्तेदार हैं, सावित्री। शायद... बाप और बेटा।"
  - >-
    रुकिए। एक फटा कागज़, दो लिखावटें, और एक बाप-बेटा, जिन्होंने चोर को भागते 'देखा'। आप बताइए, इस कागज़ का बाक़ी हिस्सा कहाँ होगा?
  - >-
    अगले दिन हम कपूर साहब की हवेली पहुँचे। विक्रम बहुत सारे सवाल पूछते रहे। फिर अचानक... वो लड़खड़ाए, और ज़मीन पर गिर पड़े। कमरे में भगदड़ मच गई।
  - >-
    गिरते-गिरते उन्होंने संतरों से भरी मेज़ उलट दी। संतरे फ़र्श पर लुढ़क गए, पानी का जग टूट गया। मैं घबराकर उनकी तरफ़ भागी। पर जैसे ही मैं झुकी, उन्होंने मुझे चुपके से आँख मारी।
  - >-
    सब संतरे उठाने में लग गए। उसी बीच विक्रम कमरे से ग़ायब हो गए। कुछ मिनट बाद वो लौटे, बिल्कुल ठीक। "माफ़ कीजिए, बीमारी का दौरा था।" मैं समझ गई, ये दौरा नहीं, नाटक था।
  - >-
    फिर विक्रम ने एक बयान लिखा, और उसमें जानबूझकर एक ग़लती कर दी... समय ग़लत लिख दिया। बूढ़े कैलाशनाथ ने तुरंत क़लम उठाई, और उसे सुधार दिया। अपने हाथ से। विक्रम ने बयान मोड़कर सावधानी से जेब में रख लिया।
  - >-
    रात को विक्रम चुपके से विकास के कमरे में घुसे। अलमारी में टँगे एक रेशमी गाउन की जेब में हाथ डाला। और बाहर निकला... कागज़ का बाक़ी हिस्सा।
  - >-
    तभी दरवाज़ा भड़ाक से खुला। बाप और बेटा दोनों अंदर घुसे। विकास ने विक्रम का गला पकड़ लिया, बूढ़ा कैलाशनाथ उनके हाथ से कागज़ छीनने लगा। विक्रम की साँस अटकने लगी।
  - >-
    मैंने चीखकर इंस्पेक्टर भैरव को बुलाया। भैरव और दो सिपाही दौड़ते आए, और बाप-बेटे को धर दबोचा। विक्रम ज़मीन पर बैठे, गला सहलाते हुए मुस्करा रहे थे। "बीमारी अब ठीक है, सावित्री।"
  - >-
    विक्रम ने समझाया। "पड़ोसी से इनका ज़मीन का मुक़दमा चल रहा है। पड़ोसी के पास कुछ काग़ज़ात थे, जो इनका दावा झूठा साबित कर देते। पिछली 'चोरी' इन्हीं ने की थी, वो काग़ज़ ढूँढ़ने के लिए। बेकार चीज़ें बस दिखावे के लिए उठाई गईं।"
  - >-
    "गुलज़ार ने इन्हें उस रात देख लिया था, और वो इन्हें ब्लैकमेल करने लगा। इसलिए दोनों ने मिलकर ये चिट्ठी लिखी, उसे पौने बारह बजे आँगन में बुलाया, और गोली मार दी।"
  - >-
    "मरते-मरते गुलज़ार ने चिट्ठी छीनने की कोशिश की, और एक कोना उसकी मुट्ठी में रह गया। संतरे गिराकर मैंने सबका ध्यान बँटाया, और विकास का कमरा देख आया।" वो मुस्कराए। "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    मुक़दमे के काग़ज़ात में एक नाम बार-बार आता था। कपूर परिवार का वकील, जिसने उन्हें ये चोरी करने की सलाह दी थी। वही आदमी, बनारस की एक बड़ी संस्था का क़ानूनी सलाहकार भी था... पंकज सेवा सदन।
  - >-
    और भैरव की जेब वाला पेपरवेट? उन्होंने हँसकर कहा, "अरे, ग़लती से रख लिया था!" और लौटा दिया। विक्रम ने पेपरवेट को उलटकर देखा। उसके नीचे एक छोटा सा कमल खुदा था। क्या भैरव सच में भूल गए थे? आपकी क्या राय है?
