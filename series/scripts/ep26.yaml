  - {start_scene: 1, end_scene: 2, hook_text: "जासूस विक्रम मर रहे हैं", title: "'पास मत आना!' - जासूस विक्रम की आख़िरी रात?", end_question: "क्या ये विक्रम का अंत है?"}
  - {start_scene: 12, end_scene: 13, hook_text: "हाथीदाँत का तोहफ़ा", title: "क़ातिल ने ख़ुद बताया: वो तोहफ़ा मौत का था", end_question: "ये तोहफ़ा किसने भेजा?"}
  - {start_scene: 14, end_scene: 15, hook_text: "लैंप तेज़ करो...", title: "मरते जासूस ने कहा: 'लैंप तेज़ कर दो'... और दरवाज़ा खुला", end_question: "दरवाज़े पर कौन था?"}
script:
  - >-
    जासूस विक्रम मर रहे हैं। आधी रात को अम्मा जी, विक्रम की बूढ़ी मकान-मालकिन, मेरे दवाख़ाने का दरवाज़ा पीटते हुए चीखीं। "सावित्री बिटिया! जल्दी चलो! विक्रम ने तीन दिन से कुछ नहीं खाया, और बुख़ार में बड़बड़ा रहे हैं!"
  - >-
    मैं भागी। विक्रम का कमरा अँधेरा था, घुटन से भरा। वो बिस्तर पर पड़े थे, चेहरा पीला, होंठों पर पपड़ी, आँखें धँसी हुई। मैं उनकी तरफ़ बढ़ी। तभी वो चीखे, "पास मत आना! ये बीमारी छूने से फैलती है!"
  - >-
    मैं सावित्री हूँ। मैं एक डॉक्टर हूँ। पर उस रात, मेरा सबसे अच्छा दोस्त मुझे अपनी नब्ज़ तक छूने नहीं दे रहा था। "सुमात्रा का बुख़ार है, सावित्री। एक दुर्लभ बीमारी। इसका इलाज हिंदुस्तान के किसी डॉक्टर के पास नहीं।"
  - >-
    मैंने ज़िद की। वो और भड़क उठे। "तुम मेरी दोस्त हो, मेरी डॉक्टर नहीं! अगर तुमने मुझे छुआ, तो मैं ये घर छोड़ दूँगा!" मैं सन्न रह गई। आँसू रोकते हुए मैं कोने की कुर्सी पर बैठ गई।
  - >-
    फिर वो बड़बड़ाने लगे। "सीपियाँ... समुंदर की सीपियाँ इतनी तेज़ी से क्यों बढ़ती हैं, सावित्री? दुनिया सीपियों से भर जाएगी..." फिर अचानक बोले, "मेरे सिक्के, मेज़ पर सिक्के ठीक से रखो।" मेरा दिल बैठ गया। वो होश खो रहे थे।
  - >-
    फिर, एक पल को, वो होश में आए। "सावित्री, एक ही आदमी मुझे बचा सकता है। कुलवंत सूद। सुमात्रा का बागान मालिक। वो इस बीमारी को जानता है। उसे लेकर आओ। उससे कहना, मैं बहुत बुरी हालत में हूँ। और... उससे पहले तुम यहाँ लौट आना।"
  - >-
    मैं कुलवंत सूद के घर पहुँची। एक मोटा, मुस्कुराता आदमी, आँखों में एक ठंडी चमक। विक्रम का नाम सुनते ही उसकी मुस्कान और चौड़ी हो गई। "अरे, बेचारे विक्रम! मैं अभी आता हूँ।" उस मुस्कान ने मुझे डरा दिया।
  - >-
    मैं जल्दी लौटी। विक्रम ने मुझसे कहा, "बिस्तर के सिरहाने के पीछे छिप जाओ। जो भी हो, एक आवाज़ मत करना।" मैंने हैरानी से देखा, पर उनकी आँखों में एक अजीब सी चमक थी। मैं छिप गई।
  - >-
    इसी बीमारी के दिनों में राय बहादुर देवेंद्रनाथ भी विक्रम को देखने आए थे। कमरे में केवड़े की ख़ुशबू भर गई थी। उन्होंने बाएँ हाथ से मेज़ पर रखी क़लम उठाई, और बैंगनी स्याही में एक पर्ची लिखी... "जल्दी ठीक हो जाओ।"
  - >-
    रुकिए। एक जासूस, जो अपनी डॉक्टर दोस्त को छूने नहीं देता। सीपियों और सिक्कों की बड़बड़ाहट। और एक आदमी, जिसे बुलाने की इतनी ज़िद। क्या ये सचमुच विक्रम का अंत है?
  - >-
    सीढ़ियों पर भारी क़दम। कुलवंत सूद अंदर आया, और दरवाज़ा बंद कर दिया। वो बिस्तर के पास खड़ा होकर विक्रम को घूरता रहा। फिर हँसा। एक धीमी, ज़हरीली हँसी।
  - >-
    "तो महान जासूस विक्रम मर रहा है। जानते हो, ये बीमारी कहाँ से आई? मेरे भतीजे विजय को भी यही हुई थी। उसकी जायदाद मुझे चाहिए थी। उसने भी ऐसे ही तड़प-तड़पकर दम तोड़ा।"
  - >-
    "और तुम, विक्रम... तुम विजय की मौत के बारे में बहुत सवाल पूछ रहे थे। इसलिए मैंने तुम्हें एक तोहफ़ा भेजा था।" उसने मेज़ से हाथीदाँत का एक छोटा सा डिब्बा उठाया। "इसके अंदर एक स्प्रिंग वाली सुई है। जैसे ही तुमने खोला... चुभ गई।"
  - >-
    "ये सबूत मैं अपने साथ ले जाऊँगा। और तुम यहीं मरोगे।" उसने डिब्बा अपनी जेब में रख लिया। मेरी साँस रुक गई। मैं बिस्तर के पीछे से निकलना चाहती थी।
  - >-
    तभी विक्रम ने कमज़ोर आवाज़ में कहा, "सूद... बहुत अँधेरा है। गैस लैंप थोड़ा तेज़ कर दो।" सूद ने हँसते हुए लैंप की चाबी घुमाई। रोशनी तेज़ हुई। और उसी पल... दरवाज़ा भड़ाक से खुला।
  - >-
    इंस्पेक्टर भैरव अंदर घुसे। निलंबित होने के बावजूद, विक्रम के कहने पर वो बाहर छिपे थे। लैंप की तेज़ रोशनी उनके लिए इशारा थी। "कुलवंत सूद, तुम गिरफ़्तार हो!" सूद ने भागने की कोशिश की, पर भैरव ने उसे दबोच लिया।
  - >-
    और फिर... विक्रम उठकर बैठ गए। बिल्कुल ठीक। "अम्मा जी, कुछ खाने को मिलेगा? तीन दिन से भूखा हूँ।" मैं बिस्तर के पीछे से निकली, और बस उन्हें घूरती रह गई।
  - >-
    विक्रम ने समझाया। "तीन दिन का उपवास, आँखों में बेलाडोना की बूँदें, होंठों पर मोम, माथे पर वैसलीन, और गालों पर थोड़ा रंग। और सीपियों-सिक्कों की बातें... पागलपन का नाटक।"
  - >-
    "और तुम्हें पास इसलिए नहीं आने दिया, सावित्री, क्योंकि तुम डॉक्टर हो। एक बार नब्ज़ छूतीं, तो सब समझ जातीं। और सूद तक तुम्हारी असली घबराहट पहुँचनी ज़रूरी थी।" फिर धीरे से बोले, "माफ़ करना, सावित्री। तुम्हारे आँसू ही इस नाटक को सच बना सकते थे।"
  - >-
    मैं गुस्सा होना चाहती थी। पर मैं रो भी पड़ी, और हँस भी पड़ी। विक्रम बोले, "डिब्बा मैंने कभी खोला ही नहीं। उसकी बनावट में कुछ अजीब था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    बाद में पता चला, वो हाथीदाँत का डिब्बा, पंकज सेवा सदन अस्पताल का एक लड़का 'जल्द ठीक होने का तोहफ़ा' कहकर दे गया था। ये सुनकर विक्रम के चेहरे का रंग बदल गया।
  - >-
    उस रात, जब सब चले गए, मैंने देखा, विक्रम मेज़ पर बैठे, देवेंद्रनाथ वाली पर्ची को घूर रहे थे। बैंगनी स्याही। पीछे की ओर झुके अक्षर। बहुत देर बाद उन्होंने बस इतना कहा, "अब मुझे यक़ीन है।" विक्रम किसके बारे में सोच रहे थे? कमेंट में लिखिए।
