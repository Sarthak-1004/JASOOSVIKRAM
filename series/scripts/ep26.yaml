  - {start_scene: 1, end_scene: 2, hook_text: "जासूस विक्रम मर रहे हैं", title: "'पास मत आना!' - जासूस विक्रम की आख़िरी रात?", end_question: "क्या ये विक्रम का अंत है?"}
  - {start_scene: 12, end_scene: 13, hook_text: "हाथीदाँत का तोहफ़ा", title: "क़ातिल ने ख़ुद बताया: वो तोहफ़ा मौत का था", end_question: "ये तोहफ़ा किसने भेजा?"}
  - {start_scene: 14, end_scene: 15, hook_text: "लैंप तेज़ करो...", title: "मरते जासूस ने कहा: 'लैंप तेज़ कर दो'... और दरवाज़ा खुला", end_question: "दरवाज़े पर कौन था?"}
script:
  - >-
    जासूस विक्रम मर रहे थे। आधी रात को विक्रम की बूढ़ी मकान-मालकिन अम्मा जी डॉक्टर सावित्री के दवाख़ाने का दरवाज़ा पीटते हुए चीखीं, "सावित्री बिटिया, जल्दी चलो! विक्रम ने तीन दिन से कुछ नहीं खाया है और वह बुख़ार में बड़बड़ा रहे हैं!"
  - >-
    सावित्री भागती हुई वहाँ पहुँचीं। विक्रम का कमरा अँधेरा और घुटन से भरा था। वह बिस्तर पर पड़े थे, उनका चेहरा पीला था, होंठों पर पपड़ी जमी थी और आँखें धँसी हुई थीं। सावित्री उनकी तरफ़ बढ़ीं, तो वह चीखे, "पास मत आना, यह बीमारी छूने से फैलती है!"
  - >-
    सावित्री एक डॉक्टर थीं, लेकिन उस रात उनका सबसे अच्छा दोस्त उन्हें अपनी नब्ज़ तक छूने नहीं दे रहा था। विक्रम ने कहा, "यह सुमात्रा का बुख़ार है, सावित्री, जो एक दुर्लभ बीमारी है। इसका इलाज हिंदुस्तान के किसी डॉक्टर के पास नहीं है।"
  - >-
    सावित्री ने ज़िद की, तो विक्रम और भड़क उठे। उन्होंने कहा, "तुम मेरी दोस्त हो, मेरी डॉक्टर नहीं! अगर तुमने मुझे छुआ, तो मैं यह घर छोड़ दूँगा!" सावित्री सन्न रह गईं और आँसू रोकते हुए कोने की कुर्सी पर बैठ गईं।
  - >-
    फिर विक्रम बड़बड़ाने लगे, "समुंदर की सीपियाँ इतनी तेज़ी से क्यों बढ़ती हैं, सावित्री? यह दुनिया सीपियों से भर जाएगी।" फिर अचानक वह बोले, "मेज़ पर मेरे सिक्के ठीक से रखो।" सावित्री का दिल बैठ गया, क्योंकि विक्रम अपना होश खो रहे थे।
  - >-
    फिर एक पल के लिए वह होश में आए और बोले, "सावित्री, मुझे सिर्फ़ एक आदमी बचा सकता है। उसका नाम कुलवंत सूद है और वह सुमात्रा का बागान मालिक है, जो इस बीमारी को जानता है। उसे लेकर आओ और कहना कि मैं बहुत बुरी हालत में हूँ। लेकिन तुम उससे पहले यहाँ लौट आना।"
  - >-
    सावित्री कुलवंत सूद के घर पहुँचीं। वह एक मोटा और मुस्कुराता हुआ आदमी था, जिसकी आँखों में एक ठंडी चमक थी। विक्रम का नाम सुनते ही उसकी मुस्कान और चौड़ी हो गई और वह बोला, "बेचारे विक्रम! मैं अभी आता हूँ।" उसकी उस मुस्कान ने सावित्री को डरा दिया।
  - >-
    सावित्री जल्दी से लौट आईं। विक्रम ने उनसे कहा, "बिस्तर के सिरहाने के पीछे छिप जाओ और चाहे जो भी हो, एक आवाज़ मत करना।" सावित्री ने हैरानी से उन्हें देखा, लेकिन उनकी आँखों में एक अजीब सी चमक थी, इसलिए वह छिप गईं।
  - >-
    बीमारी के इन्हीं दिनों में राय बहादुर देवेंद्रनाथ भी विक्रम को देखने आए थे और उनके आते ही कमरे में केवड़े की ख़ुशबू भर गई थी। उन्होंने बाएँ हाथ से मेज़ पर रखी क़लम उठाई थी। फिर उन्होंने बैंगनी स्याही से एक पर्ची पर लिखा था कि जल्दी ठीक हो जाओ।
  - >-
    यहाँ एक पल रुककर सोचिए। एक जासूस अपनी डॉक्टर दोस्त को ख़ुद को छूने नहीं दे रहा था और सीपियों और सिक्कों की बातें बड़बड़ा रहा था। वह एक ख़ास आदमी को बुलाने की ज़िद भी कर रहा था। क्या यह सचमुच विक्रम का अंत था?
  - >-
    सीढ़ियों पर भारी क़दमों की आवाज़ आई। कुलवंत सूद अंदर आया और उसने दरवाज़ा बंद कर दिया। वह बिस्तर के पास खड़ा होकर विक्रम को घूरता रहा और फिर एक धीमी, ज़हरीली हँसी हँसा।
  - >-
    सूद ने कहा, "तो महान जासूस विक्रम मर रहा है। क्या तुम जानते हो कि यह बीमारी कहाँ से आई? मेरे भतीजे विजय को भी यही बीमारी हुई थी, क्योंकि मुझे उसकी जायदाद चाहिए थी। उसने भी ऐसे ही तड़प-तड़पकर दम तोड़ा था।"
  - >-
    उसने आगे कहा, "तुम विजय की मौत के बारे में बहुत सवाल पूछ रहे थे, विक्रम, इसलिए मैंने तुम्हें एक तोहफ़ा भेजा था।" उसने मेज़ से हाथीदाँत का एक छोटा सा डिब्बा उठाया और बोला, "इसके अंदर स्प्रिंग वाली एक सुई है, जो डिब्बा खोलते ही तुम्हें चुभ गई।"
  - >-
    सूद ने कहा, "यह सबूत मैं अपने साथ ले जाऊँगा और तुम यहीं मरोगे।" उसने वह डिब्बा अपनी जेब में रख लिया। सावित्री की साँस रुक गई और वह बिस्तर के पीछे से बाहर निकलना चाहती थीं।
  - >-
    तभी विक्रम ने कमज़ोर आवाज़ में कहा, "सूद, यहाँ बहुत अँधेरा है, गैस लैंप थोड़ा तेज़ कर दो।" सूद ने हँसते हुए लैंप की चाबी घुमाई और रोशनी तेज़ हो गई। उसी पल दरवाज़ा भड़ाक से खुल गया।
  - >-
    इंस्पेक्टर भैरव अंदर घुस आए। निलंबित होने के बावजूद वह विक्रम के कहने पर बाहर छिपे हुए थे, और लैंप की तेज़ रोशनी उनके लिए इशारा थी। उन्होंने कहा, "कुलवंत सूद, तुम गिरफ़्तार हो!" सूद ने भागने की कोशिश की, लेकिन भैरव ने उसे दबोच लिया।
  - >-
    इसके बाद विक्रम उठकर बैठ गए और वह बिल्कुल ठीक थे। उन्होंने कहा, "अम्मा जी, क्या कुछ खाने को मिलेगा? मैं तीन दिन से भूखा हूँ।" सावित्री बिस्तर के पीछे से निकलीं और बस उन्हें घूरती रह गईं।
  - >-
    विक्रम ने समझाया, "मैंने तीन दिन का उपवास रखा, आँखों में बेलाडोना की बूँदें डालीं, होंठों पर मोम लगाया, माथे पर वैसलीन मली और गालों पर थोड़ा रंग लगाया। सीपियों और सिक्कों की बातें तो बस पागलपन का नाटक थीं।"
  - >-
    उन्होंने कहा, "मैंने तुम्हें पास इसलिए नहीं आने दिया, सावित्री, क्योंकि तुम डॉक्टर हो और एक बार नब्ज़ छूते ही सब समझ जातीं। सूद तक तुम्हारी असली घबराहट पहुँचनी ज़रूरी थी।" फिर वह धीरे से बोले, "मुझे माफ़ करना, सावित्री, क्योंकि तुम्हारे आँसू ही इस नाटक को सच बना सकते थे।"
  - >-
    सावित्री गुस्सा होना चाहती थीं, लेकिन वह एक साथ रो भी पड़ीं और हँस भी पड़ीं। विक्रम बोले, "मैंने वह डिब्बा कभी खोला ही नहीं था, क्योंकि उसकी बनावट में कुछ अजीब था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    बाद में पता चला कि हाथीदाँत का वह डिब्बा पंकज सेवा सदन अस्पताल का एक लड़का दे गया था, और उसने उसे जल्दी ठीक होने का तोहफ़ा बताया था। यह सुनकर विक्रम के चेहरे का रंग बदल गया।
  - >-
    उस रात जब सब चले गए, तब सावित्री ने देखा कि विक्रम मेज़ पर बैठे देवेंद्रनाथ वाली पर्ची को घूर रहे थे। उसकी स्याही बैंगनी थी और उसके अक्षर पीछे की ओर झुके हुए थे। बहुत देर बाद उन्होंने बस इतना कहा, "अब मुझे यक़ीन हो गया है।" विक्रम किसके बारे में सोच रहे थे? अपना जवाब कमेंट में लिखिए।
