  - {start_scene: 4, end_scene: 6, hook_text: "छह हाथी, एक राज़", title: "छह हाथी एक ही दिन बने... और उसी दिन एक कारीगर पकड़ा गया", end_question: "दोनों का कनेक्शन क्या है?"}
  - {start_scene: 14, end_scene: 15, hook_text: "आख़िरी हाथी पर हथौड़ा", title: "जासूस ने आख़िरी हाथी दस गुना दाम में ख़रीदा... और हथौड़ा उठाया", end_question: "अंदर क्या था?"}
script:
  - >-
    कलकत्ता में एक के बाद एक घरों में चोरी हो रही थी। पर चोर न पैसे ले जाता, न गहने। बस घर में रखा मिट्टी का एक सजावटी हाथी उठाता, और बाहर गली में ले जाकर उसे चकनाचूर कर देता।
  - >-
    हर बार एक ही जैसा हाथी। हर बार टुकड़े-टुकड़े। लोग हँसते थे, कोई पागल है। फिर एक रात, एक टूटे हुए हाथी के पास, एक आदमी की लाश मिली। अब कोई नहीं हँस रहा था।
  - >-
    मैं सावित्री हूँ। इंस्पेक्टर भैरव भी कलकत्ता आए हुए थे, और वो पूरी तरह आश्वस्त थे। "विक्रम बाबू, ये कोई सनकी है, जिसे हाथियों से नफ़रत है। बस।" विक्रम बोले, "सनकी आदमी इतने ध्यान से हर बार एक ही तरह का हाथी नहीं चुनता।"
  - >-
    विक्रम ने टूटे हाथी का एक टुकड़ा उठाया। उसके नीचे एक कारख़ाने की मुहर थी। हम बहूबाज़ार के मिट्टी और प्लास्टर के कारख़ानों की तंग गलियों में पहुँचे। कारख़ाने के मालिक ने बताया, उस साँचे से एक साथ सिर्फ़ छह हाथी बने थे।
  - >-
    "छह के छह अलग-अलग दुकानों पर बिके, फिर अलग-अलग घरों में गए।" विक्रम ने पूछा, "जिस दिन ये बने, उस दिन कारख़ाने में कुछ अजीब हुआ था?" मालिक ने याद किया। "हाँ। अगले ही दिन पुलिस ने हमारे एक कारीगर, भुवन, को गिरफ़्तार कर लिया था।"
  - >-
    "पुलिस उसके पीछे भागती हुई आई थी। वो दौड़ता हुआ कारख़ाने में घुसा, कुछ देर रुका, फिर पकड़ा गया। उसे एक साल की सज़ा हुई। अभी पिछले हफ़्ते ही छूटा है।" विक्रम की आँखें चमक उठीं।
  - >-
    मरा हुआ आदमी पहचाना गया... प्यारे लाल, भुवन का पुराना साथी। उसकी जेब में भुवन की एक तस्वीर थी। "दोनों मिलकर कुछ ढूँढ़ रहे थे," विक्रम बोले। "फिर किसी बात पर दोनों में झगड़ा हुआ।"
  - >-
    विक्रम ने अपनी डायरी में छह घरों की सूची बनाई। चार हाथी टूट चुके थे। "दो बाक़ी हैं, सावित्री। और भुवन उन तक पहुँचे बिना रुकेगा नहीं।"
  - >-
    एक हाथी बालीगंज की एक कोठी में था, दूसरा एक बूढ़ी विधवा के घर। विक्रम ने कहा, "भुवन अगली रात बालीगंज जाएगा। और हम वहाँ पहले से होंगे।"
  - >-
    रुकिए। छह हाथी, जो एक ही दिन बने। उसी दिन, पुलिस से भागता एक कारीगर कारख़ाने में घुसा। और अब, जेल से छूटते ही, वो उन्हीं हाथियों को तोड़ रहा है। आप बताइए, वो क्या ढूँढ़ रहा है?
  - >-
    रात। बालीगंज की कोठी का अँधेरा बगीचा। मैं, विक्रम और भैरव झाड़ियों में छिपे थे। आधी रात के बाद, एक फुर्तीली परछाईं दीवार फाँदकर आई, खिड़की खोली, और कुछ ही पलों में एक हाथी लेकर बाहर निकली।
  - >-
    उसने हाथी को बगीचे के पत्थर पर पटका। टुकड़े बिखर गए। वो घुटनों पर बैठकर उन्हें टटोलने लगा। तभी भैरव उस पर कूद पड़े। "पकड़ लिया!" भुवन ने बहुत हाथ-पैर मारे, पर हथकड़ी लग चुकी थी।
  - >-
    टूटे हाथी में कुछ नहीं था। भुवन गुस्से से दाँत पीस रहा था। भैरव बोले, "मामला ख़त्म, विक्रम बाबू। सनकी पकड़ा गया।" विक्रम मुस्कराए। "नहीं, इंस्पेक्टर साहब। मामला कल ख़त्म होगा।"
  - >-
    अगली सुबह विक्रम उस बूढ़ी विधवा के घर गए, और आख़िरी हाथी को उसकी असली क़ीमत से दस गुना ज़्यादा में ख़रीद लिया। विधवा ख़ुशी से रो पड़ी। विक्रम हाथी को कपड़े में लपेटकर घर ले आए।
  - >-
    शाम को उन्होंने हम सबको अपने कमरे में बुलाया। भैरव, मैं, और कारख़ाने का मालिक। मेज़ पर सफ़ेद कपड़ा बिछाया, और हाथी उस पर रखा। फिर उन्होंने एक हथौड़ा उठाया।
  - >-
    एक वार। मिट्टी का हाथी टुकड़े-टुकड़े हो गया। और उन टुकड़ों के बीच, लालटेन की रोशनी में, कुछ चमक उठा। एक बड़ा, गोल, काला मोती।
  - >-
    "रतनपुर की रानी का मशहूर काला मोती," विक्रम बोले। "जो एक साल पहले चोरी हुआ था।" भैरव कुर्सी से गिरते-गिरते बचे।
  - >-
    "भुवन रानी की एक नौकरानी, लक्ष्मी, से प्यार करता था। उसी की मदद से उसने मोती चुराया। पुलिस पीछे पड़ी, तो वो कारख़ाने में घुसा। वहाँ गीली मिट्टी के छह हाथी सूख रहे थे। उसने मोती एक हाथी के अंदर दबा दिया।"
  - >-
    "फिर वो पकड़ा गया, और एक साल जेल में रहा। छूटते ही उसने उन छह हाथियों को ढूँढ़ना शुरू किया। प्यारे लाल ने उसे धोखा देकर मोती ख़ुद हड़पना चाहा, और भुवन ने उसे मार डाला।"
  - >-
    "कारख़ाने की मुहर, एक गिरफ़्तारी की तारीख़, और छह की गिनती..." विक्रम ने कहा, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर भुवन की जेब से एक और चीज़ मिली थी। एक कार्ड। उस पर काले कमल का निशान था, और लिखा था... "हम मोती का इंतज़ार कर रहे हैं।" भुवन के पास पहले से एक ख़रीदार था।
  - >-
    मैंने कार्ड उठाया, और नाक के पास ले गई। केवड़ा। फिर से। "हर बार केवड़ा, विक्रम... ये इत्तफ़ाक़ नहीं हो सकता।" विक्रम ने मेरी तरफ़ देखा। "मुझे पता है, सावित्री। मुझे पता है।" आपको क्या लगता है, ये ख़ुशबू किसकी है? कमेंट करें।
