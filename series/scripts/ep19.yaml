  - {start_scene: 4, end_scene: 6, hook_text: "छह हाथी, एक राज़", title: "छह हाथी एक ही दिन बने... और उसी दिन एक कारीगर पकड़ा गया", end_question: "दोनों का कनेक्शन क्या है?"}
  - {start_scene: 14, end_scene: 15, hook_text: "आख़िरी हाथी पर हथौड़ा", title: "जासूस ने आख़िरी हाथी दस गुना दाम में ख़रीदा... और हथौड़ा उठाया", end_question: "अंदर क्या था?"}
script:
  - >-
    कलकत्ता में एक के बाद एक कई घरों में चोरी हो रही थी, लेकिन चोर न पैसे ले जाता था और न गहने। वह बस घर में रखा मिट्टी का एक सजावटी हाथी उठाता था और उसे बाहर गली में ले जाकर चकनाचूर कर देता था।
  - >-
    हर बार एक ही जैसा हाथी चुराया जाता था और हर बार उसके टुकड़े-टुकड़े कर दिए जाते थे। लोग हँसते थे कि यह किसी पागल का काम है। फिर एक रात एक टूटे हुए हाथी के पास एक आदमी की लाश मिली, और उसके बाद किसी को हँसी नहीं आई।
  - >-
    जासूस विक्रम और डॉक्टर सावित्री उन दिनों कलकत्ता में थे। इंस्पेक्टर भैरव भी वहाँ आए हुए थे और वह पूरी तरह आश्वस्त थे। उन्होंने कहा, "विक्रम बाबू, यह कोई सनकी है, जिसे हाथियों से नफ़रत है।" विक्रम बोले, "कोई सनकी आदमी इतने ध्यान से हर बार एक ही तरह का हाथी नहीं चुनता।"
  - >-
    विक्रम ने टूटे हुए हाथी का एक टुकड़ा उठाया, जिसके नीचे एक कारख़ाने की मुहर लगी थी। वे दोनों बहूबाज़ार में मिट्टी और प्लास्टर के कारख़ानों की तंग गलियों में पहुँचे। कारख़ाने के मालिक ने बताया कि उस साँचे से एक साथ सिर्फ़ छह हाथी बने थे।
  - >-
    मालिक ने कहा, "वे छहों हाथी अलग-अलग दुकानों पर बिके और फिर अलग-अलग घरों में गए।" विक्रम ने पूछा, "जिस दिन ये हाथी बने, क्या उस दिन कारख़ाने में कुछ अजीब हुआ था?" मालिक ने याद करके बताया, "हाँ, अगले ही दिन पुलिस ने हमारे एक कारीगर भुवन को गिरफ़्तार कर लिया था।"
  - >-
    उसने आगे बताया, "पुलिस उसके पीछे भागती हुई आई थी। वह दौड़ता हुआ कारख़ाने में घुसा, कुछ देर रुका और फिर पकड़ा गया। उसे एक साल की सज़ा हुई थी और वह अभी पिछले हफ़्ते ही छूटा है।" यह सुनकर विक्रम की आँखें चमक उठीं।
  - >-
    मरे हुए आदमी की पहचान भुवन के पुराने साथी प्यारे लाल के रूप में हुई। उसकी जेब में भुवन की एक तस्वीर मिली थी। विक्रम बोले, "दोनों मिलकर कुछ ढूँढ़ रहे थे और फिर किसी बात पर दोनों में झगड़ा हो गया।"
  - >-
    विक्रम ने अपनी डायरी में उन छह घरों की सूची बनाई, जिनमें से चार हाथी टूट चुके थे। उन्होंने कहा, "अभी दो हाथी बाक़ी हैं, सावित्री, और भुवन उन तक पहुँचे बिना नहीं रुकेगा।"
  - >-
    एक हाथी बालीगंज की एक कोठी में था और दूसरा एक बूढ़ी विधवा के घर में था। विक्रम ने कहा, "भुवन अगली रात बालीगंज जाएगा और हम वहाँ पहले से मौजूद होंगे।"
  - >-
    यहाँ एक पल रुककर सोचिए। छह हाथी एक ही दिन बने थे और उसी दिन पुलिस से भागता हुआ एक कारीगर कारख़ाने में घुसा था। अब जेल से छूटते ही वह उन्हीं हाथियों को तोड़ रहा है। आप बताइए कि वह क्या ढूँढ़ रहा है?
  - >-
    उस रात सावित्री, विक्रम और भैरव बालीगंज की कोठी के अँधेरे बगीचे की झाड़ियों में छिपे थे। आधी रात के बाद एक फुर्तीली परछाईं दीवार फाँदकर आई और उसने खिड़की खोली। कुछ ही पलों में वह एक हाथी लेकर बाहर निकल आई।
  - >-
    उस आदमी ने हाथी को बगीचे के पत्थर पर पटक दिया और टुकड़े बिखर गए। वह घुटनों पर बैठकर उन टुकड़ों को टटोलने लगा। तभी भैरव उस पर कूद पड़े और चिल्लाए, "मैंने इसे पकड़ लिया!" भुवन ने बहुत हाथ-पैर मारे, लेकिन तब तक उसे हथकड़ी लग चुकी थी।
  - >-
    उस टूटे हुए हाथी में कुछ नहीं था और भुवन गुस्से से दाँत पीस रहा था। भैरव बोले, "मामला ख़त्म हो गया, विक्रम बाबू, सनकी पकड़ा गया।" विक्रम मुस्कराकर बोले, "नहीं, इंस्पेक्टर साहब, यह मामला कल ख़त्म होगा।"
  - >-
    अगली सुबह विक्रम उस बूढ़ी विधवा के घर गए और उन्होंने आख़िरी हाथी को उसकी असली क़ीमत से दस गुना ज़्यादा में ख़रीद लिया। विधवा ख़ुशी से रो पड़ी। विक्रम हाथी को कपड़े में लपेटकर घर ले आए।
  - >-
    शाम को उन्होंने सावित्री, भैरव और कारख़ाने के मालिक को अपने कमरे में बुलाया। उन्होंने मेज़ पर एक सफ़ेद कपड़ा बिछाया और हाथी को उस पर रख दिया। फिर उन्होंने एक हथौड़ा उठाया।
  - >-
    हथौड़े के एक ही वार से मिट्टी का हाथी टुकड़े-टुकड़े हो गया। उन टुकड़ों के बीच लालटेन की रोशनी में कुछ चमक उठा। वह एक बड़ा, गोल और काला मोती था।
  - >-
    विक्रम बोले, "यह रतनपुर की रानी का मशहूर काला मोती है, जो एक साल पहले चोरी हुआ था।" यह सुनकर भैरव कुर्सी से गिरते-गिरते बचे।
  - >-
    विक्रम ने समझाया, "भुवन रानी की एक नौकरानी लक्ष्मी से प्यार करता था और उसी की मदद से उसने मोती चुराया। जब पुलिस पीछे पड़ी, तो वह कारख़ाने में घुस गया। वहाँ गीली मिट्टी के छह हाथी सूख रहे थे और उसने मोती एक हाथी के अंदर दबा दिया।"
  - >-
    उन्होंने कहा, "फिर वह पकड़ा गया और एक साल जेल में रहा। छूटते ही उसने उन छह हाथियों को ढूँढ़ना शुरू कर दिया। प्यारे लाल ने उसे धोखा देकर मोती ख़ुद हड़पना चाहा, इसलिए भुवन ने उसे मार डाला।"
  - >-
    विक्रम ने कहा, "यह मामला कारख़ाने की मुहर, एक गिरफ़्तारी की तारीख़ और छह की गिनती से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन भुवन की जेब से एक और चीज़ मिली थी। वह एक कार्ड था, जिस पर काले कमल का निशान था और लिखा था, "हम मोती का इंतज़ार कर रहे हैं।" इसका मतलब था कि भुवन के पास पहले से एक ख़रीदार था।
  - >-
    सावित्री ने वह कार्ड उठाकर सूँघा, तो उसमें से फिर केवड़े की ख़ुशबू आई। उन्होंने कहा, "हर बार केवड़ा ही मिलता है, विक्रम, और यह इत्तफ़ाक़ नहीं हो सकता।" विक्रम ने उनकी तरफ़ देखकर कहा, "मुझे पता है, सावित्री।" आपको क्या लगता है कि यह ख़ुशबू किसकी है? अपना जवाब कमेंट में लिखिए।
