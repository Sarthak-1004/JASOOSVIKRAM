# EP 5 - पाँच काली पंखुड़ियाँ (The Five Orange Pips)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पाँच काली पंखुड़ियाँ = मौत", title: "लिफ़ाफ़े से गिरीं पाँच काली पंखुड़ियाँ... तीन दिन बाद मौत", end_question: "अगली बारी किसकी?"}
  - {start_scene: 4, end_scene: 6, hook_text: "तीन लिफ़ाफ़े, तीन मौतें", title: "चाचा, फिर पिता... और अब उसे भी वही लिफ़ाफ़ा मिला", end_question: "क्या ये श्राप है?"}
  - {start_scene: 10, end_scene: 12, hook_text: "तूफ़ान में अकेला", title: "वो तूफ़ानी रात में अकेला घर की ओर निकला...", end_question: "क्या विक्रम उसे बचा पाएंगे?"}
script:
  - >-
    मेज़ पर एक लिफ़ाफ़ा खुला और उसमें से पाँच सूखी, काली पंखुड़ियाँ गिर पड़ीं। अंदर रखी पर्ची पर बस इतना लिखा था कि कागज़ लौटा दो। तीन दिन बाद उस लिफ़ाफ़े को खोलने वाला आदमी अपने बगीचे के तालाब में मरा हुआ मिला, जिसमें बस घुटनों तक पानी था।
  - >-
    सवाल यह था कि घुटनों भर पानी में कोई कैसे डूब सकता है? लोग कहने लगे कि यह एक श्राप है और काली पंखुड़ियाँ मौत की चिट्ठी हैं। उनका मानना था कि जिसे भी ये पंखुड़ियाँ मिलती हैं, वह ज़िंदा नहीं बचता।
  - >-
    उस साल बनारस में ऐसी बारिश हुई थी, जैसी बरसों में नहीं हुई थी, और सारे घाट डूब चुके थे। एक तूफ़ानी रात जासूस विक्रम और डॉक्टर सावित्री के सामने दरवाज़े पर एक भीगा हुआ, काँपता हुआ लड़का खड़ा था। वह उन्नीस साल का अर्जुन मल्होत्रा था।
  - >-
    अर्जुन ने बताया कि उसके चाचा ईश्वर रंगून से बहुत दौलत लेकर लौटे थे, लेकिन वह हमेशा डरे-डरे रहते थे। एक दिन उन्हें पाँच काली पंखुड़ियों वाला लिफ़ाफ़ा मिला और उन्होंने अपने संदूक के सारे कागज़ जला दिए। तीन दिन बाद वह उसी तालाब में मरे हुए मिले।
  - >-
    दो साल बाद अर्जुन के पिता मदन को भी वैसा ही लिफ़ाफ़ा मिला, जिसमें वही पाँच पंखुड़ियाँ और वही पर्ची थी। एक हफ़्ते बाद वह पत्थर की एक खदान में गिरकर मर गए। सबने यही कहा कि वह एक हादसा था।
  - >-
    अर्जुन ने काँपते हाथ से अपनी जेब से एक लिफ़ाफ़ा निकाला और कहा, "कल यह मुझे मिला है।" मेज़ पर पाँच काली पंखुड़ियाँ बिखर गईं। कमरे में अचानक ऐसी ठंड महसूस हुई, जैसे कोई खिड़की खुल गई हो।
  - >-
    विक्रम ने पूछा, "जो कागज़ जलाए गए थे, क्या उनमें से कुछ बचा है?" अर्जुन ने एक अधजला पन्ना आगे बढ़ा दिया। उस पर तारीख़ें और नाम लिखे थे, और हर नाम के आगे लिखा था कि पंखुड़ियाँ भेजी गईं और वह आदमी चला गया।
  - >-
    विक्रम ने वह पन्ना रोशनी में देखा और कहा, "तुम्हारे चाचा किसी बहुत बड़े गिरोह के लिए काम करते थे, अर्जुन, जो रंगून से तस्करी करता था। फिर वह उस गिरोह का हिसाब-किताब लेकर भाग आए। अब वह गिरोह अपने कागज़ वापस चाहता है।"
  - >-
    विक्रम ने धीरे से कहा, "यह कोई श्राप नहीं है, यह एक संगठन है और इसका निशान काला कमल है।" यह सुनकर सावित्री के रोंगटे खड़े हो गए। उन्हें ठाकुर की मेज़ पर मिली वह चिट्ठी याद आ गई।
  - >-
    विक्रम ने कहा, "तुम घर जाओ, अर्जुन। यह पन्ना एक चिट्ठी के साथ बगीचे की धूप-घड़ी पर रख दो, जैसा पर्ची में लिखा है, और घर से बाहर मत निकलना।" फिर उन्होंने इंस्पेक्टर भैरव को संदेश भेजा कि वह अर्जुन के घर पर पहरा बिठा दें।
  - >-
    यहाँ एक पल रुककर सोचिए। तीन लिफ़ाफ़े आए थे और तीन मौतें हुई थीं। हर मौत तालाब या खदान जैसी ऐसी जगह पर हुई थी, जहाँ उसे आसानी से हादसा कहा जा सके। आपको क्या लगता है कि आज रात अर्जुन के लिए सबसे ख़तरनाक जगह कौन सी होगी?
  - >-
    अर्जुन बारिश में ही निकल गया। कुछ देर बाद भैरव का जवाब आया, "मैं सुबह तक पहुँचूँगा, विक्रम बाबू, क्योंकि आज रात थाने में बहुत काम है।" विक्रम ने खिड़की से बाहर देखा, जहाँ बारिश और तेज़ हो गई थी।
  - >-
    उस रात न विक्रम सोए और न ही सावित्री सो पाईं। सुबह के धुंधलके में दरवाज़े पर अख़बार आकर गिरा। विक्रम ने उसे उठाकर पढ़ा और उनका चेहरा सफ़ेद पड़ गया।
  - >-
    अख़बार में छपा था कि दशाश्वमेध घाट पर एक दुखद हादसा हुआ है और उन्नीस साल का अर्जुन मल्होत्रा रात में फिसलकर बाढ़ में बह गया। वह घाट तो अर्जुन के घर के रास्ते में भी नहीं पड़ता था। साफ़ था कि उसे वहाँ ले जाया गया था।
  - >-
    सावित्री ने विक्रम को पहली बार इस हाल में देखा था। वह धीरे से कुर्सी पर बैठ गए और बोले, "वह मेरे पास मदद माँगने आया था, सावित्री, और मैंने उसे अकेले तूफ़ान में भेज दिया। यह मेरी हार है।"
  - >-
    फिर वह उठ खड़े हुए और उनकी आँखों में एक ऐसी ठंडी आग थी, जो सावित्री ने पहले कभी नहीं देखी थी। उन्होंने कहा, "अब यह मेरा अपना मामला है।"
  - >-
    पूरा दिन विक्रम पुराने अख़बारों और जहाज़ों के रजिस्टरों में डूबे रहे। तीनों लिफ़ाफ़ों पर कलकत्ता, रंगून और बनारस की डाक की मुहरें लगी थीं। उन तीनों की तारीख़ें 'स्वर्णमाला' नाम के एक ही जहाज़ के आने-जाने से मिलती थीं।
  - >-
    विक्रम बोले, "क़ातिल उसी जहाज़ पर सफ़र करते हैं।" उन्होंने एक लिफ़ाफ़े में पाँच काली पंखुड़ियाँ रखीं और उसे जहाज़ के कप्तान के नाम भेज दिया। उन्होंने कहा, "अब उन्हें भी पता चलना चाहिए कि डर क्या होता है।"
  - >-
    लेकिन वह लिफ़ाफ़ा कभी नहीं पहुँचा। उसी हफ़्ते बंगाल की खाड़ी में चक्रवात आया और 'स्वर्णमाला' अपने सारे लोगों समेत समुंदर में समा गया। विक्रम बोले, "डाक की मुहर और जहाज़ की तारीख़ ने रास्ता दिखाया। सच हमेशा छोटी चीज़ों में छिपा होता है, पर इस बार मैं देर से पहुँचा।"
  - >-
    अर्जुन का अंतिम संस्कार मणिकर्णिका घाट पर हुआ और बारिश तब भी थमी नहीं थी। वहाँ की भीड़ में राय बहादुर देवेंद्रनाथ भी मौजूद थे। वह विक्रम के पास आए और उन्होंने उनके कंधे पर हाथ रखा।
  - >-
    देवेंद्रनाथ ने कहा, "इतना बोझ अपने ऊपर मत लीजिए, विक्रम जी, आपने अपना पूरा प्रयास किया।" उनके जाने के बाद सावित्री को केवड़े की हल्की सी ख़ुशबू आई। उन्होंने सोचा कि बनारस में तो केवड़ा हर कोई लगाता है।
  - >-
    जहाज़ डूब गया, लेकिन काला कमल नहीं डूबा। विक्रम ने चिता की आग की ओर देखते हुए कहा, "यह तो अभी शुरू हुआ है, सावित्री।" क्या विक्रम अर्जुन को बचा सकते थे? अपनी राय कमेंट में लिखिए।
