# EP 5 - पाँच काली पंखुड़ियाँ (The Five Orange Pips)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "पाँच काली पंखुड़ियाँ = मौत", title: "लिफ़ाफ़े से गिरीं पाँच काली पंखुड़ियाँ... तीन दिन बाद मौत", end_question: "अगली बारी किसकी?"}
  - {start_scene: 4, end_scene: 6, hook_text: "तीन लिफ़ाफ़े, तीन मौतें", title: "चाचा, फिर पिता... और अब उसे भी वही लिफ़ाफ़ा मिला", end_question: "क्या ये श्राप है?"}
  - {start_scene: 10, end_scene: 12, hook_text: "तूफ़ान में अकेला", title: "वो तूफ़ानी रात में अकेला घर की ओर निकला...", end_question: "क्या विक्रम उसे बचा पाएंगे?"}
script:
  - >-
    एक लिफ़ाफ़ा मेज़ पर खुला, और उसमें से पाँच सूखी, काली पंखुड़ियाँ गिर पड़ीं। अंदर एक पर्ची पर बस तीन शब्द लिखे थे... "कागज़ लौटा दो।" तीन दिन बाद, जिसने वो लिफ़ाफ़ा खोला था, वो बगीचे के घुटनों भर पानी वाले तालाब में मरा मिला।
  - >-
    घुटनों भर पानी में कोई कैसे डूब सकता है? लोग कहने लगे, ये श्राप है। काली पंखुड़ियाँ मौत की चिट्ठी हैं। और जिसे ये मिलती हैं, वो बचता नहीं।
  - >-
    मैं सावित्री हूँ। उस साल बनारस में ऐसी बारिश हुई, जैसी बरसों में नहीं हुई थी। घाट डूब चुके थे। एक तूफ़ानी रात, विक्रम के दरवाज़े पर एक भीगा हुआ, काँपता हुआ लड़का खड़ा था। उन्नीस साल का अर्जुन मल्होत्रा।
  - >-
    अर्जुन ने बताया, उसके चाचा ईश्वर रंगून से बहुत दौलत लेकर लौटे थे, पर हमेशा डरे-डरे रहते थे। एक दिन उन्हें पाँच काली पंखुड़ियों वाला लिफ़ाफ़ा मिला। उन्होंने संदूक के सारे कागज़ जला दिए। तीन दिन बाद... तालाब।
  - >-
    दो साल बाद, अर्जुन के पिता मदन को वही लिफ़ाफ़ा मिला। वही पाँच पंखुड़ियाँ। वही पर्ची। एक हफ़्ते बाद वो पत्थर की खदान में गिरकर मर गए। सबने कहा, हादसा था।
  - >-
    अर्जुन ने काँपते हाथ से जेब से कुछ निकाला। "और कल... ये मुझे मिला।" एक लिफ़ाफ़ा। मेज़ पर पाँच काली पंखुड़ियाँ बिखर गईं। कमरे में अचानक ऐसी ठंड लगी, जैसे कोई खिड़की खुल गई हो।
  - >-
    विक्रम ने पूछा, "जो कागज़ जलाए गए, उनमें से कुछ बचा?" अर्जुन ने एक अधजला पन्ना आगे बढ़ाया। उस पर तारीख़ें थीं, नाम थे, और हर नाम के आगे एक निशान... 'पंखुड़ियाँ भेजीं।' 'चले गए।'
  - >-
    विक्रम ने पन्ना रोशनी में देखा। "तुम्हारे चाचा किसी बहुत बड़े गिरोह के लिए काम करते थे, अर्जुन। रंगून से तस्करी। फिर वो उनका हिसाब-किताब लेकर भाग आए। ये गिरोह अपने कागज़ वापस चाहता है।"
  - >-
    "ये कोई श्राप नहीं है," विक्रम ने धीरे से कहा। "ये एक संगठन है। और इसका निशान है... काला कमल।" मेरे रोंगटे खड़े हो गए। ठाकुर की मेज़ पर मिली वो चिट्ठी मुझे याद आ गई।
  - >-
    "घर जाओ, अर्जुन। ये पन्ना एक चिट्ठी के साथ बगीचे की धूप-घड़ी पर रख दो, जैसा पर्ची में लिखा है। और घर से बाहर मत निकलना।" विक्रम ने इंस्पेक्टर भैरव को संदेश भेजा कि अर्जुन के घर पहरा बिठाएँ।
  - >-
    रुकिए। तीन लिफ़ाफ़े। तीन मौतें। और हर मौत ऐसी जगह, जहाँ उसे आसानी से हादसा कहा जा सके... तालाब, खदान। सोचिए, आज रात अर्जुन के लिए सबसे ख़तरनाक जगह कौन सी होगी?
  - >-
    अर्जुन बारिश में निकल गया। कुछ देर बाद भैरव का जवाब आया... "सुबह तक पहुँचूँगा, विक्रम बाबू। आज रात थाने में बहुत काम है।" विक्रम ने खिड़की से बाहर देखा। बारिश और तेज़ हो गई थी।
  - >-
    उस रात विक्रम सोए नहीं। मैं भी नहीं। सुबह के धुंधलके में दरवाज़े पर अख़बार गिरा। विक्रम ने उसे उठाया... और उनका चेहरा सफ़ेद पड़ गया।
  - >-
    'दशाश्वमेध घाट पर दुखद हादसा। उन्नीस वर्षीय अर्जुन मल्होत्रा रात में फिसलकर बाढ़ में बह गए।' घाट तो अर्जुन के घर के रास्ते में भी नहीं था। उसे वहाँ ले जाया गया था।
  - >-
    मैंने विक्रम को पहली बार इस तरह देखा। वो धीरे से कुर्सी पर बैठ गए। "वो मेरे पास मदद माँगने आया था, सावित्री... और मैंने उसे अकेले तूफ़ान में भेज दिया। ये मेरी हार है।"
  - >-
    फिर वो उठे, और उनकी आँखों में एक ऐसी ठंडी आग थी, जो मैंने पहले कभी नहीं देखी थी। "अब ये मेरा अपना मामला है।"
  - >-
    पूरा दिन वो पुराने अख़बारों और जहाज़ों के रजिस्टरों में डूबे रहे। तीनों लिफ़ाफ़ों पर डाक की मुहरें थीं... कलकत्ता, रंगून, और बनारस। और तीनों की तारीख़ें एक ही जहाज़ के आने-जाने से मिलती थीं... 'स्वर्णमाला।'
  - >-
    "क़ातिल उसी जहाज़ पर सफ़र करते हैं," विक्रम बोले। उन्होंने एक लिफ़ाफ़ा लिया, उसमें पाँच काली पंखुड़ियाँ रखीं, और जहाज़ के कप्तान के नाम भेज दिया। "अब उन्हें भी पता चले, डर क्या होता है।"
  - >-
    पर वो लिफ़ाफ़ा कभी नहीं पहुँचा। उसी हफ़्ते बंगाल की खाड़ी में चक्रवात आया, और 'स्वर्णमाला' अपने सारे लोगों समेत समुंदर में समा गया। विक्रम बोले, "डाक की मुहर, जहाज़ की तारीख़... सच हमेशा छोटी चीज़ों में छिपा होता है। पर इस बार मैं देर से पहुँचा।"
  - >-
    अर्जुन का अंतिम संस्कार मणिकर्णिका घाट पर हुआ। बारिश अब भी थमी नहीं थी। भीड़ में राय बहादुर देवेंद्रनाथ भी थे। वो विक्रम के पास आए, और उनके कंधे पर हाथ रखा।
  - >-
    "इतना बोझ अपने ऊपर मत लीजिए, विक्रम जी। आपने अपना पूरा प्रयास किया।" उनके जाने के बाद मुझे केवड़े की हल्की सी ख़ुशबू आई। मैंने सोचा, बनारस में केवड़ा कौन नहीं लगाता।
  - >-
    जहाज़ डूब गया, पर काला कमल नहीं डूबा। विक्रम ने चिता की आग की ओर देखते हुए कहा, "ये तो अभी शुरू हुआ है, सावित्री।" क्या विक्रम अर्जुन को बचा सकते थे? अपनी राय कमेंट में लिखिए।
