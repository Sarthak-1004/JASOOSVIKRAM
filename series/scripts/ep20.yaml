script:
  - >-
    शहर का सबसे ख़तरनाक आदमी कोई गुंडा नहीं था। उसके हाथ में न चाकू था, न पिस्तौल। वो एक मुस्कुराता हुआ, मोटा सेठ था, जिसकी तिजोरी में पूरे कलकत्ता के राज़ बंद थे। सेठ मोहनलाल कपूर।
  - >-
    वो पुराने ख़त ख़रीदता था। प्रेम-पत्र, पुरानी ग़लतियाँ, शर्मनाक राज़। फिर उन लोगों से सौदा करता। पैसा दो, या बर्बाद हो जाओ। कितने घर उजड़ गए। पर क़ानून उसका कुछ नहीं बिगाड़ सकता था।
  - >-
    मैं सावित्री हूँ। उस सर्दी में राजकुमारी उमा विक्रम के पास आईं। अगले महीने उनकी शादी थी। और कपूर के पास उनके कुछ पुराने, मासूम ख़त थे, जो उन्होंने बरसों पहले किसी को लिखे थे।
  - >-
    "ख़तों में कुछ ग़लत नहीं है, विक्रम बाबू। पर अगर वो मेरे होने वाले पति के परिवार तक पहुँचे, तो शादी टूट जाएगी।" कपूर ने इतनी बड़ी रक़म माँगी थी, जो राजकुमारी के पास थी ही नहीं।
  - >-
    उसी शाम कपूर ख़ुद विक्रम से मिलने आया। रेशमी कुर्ता, मुस्कुराता हुआ गोल चेहरा, और बेहद नरम आवाज़। "विक्रम जी, मैं तो बस एक व्यापारी हूँ। माल है, दाम है।" उसकी मुस्कान से मेरी रीढ़ में ठंड दौड़ गई।
  - >-
    विक्रम ने कम रक़म की पेशकश की। कपूर हँसा। "एक पैसा कम नहीं। और हाँ, ख़त मेरी जेब में नहीं हैं, अगर आप सोच रहे हों।" वो उठा, झुककर सलाम किया, और चला गया। विक्रम बोले, "इस आदमी से बात नहीं, सीधे उसकी तिजोरी से मिलना होगा।"
  - >-
    अगले हफ़्ते विक्रम ग़ायब रहे। जब लौटे, तो हँसते हुए बताया, "मैं गैस-लैंप ठीक करने वाला रामू बनकर कपूर की कोठी में काम कर रहा था। और... मेरी कपूर की नौकरानी से सगाई हो गई है।" मेरी चाय गले में अटक गई।
  - >-
    "विक्रम! ये धोखा है!" "हाँ, सावित्री। पर उसकी कोठी का नक़्शा मुझे उसी से मिला। और फ़िक्र मत करो, उसका एक पुराना प्रेमी है, जो मुझसे कहीं बेहतर है।" मुझे ये बिल्कुल पसंद नहीं आया। पर मैंने कुछ नहीं कहा।
  - >-
    उस रात, नक़ाब पहने, हम अलीपुर की उस आलीशान कोठी में घुसे। बर्फ़ीली हवा, काँच की खिड़की, और विक्रम के औज़ार। मेरा दिल इतनी ज़ोर से धड़क रहा था कि डर था, कोई सुन लेगा।
  - >-
    कपूर का कमरा। एक बड़ी हरी तिजोरी। विक्रम ने बीस मिनट में उसे खोल लिया। अंदर ख़तों के बंडल, हर बंडल पर किसी का नाम। तभी... बाहर से क़दमों की आवाज़। हम मख़मली पर्दों के पीछे छिप गए।
  - >-
    रुकिए। हम दो नक़ाबपोश, एक खुली तिजोरी, और सामने ख़ुद कपूर। क़ानून तोड़कर किसी बेगुनाह की इज़्ज़त बचाना... क्या विक्रम ने सही किया? आप होते, तो क्या करते? कमेंट में लिखिए।
  - >-
    कपूर अंदर आया, और कुर्सी पर बैठकर सिगार जलाया। वो किसी का इंतज़ार कर रहा था। पर्दे की झिरी से हम सब देख रहे थे। फिर दरवाज़ा धीरे से खुला। एक औरत अंदर आई, घूँघट में।
  - >-
    कपूर मुस्कराया। "आप आ गईं? अपनी मालकिन के ख़त ख़रीदने?" औरत ने घूँघट उठाया। कपूर का चेहरा सफ़ेद पड़ गया। "तुम... तुम?"
  - >-
    "हाँ, मैं। तुमने मेरे पति के ख़त छापे थे। वो शर्म से मर गए। मैं हर रोज़ उनकी तस्वीर के आगे मरी हूँ।" उसके हाथ में कुछ चमका। "अब तुम्हारी बारी है।"
  - >-
    कमरे में तेज़ चमक हुई। एक के बाद एक। मैंने आँखें बंद कर लीं। जब खोलीं, कपूर कुर्सी से फ़र्श पर लुढ़क चुका था। वो औरत बिना पीछे देखे चली गई।
  - >-
    विक्रम पर्दे से निकले। उन्होंने कपूर की ओर नहीं देखा। सीधे तिजोरी तक गए, ख़तों के सारे बंडल उठाए, और जलती अँगीठी में झोंक दिए। एक-एक करके। सैकड़ों लोगों के राज़ राख हो गए।
  - >-
    तभी पूरी कोठी जाग उठी। नौकर दौड़ते हुए आए। हम खिड़की से कूदे, बगीचे में भागे, दीवार फाँदी। एक चौकीदार ने मेरा टख़ना पकड़ लिया। मैंने झटका दिया, और हम अँधेरे में ग़ायब हो गए।
  - >-
    अगली सुबह, इंस्पेक्टर भैरव विक्रम के कमरे में आए। "विक्रम बाबू, कल रात कपूर का क़त्ल हुआ। दो नक़ाबपोश चोर भी देखे गए। एक का क़द बिल्कुल आपके जितना था। आप इस मामले में मेरी मदद करेंगे?"
  - >-
    विक्रम ने बिल्कुल गंभीर चेहरे से कहा, "माफ़ कीजिए, इंस्पेक्टर साहब। इस बार मेरी हमदर्दी अपराधियों के साथ है।" भैरव कुछ समझे बिना चले गए। मैंने अपनी हँसी बड़ी मुश्किल से रोकी।
  - >-
    "एक मुस्कान, एक तिजोरी, और एक घूँघट," विक्रम ने कहा। "कभी-कभी क़ानून से बड़ा न्याय होता है। सच हमेशा छोटी चीज़ों में छिपा होता है।" राजकुमारी उमा की शादी धूमधाम से हुई।
  - >-
    पर एक बंडल नहीं जला था। विक्रम ने उसे जेब में रख लिया था। घर आकर उन्होंने उसे खोला। बैंगनी स्याही। काले कमल की मुहर। और कपूर के नाम एक आदेश... "विक्रम पर नज़र रखो।"
  - >-
    कपूर काले कमल का जासूस था। विक्रम ने लिखावट को देर तक देखा। "देखो, सावित्री। सारे अक्षर पीछे की ओर झुके हैं। ये किसी बाएँ हाथ से लिखने वाले की लिखावट है।" क्या आपको याद है, इस कहानी में अब तक किसने बाएँ हाथ से कुछ लिखा था? कमेंट करें।
