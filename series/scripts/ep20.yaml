script:
  - >-
    शहर का सबसे ख़तरनाक आदमी कोई गुंडा नहीं था और उसके हाथ में न चाकू था, न पिस्तौल। वह एक मुस्कुराता हुआ मोटा सेठ था, जिसकी तिजोरी में पूरे कलकत्ता के राज़ बंद थे। उसका नाम सेठ मोहनलाल कपूर था।
  - >-
    वह पुराने प्रेम-पत्र, पुरानी ग़लतियाँ और शर्मनाक राज़ों वाले ख़त ख़रीदता था। फिर वह उन लोगों से सौदा करता था कि या तो पैसा दो या बर्बाद हो जाओ। उसकी वजह से कितने ही घर उजड़ गए थे, लेकिन क़ानून उसका कुछ नहीं बिगाड़ सकता था।
  - >-
    उस सर्दी में राजकुमारी उमा जासूस विक्रम और डॉक्टर सावित्री के पास आईं। अगले महीने उनकी शादी थी। कपूर के पास उनके कुछ पुराने और मासूम ख़त थे, जो उन्होंने बरसों पहले किसी को लिखे थे।
  - >-
    राजकुमारी ने कहा, "उन ख़तों में कुछ ग़लत नहीं है, विक्रम बाबू, लेकिन अगर वे मेरे होने वाले पति के परिवार तक पहुँचे, तो मेरी शादी टूट जाएगी।" कपूर ने इतनी बड़ी रक़म माँगी थी, जो राजकुमारी के पास थी ही नहीं।
  - >-
    उसी शाम कपूर ख़ुद विक्रम से मिलने आया। उसने रेशमी कुर्ता पहना था, उसका गोल चेहरा मुस्कुरा रहा था और उसकी आवाज़ बेहद नरम थी। उसने कहा, "विक्रम जी, मैं तो बस एक व्यापारी हूँ, जिसके पास माल है और उसका दाम है।" उसकी मुस्कान देखकर सावित्री की रीढ़ में ठंड दौड़ गई।
  - >-
    विक्रम ने कम रक़म की पेशकश की, तो कपूर हँसकर बोला, "मैं एक पैसा कम नहीं लूँगा। और अगर आप सोच रहे हों, तो वे ख़त मेरी जेब में नहीं हैं।" वह उठा, झुककर सलाम किया और चला गया। विक्रम बोले, "इस आदमी से बात करने का फ़ायदा नहीं है, हमें सीधे उसकी तिजोरी तक जाना होगा।"
  - >-
    अगले पूरे हफ़्ते विक्रम ग़ायब रहे। जब वह लौटे, तो उन्होंने हँसते हुए बताया, "मैं गैस-लैंप ठीक करने वाला रामू बनकर कपूर की कोठी में काम कर रहा था, और मेरी कपूर की नौकरानी से सगाई हो गई है।" यह सुनकर सावित्री की चाय गले में अटक गई।
  - >-
    सावित्री ने कहा, "विक्रम, यह तो धोखा है!" विक्रम बोले, "हाँ, सावित्री, लेकिन उसकी कोठी का नक़्शा मुझे उसी से मिला है। तुम फ़िक्र मत करो, उसका एक पुराना प्रेमी है, जो मुझसे कहीं बेहतर है।" सावित्री को यह बात बिल्कुल पसंद नहीं आई, लेकिन उन्होंने कुछ नहीं कहा।
  - >-
    उस रात वे दोनों नक़ाब पहनकर अलीपुर की उस आलीशान कोठी में घुसे। बाहर बर्फ़ीली हवा चल रही थी और विक्रम अपने औज़ारों से काँच की खिड़की खोल रहे थे। सावित्री का दिल इतनी ज़ोर से धड़क रहा था कि उन्हें डर था कि कोई उसे सुन लेगा।
  - >-
    कपूर के कमरे में एक बड़ी हरी तिजोरी थी, जिसे विक्रम ने बीस मिनट में खोल लिया। अंदर ख़तों के बंडल रखे थे और हर बंडल पर किसी का नाम लिखा था। तभी बाहर से क़दमों की आवाज़ आई और वे दोनों मख़मली पर्दों के पीछे छिप गए।
  - >-
    यहाँ एक पल रुककर सोचिए। कमरे में दो नक़ाबपोश थे, तिजोरी खुली पड़ी थी और सामने ख़ुद कपूर आ रहा था। क्या क़ानून तोड़कर किसी बेगुनाह की इज़्ज़त बचाना सही था? अगर आप विक्रम की जगह होते, तो क्या करते? अपना जवाब कमेंट में लिखिए।
  - >-
    कपूर अंदर आया और कुर्सी पर बैठकर उसने सिगार जलाया। वह किसी का इंतज़ार कर रहा था और पर्दे की झिरी से वे दोनों सब कुछ देख रहे थे। फिर दरवाज़ा धीरे से खुला और घूँघट में एक औरत अंदर आई।
  - >-
    कपूर मुस्कराकर बोला, "क्या आप अपनी मालकिन के ख़त ख़रीदने आई हैं?" उस औरत ने अपना घूँघट उठाया, तो कपूर का चेहरा सफ़ेद पड़ गया। उसके मुँह से बस इतना निकला, "तुम यहाँ कैसे आईं?"
  - >-
    औरत ने कहा, "तुमने मेरे पति के ख़त छापे थे और वह शर्म से मर गए। मैं हर रोज़ उनकी तस्वीर के आगे मरती रही हूँ।" उसके हाथ में कुछ चमका और वह बोली, "अब तुम्हारी बारी है।"
  - >-
    कमरे में एक के बाद एक कई तेज़ चमकें हुईं और सावित्री ने अपनी आँखें बंद कर लीं। जब उन्होंने आँखें खोलीं, तब कपूर कुर्सी से फ़र्श पर लुढ़क चुका था। वह औरत बिना पीछे देखे वहाँ से चली गई।
  - >-
    विक्रम पर्दे के पीछे से निकले, लेकिन उन्होंने कपूर की ओर नहीं देखा। वह सीधे तिजोरी तक गए और ख़तों के सारे बंडल उठाकर एक-एक करके जलती हुई अँगीठी में झोंक दिए। सैकड़ों लोगों के राज़ वहीं राख हो गए।
  - >-
    तभी पूरी कोठी जाग उठी और नौकर दौड़ते हुए आने लगे। विक्रम और सावित्री खिड़की से कूदे, बगीचे में भागे और उन्होंने दीवार फाँद ली। एक चौकीदार ने सावित्री का टख़ना पकड़ लिया, लेकिन उन्होंने झटका देकर ख़ुद को छुड़ा लिया और वे दोनों अँधेरे में ग़ायब हो गए।
  - >-
    अगली सुबह इंस्पेक्टर भैरव विक्रम के कमरे में आए। उन्होंने कहा, "विक्रम बाबू, कल रात कपूर का क़त्ल हो गया और वहाँ दो नक़ाबपोश चोर भी देखे गए। उनमें से एक का क़द बिल्कुल आपके जितना था। क्या आप इस मामले में मेरी मदद करेंगे?"
  - >-
    विक्रम ने बिल्कुल गंभीर चेहरे से कहा, "माफ़ कीजिए, इंस्पेक्टर साहब, इस बार मेरी हमदर्दी अपराधियों के साथ है।" भैरव कुछ समझे बिना चले गए। सावित्री ने अपनी हँसी बड़ी मुश्किल से रोकी।
  - >-
    विक्रम ने कहा, "इस मामले में बस एक मुस्कान, एक तिजोरी और एक घूँघट था। कभी-कभी न्याय क़ानून से बड़ा होता है। सच हमेशा छोटी चीज़ों में छिपा होता है।" राजकुमारी उमा की शादी धूमधाम से हुई।
  - >-
    लेकिन एक बंडल नहीं जला था, क्योंकि विक्रम ने उसे अपनी जेब में रख लिया था। घर आकर उन्होंने उसे खोला। उसमें बैंगनी स्याही से लिखा और काले कमल की मुहर लगा हुआ एक आदेश था, जिसमें कपूर से कहा गया था कि वह विक्रम पर नज़र रखे।
  - >-
    कपूर काले कमल का जासूस था। विक्रम ने उस लिखावट को देर तक देखा और कहा, "देखो, सावित्री, सारे अक्षर पीछे की ओर झुके हुए हैं। यह किसी बाएँ हाथ से लिखने वाले की लिखावट है।" क्या आपको याद है कि इस कहानी में अब तक किसने बाएँ हाथ से कुछ लिखा था? अपना जवाब कमेंट में लिखिए।
