# EP 18 - समुंदर का शैतान (The Adventure of Black Peter)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "अपने ही हार्पून से मौत", title: "समुंदर का शैतान, अपने ही हार्पून से मारा गया", end_question: "इतनी ताक़त किसमें थी?"}
  - {start_scene: 7, end_scene: 8, hook_text: "जासूस क़साई की दुकान में", title: "जासूस हार्पून लेकर क़साई की दुकान में क्या कर रहा था?", end_question: "विक्रम क्या साबित कर रहे थे?"}
  - {start_scene: 12, end_scene: 13, hook_text: "तीन हार्पूनर, एक क़ातिल", title: "जासूस ने इश्तहार दिया... और तीन हार्पूनर आए", end_question: "इनमें से क़ातिल कौन?"}
script:
  - >-
    भोर का धुंधलका। रत्नागिरी के पास एक मछुआरों के गाँव में लोग समुंदर किनारे की लकड़ी की एक झोंपड़ी के बाहर इकट्ठा थे। दरवाज़ा खुला था। अंदर दीवार पर एक लंबे हार्पून की परछाईं पड़ रही थी।
  - >-
    और उस हार्पून के साथ दीवार से टिका था कैप्टन भीमराव जाधव। 'काला भीम'। जिसके नाम से पूरा तट काँपता था। समुंदर का शैतान, अपने ही हथियार से मारा गया था।
  - >-
    मैं सावित्री हूँ। काला भीम एक रिटायर्ड जहाज़ी कप्तान था। शराबी, ज़ालिम। उसकी पत्नी और बेटी उससे इतना डरती थीं कि उन्होंने उसकी मौत पर एक आँसू नहीं बहाया। वो घर से दूर इस झोंपड़ी में अकेला रहता था, जिसे वो अपना 'केबिन' कहता था।
  - >-
    झोंपड़ी में दो सुराग़ मिले। तंबाकू का एक बटुआ, जिस पर अंग्रेज़ी का अक्षर 'के' खुदा था। और एक पुरानी नोटबुक, जिसमें बैंक के अजीब कोड लिखे थे। पर काला भीम तो तंबाकू पीता ही नहीं था।
  - >-
    दो रात बाद, पुलिस ने एक दुबले-पतले नौजवान को झोंपड़ी में चोरी से घुसते पकड़ा। नाम था नीलेश शेनॉय। वो काँपता हुआ बोला, "मैं बस कुछ काग़ज़ ढूँढ़ रहा था!" पुलिस ने उसे ही क़ातिल मान लिया।
  - >-
    विक्रम ने नीलेश को देखा। पतली कलाइयाँ, कमज़ोर कंधे। "हार्पून इतनी ताक़त से चला था कि लकड़ी की दीवार में धँस गया। क्या ये लड़का ऐसा कर सकता है?"
  - >-
    अगली सुबह मैं विक्रम को ढूँढ़ती हुई एक क़साई की दुकान पहुँची, और वहीं ठिठक गई। विक्रम आस्तीनें चढ़ाए, एक हार्पून लिए, दुकान में टँगे गोश्त के एक बड़े टुकड़े पर पूरी ताक़त से वार कर रहे थे। "विक्रम! ये क्या है?"
  - >-
    पसीना पोंछते हुए वो बोले, "पूरी ताक़त से भी, मैं इसे आर-पार नहीं कर पाया। ये काम किसी बहुत ताक़तवर आदमी का है, जिसने बरसों हार्पून चलाया हो। नीलेश के बस का नहीं।" क़साई हमें ऐसे देख रहा था, जैसे हम पागल हों।
  - >-
    नीलेश ने आख़िरकार सच बताया। "बारह साल पहले, मेरे पिता एक बैंक चलाते थे। बैंक डूबा, तो वो कुछ क़ीमती काग़ज़ लेकर जहाज़ से निकले, ताकि लोगों का पैसा लौटा सकें। वो कभी नहीं पहुँचे।"
  - >-
    "कुछ हफ़्ते पहले मैंने बाज़ार में अपने पिता के बैंक का एक काग़ज़ बिकते देखा। बेचने वाला... काला भीम था। मैं उसकी झोंपड़ी में वही नोटबुक ढूँढ़ने गया था।"
  - >-
    रुकिए। एक हार्पून, जिसे सिर्फ़ एक बेहद ताक़तवर आदमी चला सकता था। एक बटुआ, जिस पर 'के' लिखा है। और बारह साल पुराना एक ग़ायब जहाज़। क्या आप अंदाज़ा लगा सकते हैं, क़ातिल कौन था?
  - >-
    विक्रम ने बंबई के अख़बार में एक इश्तहार दिया... 'व्हेल के शिकार की एक लंबी यात्रा के लिए अनुभवी हार्पून चलाने वाले चाहिए। अच्छी मज़दूरी।' और अपने कमरे में इंटरव्यू रखे।
  - >-
    अगली सुबह तीन आदमी आए। पहला बूढ़ा और कमज़ोर। दूसरा जवान, पर अनाड़ी। तीसरा... एक विशाल आदमी, चौड़े कंधे, हाथ पत्थर जैसे। उसने अपना नाम बताया... केसरी।
  - >-
    विक्रम ने मुस्कराकर कहा, "बैठो, केसरी। ये काग़ज़ पढ़ो, और दस्तख़त करो।" जैसे ही केसरी झुका, विक्रम ने उसकी कलाइयों में हथकड़ी डाल दी। केसरी ने ऐसा झटका दिया कि मेज़ उलट गई। भैरव और दो सिपाहियों ने मिलकर उसे क़ाबू किया।
  - >-
    केसरी गरजा, "हाँ, मैंने उसे मारा! पर वो शैतान इसी लायक़ था!" फिर वो शांत हुआ, और बोला, "बारह साल पहले मैं काला भीम के जहाज़ पर हार्पूनर था।"
  - >-
    "एक रात समुंदर में हमें एक छोटी नाव मिली। एक आदमी, और एक बक्सा। काला भीम ने उस आदमी को समुंदर में धकेल दिया, और बक्सा रख लिया। मैंने सब देखा था।"
  - >-
    नीलेश की आँखें भर आईं। वो आदमी उसके पिता थे। केसरी आगे बोला, "बरसों बाद मुझे काला भीम मिला। मैंने अपना हिस्सा माँगा। उसने हार्पून उठाया, मुझे मारने के लिए। मैंने उसके हाथ से छीना, और... बस।"
  - >-
    बटुआ केसरी का था। 'के' यानी केसरी। भागते वक़्त वो छूट गया था। विक्रम बोले, "क़साई की दुकान, एक बटुआ, और कंधों की चौड़ाई... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    नीलेश को उसके पिता के बैंक के काग़ज़ लौटा दिए गए। अदालत ने केसरी की कहानी सुनी, और आत्मरक्षा मानकर उसे कम सज़ा दी। काला भीम के लिए कोई नहीं रोया।
  - >-
    पर उन काग़ज़ों में कुछ अजीब था। नीलेश के पिता के बैंक के शेयर, जो काला भीम ने बेचे थे, बाद में कुछ कंपनियों ने ख़रीदे थे। ऐसी कंपनियाँ, जिनका न कोई दफ़्तर था, न कोई मालिक।
  - >-
    विक्रम ने नोटबुक के आख़िरी पन्ने पर उन कंपनियों के असली ख़रीदार का नाम पढ़ा... 'पंकज सेवा सदन ट्रस्ट, बनारस।' उन्होंने नोटबुक धीरे से बंद कर दी।
  - >-
    उस रात, समुंदर के किनारे, विक्रम बोले, "सावित्री, अब मुझे उस संस्था पर शक है। पर संस्था सिर्फ़ एक इमारत है। मुझे उस इमारत के पीछे का चेहरा चाहिए।" क्या आपको लगता है विक्रम सही रास्ते पर हैं? कमेंट करें।
