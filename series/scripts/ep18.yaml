# EP 18 - समुंदर का शैतान (The Adventure of Black Peter)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "अपने ही हार्पून से मौत", title: "समुंदर का शैतान, अपने ही हार्पून से मारा गया", end_question: "इतनी ताक़त किसमें थी?"}
  - {start_scene: 7, end_scene: 8, hook_text: "जासूस क़साई की दुकान में", title: "जासूस हार्पून लेकर क़साई की दुकान में क्या कर रहा था?", end_question: "विक्रम क्या साबित कर रहे थे?"}
  - {start_scene: 12, end_scene: 13, hook_text: "तीन हार्पूनर, एक क़ातिल", title: "जासूस ने इश्तहार दिया... और तीन हार्पूनर आए", end_question: "इनमें से क़ातिल कौन?"}
script:
  - >-
    भोर के धुंधलके में रत्नागिरी के पास मछुआरों के एक गाँव के लोग समुंदर किनारे बनी लकड़ी की एक झोंपड़ी के बाहर इकट्ठा थे। झोंपड़ी का दरवाज़ा खुला था। अंदर दीवार पर एक लंबे हार्पून की परछाईं पड़ रही थी।
  - >-
    उसी हार्पून के साथ कैप्टन भीमराव जाधव दीवार से टिका हुआ था। लोग उसे 'काला भीम' कहते थे और उसके नाम से पूरा तट काँपता था। समुंदर का वह शैतान अपने ही हथियार से मारा गया था।
  - >-
    काला भीम एक रिटायर्ड जहाज़ी कप्तान था, जो शराबी और ज़ालिम था। उसकी पत्नी और बेटी उससे इतना डरती थीं कि उन्होंने उसकी मौत पर एक आँसू भी नहीं बहाया। वह घर से दूर इस झोंपड़ी में अकेला रहता था, जिसे वह अपना केबिन कहता था। इस मामले की जाँच जासूस विक्रम और डॉक्टर सावित्री ने शुरू की।
  - >-
    झोंपड़ी में दो सुराग़ मिले। पहला तंबाकू का एक बटुआ था, जिस पर अंग्रेज़ी का अक्षर 'के' खुदा था, और दूसरा एक पुरानी नोटबुक थी, जिसमें बैंक के अजीब कोड लिखे थे। लेकिन काला भीम तो तंबाकू पीता ही नहीं था।
  - >-
    दो रात बाद पुलिस ने एक दुबले-पतले नौजवान को झोंपड़ी में चोरी से घुसते हुए पकड़ा। उसका नाम नीलेश शेनॉय था। वह काँपते हुए बोला, "मैं बस कुछ काग़ज़ ढूँढ़ रहा था!" लेकिन पुलिस ने उसी को क़ातिल मान लिया।
  - >-
    विक्रम ने नीलेश की पतली कलाइयाँ और कमज़ोर कंधे देखे। उन्होंने कहा, "हार्पून इतनी ताक़त से चला था कि वह लकड़ी की दीवार में धँस गया। क्या यह लड़का ऐसा कर सकता है?"
  - >-
    अगली सुबह सावित्री विक्रम को ढूँढ़ती हुई एक क़साई की दुकान पर पहुँचीं और वहीं ठिठक गईं। विक्रम आस्तीनें चढ़ाए, हाथ में एक हार्पून लिए, दुकान में टँगे गोश्त के एक बड़े टुकड़े पर पूरी ताक़त से वार कर रहे थे। सावित्री ने पूछा, "विक्रम, आप यह क्या कर रहे हैं?"
  - >-
    विक्रम पसीना पोंछते हुए बोले, "मैं पूरी ताक़त लगाकर भी इसे आर-पार नहीं कर पाया। यह काम किसी बहुत ताक़तवर आदमी का है, जिसने बरसों हार्पून चलाया हो, और यह नीलेश के बस का नहीं है।" क़साई उन दोनों को ऐसे देख रहा था, जैसे वे पागल हों।
  - >-
    नीलेश ने आख़िरकार सच बता दिया। उसने कहा, "बारह साल पहले मेरे पिता एक बैंक चलाते थे। जब बैंक डूबा, तो वह कुछ क़ीमती काग़ज़ लेकर जहाज़ से निकले, ताकि लोगों का पैसा लौटा सकें। लेकिन वह कभी अपनी मंज़िल पर नहीं पहुँचे।"
  - >-
    नीलेश ने आगे बताया, "कुछ हफ़्ते पहले मैंने बाज़ार में अपने पिता के बैंक का एक काग़ज़ बिकते हुए देखा, और उसे बेचने वाला काला भीम था। मैं उसकी झोंपड़ी में वही नोटबुक ढूँढ़ने गया था।"
  - >-
    यहाँ एक पल रुककर सोचिए। एक हार्पून था, जिसे सिर्फ़ कोई बेहद ताक़तवर आदमी चला सकता था। एक बटुआ था, जिस पर 'के' लिखा था, और बारह साल पहले ग़ायब हुआ एक जहाज़ था। क्या आप अंदाज़ा लगा सकते हैं कि क़ातिल कौन था?
  - >-
    विक्रम ने बंबई के अख़बार में एक इश्तहार दिया कि व्हेल के शिकार की एक लंबी यात्रा के लिए अनुभवी हार्पून चलाने वाले चाहिए और उन्हें अच्छी मज़दूरी मिलेगी। इसके बाद उन्होंने अपने कमरे में इंटरव्यू रखे।
  - >-
    अगली सुबह तीन आदमी आए। पहला बूढ़ा और कमज़ोर था, जबकि दूसरा जवान लेकिन अनाड़ी था। तीसरा एक विशाल आदमी था, जिसके कंधे चौड़े और हाथ पत्थर जैसे थे। उसने अपना नाम केसरी बताया।
  - >-
    विक्रम ने मुस्कराकर कहा, "बैठो, केसरी, यह काग़ज़ पढ़ो और इस पर दस्तख़त करो।" जैसे ही केसरी झुका, विक्रम ने उसकी कलाइयों में हथकड़ी डाल दी। केसरी ने ऐसा झटका दिया कि मेज़ उलट गई, और भैरव ने दो सिपाहियों के साथ मिलकर उसे क़ाबू किया।
  - >-
    केसरी गरजकर बोला, "हाँ, मैंने उसे मारा है, लेकिन वह शैतान इसी लायक़ था!" फिर वह शांत हुआ और बोला, "बारह साल पहले मैं काला भीम के जहाज़ पर हार्पूनर था।"
  - >-
    केसरी ने बताया, "एक रात समुंदर में हमें एक छोटी नाव मिली, जिसमें एक आदमी और एक बक्सा था। काला भीम ने उस आदमी को समुंदर में धकेल दिया और बक्सा अपने पास रख लिया। मैंने यह सब अपनी आँखों से देखा था।"
  - >-
    नीलेश की आँखें भर आईं, क्योंकि वह आदमी उसके पिता थे। केसरी आगे बोला, "बरसों बाद मुझे काला भीम मिला और मैंने उससे अपना हिस्सा माँगा। उसने मुझे मारने के लिए हार्पून उठाया, तो मैंने उसे उसके हाथ से छीनकर उसी पर चला दिया।"
  - >-
    वह बटुआ केसरी का था और 'के' का मतलब केसरी था। वह भागते वक़्त वहीं छूट गया था। विक्रम बोले, "यह मामला क़साई की दुकान, एक बटुए और कंधों की चौड़ाई से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    नीलेश को उसके पिता के बैंक के काग़ज़ लौटा दिए गए। अदालत ने केसरी की कहानी सुनी और इसे आत्मरक्षा मानकर उसे कम सज़ा दी। काला भीम के लिए कोई नहीं रोया।
  - >-
    लेकिन उन काग़ज़ों में कुछ अजीब बात थी। नीलेश के पिता के बैंक के जो शेयर काला भीम ने बेचे थे, उन्हें बाद में कुछ कंपनियों ने ख़रीदा था। वे ऐसी कंपनियाँ थीं, जिनका न कोई दफ़्तर था और न कोई मालिक।
  - >-
    विक्रम ने नोटबुक के आख़िरी पन्ने पर उन कंपनियों के असली ख़रीदार का नाम पढ़ा, जो 'पंकज सेवा सदन ट्रस्ट, बनारस' था। उन्होंने नोटबुक धीरे से बंद कर दी।
  - >-
    उस रात समुंदर के किनारे विक्रम बोले, "सावित्री, अब मुझे उस संस्था पर शक है। लेकिन संस्था सिर्फ़ एक इमारत है, और मुझे उस इमारत के पीछे का चेहरा चाहिए।" क्या आपको लगता है कि विक्रम सही रास्ते पर हैं? अपना जवाब कमेंट में लिखिए।
