# EP 8 - झील की चुड़ैल (The Boscombe Valley Mystery)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "झील किनारे सफ़ेद साया", title: "झील किनारे लाश... और पेड़ों के बीच एक सफ़ेद साया", end_question: "क्या वो सच में चुड़ैल थी?"}
  - {start_scene: 6, end_scene: 7, hook_text: "मरते वक़्त: '...बल'", title: "मरते हुए पिता का आख़िरी शब्द: '...बल'", end_question: "आप बताइए, इसका मतलब क्या था?"}
  - {start_scene: 8, end_scene: 10, hook_text: "लँगड़ाते क़दमों के निशान", title: "कीचड़ में तीसरे आदमी के लँगड़ाते निशान", end_question: "क़ातिल कौन है?"}
script:
  - >-
    शाम ढल रही थी और सोनपुर की झील पर धुंध उतर आई थी। तभी झील के किनारे से एक चीख उठी और गाँव वाले उस तरफ़ दौड़ पड़े। पानी के किनारे मोहन राठौड़ औंधे मुँह पड़ा था और उसकी मौत हो चुकी थी।
  - >-
    दो चरवाहों ने क़सम खाकर कहा कि उन्होंने कदंब के पेड़ों के बीच एक सफ़ेद आकृति देखी थी, जो लहरा रही थी और जिसका कोई चेहरा नहीं था। पूरा गाँव फुसफुसाने लगा कि झील की चुड़ैल ने मोहन को अपने पास बुलाया था।
  - >-
    उस हफ़्ते जासूस विक्रम और डॉक्टर सावित्री राजपूताना में थे, जब रत्ना नाम की एक लड़की रोती हुई उनके पास आई। उसने कहा, "मोहन चाचा के क़त्ल के इल्ज़ाम में शेखर को पकड़ लिया गया है, लेकिन मैं जानती हूँ कि वह बेगुनाह है।"
  - >-
    शेखर मोहन राठौड़ का बेटा था। मोहन के मरने से कुछ मिनट पहले झील के किनारे दोनों के बीच ज़ोरदार बहस हुई थी, जिसकी आवाज़ें गाँव वालों ने भी सुनी थीं। शेखर के ख़िलाफ़ सबूत पक्के लग रहे थे।
  - >-
    रत्ना ठाकुर जसवंत सिंह की बेटी थी, जो उस इलाक़े के सबसे अमीर ज़मींदार थे। मोहन उन्हीं की ज़मीन पर खेती करता था। रत्ना और शेखर एक-दूसरे से प्यार करते थे।
  - >-
    विक्रम और सावित्री हवालात में शेखर से मिले। उसने बताया कि बहस के बाद वह चला गया था, लेकिन पिता की चीख सुनकर लौट आया। शेखर बोला, "वह मर रहे थे और बस एक अधूरा शब्द बोल पाए, जो 'बल' जैसा सुनाई दिया। पास की घास पर एक भूरी शॉल पड़ी थी, लेकिन जब मैं दोबारा मुड़ा, तो वह शॉल ग़ायब थी।"
  - >-
    एक शॉल थी, जो दिखी और फिर ग़ायब हो गई, और एक अधूरा शब्द था। पुलिस का कहना था कि शेखर झूठ बोल रहा है, जबकि गाँव वाले उस शॉल को चुड़ैल का कपड़ा बता रहे थे। विक्रम ने बस इतना कहा, "चलो, हम झील पर चलते हैं।"
  - >-
    झील के किनारे विक्रम घुटनों के बल बैठ गए और कीचड़ में बने पैरों के निशानों को किसी किताब की तरह पढ़ने लगे। उन्होंने कहा, "ये शेखर के जूते हैं और ये मोहन के हैं। ये निशान किसी तीसरे आदमी के हैं, जो दाहिने पैर से लँगड़ाकर चलता है।"
  - >-
    जिस पेड़ के पीछे वह तीसरा आदमी खड़ा रहा होगा, वहाँ विक्रम को सिगार की राख मिली। उन्होंने कहा, "यह बर्मा का चुरुट है, जो बहुत महँगा होता है। इस गाँव में ऐसा चुरुट कौन पीता है?"
  - >-
    जहाँ वह शॉल पड़ी थी, वहाँ की घास दबी हुई थी। विक्रम बोले, "क़ातिल घबराहट में अपनी शॉल यहीं छोड़ गया था। जब शेखर अपने पिता के पास झुका हुआ था, तब वह चुपके से लौटा और शॉल उठा ले गया।"
  - >-
    यहाँ एक पल रुककर सोचिए। मरते हुए आदमी ने 'बल' जैसा एक अधूरा शब्द कहा था। कीचड़ में लँगड़ाते पैरों के निशान थे और पेड़ के पीछे बर्मा के महँगे चुरुट की राख थी। आपके हिसाब से वह पूरा शब्द क्या हो सकता है? अपना जवाब कमेंट में लिखिए और फिर आगे देखिए।
  - >-
    विक्रम ने रत्ना से पूछा, "मोहन राठौड़ इस गाँव में कब आया था?" रत्ना ने बताया, "वह बरसों पहले चंबल की तरफ़ से आया था और मेरे पिता ने उसे बिना किराए के ज़मीन दी थी।" विक्रम की आँखें चमक उठीं और वह बोले, "वह शब्द 'बल' नहीं था, सावित्री, वह चंबल था।"
  - >-
    उस शाम वे दोनों ठाकुर जसवंत सिंह की हवेली पहुँचे। ठाकुर एक बूढ़े और बीमार आदमी थे, जिनका चेहरा बड़ा भला लगता था। वह छड़ी के सहारे चलते थे और दाहिने पैर से लँगड़ाते थे। उनकी मेज़ पर बर्मा के चुरुट का एक डिब्बा रखा था।
  - >-
    विक्रम ने उनके सामने बैठकर बस इतना कहा, "चंबल, ठाकुर साहब।" यह सुनते ही बूढ़े ठाकुर के हाथ काँपने लगे। बहुत देर तक कमरे में सिर्फ़ घड़ी की टिक-टिक गूँजती रही और फिर ठाकुर ने बोलना शुरू किया।
  - >-
    ठाकुर ने कहा, "तीस साल पहले मैं चंबल का डाकू था। मैं लूट का माल लेकर भागा, मैंने नया नाम रखा और एक इज़्ज़तदार ज़मींदार बन गया। लेकिन मोहन मेरे ही गिरोह में था और उसने मुझे पहचान लिया।"
  - >-
    उन्होंने आगे कहा, "तीस साल तक वह मुझसे पैसे ऐंठता रहा और उसने मेरी ज़मीन और घर तक ले लिए। अब वह चाहता था कि मेरी रत्ना की शादी उसके बेटे से हो जाए, ताकि मेरी सारी जायदाद उसकी हो जाए।"
  - >-
    ठाकुर बोले, "उस शाम झील पर मैंने उसे शेखर से यही कहते सुना। वह मेरी बच्ची को सौदे की चीज़ बना रहा था और मैं अपना होश खो बैठा, विक्रम बाबू। मैं बीमार हूँ और मेरे पास कुछ ही महीने बचे हैं, लेकिन रत्ना को यह सच कभी पता नहीं चलना चाहिए।"
  - >-
    विक्रम ने एक कागज़ आगे बढ़ाकर कहा, "आप अपना बयान लिख दीजिए। अगर शेखर को सज़ा हुई, तो मैं यह अदालत में दूँगा, और अगर नहीं हुई, तो यह कभी किसी को नहीं दिखेगा।" ठाकुर ने काँपते हाथों से उस पर दस्तख़त कर दिए।
  - >-
    अदालत में विक्रम ने पैरों के निशानों और शॉल के सबूत से साबित कर दिया कि वहाँ एक तीसरा आदमी भी मौजूद था। शेखर बरी हो गया। कुछ महीनों बाद ठाकुर जसवंत सिंह चल बसे और उनका राज़ उनके साथ ही चला गया।
  - >-
    झील की वह चुड़ैल असल में रत्ना का सफ़ेद दुपट्टा थी, जो उस शाम हवा में उड़कर कदंब की डाल में अटक गया था। विक्रम बोले, "चुड़ैल कभी थी ही नहीं। यह मामला एक अधूरे शब्द और लँगड़ाते क़दमों से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन बयान लिखते हुए ठाकुर ने एक और बात कही थी, जिसने विक्रम को चौंका दिया। उन्होंने बताया था, "हमारे गिरोह को पैसा शहर का एक सेठ देता था। हमने उसका चेहरा कभी नहीं देखा, लेकिन उसके ख़त हमेशा बैंगनी स्याही में आते थे।"
  - >-
    ठाकुर रघुवेंद्र की मेज़ पर मिली चिट्ठी भी बैंगनी स्याही में ही लिखी थी। विक्रम ने धीरे से कहा, "यह जाल तीस साल पुराना है, सावित्री, और यह कमल बहुत पुराना है।" क्या शेखर और रत्ना को यह सच पता चलना चाहिए था? अपनी राय कमेंट में बताइए।
