# EP 8 - झील की चुड़ैल (The Boscombe Valley Mystery)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "झील किनारे सफ़ेद साया", title: "झील किनारे लाश... और पेड़ों के बीच एक सफ़ेद साया", end_question: "क्या वो सच में चुड़ैल थी?"}
  - {start_scene: 6, end_scene: 7, hook_text: "मरते वक़्त: '...बल'", title: "मरते हुए पिता का आख़िरी शब्द: '...बल'", end_question: "आप बताइए, इसका मतलब क्या था?"}
  - {start_scene: 8, end_scene: 10, hook_text: "लँगड़ाते क़दमों के निशान", title: "कीचड़ में तीसरे आदमी के लँगड़ाते निशान", end_question: "क़ातिल कौन है?"}
script:
  - >-
    शाम ढल रही थी। सोनपुर की झील पर धुंध उतर आई थी। तभी झील किनारे से एक चीख उठी। गाँव वाले दौड़े। पानी के किनारे मोहन राठौड़ औंधे मुँह पड़ा था। मर चुका था।
  - >-
    दो चरवाहों ने क़सम खाई, उन्होंने कदंब के पेड़ों के बीच एक सफ़ेद आकृति देखी थी। लहराती हुई, बिना चेहरे की। पूरा गाँव फुसफुसाने लगा... "झील की चुड़ैल ने उसे बुलाया था।"
  - >-
    मैं सावित्री हूँ। उस हफ़्ते हम राजपूताना में थे, जब एक लड़की, रत्ना, रोती हुई विक्रम के पास आई। "मोहन चाचा के क़त्ल के इल्ज़ाम में शेखर को पकड़ लिया गया है। पर वो बेगुनाह है, मैं जानती हूँ।"
  - >-
    शेखर, मोहन राठौड़ का बेटा था। मरने से कुछ मिनट पहले, झील किनारे उसकी अपने पिता से ज़ोरदार बहस हुई थी। गाँव वालों ने आवाज़ें सुनी थीं। सबूत पक्के लगते थे।
  - >-
    रत्ना, ठाकुर जसवंत सिंह की बेटी थी, जो इस इलाक़े के सबसे अमीर ज़मींदार थे। मोहन उन्हीं की ज़मीन पर खेती करता था। और रत्ना और शेखर... एक-दूसरे से प्यार करते थे।
  - >-
    हम हवालात में शेखर से मिले। उसने बताया, बहस के बाद वो चला गया था। फिर पिता की चीख सुनकर लौटा। "वो मर रहे थे। बस एक शब्द बोल पाए... '...बल'। और पास की घास पर एक भूरी शॉल पड़ी थी। जब मैं दोबारा मुड़ा, वो शॉल ग़ायब थी।"
  - >-
    एक शॉल, जो आई और ग़ायब हो गई। और एक अधूरा शब्द। पुलिस कहती थी, शेखर झूठ बोल रहा है। गाँव वाले कहते थे, वो चुड़ैल का कपड़ा था। विक्रम ने बस इतना कहा, "चलो, झील चलते हैं।"
  - >-
    झील किनारे विक्रम घुटनों के बल बैठ गए, और कीचड़ में पैरों के निशान ऐसे पढ़ने लगे, जैसे कोई किताब हो। "ये शेखर के जूते हैं। ये मोहन के। और ये... किसी तीसरे आदमी के। वो दाहिने पैर से लँगड़ाकर चलता है।"
  - >-
    पेड़ के पीछे, जहाँ वो तीसरा आदमी खड़ा रहा होगा, विक्रम को सिगार की राख मिली। "बर्मा का चुरुट," वो बोले। "बहुत महँगा। ऐसा चुरुट इस गाँव में कौन पीता है?"
  - >-
    और जहाँ शॉल पड़ी थी, वहाँ घास दबी हुई थी। "क़ातिल घबराहट में अपनी शॉल छोड़ गया था," विक्रम बोले। "जब शेखर पिता के पास झुका था, वो चुपके से लौटा, और उसे उठा ले गया।"
  - >-
    रुकिए। एक अधूरा शब्द... '...बल'। लँगड़ाते पैरों के निशान। बर्मा का महँगा चुरुट। आप बताइए, '...बल' का पूरा शब्द क्या हो सकता है? कमेंट में लिखिए, फिर आगे देखिए।
  - >-
    विक्रम ने रत्ना से पूछा, "मोहन राठौड़ इस गाँव में कब आया था?" "बरसों पहले, चंबल की तरफ़ से। मेरे पिता ने उसे बिना किराए के ज़मीन दी थी।" विक्रम की आँखें चमक उठीं। "चंबल। '...बल' नहीं, सावित्री... चंबल।"
  - >-
    उस शाम हम ठाकुर जसवंत सिंह की हवेली पहुँचे। एक बूढ़ा, बीमार आदमी, जिसका चेहरा बड़ा भला लगता था। वो छड़ी के सहारे चलते थे... दाहिने पैर से लँगड़ाते हुए। मेज़ पर बर्मा के चुरुट का डिब्बा रखा था।
  - >-
    विक्रम ने उनके सामने बैठकर बस इतना कहा, "चंबल, ठाकुर साहब।" बूढ़े ठाकुर के हाथ काँपने लगे। बहुत देर तक कमरे में सिर्फ़ घड़ी की टिक-टिक गूँजती रही। फिर वो बोले।
  - >-
    "तीस साल पहले मैं चंबल का डाकू था। लूट का माल लेकर भागा, नया नाम रखा, और इज़्ज़तदार ज़मींदार बन गया। पर मोहन मेरे गिरोह में था। वो मुझे पहचान गया।"
  - >-
    "तीस साल वो मुझसे पैसे ऐंठता रहा। ज़मीन, घर, सब लिया। और अब... अब वो चाहता था कि मेरी रत्ना की शादी उसके बेटे से हो, ताकि मेरी सारी जायदाद उसकी हो जाए।"
  - >-
    "उस शाम झील पर मैंने उसे शेखर से यही कहते सुना। मेरी बच्ची को सौदे की चीज़ बना रहा था। मैं अपना होश खो बैठा, विक्रम बाबू। मैं बीमार हूँ, कुछ ही महीने बचे हैं। पर रत्ना को ये सच कभी पता न चले।"
  - >-
    विक्रम ने एक कागज़ आगे बढ़ाया। "अपना बयान लिख दीजिए। अगर शेखर को सज़ा हुई, तो मैं ये अदालत में दूँगा। अगर नहीं, तो ये कभी किसी को नहीं दिखेगा।" ठाकुर ने काँपते हाथों से दस्तख़त कर दिए।
  - >-
    अदालत में विक्रम ने पैरों के निशानों और शॉल के सबूत से साबित कर दिया कि वहाँ एक तीसरा आदमी था। शेखर बरी हो गया। कुछ महीनों बाद ठाकुर जसवंत सिंह चल बसे, और उनका राज़ उनके साथ चला गया।
  - >-
    और झील की चुड़ैल? वो रत्ना का सफ़ेद दुपट्टा था, जो उस शाम हवा में उड़कर कदंब की डाल में अटक गया था। "चुड़ैल कभी थी ही नहीं," विक्रम बोले। "एक अधूरा शब्द, लँगड़ाते क़दम... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर ठाकुर ने बयान लिखते हुए एक और बात कही थी, जिसने विक्रम को चौंका दिया। "हमारे गिरोह को पैसा शहर का एक सेठ देता था। चेहरा कभी नहीं देखा। उसके ख़त हमेशा बैंगनी स्याही में आते थे।"
  - >-
    बैंगनी स्याही। ठाकुर रघुवेंद्र की मेज़ पर मिली चिट्ठी भी बैंगनी स्याही में थी। विक्रम ने धीरे से कहा, "तीस साल पुराना जाल, सावित्री... ये कमल बहुत पुराना है।" क्या शेखर और रत्ना को सच पता चलना चाहिए था? कमेंट में बताइए।
