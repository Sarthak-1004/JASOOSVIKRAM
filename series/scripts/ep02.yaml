# EP 2 - दीवार के अंदर कौन? (The Red-Headed League)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "दीवार के अंदर से ठक-ठक", title: "आधी रात, बैंक की दीवार के अंदर से आवाज़", end_question: "दीवार के अंदर कौन था?"}
  - {start_scene: 4, end_scene: 7, hook_text: "सिर्फ़ सफ़ेद लट वालों की नौकरी", title: "बस बालों में सफ़ेद लट हो... और रोज़ चार रुपये", end_question: "ये नौकरी असली थी या जाल?"}
  - {start_scene: 15, end_scene: 16, hook_text: "अँधेरी तिजोरी में इंतज़ार", title: "घुप अँधेरा... और फ़र्श का पत्थर उठने लगा", end_question: "नीचे से कौन निकला?"}
script:
  - >-
    आधी रात का समय था और काशी इम्पीरियल बैंक का बूढ़ा चौकीदार लालटेन लिए तिजोरी वाले कमरे के बाहर खड़ा था। तभी उसे दीवार के अंदर से ठक-ठक की आवाज़ सुनाई दी। ऐसा लग रहा था, जैसे कोई दीवार के भीतर से बाहर निकलने की कोशिश कर रहा हो।
  - >-
    चौकीदार ने क़सम खाकर कहा कि बरसों पहले एक चोर को इसी दीवार में ज़िंदा चुनवा दिया गया था, और उसकी आत्मा आज भी बाहर निकलने का रास्ता खोद रही है। लेकिन क्या सच में उस दीवार के अंदर कोई आत्मा थी?
  - >-
    यह कहानी जासूस विक्रम और उनकी साथी डॉक्टर सावित्री के एक अनोखे मामले की है। उसी हफ़्ते विक्रम के कमरे में एक मोटा और हँसमुख आदमी आया, जिसके काले बालों के बीच एक चौड़ी सफ़ेद लट थी। उसका नाम लाला रामदास था और वह चौक बाज़ार में गिरवी की एक छोटी सी दुकान चलाता था।
  - >-
    रामदास ने हँसते हुए कहा, "विक्रम बाबू, मेरे साथ एक अजीब मज़ाक हुआ है।" आठ हफ़्ते पहले अख़बार में 'सफ़ेद लट सभा' का एक इश्तहार छपा था। उसमें लिखा था कि जिनके बालों में सफ़ेद लट हो, उन्हें रोज़ चार रुपये की नौकरी दी जाएगी।
  - >-
    रामदास वहाँ गए और उन्हें चुन लिया गया। उनका काम बस इतना था कि वह रोज़ सुबह दस बजे से दोपहर दो बजे तक एक पुरानी किताब की हाथ से नक़ल करें। शर्त यह थी कि वह उस दौरान एक मिनट के लिए भी दफ़्तर छोड़कर नहीं जा सकते थे।
  - >-
    आठ हफ़्ते तक रामदास रोज़ वहाँ गए, रोज़ लिखते रहे और रोज़ चार रुपये लेते रहे। लेकिन आज सुबह दफ़्तर पर ताला लटका हुआ था। दरवाज़े पर चिपकी एक पर्ची पर लिखा था कि सफ़ेद लट सभा भंग की जाती है। वह सभा, उसके आदमी और उसका दफ़्तर, सब कुछ ग़ायब हो चुका था।
  - >-
    यह सुनकर सावित्री हँस पड़ीं, लेकिन विक्रम नहीं हँसे। उन्होंने पूछा, "जब आप दस से दो बजे तक बाहर रहते थे, तब दुकान कौन संभालता था?" रामदास बोले, "मेरा नया मुंशी जयदेव संभालता था। वह बड़ा मेहनती लड़का है और आधी तनख़्वाह पर काम करता है।"
  - >-
    आधी तनख़्वाह की बात सुनकर विक्रम की आँखें चमक उठीं। उन्होंने पूछा, "यह जयदेव अपने ख़ाली वक़्त में क्या करता है?" रामदास ने बताया, "वह तहख़ाने में घुसा रहता है, बाबू, और कहता है कि उसे तस्वीरें धोने का शौक़ है।"
  - >-
    उसी दोपहर विक्रम और सावित्री चौक बाज़ार पहुँचे। विक्रम ने दुकान के बाहर अपनी छड़ी से फ़र्श को तीन बार ठोका और कान लगाकर उसकी आवाज़ सुनी। फिर उन्होंने दुकान का दरवाज़ा खटखटाया, जिसे एक जवान लड़के ने खोला। विक्रम ने उससे बस एक रास्ता पूछा और लौट आए।
  - >-
    बाहर आकर विक्रम ने पूछा, "क्या तुमने उसके घुटने देखे, सावित्री?" सावित्री ने उन पर ध्यान नहीं दिया था। विक्रम बोले, "उसके पाजामे के घुटने घिसे हुए थे और मिट्टी से सने थे, जैसे कोई घंटों तक ज़मीन पर घुटनों के बल काम करता रहा हो।"
  - >-
    यहाँ एक पल रुककर सोचिए। एक ऐसी नौकरी थी, जो एक आदमी को रोज़ चार घंटे घर से दूर रखती थी। एक मुंशी था, जो आधी तनख़्वाह पर भी ख़ुश था, तहख़ाने में वक़्त बिताता था और जिसके घुटने घिसे हुए थे। क्या आपको समझ आया कि दीवार के अंदर से आने वाली आवाज़ किसकी थी?
  - >-
    फिर विक्रम ने दुकान के पीछे खड़ी पत्थर की ऊँची इमारत की ओर देखा। वह इमारत काशी इम्पीरियल बैंक की थी। रामदास की दुकान की पिछली दीवार और बैंक की तिजोरी की दीवार आपस में सटी हुई थीं।
  - >-
    उस शाम वे दोनों बैंक के मालिक, राय बहादुर देवेंद्रनाथ से मिले। उनके बाल चाँदी जैसे सफ़ेद थे, आँखों पर सुनहरी ऐनक थी और हाथ में हाथीदाँत की मूठ वाली छड़ी थी। वह बड़े नरम स्वभाव के आदमी थे। उन्होंने कहा, "विक्रम जी, बनारस को आप पर गर्व है।"
  - >-
    बनारस पुलिस के इंस्पेक्टर भैरव पांडे भी मूँछों पर ताव देते हुए वहाँ आ पहुँचे। उन्होंने कहा, "यहाँ कोई भूत-वूत नहीं है, विक्रम बाबू, मैं सब संभाल लूँगा।" विक्रम मुस्कराकर बोले, "आज रात आप बस चुपचाप बैठिएगा, इंस्पेक्टर साहब।"
  - >-
    शनिवार की रात वे सब बैंक की तिजोरी वाले कमरे में पहुँचे। विक्रम ने लालटेन पर ढक्कन रख दिया और कमरे में घुप अँधेरा छा गया। चारों लोग पत्थर के फ़र्श पर साँस रोके बैठे थे। सन्नाटा इतना गहरा था कि सावित्री को अपनी धड़कन सुनाई दे रही थी।
  - >-
    पहले एक घंटा बीता और फिर दूसरा भी बीत गया। तभी फ़र्श के नीचे से वही ठक-ठक की आवाज़ आने लगी। सावित्री की साँस रुक गई, क्योंकि सामने पत्थर का एक चौकोर टुकड़ा धीरे-धीरे ऊपर उठ रहा था।
  - >-
    उस दरार से रोशनी की एक पतली लकीर निकली और फिर लालटेन थामे हुए एक हाथ बाहर आया। उसके बाद जो चेहरा दिखा, वह आधी तनख़्वाह वाले मुंशी जयदेव का था। वह सुरंग से बाहर निकला और उसके पीछे एक और आदमी भी आया।
  - >-
    विक्रम चिल्लाए, "इन्हें अभी पकड़ो!" इंस्पेक्टर भैरव शेर की तरह झपटे, लेकिन उन्होंने ग़लती से सावित्री को पकड़ लिया। इतने में विक्रम ने जयदेव की कलाई जकड़ ली, जबकि उसका साथी वापस सुरंग में कूदकर भाग गया।
  - >-
    सुबह विक्रम ने सारी बात समझाई। उन्होंने कहा, "सफ़ेद लट सभा कोई सभा नहीं थी, वह एक जाल था, ताकि रामदास रोज़ चार घंटे दुकान से दूर रहें। उन्हीं चार घंटों में जयदेव तहख़ाने से बैंक की तिजोरी तक सुरंग खोदता रहा।"
  - >-
    विक्रम ने आगे कहा, "उसके घुटने खुदाई की वजह से घिसे थे। मैं फ़र्श पर छड़ी मारकर सुन रहा था कि नीचे कोई खोखली जगह तो नहीं है। दीवार से आने वाली वह ठक-ठक किसी आत्मा की नहीं, बल्कि एक कुदाल की थी। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जब सिपाही जयदेव को ले जा रहे थे, तब वह मुड़ा और फुसफुसाकर बोला, "आज की चाल तुमने जीत ली, विक्रम, पर काले कमल तक यह ख़बर पहुँच जाएगी।" उसकी आँखों में कोई डर नहीं था, बस एक अजीब सी मुस्कान थी।
  - >-
    राय बहादुर देवेंद्रनाथ ने अपनी सुनहरी क़लम उठाई, बाएँ हाथ से इनाम का चेक लिखा और बोले, "यह बैंक हमेशा आपका एहसानमंद रहेगा।" लेकिन विक्रम का ध्यान अब भी जयदेव के शब्दों पर अटका हुआ था। आख़िर यह काला कमल कौन है? अपना शक कमेंट में ज़रूर लिखिए।
