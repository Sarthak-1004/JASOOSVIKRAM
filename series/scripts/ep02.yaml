# EP 2 - दीवार के अंदर कौन? (The Red-Headed League)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "दीवार के अंदर से ठक-ठक", title: "आधी रात, बैंक की दीवार के अंदर से आवाज़", end_question: "दीवार के अंदर कौन था?"}
  - {start_scene: 4, end_scene: 7, hook_text: "सिर्फ़ सफ़ेद लट वालों की नौकरी", title: "बस बालों में सफ़ेद लट हो... और रोज़ चार रुपये", end_question: "ये नौकरी असली थी या जाल?"}
  - {start_scene: 15, end_scene: 16, hook_text: "अँधेरी तिजोरी में इंतज़ार", title: "घुप अँधेरा... और फ़र्श का पत्थर उठने लगा", end_question: "नीचे से कौन निकला?"}
script:
  - >-
    आधी रात। काशी इम्पीरियल बैंक का बूढ़ा चौकीदार लालटेन लिए तिजोरी वाले कमरे के बाहर खड़ा था। तभी दीवार के अंदर से आवाज़ आई... ठक। ठक। ठक। जैसे कोई दीवार के भीतर से बाहर निकलने की कोशिश कर रहा हो।
  - >-
    चौकीदार ने क़सम खाकर कहा, बरसों पहले एक चोर को इसी दीवार में ज़िंदा चुनवा दिया गया था, और उसकी आत्मा आज भी रास्ता खोद रही है। पर क्या सच में दीवार के अंदर कोई आत्मा थी?
  - >-
    मैं सावित्री हूँ। उसी हफ़्ते विक्रम के कमरे में एक मोटा, हँसमुख आदमी आया। काले बालों के बीच एक चौड़ी सफ़ेद लट। नाम था लाला रामदास। चौक बाज़ार में गिरवी की एक छोटी सी दुकान चलाते थे।
  - >-
    हँसते-हँसते बोले, "विक्रम बाबू, मेरे साथ एक अजीब मज़ाक हुआ है।" आठ हफ़्ते पहले अख़बार में इश्तहार छपा था... 'सफ़ेद लट सभा। जिनके बालों में सफ़ेद लट हो, उन्हें रोज़ चार रुपये की नौकरी।'
  - >-
    रामदास गए, और चुन लिए गए। काम बस इतना था... रोज़ सुबह दस से दोपहर दो बजे तक, एक पुरानी किताब हाथ से नक़ल करना। और दफ़्तर छोड़कर जाना मना था। एक मिनट के लिए भी नहीं।
  - >-
    आठ हफ़्ते तक रामदास रोज़ गए, रोज़ लिखा, रोज़ चार रुपये लिए। और आज सुबह... दफ़्तर पर ताला लटका था। दरवाज़े पर एक पर्ची चिपकी थी... 'सफ़ेद लट सभा भंग की जाती है।' सभा, आदमी, दफ़्तर... सब ग़ायब।
  - >-
    मैं हँस पड़ी। पर विक्रम नहीं हँसे। उन्होंने पूछा, "जब आप दस से दो बजे तक बाहर रहते थे, दुकान कौन संभालता था?" रामदास बोले, "मेरा नया मुंशी, जयदेव। बड़ा मेहनती लड़का है। आधी तनख़्वाह पर काम करता है।"
  - >-
    "आधी तनख़्वाह पर?" विक्रम की आँखें चमक उठीं। "और ये जयदेव ख़ाली वक़्त में क्या करता है?" "तहख़ाने में घुसा रहता है, बाबू। कहता है, उसे तस्वीरें धोने का शौक़ है।"
  - >-
    उसी दोपहर हम चौक बाज़ार पहुँचे। विक्रम ने दुकान के बाहर अपनी छड़ी से फ़र्श को तीन बार ठोका, और कान लगाकर सुना। फिर दुकान का दरवाज़ा खटखटाया। एक जवान लड़के ने दरवाज़ा खोला। विक्रम ने उससे बस रास्ता पूछा, और लौट आए।
  - >-
    बाहर आकर बोले, "तुमने उसके घुटने देखे, सावित्री?" मैंने नहीं देखे थे। "उसके पाजामे के घुटने घिसे हुए थे, और मिट्टी से सने। जैसे कोई घंटों ज़मीन पर घुटनों के बल काम करता रहा हो।"
  - >-
    रुकिए। एक नौकरी, जो बस एक आदमी को रोज़ चार घंटे घर से दूर रखे। एक मुंशी, जो आधी तनख़्वाह पर भी ख़ुश है। तहख़ाने का शौक़। घिसे हुए घुटने। क्या आपको समझ आया, दीवार के अंदर की आवाज़ किसकी थी?
  - >-
    फिर विक्रम ने दुकान के पीछे वाली इमारत की ओर देखा। ऊँची, पत्थर की इमारत। काशी इम्पीरियल बैंक। रामदास की दुकान की पिछली दीवार, और बैंक की तिजोरी की दीवार... आपस में सटी हुई थीं।
  - >-
    उस शाम हम बैंक के मालिक से मिले। राय बहादुर देवेंद्रनाथ। चाँदी जैसे सफ़ेद बाल, सुनहरी ऐनक, हाथ में हाथीदाँत की मूठ वाली छड़ी। बड़े नरम स्वभाव के आदमी। बोले, "विक्रम जी, बनारस को आप पर गर्व है।"
  - >-
    बनारस पुलिस के इंस्पेक्टर भैरव पांडे भी आ पहुँचे, मूँछों पर ताव देते हुए। "कोई भूत-वूत नहीं है, विक्रम बाबू। मैं सब संभाल लूँगा।" विक्रम मुस्कराए। "आज रात आप बस चुपचाप बैठिएगा, इंस्पेक्टर साहब।"
  - >-
    शनिवार की रात। बैंक की तिजोरी। विक्रम ने लालटेन पर ढक्कन रख दिया। घुप अँधेरा। हम चारों पत्थर के फ़र्श पर साँस रोके बैठे थे। सन्नाटा इतना गहरा था कि मुझे अपनी धड़कन सुनाई दे रही थी।
  - >-
    एक घंटा बीता। फिर दूसरा। तभी... फ़र्श के नीचे से वही आवाज़। ठक। ठक। ठक। मेरी साँस रुक गई। सामने, पत्थर का एक चौकोर टुकड़ा धीरे-धीरे ऊपर उठने लगा।
  - >-
    दरार से रोशनी की एक पतली लकीर निकली। फिर एक हाथ, लालटेन थामे हुए। और फिर एक चेहरा... जयदेव! वही आधी तनख़्वाह वाला मुंशी। वो सुरंग से बाहर निकला, और उसके पीछे एक और आदमी।
  - >-
    "अभी!" विक्रम चिल्लाए। इंस्पेक्टर भैरव शेर की तरह झपटे... और ग़लती से मुझे पकड़ लिया! इतने में विक्रम ने जयदेव की कलाई जकड़ ली। उसका साथी वापस सुरंग में कूदकर भाग गया।
  - >-
    सुबह विक्रम ने सब समझाया। "सफ़ेद लट सभा कोई सभा नहीं थी। एक जाल था, ताकि रामदास रोज़ चार घंटे दुकान से दूर रहें। उन्हीं चार घंटों में जयदेव तहख़ाने से बैंक की तिजोरी तक सुरंग खोदता रहा।"
  - >-
    "घिसे हुए घुटने खुदाई के थे। फ़र्श पर छड़ी मारकर मैं सुन रहा था कि नीचे कोई खोखली जगह तो नहीं। और दीवार की वो ठक-ठक... कोई आत्मा नहीं, एक कुदाल थी। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    जब सिपाही जयदेव को ले जा रहे थे, वो मुड़ा, और फुसफुसाया, "आज की चाल तुमने जीत ली, विक्रम। पर काले कमल को ख़बर पहुँच जाएगी।" उसकी आँखों में डर नहीं था। बस एक अजीब सी मुस्कान।
  - >-
    राय बहादुर देवेंद्रनाथ ने अपनी सुनहरी क़लम उठाई, बाएँ हाथ से इनाम का चेक लिखा, और बोले, "बैंक हमेशा आपका एहसानमंद रहेगा।" पर विक्रम का ध्यान अब भी जयदेव के शब्दों पर अटका था... काला कमल। कौन है ये? अपना शक कमेंट में लिखिए।
