# EP 16 - सुनसान सड़क का साया (The Adventure of the Solitary Cyclist)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "हर शनिवार वही साया", title: "सुनसान जंगल की सड़क पर हर शनिवार पीछा करता एक साया", end_question: "वो कौन है?"}
  - {start_scene: 7, end_scene: 8, hook_text: "फाटक के अंदर ग़ायब", title: "झाड़ियों में छिपकर देखा... और साया फाटक में ग़ायब हो गया", end_question: "ग़ायब कैसे हुआ?"}
  - {start_scene: 12, end_scene: 14, hook_text: "जंगल में ज़बरदस्ती की शादी", title: "ख़ाली साइकिल, और जंगल में ज़बरदस्ती के फेरे...", end_question: "क्या वसुधा बच पाएगी?"}
script:
  - >-
    देहरादून की वो सड़क जंगल से होकर गुज़रती थी। सुनसान, धुंध भरी। हर शनिवार वसुधा उस पर साइकिल चलाकर स्टेशन जाती थी। और हर शनिवार, उसके पीछे एक और साइकिल होती थी।
  - >-
    काली दाढ़ी वाला एक चुप आदमी। हमेशा उतनी ही दूरी पर। वसुधा रुकती, तो वो भी रुक जाता। वो मुड़कर उसकी तरफ़ जाती, तो वो ग़ायब हो जाता। सुनसान सड़क पर, हर शनिवार, वही साया।
  - >-
    मैं सावित्री हूँ। वसुधा एक जवान संगीत शिक्षिका थी, जो साल बागान नाम की एक जागीर में एक बच्ची को पियानो सिखाती थी। जब वो विक्रम के पास आई, तो डरी हुई कम, परेशान ज़्यादा थी।
  - >-
    उसने बताया, कुछ महीने पहले अख़बार में उसके नाम एक इश्तहार छपा था। उसके एक चाचा अफ़्रीका में गुज़र गए थे। फिर अफ़्रीका से लौटे दो अजनबी उससे मिले... किशननाथ और भानु प्रताप। चाचा के दोस्त।
  - >-
    किशननाथ ने उसे अपनी बेटी को पढ़ाने की नौकरी दी। तनख़्वाह बहुत अच्छी। किशननाथ भले आदमी थे, चुप-चुप से। पर भानु प्रताप... मोटा, गुस्सैल, और वो बार-बार वसुधा से शादी की बात करता था।
  - >-
    विक्रम ने कहा, "चाचा की मौत, दो अजनबी, अच्छी तनख़्वाह, और शादी की ज़िद। ये सब एक साथ क्यों?" फिर बोले, "सावित्री, इस शनिवार तुम उस सड़क पर जाओगी।"
  - >-
    शनिवार की सुबह मैं जंगल वाली सड़क के किनारे झाड़ियों में छिपकर बैठ गई। ठंड थी, धुंध थी, और सन्नाटा। थोड़ी देर में वसुधा की साइकिल आई। और कुछ ही पलों बाद... वो दाढ़ी वाला।
  - >-
    वसुधा अचानक मुड़ी। वो आदमी तुरंत अपनी साइकिल घुमाकर भागा। मैं झाड़ियों से निकली, और देखा... वो साल बागान जागीर के फाटक के अंदर मुड़कर ग़ायब हो गया।
  - >-
    मैंने विक्रम को बताया। वो बोले, "तुमने ये तो देखा कि वो कहाँ गया। पर ये नहीं देखा कि वो कौन है।" मैं झेंप गई। उसी हफ़्ते देहरादून की एक गली में मैंने कुछ और देखा। इंस्पेक्टर भैरव... एक लंबे काले कोट वाले आदमी से छिपकर बात कर रहे थे।
  - >-
    मैंने अपने नए कोडक कैमरे से चुपचाप एक तस्वीर ले ली। बाद में विक्रम ने तस्वीर देखी, और कुछ नहीं बोले। बस उसे अपनी डायरी में रख लिया।
  - >-
    रुकिए। एक साया, जो कभी पास नहीं आता। एक मोटा आदमी, जो शादी की ज़िद करता है। और अफ़्रीका से आई एक विरासत। आपको क्या लगता है, ये साया वसुधा का दुश्मन है... या कुछ और?
  - >-
    अगले शनिवार विक्रम ख़ुद गए। पर हम देर से पहुँचे। सड़क पर वसुधा की ख़ाली साइकिल पड़ी थी, और ताँगे के पहियों के निशान। तभी पीछे से वो दाढ़ी वाला साइकिल सवार तूफ़ान की तरह आया।
  - >-
    उसने हमें देखा, और चीखा, "वो उसे ले गए! भानु उसे ले गया!" उसकी आवाज़ में गुस्सा था, डर था। विक्रम बोले, "तुम उसके दुश्मन नहीं, रखवाले हो।" हम सब जंगल की ओर भागे।
  - >-
    जंगल की एक खुली जगह पर, भानु प्रताप वसुधा का हाथ पकड़े खड़ा था। सामने एक नक़ली पंडित, रघुनंदन, जल्दी-जल्दी मंत्र पढ़ रहा था। वसुधा के मुँह पर कपड़ा बँधा था। ज़बरदस्ती की शादी।
  - >-
    दाढ़ी वाले ने पिस्तौल निकाली, और गोली चला दी। भानु प्रताप कंधा पकड़कर गिर पड़ा। पंडित भागने लगा, पर विक्रम ने उसे अपनी छड़ी से गिरा दिया।
  - >-
    दाढ़ी वाले ने अपनी नक़ली दाढ़ी उतारी। वो किशननाथ थे। वसुधा के मालिक। "मैं उससे प्यार करता हूँ, विक्रम बाबू। हर शनिवार इसलिए पीछे चलता था, ताकि भानु उसे अकेले में न पकड़ ले।"
  - >-
    किशननाथ ने सब बताया। अफ़्रीका में वसुधा के चाचा बहुत अमीर होकर मरे थे, और सारी दौलत वसुधा के नाम छोड़ गए थे। किशननाथ और भानु ये जानते थे। दोनों ने तय किया था, एक उससे शादी करेगा, और दौलत आपस में बाँट लेंगे।
  - >-
    "पर मैं उससे सचमुच प्यार करने लगा। और भानु ने ज़बरदस्ती का रास्ता चुना। मैं उसके सामने आ नहीं सकता था, इसलिए दाढ़ी लगाकर पीछे-पीछे चलता रहा।"
  - >-
    विक्रम ने पंडित की जेब से उसका प्रमाणपत्र निकाला। "ये पंडित नहीं, ढोंगी है। ये शादी, शादी नहीं।" वसुधा आज़ाद थी, और अमीर भी। उसने किशननाथ की तरफ़ देखा... पर कुछ नहीं कहा।
  - >-
    "एक साया, जो कभी पास नहीं आया... यही उसकी सच्चाई थी," विक्रम बोले। "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पंडित का नक़ली प्रमाणपत्र एक मंदिर कोष के नाम से बना था। नीचे मुहर लगी थी... 'पंकज सेवा सदन मंदिर कोष'। विक्रम ने उसे ऐसे देखा, जैसे किसी पुराने ज़ख़्म को छू लिया हो।
  - >-
    और रात को, उन्होंने मेरी खींची हुई तस्वीर फिर निकाली... भैरव, और वो काले कोट वाला आदमी। "सावित्री, भैरव उस दिन देहरादून में क्या कर रहे थे?" मेरे पास कोई जवाब नहीं था। आपके पास है? कमेंट में लिखिए।
