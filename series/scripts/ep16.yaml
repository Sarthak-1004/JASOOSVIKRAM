# EP 16 - सुनसान सड़क का साया (The Adventure of the Solitary Cyclist)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "हर शनिवार वही साया", title: "सुनसान जंगल की सड़क पर हर शनिवार पीछा करता एक साया", end_question: "वो कौन है?"}
  - {start_scene: 7, end_scene: 8, hook_text: "फाटक के अंदर ग़ायब", title: "झाड़ियों में छिपकर देखा... और साया फाटक में ग़ायब हो गया", end_question: "ग़ायब कैसे हुआ?"}
  - {start_scene: 12, end_scene: 14, hook_text: "जंगल में ज़बरदस्ती की शादी", title: "ख़ाली साइकिल, और जंगल में ज़बरदस्ती के फेरे...", end_question: "क्या वसुधा बच पाएगी?"}
script:
  - >-
    देहरादून की वह सुनसान और धुंध भरी सड़क जंगल के बीच से होकर गुज़रती थी। हर शनिवार वसुधा उस सड़क पर साइकिल चलाकर स्टेशन जाती थी। हर शनिवार उसके पीछे एक और साइकिल चलती थी।
  - >-
    उस साइकिल पर काली दाढ़ी वाला एक चुप आदमी होता था, जो हमेशा उतनी ही दूरी बनाए रखता था। वसुधा रुकती, तो वह भी रुक जाता था, और जब वह मुड़कर उसकी तरफ़ जाती, तो वह ग़ायब हो जाता था। उस सुनसान सड़क पर हर शनिवार वही साया उसका पीछा करता था।
  - >-
    वसुधा एक जवान संगीत शिक्षिका थी, जो साल बागान नाम की एक जागीर में एक बच्ची को पियानो सिखाती थी। जब वह जासूस विक्रम और डॉक्टर सावित्री के पास आई, तो वह डरी हुई कम और परेशान ज़्यादा थी।
  - >-
    उसने बताया कि कुछ महीने पहले अख़बार में उसके नाम एक इश्तहार छपा था, क्योंकि उसके एक चाचा अफ़्रीका में गुज़र गए थे। फिर अफ़्रीका से लौटे दो अजनबी, किशननाथ और भानु प्रताप, उससे मिले। दोनों ने ख़ुद को उसके चाचा का दोस्त बताया।
  - >-
    किशननाथ ने उसे अपनी बेटी को पढ़ाने की नौकरी दी, जिसकी तनख़्वाह बहुत अच्छी थी। किशननाथ एक भले और चुप रहने वाले आदमी थे। लेकिन भानु प्रताप मोटा और गुस्सैल था, और वह बार-बार वसुधा से शादी की बात करता था।
  - >-
    विक्रम ने कहा, "चाचा की मौत, दो अजनबी, अच्छी तनख़्वाह और शादी की ज़िद, ये सब बातें एक साथ क्यों हो रही हैं?" फिर वह बोले, "सावित्री, इस शनिवार तुम उस सड़क पर जाओगी।"
  - >-
    शनिवार की सुबह सावित्री जंगल वाली सड़क के किनारे झाड़ियों में छिपकर बैठ गईं, जहाँ ठंड, धुंध और सन्नाटा था। थोड़ी देर में वसुधा की साइकिल आई। कुछ ही पलों बाद उसके पीछे वह दाढ़ी वाला आदमी भी आ गया।
  - >-
    वसुधा अचानक मुड़ी, तो वह आदमी तुरंत अपनी साइकिल घुमाकर भागा। सावित्री झाड़ियों से बाहर निकलीं और उन्होंने देखा कि वह साल बागान जागीर के फाटक के अंदर मुड़कर ग़ायब हो गया।
  - >-
    सावित्री ने यह बात विक्रम को बताई, तो वह बोले, "तुमने यह तो देखा कि वह कहाँ गया, लेकिन यह नहीं देखा कि वह कौन है।" सावित्री झेंप गईं। उसी हफ़्ते देहरादून की एक गली में उन्होंने देखा कि इंस्पेक्टर भैरव लंबे काले कोट वाले एक आदमी से छिपकर बात कर रहे थे।
  - >-
    सावित्री ने अपने नए कोडक कैमरे से चुपचाप उनकी एक तस्वीर ले ली। बाद में विक्रम ने वह तस्वीर देखी, लेकिन वह कुछ नहीं बोले। उन्होंने बस उसे अपनी डायरी में रख लिया।
  - >-
    यहाँ एक पल रुककर सोचिए। एक साया था, जो कभी पास नहीं आता था, और एक मोटा आदमी था, जो शादी की ज़िद करता था। इन सबके पीछे अफ़्रीका से आई एक विरासत थी। आपको क्या लगता है कि वह साया वसुधा का दुश्मन था या कुछ और?
  - >-
    अगले शनिवार विक्रम ख़ुद वहाँ गए, लेकिन वे देर से पहुँचे। सड़क पर वसुधा की ख़ाली साइकिल पड़ी थी और पास में ताँगे के पहियों के निशान थे। तभी पीछे से वह दाढ़ी वाला साइकिल सवार तूफ़ान की तरह आया।
  - >-
    उसने उन्हें देखा और चीखकर कहा, "भानु उसे उठाकर ले गया है!" उसकी आवाज़ में गुस्सा भी था और डर भी था। विक्रम बोले, "तुम उसके दुश्मन नहीं, बल्कि उसके रखवाले हो।" फिर वे सब जंगल की ओर भागे।
  - >-
    जंगल की एक खुली जगह पर भानु प्रताप वसुधा का हाथ पकड़े खड़ा था। सामने रघुनंदन नाम का एक नक़ली पंडित जल्दी-जल्दी मंत्र पढ़ रहा था। वसुधा के मुँह पर कपड़ा बँधा था और उसकी ज़बरदस्ती शादी करवाई जा रही थी।
  - >-
    दाढ़ी वाले आदमी ने पिस्तौल निकाली और गोली चला दी, जिससे भानु प्रताप कंधा पकड़कर गिर पड़ा। पंडित भागने लगा, लेकिन विक्रम ने उसे अपनी छड़ी से गिरा दिया।
  - >-
    फिर उस आदमी ने अपनी नक़ली दाढ़ी उतार दी। वह वसुधा के मालिक किशननाथ थे। उन्होंने कहा, "मैं उससे प्यार करता हूँ, विक्रम बाबू। मैं हर शनिवार इसलिए उसके पीछे चलता था, ताकि भानु उसे अकेले में न पकड़ ले।"
  - >-
    किशननाथ ने सारी बात बताई। अफ़्रीका में वसुधा के चाचा बहुत अमीर होकर मरे थे और अपनी सारी दौलत वसुधा के नाम छोड़ गए थे। किशननाथ और भानु यह बात जानते थे। दोनों ने तय किया था कि उनमें से एक उससे शादी करेगा और वे दौलत आपस में बाँट लेंगे।
  - >-
    किशननाथ बोले, "लेकिन मैं उससे सचमुच प्यार करने लगा, और भानु ने ज़बरदस्ती का रास्ता चुन लिया। मैं उसके सामने नहीं आ सकता था, इसलिए दाढ़ी लगाकर उसके पीछे-पीछे चलता रहा।"
  - >-
    विक्रम ने पंडित की जेब से उसका प्रमाणपत्र निकाला और कहा, "यह पंडित नहीं, एक ढोंगी है, इसलिए यह शादी कोई शादी नहीं है।" वसुधा अब आज़ाद भी थी और अमीर भी। उसने किशननाथ की तरफ़ देखा, लेकिन कुछ नहीं कहा।
  - >-
    विक्रम बोले, "वह साया कभी पास नहीं आया, और यही उसकी सच्चाई थी। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पंडित का नक़ली प्रमाणपत्र एक मंदिर कोष के नाम से बना था। उसके नीचे 'पंकज सेवा सदन मंदिर कोष' की मुहर लगी थी। विक्रम ने उसे ऐसे देखा, जैसे किसी ने उनका कोई पुराना ज़ख़्म छू लिया हो।
  - >-
    रात को उन्होंने सावित्री की खींची हुई वह तस्वीर फिर निकाली, जिसमें भैरव और काले कोट वाला आदमी थे। उन्होंने पूछा, "सावित्री, भैरव उस दिन देहरादून में क्या कर रहे थे?" सावित्री के पास इसका कोई जवाब नहीं था। क्या आपके पास इसका जवाब है? अपना जवाब कमेंट में लिखिए।
