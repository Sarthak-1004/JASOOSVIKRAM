# EP 12 - पर्दे पर अजीब पंजे (The Crooked Man)
clips:
  - {start_scene: 1, end_scene: 3, hook_text: "बंद कमरा, अजीब पंजे", title: "बंद कमरे में मरा कर्नल... और पर्दे पर किसी जानवर के पंजे", end_question: "ये पंजे किसके थे?"}
  - {start_scene: 8, end_scene: 9, hook_text: "'कायर! दग़ाबाज़!'", title: "लैंप के नीचे मिला एक कुबड़ा आदमी, जिसे सब मरा समझते थे", end_question: "किसने किसको धोखा दिया?"}
  - {start_scene: 11, end_scene: 12, hook_text: "डिब्बे में कुछ हिल रहा है", title: "अँधेरी धर्मशाला... और डिब्बे के अंदर कुछ सरसराया", end_question: "डिब्बे में क्या था?"}
script:
  - >-
    मेरठ छावनी में वह बरसात की एक रात थी। कर्नल अमरजीत सिंह भुल्लर के बंगले के बंद कमरे से उनकी पत्नी की चीख सुनाई दी, "तुम कायर और दग़ाबाज़ हो!" उसके बाद एक भयानक धमाका हुआ और फिर सन्नाटा छा गया।
  - >-
    कमरे का दरवाज़ा अंदर से बंद था और उसकी चाबी ग़ायब थी, इसलिए नौकर खिड़की तोड़कर अंदर घुसे। कर्नल फ़र्श पर मरे पड़े थे और उनका चेहरा ऐसे ख़ौफ़ में जमा हुआ था, जैसे उन्होंने मौत को सामने देखा हो। उनकी पत्नी नंदिनी बेहोश पड़ी थीं।
  - >-
    कमरे के सफ़ेद पर्दे पर किसी अजीब जानवर के छोटे-छोटे पंजों के निशान थे, जो न बिल्ली के थे और न कुत्ते के। कमरा बंद था, कर्नल मर चुके थे और पर्दे पर वे अजीब पंजे छपे हुए थे।
  - >-
    इस मामले की जाँच के लिए जासूस विक्रम और डॉक्टर सावित्री वहाँ पहुँचे। कर्नल के माथे पर चोट का निशान था और फ़ौजी पुलिस ने फ़ौरन नंदिनी को क़त्ल के इल्ज़ाम में पकड़ लिया था। बेहोश होने से पहले नंदिनी बस 'हेमंत' नाम बुदबुदाई थीं।
  - >-
    नंदिनी को छावनी में हर कोई पसंद करता था, क्योंकि वह ग़रीबों की मदद करती थीं और अस्पताल में सेवा करती थीं। कर्नल से उनकी शादी को तीस साल हो गए थे। इतने सालों में किसी ने उन्हें ऊँची आवाज़ में बोलते नहीं सुना था।
  - >-
    विक्रम ने पर्दे के निशान बहुत ग़ौर से देखे और कहा, "इस जानवर का शरीर लंबा है, पैर छोटे हैं और नाख़ून आगे को मुड़े हुए हैं। यह बिल्ली से छोटा है, लेकिन पर्दे पर चढ़ सकता है।" फिर उन्होंने खिड़की के बाहर लॉन को देखा, जहाँ एक आदमी के पैरों के निशान थे।
  - >-
    पैरों के वे निशान लॉन पार करके खिड़की तक आते थे और फिर वापस चले जाते थे। विक्रम बोले, "इस कमरे में कोई और भी था और उसके साथ वह जानवर भी था। चाबी भी वही आदमी लेकर गया है।"
  - >-
    नंदिनी की सहेली रोज़ी डिसूज़ा उस शाम उनके साथ घर लौटी थी। पहले तो वह कुछ भी बताने को तैयार नहीं थी, लेकिन फिर रो पड़ी। उसने कहा, "रास्ते में लैंप के नीचे हमें एक आदमी मिला था, जो बुरी तरह मुड़ा हुआ और कुबड़ा था, और वह नंदिनी को जानता था।"
  - >-
    रोज़ी ने आगे बताया, "उसे देखते ही नंदिनी का रंग उड़ गया और वह बोलीं, 'हेमंत, क्या तुम ज़िंदा हो?' दोनों ने कुछ देर अकेले में बात की। जब नंदिनी घर लौटीं, तो वह गुस्से से काँप रही थीं।"
  - >-
    यहाँ एक पल रुककर सोचिए। एक बंद कमरा था, कर्नल के माथे पर चोट थी और पर्दे पर किसी अनजान जानवर के पंजे थे। एक कुबड़ा आदमी भी था, जिसे सब मरा हुआ समझते थे। क्या आपने पहचाना कि वे पंजे किस जानवर के थे?
  - >-
    विक्रम ने छावनी के बाहर की धर्मशालाओं में पूछताछ की। वहाँ उन्हें एक मदारी के बारे में पता चला, जो अपने डिब्बे में एक जानवर रखता था और साँपों के साथ खेल दिखाता था। विक्रम बोले, "वह जानवर नेवला है, जो साँप का दुश्मन होता है।"
  - >-
    विक्रम और सावित्री एक छोटी और अँधेरी धर्मशाला में पहुँचे। वहाँ एक कोने में बुरी तरह मुड़ा हुआ एक आदमी बैठा था। उसके पास लकड़ी का एक डिब्बा रखा था, जिसके अंदर कुछ सरसरा रहा था।
  - >-
    विक्रम ने कहा, "हेमंत काले, मुझे सब कुछ पता है। अगर तुम सच नहीं बताओगे, तो नंदिनी को फाँसी हो जाएगी।" उस टूटे हुए आदमी की आँखों में आँसू आ गए और वह बोला, "नहीं, नंदिनी को कुछ नहीं होना चाहिए।"
  - >-
    हेमंत ने बताया, "बरसों पहले मैं और अमरजीत मेसोपोटामिया की जंग में एक ही पलटन में थे। हम दोनों नंदिनी से प्यार करते थे, लेकिन नंदिनी मुझसे प्यार करती थी।"
  - >-
    उसने कहा, "एक रात अमरजीत ने मुझे जानबूझकर एक ख़तरनाक मोर्चे पर भेजा और दुश्मन को मेरी ख़बर दे दी। मुझे पकड़ लिया गया और मैं बरसों क़ैद में रहा, जहाँ मेरा शरीर टूटकर मुड़ गया। यहाँ सबको बताया गया कि मैं मर चुका हूँ।"
  - >-
    हेमंत बोला, "अमरजीत ने नंदिनी से शादी कर ली। उस शाम जब मैंने नंदिनी को सच बताया, तो वह घर जाकर अमरजीत पर चीख पड़ी। मैं खिड़की से अंदर गया, क्योंकि मैं बस एक बार उसकी आँखों में देखना चाहता था।"
  - >-
    उसने आगे कहा, "जैसे ही अमरजीत ने मुझे देखा, उसका बरसों पुराना पाप उसके सामने खड़ा हो गया। उसका चेहरा सफ़ेद पड़ गया और वह गिर पड़ा, जिससे उसका माथा अँगीठी से टकरा गया। मैंने उसे छुआ तक नहीं था। उसी बीच मेरा नेवला डिब्बे से निकलकर पर्दे पर चढ़ गया।"
  - >-
    हेमंत ने कहा, "नंदिनी बेहोश थी, इसलिए मैं घबरा गया और चाबी उठाकर भाग गया।" एक डॉक्टर के तौर पर सावित्री ने कर्नल की रिपोर्ट दोबारा देखी। उनकी मौत चोट से नहीं, बल्कि दिल के दौरे से हुई थी।
  - >-
    विक्रम बोले, "यहाँ कोई क़त्ल नहीं हुआ है। कर्नल को उसके अपने डर ने मारा है।" नंदिनी रिहा हो गईं और हेमंत अपने नेवले के साथ छावनी छोड़कर चला गया।
  - >-
    विक्रम ने कहा, "यह मामला पर्दे के पंजों, लॉन पर बने क़दमों और एक नाम से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    लेकिन जाते-जाते हेमंत ने एक ऐसी बात कही, जो सावित्री को हमेशा याद रही। उसने कहा, "बाबू जी, मैं तो रंगून में भीख माँग रहा था। एक अजनबी ने मुझे पैसे और टिकट दिया और कहा कि मेरठ जाकर अपने पुराने दोस्त से मिलो। उसके ख़त बैंगनी स्याही में लिखे थे और उनसे केवड़े की ख़ुशबू आती थी।"
  - >-
    यह सुनकर विक्रम का चेहरा सख़्त हो गया। उन्होंने कहा, "किसी ने यह मुलाक़ात जानबूझकर करवाई है, सावित्री। कर्नल के पास फ़ौज के गोला-बारूद के ठेके थे, तो अब वे ठेके किसे मिलेंगे?" आपको क्या लगता है कि क्या हेमंत को माफ़ी मिलनी चाहिए थी? अपना जवाब कमेंट में लिखिए।
