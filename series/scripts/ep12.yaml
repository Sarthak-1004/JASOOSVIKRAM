# EP 12 - पर्दे पर अजीब पंजे (The Crooked Man)
clips:
  - {start_scene: 1, end_scene: 3, hook_text: "बंद कमरा, अजीब पंजे", title: "बंद कमरे में मरा कर्नल... और पर्दे पर किसी जानवर के पंजे", end_question: "ये पंजे किसके थे?"}
  - {start_scene: 8, end_scene: 9, hook_text: "'कायर! दग़ाबाज़!'", title: "लैंप के नीचे मिला एक कुबड़ा आदमी, जिसे सब मरा समझते थे", end_question: "किसने किसको धोखा दिया?"}
  - {start_scene: 11, end_scene: 12, hook_text: "डिब्बे में कुछ हिल रहा है", title: "अँधेरी धर्मशाला... और डिब्बे के अंदर कुछ सरसराया", end_question: "डिब्बे में क्या था?"}
script:
  - >-
    मेरठ छावनी। बरसात की रात। कर्नल अमरजीत सिंह भुल्लर के बंगले के बंद कमरे से उनकी पत्नी की चीख आई... "कायर! दग़ाबाज़!" फिर एक भयानक धमाका। फिर सन्नाटा।
  - >-
    दरवाज़ा अंदर से बंद था, चाबी ग़ायब। नौकर खिड़की तोड़कर अंदर घुसे। कर्नल फ़र्श पर मरे पड़े थे, चेहरा ऐसे ख़ौफ़ में जमा हुआ, जैसे मौत को सामने देखा हो। उनकी पत्नी नंदिनी बेहोश थीं।
  - >-
    और सफ़ेद पर्दे पर... किसी अजीब जानवर के छोटे-छोटे पंजों के निशान थे। न बिल्ली के, न कुत्ते के। बंद कमरा, मरा हुआ कर्नल... और पर्दे पर अजीब पंजे।
  - >-
    मैं सावित्री हूँ। कर्नल के माथे पर चोट का निशान था। फ़ौजी पुलिस ने फ़ौरन नंदिनी को क़त्ल के इल्ज़ाम में पकड़ लिया। बेहोश होने से पहले वो बस एक नाम बुदबुदाई थीं... "हेमंत।"
  - >-
    नंदिनी को छावनी में हर कोई पसंद करता था। ग़रीबों की मदद करतीं, अस्पताल में सेवा करतीं। कर्नल से उनकी शादी को तीस साल हो गए थे। इतने सालों में किसी ने उन्हें ऊँची आवाज़ में बोलते नहीं सुना था।
  - >-
    विक्रम ने पर्दे के निशान बहुत ग़ौर से देखे। "लंबा शरीर, छोटे पैर, नाख़ून आगे को मुड़े हुए। ये जानवर बिल्ली से छोटा है, पर पर्दे पर चढ़ सकता है।" फिर उन्होंने खिड़की के बाहर लॉन देखा। वहाँ एक आदमी के पैरों के निशान थे।
  - >-
    पैरों के निशान लॉन पार करके खिड़की तक आते थे, और फिर वापस जाते थे। "कोई और भी कमरे में था," विक्रम बोले। "और उसके साथ ये जानवर भी। चाबी वही लेकर गया।"
  - >-
    नंदिनी की सहेली, रोज़ी डिसूज़ा, उस शाम उनके साथ घर लौटी थी। पहले तो वो कुछ बताने को तैयार नहीं थी। फिर रो पड़ी। "रास्ते में लैंप के नीचे हमें एक आदमी मिला था। बुरी तरह मुड़ा हुआ, कुबड़ा। और वो नंदिनी को जानता था।"
  - >-
    "उसे देखते ही नंदिनी का रंग उड़ गया। वो बोलीं, 'हेमंत... तुम ज़िंदा हो?' दोनों ने कुछ देर अकेले में बात की। फिर नंदिनी घर लौटीं, तो गुस्से से काँप रही थीं।"
  - >-
    रुकिए। एक बंद कमरा। माथे पर चोट। पर्दे पर किसी अनजान जानवर के पंजे। और एक कुबड़ा आदमी, जिसे सब मरा समझते थे। क्या आपने पहचाना, ये पंजे किस जानवर के थे?
  - >-
    विक्रम ने छावनी के बाहर की धर्मशालाओं में पूछताछ की। एक मदारी के बारे में पता चला, जो अपने डिब्बे में एक जानवर रखता है, और साँपों के साथ खेल दिखाता है। "नेवला," विक्रम बोले। "साँप का दुश्मन।"
  - >-
    हम एक छोटी, अँधेरी धर्मशाला में पहुँचे। कोने में एक बुरी तरह मुड़ा हुआ आदमी बैठा था। पास में लकड़ी का एक डिब्बा रखा था, जिसके अंदर कुछ सरसरा रहा था।
  - >-
    विक्रम ने कहा, "हेमंत काले। मुझे सब पता है। अगर तुम सच नहीं बताओगे, तो नंदिनी को फाँसी हो जाएगी।" उस टूटे हुए आदमी की आँखों में आँसू आ गए। "नहीं... नंदिनी को नहीं।"
  - >-
    "बरसों पहले, मैं और अमरजीत एक ही पलटन में थे। मेसोपोटामिया की जंग में। हम दोनों नंदिनी से प्यार करते थे। और नंदिनी... मुझसे प्यार करती थी।"
  - >-
    "एक रात अमरजीत ने मुझे एक ख़तरनाक मोर्चे पर भेजा। जानबूझकर। दुश्मन को मेरी ख़बर दे दी गई। मुझे पकड़ लिया गया। बरसों क़ैद में रहा। मेरा शरीर टूट गया, मुड़ गया। और यहाँ सबको बताया गया कि मैं मर चुका हूँ।"
  - >-
    "अमरजीत ने नंदिनी से शादी कर ली। उस शाम जब मैंने नंदिनी को सच बताया, वो घर जाकर अमरजीत पर चीख पड़ी... 'कायर! दग़ाबाज़!' मैं खिड़की से अंदर गया। बस उसकी आँखों में एक बार देखना चाहता था।"
  - >-
    "पर जैसे ही अमरजीत ने मुझे देखा... बरसों पुराना पाप उसके सामने खड़ा था। उसका चेहरा सफ़ेद पड़ गया, और वो गिर पड़ा। माथा अँगीठी से टकराया। मैंने उसे छुआ तक नहीं। मेरा नेवला डिब्बे से निकलकर पर्दे पर चढ़ गया।"
  - >-
    "नंदिनी बेहोश थी। मैं घबरा गया, चाबी उठाई, और भाग गया।" एक डॉक्टर के तौर पर मैंने कर्नल की रिपोर्ट दोबारा देखी। मौत चोट से नहीं, दिल के दौरे से हुई थी।
  - >-
    विक्रम बोले, "कोई क़त्ल नहीं हुआ। कर्नल को उसके अपने डर ने मारा।" नंदिनी रिहा हो गईं। हेमंत ने छावनी छोड़ दी, अपने नेवले के साथ।
  - >-
    "पर्दे पर पंजे, लॉन पर क़दम, और एक नाम..." विक्रम ने कहा, "सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    पर जाते-जाते हेमंत ने एक बात कही, जो मुझे आज तक याद है। "बाबू जी, मैं तो रंगून में भीख माँग रहा था। एक अजनबी ने मुझे पैसे दिए, टिकट दिया, कहा 'मेरठ जाओ, अपने पुराने दोस्त से मिलो।' उसके ख़त बैंगनी स्याही में थे, और उनसे केवड़े की ख़ुशबू आती थी।"
  - >-
    विक्रम का चेहरा सख़्त हो गया। "किसी ने ये मुलाक़ात जानबूझकर करवाई, सावित्री। कर्नल के पास फ़ौज के गोला-बारूद के ठेके थे। अब वो ठेके किसे मिलेंगे?" आपको क्या लगता है, क्या हेमंत को माफ़ी मिलनी चाहिए थी? कमेंट करें।
