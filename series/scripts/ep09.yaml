# EP 9 - कुत्ता क्यों नहीं भौंका? (Silver Blaze)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "चैंपियन घोड़ा ग़ायब", title: "रेस से एक रात पहले चैंपियन घोड़ा ग़ायब, ट्रेनर की लाश", end_question: "घोड़ा कहाँ गया?"}
  - {start_scene: 9, end_scene: 10, hook_text: "कुत्ते ने कुछ नहीं किया", title: "'कुत्ते ने तो कुछ किया ही नहीं' - 'यही तो अजीब है'", end_question: "कुत्ता क्यों नहीं भौंका? कमेंट में बताइए।"}
  - {start_scene: 13, end_scene: 15, hook_text: "भूरा घोड़ा जीत गया", title: "रेस में एक अनजान भूरा घोड़ा सबसे आगे निकल गया...", end_question: "क्या ये वही घोड़ा है?"}
script:
  - >-
    लखनऊ कप से एक रात पहले, महाराज विजयेंद्र का सफ़ेद घोड़ा, बादल, अपने अस्तबल से ग़ायब हो गया। और सुबह, घास के मैदान में उसका ट्रेनर गोपाल मरा पड़ा मिला। उसके हाथ में एक छोटा सा, सर्जन वाला चाकू था।
  - >-
    अस्तबल पर रात भर पहरा था। एक बड़ा, ख़ूँख़ार कुत्ता वहाँ बँधा रहता था, जो किसी अजनबी की आहट पर आसमान सिर पर उठा लेता था। पर उस रात... वो एक बार भी नहीं भौंका।
  - >-
    मैं सावित्री हूँ। उस हफ़्ते लखनऊ में हर कोई एक ही बात कर रहा था। बादल, हिंदुस्तान का सबसे तेज़ घोड़ा, और लाखों की शर्तें। इंस्पेक्टर भैरव भी छुट्टी पर वहीं थे, और उन्होंने फ़ौरन एक आदमी को गिरफ़्तार कर लिया।
  - >-
    वो एक चिकना-चुपड़ा जुआरी था, जो उस शाम अस्तबल के आसपास देखा गया था। उसने अस्तबल के लड़के, लखन, से घोड़े के बारे में पूछताछ की थी। "यही चोर है, यही क़ातिल!" भैरव ने ऐलान किया।
  - >-
    विक्रम ने अस्तबल के लड़के से बात की। उस रात लखन बेहोश पड़ा मिला था। उसके खाने में अफ़ीम मिली थी। "उस रात खाने में क्या बना था?" विक्रम ने पूछा। "मसालेदार मटन करी, साहब।"
  - >-
    "अफ़ीम का स्वाद कड़वा होता है," विक्रम ने मुझसे धीरे से कहा। "पर तेज़ मसालेदार करी में छिप जाता है। जिसने भी अफ़ीम डाली, उसे पहले से पता था कि उस रात करी बनेगी। वो बाहर का जुआरी ये कैसे जानता?"
  - >-
    गोपाल की जेब से एक दर्ज़ी का बिल निकला। रेशमी साड़ियों का, बहुत महँगा। पर गोपाल की पत्नी ने कहा, उसे कभी कोई रेशमी साड़ी नहीं मिली। विक्रम ने बिल चुपचाप अपनी जेब में रख लिया।
  - >-
    फिर विक्रम ने चरवाहे से एक अजीब सवाल पूछा। "पिछले दिनों तुम्हारी भेड़ों में कुछ अनोखा हुआ?" चरवाहा चौंका। "जी साहब। तीन भेड़ें अचानक लँगड़ी हो गईं। पता नहीं कैसे।"
  - >-
    भैरव ने झुँझलाकर पूछा, "विक्रम बाबू, भेड़ों से क्या लेना? कोई और बात, जिस पर मुझे ध्यान देना चाहिए?" विक्रम बोले, "हाँ। रात को कुत्ते का अजीब बर्ताव।" "पर कुत्ते ने तो कुछ किया ही नहीं!" "यही तो अजीब है, इंस्पेक्टर साहब।"
  - >-
    रुकिए। एक कुत्ता, जो हर अजनबी पर भौंकता है, उस रात चुप रहा। तो घोड़े को ले जाने वाला अजनबी नहीं था। आप बताइए, कुत्ता क्यों नहीं भौंका? कमेंट में अपना जवाब लिखिए।
  - >-
    "कुत्ता उसे जानता था," विक्रम बोले। "जो रात को घोड़ा लेकर निकला, वो इसी अस्तबल का आदमी था।" फिर वो मैदान में उतरे, और घोड़े के खुरों के निशान ढूँढ़ने लगे। निशान दूर, पास वाले अस्तबल की ओर जाते थे।
  - >-
    पास वाला अस्तबल, बादल के सबसे बड़े मुक़ाबले वाले घोड़े का था। वहाँ के मालिक ने क़सम खाई, उसने कोई सफ़ेद घोड़ा नहीं देखा। विक्रम एक भूरे घोड़े के पास रुके, उसके माथे को छुआ, और मुस्करा दिए। कुछ नहीं बोले।
  - >-
    रेस का दिन। पूरा लखनऊ मैदान में उमड़ आया था। महाराज विजयेंद्र परेशान थे। "विक्रम बाबू, बादल नहीं मिला तो?" विक्रम बोले, "महाराज, बस रेस देखिए।"
  - >-
    भीड़ में राय बहादुर देवेंद्रनाथ भी थे, बनारस से आए हुए। मुस्कुराते हुए उन्होंने बताया कि उन्होंने बादल के ख़िलाफ़ बड़ी शर्त लगाई है। "घोड़ा ही नहीं है, तो जीतेगा कौन?"
  - >-
    रेस शुरू हुई। एक भूरा घोड़ा, जिसके माथे पर हल्का सा सफ़ेद धब्बा झलक रहा था, बिजली की तरह सबसे आगे निकल गया। पूरा मैदान चीख उठा। वो घोड़ा जीत गया।
  - >-
    विक्रम ने एक भीगा कपड़ा लेकर घोड़े का माथा पोंछा। भूरा रंग उतरने लगा। नीचे से सफ़ेद चमड़ी निकली। "महाराज," विक्रम बोले, "आपका बादल। किसी ने उसे रंगकर छिपा दिया था।"
  - >-
    महाराज ने पूछा, "और गोपाल का क़ातिल? उस जुआरी को फाँसी होगी?" विक्रम ने सिर हिलाया। "जुआरी बेगुनाह है, महाराज। गोपाल का क़ातिल यहीं खड़ा है।" और उन्होंने बादल की गर्दन थपथपाई।
  - >-
    "गोपाल पर भारी कर्ज़ था। उसका एक दूसरा घर भी था, जिसके बारे में किसी को नहीं पता था। रेशमी साड़ियाँ उसी के लिए थीं। कर्ज़ चुकाने के लिए उसने बादल के हारने पर शर्त लगाई।"
  - >-
    "उस रात उसने ख़ुद अस्तबल के लड़के को अफ़ीम दी, और बादल को चुपचाप बाहर ले गया। कुत्ता उसे जानता था, इसलिए चुप रहा। वो चाकू से बादल की पिछली टाँग की नस पर हल्का सा चीरा लगाना चाहता था, ताकि घोड़ा लँगड़ा जाए, और किसी को पता न चले।"
  - >-
    "इसका अभ्यास उसने भेड़ों पर किया था। पर बादल ने अँधेरे में चाकू की चमक देखी, और पूरी ताक़त से लात मार दी। क़ातिल घोड़ा था, महाराज। और उसने अपनी जान बचाई। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    भागा हुआ बादल पास वाले अस्तबल के मालिक को मिला था, जिसने लालच में उसे रंगकर छिपा दिया। उस शाम देवेंद्रनाथ ने हँसते हुए सट्टेबाज़ को अपनी हारी हुई शर्त की रक़म चुकाई। सट्टेबाज़ ने पैसे एक अजीब बटुए में रखे... काले रेशम पर कढ़ा एक छोटा सा काला फूल।
  - >-
    मैंने सोचा, बस एक डिज़ाइन होगा। पर विक्रम की नज़र उस बटुए पर देर तक टिकी रही। ये वही सट्टेबाज़ था, जिसने गोपाल को कर्ज़ दिया था। आपने कुत्ते वाली पहेली सुलझाई थी? सच-सच कमेंट में बताइए।
