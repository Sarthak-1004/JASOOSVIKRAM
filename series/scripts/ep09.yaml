  - {start_scene: 9, end_scene: 10, hook_text: "कुत्ते ने कुछ नहीं किया", title: "'कुत्ते ने तो कुछ किया ही नहीं' - 'यही तो अजीब है'", end_question: "कुत्ता क्यों नहीं भौंका? कमेंट में बताइए।"}
  - {start_scene: 13, end_scene: 15, hook_text: "भूरा घोड़ा जीत गया", title: "रेस में एक अनजान भूरा घोड़ा सबसे आगे निकल गया...", end_question: "क्या ये वही घोड़ा है?"}
script:
  - >-
    लखनऊ कप से एक रात पहले महाराज विजयेंद्र का सफ़ेद घोड़ा बादल अपने अस्तबल से ग़ायब हो गया। सुबह घास के मैदान में उसका ट्रेनर गोपाल मरा हुआ मिला। उसके हाथ में वैसा ही एक छोटा सा चाकू था, जैसा सर्जन इस्तेमाल करते हैं।
  - >-
    अस्तबल पर रात भर पहरा रहता था। वहाँ एक बड़ा और ख़ूँख़ार कुत्ता बँधा रहता था, जो किसी भी अजनबी की आहट पर आसमान सिर पर उठा लेता था। लेकिन उस रात वह कुत्ता एक बार भी नहीं भौंका।
  - >-
    उस हफ़्ते जासूस विक्रम और डॉक्टर सावित्री लखनऊ में थे, जहाँ हर कोई हिंदुस्तान के सबसे तेज़ घोड़े बादल और उस पर लगी लाखों की शर्तों की बात कर रहा था। इंस्पेक्टर भैरव भी छुट्टी पर वहीं थे और उन्होंने फ़ौरन एक आदमी को गिरफ़्तार कर लिया।
  - >-
    वह एक चिकना-चुपड़ा जुआरी था, जिसे उस शाम अस्तबल के आसपास देखा गया था। उसने अस्तबल के लड़के लखन से घोड़े के बारे में पूछताछ भी की थी। भैरव ने ऐलान कर दिया, "यही चोर है और यही क़ातिल है!"
  - >-
    विक्रम ने अस्तबल के लड़के से बात की। उस रात लखन बेहोश पड़ा मिला था और उसके खाने में अफ़ीम मिली थी। विक्रम ने पूछा, "उस रात खाने में क्या बना था?" लखन ने जवाब दिया, "उस रात मसालेदार मटन करी बनी थी, साहब।"
  - >-
    विक्रम ने सावित्री से धीरे से कहा, "अफ़ीम का स्वाद कड़वा होता है, लेकिन वह तेज़ मसालेदार करी में छिप जाता है। जिसने भी अफ़ीम मिलाई, उसे पहले से पता था कि उस रात करी बनेगी। बाहर का कोई जुआरी यह बात कैसे जान सकता था?"
  - >-
    गोपाल की जेब से एक दर्ज़ी का बिल निकला, जो रेशमी साड़ियों का था और बहुत महँगा था। लेकिन गोपाल की पत्नी ने कहा कि उसे कभी कोई रेशमी साड़ी नहीं मिली। विक्रम ने वह बिल चुपचाप अपनी जेब में रख लिया।
  - >-
    फिर विक्रम ने वहाँ के चरवाहे से एक अजीब सवाल पूछा, "क्या पिछले दिनों तुम्हारी भेड़ों के साथ कुछ अनोखा हुआ है?" चरवाहा चौंककर बोला, "जी साहब, तीन भेड़ें अचानक लँगड़ी हो गईं और पता नहीं यह कैसे हुआ।"
  - >-
    भैरव ने झुँझलाकर पूछा, "विक्रम बाबू, भेड़ों से हमें क्या लेना है? क्या कोई और बात है, जिस पर मुझे ध्यान देना चाहिए?" विक्रम बोले, "हाँ, रात को कुत्ते का बर्ताव अजीब था।" भैरव ने कहा, "पर कुत्ते ने तो कुछ किया ही नहीं!" विक्रम बोले, "यही तो अजीब बात है, इंस्पेक्टर साहब।"
  - >-
    यहाँ एक पल रुककर सोचिए। जो कुत्ता हर अजनबी पर भौंकता था, वह उस रात चुप रहा। इसका मतलब है कि घोड़े को ले जाने वाला कोई अजनबी नहीं था। आप बताइए कि वह कुत्ता क्यों नहीं भौंका? अपना जवाब कमेंट में लिखिए।
  - >-
    विक्रम बोले, "कुत्ता उस आदमी को जानता था। जो रात को घोड़ा लेकर निकला, वह इसी अस्तबल का आदमी था।" फिर वह मैदान में उतरे और घोड़े के खुरों के निशान ढूँढ़ने लगे। वे निशान दूर एक पड़ोसी अस्तबल की ओर जा रहे थे।
  - >-
    वह पड़ोसी अस्तबल उस घोड़े का था, जो रेस में बादल का सबसे बड़ा मुक़ाबला था। वहाँ के मालिक ने क़सम खाई कि उसने कोई सफ़ेद घोड़ा नहीं देखा। विक्रम एक भूरे घोड़े के पास रुके, उन्होंने उसके माथे को छुआ और बिना कुछ बोले मुस्करा दिए।
  - >-
    रेस के दिन पूरा लखनऊ मैदान में उमड़ आया था। महाराज विजयेंद्र परेशान थे और उन्होंने पूछा, "विक्रम बाबू, अगर बादल नहीं मिला, तो क्या होगा?" विक्रम बोले, "महाराज, आप बस रेस देखिए।"
  - >-
    उस भीड़ में बनारस से आए राय बहादुर देवेंद्रनाथ भी मौजूद थे। उन्होंने मुस्कुराते हुए बताया कि उन्होंने बादल के ख़िलाफ़ एक बड़ी शर्त लगाई है। उन्होंने कहा, "जब घोड़ा ही नहीं है, तो वह जीतेगा कैसे?"
  - >-
    रेस शुरू हुई और एक भूरा घोड़ा, जिसके माथे पर हल्का सा सफ़ेद धब्बा झलक रहा था, बिजली की तरह सबसे आगे निकल गया। पूरा मैदान चीख उठा, क्योंकि वही घोड़ा रेस जीत गया।
  - >-
    विक्रम ने एक भीगा कपड़ा लेकर उस घोड़े का माथा पोंछा। उसका भूरा रंग उतरने लगा और नीचे से सफ़ेद चमड़ी निकल आई। विक्रम बोले, "महाराज, यह आपका बादल है। किसी ने इसे रंगकर छिपा दिया था।"
  - >-
    महाराज ने पूछा, "और गोपाल के क़ातिल का क्या हुआ? क्या उस जुआरी को फाँसी होगी?" विक्रम ने सिर हिलाकर कहा, "वह जुआरी बेगुनाह है, महाराज। गोपाल का क़ातिल यहीं खड़ा है।" यह कहकर उन्होंने बादल की गर्दन थपथपाई।
  - >-
    विक्रम ने बताया, "गोपाल पर भारी कर्ज़ था। उसका एक दूसरा घर भी था, जिसके बारे में किसी को पता नहीं था, और वे रेशमी साड़ियाँ उसी घर के लिए थीं। कर्ज़ चुकाने के लिए उसने बादल के हारने पर शर्त लगाई थी।"
  - >-
    उन्होंने आगे कहा, "उस रात गोपाल ने ख़ुद अस्तबल के लड़के को अफ़ीम दी और बादल को चुपचाप बाहर ले गया। कुत्ता उसे जानता था, इसलिए चुप रहा। वह चाकू से बादल की पिछली टाँग की नस पर हल्का सा चीरा लगाना चाहता था, ताकि घोड़ा लँगड़ा जाए और किसी को पता न चले।"
  - >-
    विक्रम बोले, "इसका अभ्यास उसने भेड़ों पर किया था। लेकिन बादल ने अँधेरे में चाकू की चमक देख ली और पूरी ताक़त से लात मार दी। क़ातिल यह घोड़ा था, महाराज, और इसने बस अपनी जान बचाई थी। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    भागा हुआ बादल पड़ोसी अस्तबल के मालिक को मिला था, जिसने लालच में उसे रंगकर छिपा दिया। उस शाम देवेंद्रनाथ ने हँसते हुए सट्टेबाज़ को अपनी हारी हुई शर्त की रक़म चुकाई। सट्टेबाज़ ने वे पैसे एक अजीब बटुए में रखे, जिसके काले रेशम पर एक छोटा सा काला फूल कढ़ा हुआ था।
  - >-
    सावित्री को लगा कि वह बस एक डिज़ाइन होगा, लेकिन विक्रम की नज़र उस बटुए पर देर तक टिकी रही। यह वही सट्टेबाज़ था, जिसने गोपाल को कर्ज़ दिया था। क्या आपने कुत्ते वाली पहेली सुलझा ली थी? सच-सच कमेंट में बताइए।
