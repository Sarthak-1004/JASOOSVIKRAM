# EP 21 - तीन गिलासों का झूठ (The Adventure of the Abbey Grange)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "तीन चोर, तीन गिलास", title: "राजा की लाश, बँधी हुई रानी, और मेज़ पर तीन गिलास", end_question: "क्या रानी सच बोल रही थीं?"}
  - {start_scene: 7, end_scene: 9, hook_text: "तलछट सिर्फ़ एक गिलास में", title: "तीन गिलास, पर तलछट सिर्फ़ एक में... और मल्लाह की गाँठ", end_question: "आपने गड़बड़ पकड़ी?"}
  - {start_scene: 16, end_scene: 16, hook_text: "आप हैं जूरी", title: "जासूस ने यहीं अदालत लगाई... जूरी आप हैं", end_question: "दोषी या निर्दोष? कमेंट करें।"}
script:
  - >-
    वह एक तूफ़ानी रात थी, जब दार्जिलिंग के एक चाय बाग़ान के बंगले में राजा बहादुर नरेंद्र सिंह अँगीठी के पास मरे हुए पड़े थे। उनकी जवान रानी मीनाक्षी एक नक़्क़ाशीदार कुर्सी से रस्सी से बँधी हुई थीं।
  - >-
    रानी ने काँपती आवाज़ में बताया कि तीन चोर खिड़की से घुसे थे और जब राजा ने विरोध किया, तो उन्होंने अँगीठी की छड़ से उन्हें मार डाला। मेज़ पर शराब के तीन गिलास रखे थे। वहाँ तीन चोर थे, तीन गिलास थे और एक झूठ भी था।
  - >-
    उस सर्दी में जासूस विक्रम और डॉक्टर सावित्री दार्जिलिंग में थे, जब पुलिस ने विक्रम को बुलाया। आसपास के बंगलों में एक गिरोह पहले भी चोरियाँ कर चुका था, इसलिए पुलिस को कोई शक नहीं था। पुलिस वालों ने कहा, "यह उसी गिरोह का काम है, विक्रम बाबू।"
  - >-
    रानी की बूढ़ी और वफ़ादार दाई फूलमती ने बताया कि राजा शराबी और ज़ालिम थे। उसने कहा, "वह रानी के गहने तक जुए में हार जाते थे और नशे में उन पर हाथ उठाते थे। आप रानी की बाँहों पर नील के निशान देख लीजिए।" यह सुनकर रानी ने अपनी बाँहें दुपट्टे में छिपा लीं।
  - >-
    विक्रम ने कमरा, गिलास और रस्सी देखी और फिर बोले, "सब ठीक लगता है, यह गिरोह का ही काम है।" इसके बाद वे दोनों स्टेशन की ओर चल पड़े। सावित्री हैरान थीं कि विक्रम इतनी जल्दी कैसे मान गए।
  - >-
    ट्रेन चल पड़ी और विक्रम खिड़की से बाहर घूरते रहे। अचानक वह उठे और उन्होंने ज़ंजीर खींच दी, जिससे ट्रेन चीख़ती हुई रुक गई। उन्होंने कहा, "सावित्री, नीचे उतरो! मैं बेवकूफ़ था, क्योंकि मैंने उन गिलासों पर ध्यान नहीं दिया!"
  - >-
    वे दोनों बंगले में लौट आए। विक्रम ने तीनों गिलास रोशनी में उठाकर कहा, "देखो, तीनों में शराब के निशान हैं। लेकिन नीचे बैठने वाली गाद, जिसे तलछट कहते हैं, सिर्फ़ एक गिलास में है।"
  - >-
    विक्रम ने समझाया, "अगर तीन लोगों ने एक ही बोतल से पिया होता, तो तलछट आख़िरी गिलास में होता। यहाँ किसी ने एक गिलास की बची हुई शराब बाक़ी दो गिलासों में डाली है, ताकि ऐसा लगे कि तीन लोग पी रहे थे।"
  - >-
    फिर विक्रम ने कुर्सी पर चढ़कर घंटी की रस्सी देखी, जो बहुत ऊँचाई से काटी गई थी। उन्होंने कहा, "रस्सी काटने वाला बहुत लंबा था। इसकी गाँठ भी देखो, यह जहाज़ियों वाली गाँठ है, और ऐसी गाँठ सिर्फ़ एक मल्लाह बाँधता है।"
  - >-
    यहाँ एक पल रुककर सोचिए। गिलास तीन थे, लेकिन तलछट सिर्फ़ एक में था। रस्सी ऊँचाई से कटी थी और उस पर एक मल्लाह की गाँठ लगी थी। क्या आपने गड़बड़ पकड़ ली? रानी झूठ क्यों बोल रही थीं?
  - >-
    विक्रम ने कलकत्ता तार भेजा, जिसका जवाब जल्दी ही आ गया। कुछ दिन पहले एक जहाज़ का अफ़सर, कैप्टन अरविंद राव, दार्जिलिंग आया था, जो लंबा और ताक़तवर था। बरसों पहले, जब रानी मीनाक्षी कुँवारी थीं, तब वह उनसे प्यार करता था।
  - >-
    विक्रम और सावित्री ने कैप्टन अरविंद को एक छोटे होटल में ढूँढ़ निकाला। उसने विक्रम को देखा और बिना डरे कहा, "आप सब जानते हैं। मुझे पता था कि कोई न कोई ज़रूर जान जाएगा।" उसकी आवाज़ में कोई पछतावा नहीं था।
  - >-
    अरविंद ने बताया, "उस रात मैं बस मीनाक्षी को एक बार देखने आया था और फूलमती ने मुझे अंदर आने दिया। तभी राजा शराब में धुत्त होकर आ गया और उसने मेरे सामने मीनाक्षी पर हाथ उठाया। फिर वह अपनी छड़ी लेकर मुझ पर झपटा।"
  - >-
    उसने कहा, "मैंने अँगीठी की छड़ उठाई और अपने बचाव में बस एक वार किया। वह गिरा और फिर नहीं उठा। मैं ख़ुद पुलिस के पास जाता, विक्रम बाबू, लेकिन मीनाक्षी ने कहा कि रस्सी बाँधो, गिलास सजाओ और चोरों की कहानी बना दो।"
  - >-
    अरविंद बोला, "मैंने रस्सी काटी, उन्हें बाँधा और अपनी आदत वाली गाँठ लगा दी। गिलास फूलमती ने सजाए और फिर मैं वहाँ से चला गया।" कमरे में सन्नाटा था और बाहर बारिश हो रही थी।
  - >-
    विक्रम बहुत देर तक चुप रहे और फिर बोले, "सावित्री, आज तुम जूरी हो और अदालत यहीं लगेगी। अभियुक्त ने एक ज़ालिम आदमी को अपने बचाव में और एक औरत की रक्षा के लिए मारा है। तुम्हारा फ़ैसला क्या है?"
  - >-
    सावित्री ने अरविंद को देखा और फिर उन्हें रानी की बाँहों के नीले निशान याद आए। उन्होंने कहा, "यह निर्दोष है।" विक्रम मुस्कराकर बोले, "जनता की आवाज़ ही भगवान की आवाज़ होती है। कैप्टन, आप आज़ाद हैं।"
  - >-
    विक्रम ने कहा, "आप एक साल के लिए विदेश चले जाइए और फिर लौट आइए। उसके बाद अगर रानी चाहें, तो आप उनसे मिल सकते हैं।" यह सुनकर अरविंद की आँखें भर आईं।
  - >-
    विक्रम बोले, "यह मामला एक गिलास के तलछट और एक मल्लाह की गाँठ से सुलझा। सच हमेशा छोटी चीज़ों में छिपा होता है, और कभी-कभी सच जानकर भी चुप रहना पड़ता है।"
  - >-
    लेकिन जिस गिरोह के नाम पर रानी ने वह झूठ गढ़ा था, वह गिरोह असली था। पुलिस की फ़ाइल में उसका निशान दर्ज था। वह निशान एक छोटा सा कमल था।
  - >-
    उस रात होटल की बालकनी में विक्रम ने पहली बार सावित्री से वह बात कही, जो वह बहुत दिनों से सोच रहे थे। उन्होंने कहा, "सावित्री, काला कमल हमारे बहुत क़रीब है। वह हमें जानता है और हमारी हर चाल देखता है।"
  - >-
    सावित्री ने पूछा, "वह कितना क़रीब है?" विक्रम ने कोई जवाब नहीं दिया और बस बादलों में छिपी कंचनजंघा को देखते रहे। अब आप जूरी हैं और आपको बताना है कि कैप्टन अरविंद दोषी हैं या निर्दोष। अपना फ़ैसला कमेंट में लिखिए।
