  - {start_scene: 16, end_scene: 16, hook_text: "आप हैं जूरी", title: "जासूस ने यहीं अदालत लगाई... जूरी आप हैं", end_question: "दोषी या निर्दोष? कमेंट करें।"}
script:
  - >-
    तूफ़ानी रात। दार्जिलिंग के एक चाय बाग़ान का बंगला। राजा बहादुर नरेंद्र सिंह अँगीठी के पास मरे पड़े थे। और उनकी जवान रानी, मीनाक्षी, एक नक़्क़ाशीदार कुर्सी से रस्सी से बँधी थीं।
  - >-
    रानी ने काँपती आवाज़ में बताया, तीन चोर खिड़की से घुसे। राजा ने विरोध किया, तो उन्होंने अँगीठी की छड़ से उन्हें मार डाला। मेज़ पर शराब के तीन गिलास थे। तीन चोर, तीन गिलास... और एक झूठ।
  - >-
    मैं सावित्री हूँ। उस सर्दी में हम दार्जिलिंग में थे, जब पुलिस ने विक्रम को बुलाया। आसपास के बंगलों में एक गिरोह पहले भी चोरियाँ कर चुका था। पुलिस को कोई शक नहीं था। "वही गिरोह है, विक्रम बाबू।"
  - >-
    रानी की बूढ़ी, वफ़ादार दाई, फूलमती, ने बताया कि राजा कैसे थे। शराबी, ज़ालिम। "रानी के गहने तक जुए में हार जाते थे, और नशे में हाथ उठाते थे। रानी की बाँहों पर नील के निशान देखिए।" रानी ने अपनी बाँहें दुपट्टे में छिपा लीं।
  - >-
    विक्रम ने कमरा देखा, गिलास देखे, रस्सी देखी। फिर बोले, "सब ठीक लगता है। गिरोह का ही काम है।" और हम स्टेशन चल पड़े। मैं हैरान थी। विक्रम इतनी जल्दी मान गए?
  - >-
    ट्रेन चल पड़ी। विक्रम खिड़की से बाहर घूरते रहे। अचानक वो उठे, और ज़ंजीर खींच दी। ट्रेन चीख़ती हुई रुकी। "सावित्री, उतरो! मैं बेवकूफ़ था। वो गिलास!"
  - >-
    हम बंगले में लौटे। विक्रम ने तीनों गिलास रोशनी में उठाए। "देखो। तीनों में शराब के निशान हैं। पर तलछट, यानी नीचे बैठा गाद... सिर्फ़ एक गिलास में है।"
  - >-
    "अगर तीन लोगों ने एक ही बोतल से पिया होता, तो तलछट आख़िरी गिलास में होता। पर यहाँ, किसी ने एक गिलास की बची शराब बाक़ी दो में डाली है, ताकि लगे कि तीन लोग पी रहे थे।"
  - >-
    फिर विक्रम ने कुर्सी पर चढ़कर घंटी की रस्सी देखी। रस्सी बहुत ऊँचाई से काटी गई थी। "चोर बहुत लंबा था। और ये गाँठ देखो। ये जहाज़ियों वाली गाँठ है। ऐसी गाँठ सिर्फ़ एक मल्लाह बाँधता है।"
  - >-
    रुकिए। तीन गिलास, पर तलछट सिर्फ़ एक में। ऊँचाई से कटी रस्सी, और एक मल्लाह की गाँठ। आपने गड़बड़ पकड़ी? रानी झूठ क्यों बोल रही हैं?
  - >-
    विक्रम ने कलकत्ता तार भेजा। जवाब आया... कुछ दिन पहले एक जहाज़ का अफ़सर, कैप्टन अरविंद राव, दार्जिलिंग आया था। लंबा, ताक़तवर। और बरसों पहले, जब रानी मीनाक्षी कुँवारी थीं, वो उनसे प्यार करता था।
  - >-
    हमने कैप्टन अरविंद को एक छोटे होटल में ढूँढ़ निकाला। उसने विक्रम को देखा, और बिना डरे कहा, "आप जानते हैं। मुझे पता था, कोई न कोई जान ही जाएगा।" उसकी आवाज़ में कोई पछतावा नहीं था।
  - >-
    "उस रात मैं बस मीनाक्षी को एक बार देखने आया था। फूलमती ने मुझे अंदर आने दिया। तभी राजा शराब में धुत्त आ गया। उसने मेरे सामने मीनाक्षी पर हाथ उठाया। फिर अपनी छड़ी लेकर मुझ पर झपटा।"
  - >-
    "मैंने अँगीठी की छड़ उठाई, और अपने बचाव में वार किया। बस एक वार। वो गिरा, और नहीं उठा।" अरविंद ने सिर उठाया। "मैं ख़ुद पुलिस के पास जाता, विक्रम बाबू। पर मीनाक्षी ने कहा, रस्सी बाँधो, गिलास सजाओ, चोरों की कहानी बनाओ।"
  - >-
    "मैंने रस्सी काटी, उन्हें बाँधा, और अपनी आदत वाली गाँठ लगा दी। गिलास फूलमती ने सजाए। और मैं चला गया।" कमरे में सन्नाटा था। बाहर बारिश हो रही थी।
  - >-
    विक्रम बहुत देर तक चुप रहे। फिर बोले, "सावित्री, आज तुम जूरी हो। अदालत यहीं लगेगी। अभियुक्त ने एक ज़ालिम आदमी को, अपने बचाव में, और एक औरत की रक्षा के लिए मारा। तुम्हारा फ़ैसला?"
  - >-
    मैंने अरविंद को देखा। फिर रानी की बाँहों के नीले निशान याद आए। मैंने कहा, "निर्दोष।" विक्रम मुस्कराए। "जनता की आवाज़, भगवान की आवाज़। कैप्टन, आप आज़ाद हैं।"
  - >-
    "एक साल के लिए विदेश चले जाइए। फिर लौटिए। और अगर रानी चाहें, तो..." विक्रम ने बात अधूरी छोड़ दी। अरविंद की आँखें भर आईं।
  - >-
    "एक गिलास का तलछट, और एक मल्लाह की गाँठ," विक्रम बोले। "सच हमेशा छोटी चीज़ों में छिपा होता है। और कभी-कभी, सच जानकर भी चुप रहना पड़ता है।"
  - >-
    पर जिस गिरोह के नाम पर रानी ने झूठ गढ़ा था, वो गिरोह असली था। और पुलिस की फ़ाइल में उसका निशान दर्ज था। एक छोटा सा कमल।
  - >-
    उस रात, होटल की बालकनी में, विक्रम ने पहली बार मुझसे वो बात कही, जो वो बहुत दिनों से सोच रहे थे। "सावित्री, काला कमल हमारे बहुत क़रीब है। वो हमें जानता है। हमारी हर चाल देखता है।"
  - >-
    "कितने क़रीब?" मैंने पूछा। विक्रम ने कोई जवाब नहीं दिया। बस बादलों में छिपी कंचनजंघा को देखते रहे। अब आप जूरी हैं। कैप्टन अरविंद... दोषी या निर्दोष? कमेंट में अपना फ़ैसला लिखिए।
