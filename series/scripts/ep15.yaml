# EP 15 - नाचते पुतले (The Adventure of the Dancing Men)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "दीवार पर नाचते पुतले", title: "हर सुबह दीवार पर चॉक के पुतले... और हर बार वो बेहोश हो जाती", end_question: "इनका मतलब क्या है?"}
  - {start_scene: 5, end_scene: 7, hook_text: "गुप्त लिपि टूटी", title: "पुतलों की गुप्त लिपि: पहला शब्द निकला 'इला'", end_question: "अगला शब्द आप डिकोड कीजिए - कमेंट में लिखिए।"}
  - {start_scene: 13, end_scene: 15, hook_text: "क़ातिल के लिए जाल", title: "जासूस ने क़ातिल की ही लिपि में उसे बुलावा भेजा...", end_question: "क्या क़ातिल जाल में फँसेगा?"}
script:
  - >-
    गोरखपुर की उस हवेली की सफ़ेद दीवार पर हर सुबह चॉक से बने छोटे-छोटे पुतले दिखते थे। वे हाथ-पैर फैलाए ऐसे बने होते थे, जैसे नाच रहे हों। उन्हें देखकर हवेली की मालकिन इला हर बार बेहोश हो जाती थी।
  - >-
    सवाल यह था कि वह बच्चों का मज़ाक था या कोई संदेश था? हर पुतला दूसरे से अलग था, क्योंकि किसी का हाथ ऊपर था, किसी का पैर मुड़ा हुआ था और किसी के हाथ में झंडा था। दीवार पर नाचता हुआ हर पुतला अपने आप में एक संदेश था।
  - >-
    गन्ने के खेतों के मालिक ठाकुर हीरालाल कुँवर एक भले और सीधे आदमी थे। वह उन पुतलों की नक़ल लेकर जासूस विक्रम और डॉक्टर सावित्री के पास आए। उन्होंने कहा, "मेरी पत्नी डर से मर रही है, विक्रम बाबू, लेकिन वह मुझे कुछ बताती नहीं है।"
  - >-
    हीरालाल ने इला से कलकत्ता में शादी की थी। शादी से पहले इला ने उनसे यह वादा लिया था कि वह उसके अतीत के बारे में कभी नहीं पूछेंगे। हीरालाल ने वह वादा निभाया, लेकिन अब वही वादा उन्हें अंदर से खा रहा था।
  - >-
    विक्रम ने काग़ज़ मेज़ पर फैलाए और पूरी रात उन पर झुके रहे। सुबह होते-होते उनकी आँखें चमक रही थीं। उन्होंने कहा, "यह बच्चों का खेल नहीं है, सावित्री, यह एक गुप्त लिपि है और इसका हर पुतला एक अक्षर है।"
  - >-
    विक्रम ने समझाया, "जो पुतला सबसे ज़्यादा बार आता है, वह 'अ' होगा, क्योंकि हिंदी में वही सबसे आम है। जिस पुतले के हाथ में झंडा है, वहाँ एक शब्द ख़त्म होता है।" इसके बाद वह एक-एक अक्षर जोड़ने लगे।
  - >-
    पहला शब्द 'इला' बना और अगली नक़ल में 'आ जाओ' निकला, यानी कोई इला को अपने पास बुला रहा था। फिर हीरालाल ने एक नई नक़ल भेजी। विक्रम ने उसे पढ़ा और वह कुर्सी से उछल पड़े।
  - >-
    उस नए संदेश में लिखा था कि इला, भगवान के पास जाने को तैयार हो जा। विक्रम चीखे, "सावित्री, अपना बैग उठाओ, हमें गोरखपुर की पहली गाड़ी पकड़नी है!" लेकिन पहली गाड़ी अगली सुबह ही मिल सकती थी।
  - >-
    वे दोनों सुबह गोरखपुर स्टेशन पहुँचे। स्टेशन मास्टर ने उन्हें देखते ही पूछा, "क्या आप ठाकुर साहब की हवेली जा रहे हैं? क्या आपने सुना नहीं कि कल रात वहाँ गोली चली है?"
  - >-
    वे बहुत देर से पहुँचे थे। ठाकुर हीरालाल कुँवर मर चुके थे और इला बुरी तरह घायल और बेहोश थीं। पुलिस का कहना था कि इला ने अपने पति को गोली मारकर ख़ुद को भी मारने की कोशिश की है।
  - >-
    यहाँ एक पल रुककर सोचिए। अब तक आपने कुछ पुतले और उनके अक्षर देख लिए हैं, इसलिए इस लिपि को आप भी तोड़ सकते हैं। सोचिए कि अगर आप विक्रम होते, तो इसी लिपि से क़ातिल को कैसे पकड़ते?
  - >-
    विक्रम ने कमरे को ध्यान से देखा और कहा, "यहाँ एक नहीं, बल्कि दो गोलियाँ चली हैं। खिड़की पर बारूद का निशान है, इसलिए एक गोली बाहर से चली थी।" बाहर फूलों की क्यारी में एक आदमी के जूतों के गहरे निशान थे।
  - >-
    हवेली के पास एक फ़ार्म पर कलकत्ता से आया हुआ एक अजनबी ठहरा था। विक्रम ने चॉक उठाई और नाचते पुतलों की लिपि में एक संदेश लिखा। फिर उन्होंने एक लड़के के हाथ वह संदेश उस फ़ार्म पर भिजवा दिया।
  - >-
    उस संदेश में बस इतना लिखा था कि तुरंत आओ। वह पुतलों की उसी लिपि में था, जिसे सिर्फ़ इला और वह अजनबी जानते थे। विक्रम बोले, "वह सोचेगा कि यह इला ने लिखा है, और वह ज़रूर आएगा।"
  - >-
    शाम ढलने लगी और वे अँधेरे कमरे में इंतज़ार करते रहे। तभी फाटक खुला और एक लंबा-चौड़ा आदमी तेज़ क़दमों से अंदर आया। वह भीमा सरदार था, जो कलकत्ता के अपराध की दुनिया का सबसे ख़तरनाक नाम था।
  - >-
    जैसे ही उसने दरवाज़ा खोला, स्थानीय इंस्पेक्टर और सिपाहियों ने उसे दबोच लिया। वह दहाड़ा, "मुझे इला ने बुलाया था!" विक्रम ने चॉक उसके सामने रखकर कहा, "नहीं, भीमा, तुम्हें मैंने बुलाया था।"
  - >-
    भीमा ने सब कुछ उगल दिया। इला कलकत्ता के एक गैंग सरदार की बेटी थी। पुतलों वाली वह लिपि उसी गैंग की थी, जिसे उसके पिता ने बनाया था, और भीमा कभी इला का मंगेतर था।
  - >-
    भीमा ने कहा, "इला उस दुनिया से भागकर यहाँ आ गई थी और मैं उसे वापस ले जाना चाहता था। उस रात उसके पति ने मुझ पर गोली चलाई, तो मैंने भी गोली चला दी। मैं इला को कभी चोट नहीं पहुँचाना चाहता था।"
  - >-
    इला बच गई और होश में आकर उसने बताया कि पति को मरा हुआ देखकर उसने ख़ुद को दोषी मान लिया था। विक्रम बोले, "यह मामला दो गोलियों, क्यारी में बने जूतों के निशानों और एक ऐसी लिपि से सुलझा, जिसे क़ातिल ख़ुद पढ़ सकता था। सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    भीमा की जेब से गैंग की पूरी लिपि की चाबी मिली। उसके आख़िर में एक ख़ास पुतला था, जो किसी अक्षर का नहीं था। वह कमल का एक फूल था और उसके आगे 'सरदार' लिखा हुआ था।
  - >-
    भीमा ने दाँत पीसकर कहा, "क्या तुम मुझे पकड़कर ख़ुश हो, जासूस? हमारे ऊपर भी कोई है, जिसे कमल कहते हैं।" उसकी जेब से उसी लिपि में लिखा एक आख़िरी संदेश भी मिला।
  - >-
    विक्रम ने उसे पढ़ा, तो उसमें लिखा था कि पंकज को ख़बर दो। क्या पंकज किसी आदमी का नाम था? विक्रम ने उसी रात बनारस में पंकज नाम के हर बदनाम आदमी की सूची मँगवाई। क्या विक्रम सही दिशा में सोच रहे थे? अपना जवाब कमेंट में लिखिए।
