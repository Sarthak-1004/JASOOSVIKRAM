# EP 15 - नाचते पुतले (The Adventure of the Dancing Men)
clips:
  - {start_scene: 1, end_scene: 2, hook_text: "दीवार पर नाचते पुतले", title: "हर सुबह दीवार पर चॉक के पुतले... और हर बार वो बेहोश हो जाती", end_question: "इनका मतलब क्या है?"}
  - {start_scene: 5, end_scene: 7, hook_text: "गुप्त लिपि टूटी", title: "पुतलों की गुप्त लिपि: पहला शब्द निकला 'इला'", end_question: "अगला शब्द आप डिकोड कीजिए - कमेंट में लिखिए।"}
  - {start_scene: 13, end_scene: 15, hook_text: "क़ातिल के लिए जाल", title: "जासूस ने क़ातिल की ही लिपि में उसे बुलावा भेजा...", end_question: "क्या क़ातिल जाल में फँसेगा?"}
script:
  - >-
    हर सुबह, गोरखपुर की उस हवेली की सफ़ेद दीवार पर चॉक से बने छोटे-छोटे पुतले दिखते थे। हाथ-पैर फैलाए, जैसे नाच रहे हों। और हर बार उन्हें देखकर, हवेली की मालकिन इला बेहोश हो जाती थी।
  - >-
    बच्चों का मज़ाक? या कोई संदेश? हर पुतला अलग था। किसी का हाथ ऊपर, किसी का पैर मुड़ा हुआ, किसी के हाथ में झंडा। हर सुबह दीवार पर नाचते पुतले... और हर पुतला एक संदेश।
  - >-
    मैं सावित्री हूँ। ठाकुर हीरालाल कुँवर, गन्ने के खेतों के मालिक, एक भले और सीधे आदमी, उन पुतलों की नक़ल लेकर विक्रम के पास आए। "मेरी पत्नी डर से मर रही है, विक्रम बाबू। पर वो कुछ बताती नहीं।"
  - >-
    हीरालाल ने इला से कलकत्ता में शादी की थी। शादी से पहले इला ने उनसे एक वादा लिया था... "मेरे अतीत के बारे में कभी मत पूछना।" हीरालाल ने वादा निभाया। पर अब वही वादा उन्हें खा रहा था।
  - >-
    विक्रम ने काग़ज़ मेज़ पर फैलाए, और पूरी रात उन पर झुके रहे। सुबह होते-होते उनकी आँखें चमक रही थीं। "ये बच्चों का खेल नहीं, सावित्री। ये एक गुप्त लिपि है। हर पुतला एक अक्षर है।"
  - >-
    "जो पुतला सबसे ज़्यादा बार आता है, वो 'अ' होगा, क्योंकि हिंदी में वही सबसे आम है। और जिस पुतले के हाथ में झंडा है, वहाँ एक शब्द ख़त्म होता है।" वो एक-एक अक्षर जोड़ने लगे।
  - >-
    पहला शब्द बना... "इ-ला"। फिर अगली नक़ल में... "आ-जा-ओ"। इला, आ जाओ। कोई इला को बुला रहा था। फिर हीरालाल ने एक नई नक़ल भेजी। विक्रम ने उसे पढ़ा, और कुर्सी से उछल पड़े।
  - >-
    नया संदेश था... "इला, भगवान के पास जाने को तैयार हो जा।" विक्रम चीखे, "सावित्री, अपना बैग उठाओ! गोरखपुर की पहली गाड़ी!" पर पहली गाड़ी सुबह थी।
  - >-
    हम सुबह गोरखपुर स्टेशन पहुँचे। स्टेशन मास्टर ने हमें देखते ही पूछा, "आप ठाकुर साहब की हवेली जा रहे हैं? आपने सुना नहीं? कल रात वहाँ गोली चली है।"
  - >-
    हम बहुत देर से पहुँचे थे। ठाकुर हीरालाल कुँवर मर चुके थे। इला बुरी तरह घायल थीं, बेहोश। पुलिस कह रही थी, इला ने पति को गोली मारकर ख़ुद को मारने की कोशिश की।
  - >-
    रुकिए। अब तक आपने कुछ पुतले और उनके अक्षर देख लिए हैं। इस लिपि को आप भी तोड़ सकते हैं। सोचिए... अगर आप विक्रम होते, तो इसी लिपि से क़ातिल को कैसे पकड़ते?
  - >-
    विक्रम ने कमरे को ध्यान से देखा। "यहाँ दो गोलियाँ चली हैं, एक नहीं। और खिड़की पर बारूद का निशान है। एक गोली बाहर से चली थी।" बाहर फूलों की क्यारी में एक आदमी के जूतों के गहरे निशान थे।
  - >-
    हवेली के पास एक फ़ार्म पर एक अजनबी ठहरा था, कलकत्ता से आया हुआ। विक्रम ने चॉक उठाई, और नाचते पुतलों में एक संदेश लिखा। फिर एक लड़के के हाथ उसे उस फ़ार्म पर भिजवा दिया।
  - >-
    संदेश था... "तुरंत आओ।" पुतलों की उसी लिपि में, जो सिर्फ़ इला और वो अजनबी जानते थे। "वो सोचेगा, ये इला ने लिखा है," विक्रम बोले। "और वो ज़रूर आएगा।"
  - >-
    शाम ढलने लगी। हम अँधेरे कमरे में इंतज़ार करते रहे। तभी फाटक खुला। एक लंबा, चौड़ा आदमी तेज़ क़दमों से अंदर आया। भीमा सरदार। कलकत्ता के अपराध की दुनिया का सबसे ख़तरनाक नाम।
  - >-
    जैसे ही उसने दरवाज़ा खोला, स्थानीय इंस्पेक्टर और सिपाहियों ने उसे दबोच लिया। वो दहाड़ा, "इला! इला ने बुलाया था!" विक्रम ने चॉक उसके सामने रखी। "नहीं, भीमा। मैंने बुलाया था।"
  - >-
    भीमा ने सब उगल दिया। इला कलकत्ता के एक गैंग सरदार की बेटी थी। ये पुतलों वाली लिपि उसी गैंग की थी, जिसे उसके पिता ने बनाया था। और भीमा कभी इला का मंगेतर था।
  - >-
    "इला उस दुनिया से भागकर यहाँ आ गई। मैं उसे वापस ले जाना चाहता था। उस रात उसके पति ने मुझ पर गोली चलाई, मैंने भी चलाई। मैं इला को कभी चोट नहीं पहुँचाना चाहता था।"
  - >-
    इला बच गई। होश में आकर उसने बताया, पति को मरा देखकर उसने ख़ुद को दोष दिया था। विक्रम बोले, "दो गोलियाँ, क्यारी में जूते, और एक लिपि, जिसे क़ातिल ख़ुद पढ़ सकता था... सच हमेशा छोटी चीज़ों में छिपा होता है।"
  - >-
    भीमा की जेब से गैंग की पूरी लिपि की चाबी मिली। आख़िर में एक ख़ास पुतला था, जो किसी अक्षर का नहीं था। एक कमल का फूल। और उसके आगे लिखा था... 'सरदार'।
  - >-
    भीमा ने दाँत पीसकर कहा, "मुझे पकड़कर ख़ुश हो, जासूस? हमारे ऊपर भी कोई है... कमल।" और उसकी जेब में एक आख़िरी संदेश मिला, उसी लिपि में।
  - >-
    विक्रम ने उसे पढ़ा... "पंकज को ख़बर दो।" पंकज। किसी आदमी का नाम? विक्रम ने उसी रात बनारस में पंकज नाम के हर बदनाम आदमी की सूची मँगवाई। क्या विक्रम सही दिशा में सोच रहे थे? कमेंट में लिखिए।
