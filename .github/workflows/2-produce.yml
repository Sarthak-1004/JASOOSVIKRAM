name: "2 Produce videos + send review"
# 15:00 IST day before: images, voice, render, Telegram review
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date: today / tomorrow / YYYY-MM-DD"
        default: "tomorrow"
      force:
        description: "Redo even if this date was already done"
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: thriller-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q -r requirements.txt
      - run: python pipeline.py produce --date "${{ inputs.date || 'tomorrow' }}" ${{ inputs.force && '--force' || '' }}
      - name: Save media for later stages
        if: always()
        run: rm -rf work/*/seg_* work/*/*_raw.mp4 work/*/*_preview.mp4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media
          path: work/
          retention-days: 3
          if-no-files-found: ignore
