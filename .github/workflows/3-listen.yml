name: "3 Review listener (Telegram)"
# 19:25 IST day before: answers your Telegram commands until 01:00
on:
  schedule:
    - cron: "55 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date: today / tomorrow / YYYY-MM-DD"
        default: "tomorrow"
permissions:
  contents: write
  actions: read
concurrency:
  group: thriller-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q -r requirements.txt
      - name: Get rendered media from earlier run
        run: |
          DATE=$(python -c "from src.common import resolve_date; print(resolve_date('${{ inputs.date || 'tomorrow' }}'))")
          RUN=$(python -c "import json,sys; print(json.load(open(f'state/{sys.argv[1]}.json')).get('media_run_id') or '')" $DATE 2>/dev/null || true)
          if [ -n "$RUN" ]; then gh run download "$RUN" -n media -D work || echo "media download failed"; fi
      - run: python pipeline.py listen --date "${{ inputs.date || 'tomorrow' }}"
      - name: Save media for later stages
        if: always()
        run: rm -rf work/*/seg_* work/*/*_raw.mp4 work/*/*_preview.mp4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media
          path: work/
          retention-days: 3
          if-no-files-found: ignore
