name: "4 Auto-publish deadline"
# 08:00 IST publish day: uploads everything not on hold, scheduled for today
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date: today / tomorrow / YYYY-MM-DD"
        default: "today"
      resend:
        description: "Send the final files to Telegram again"
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: thriller-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        timeout-minutes: 20
        run: bash tools/install.sh
      - name: Get rendered media from earlier run
        run: |
          DATE=$(python -c "from src.common import resolve_date; print(resolve_date('${{ inputs.date || 'today' }}'))")
          RUN=$(python -c "import json,sys; print(json.load(open(f'state/{sys.argv[1]}.json')).get('media_run_id') or '')" $DATE 2>/dev/null || true)
          if [ -n "$RUN" ]; then gh run download "$RUN" -n media -D work || echo "media download failed"; fi
      - run: python pipeline.py ${{ inputs.resend && 'resend' || 'publish' }} --date "${{ inputs.date || 'today' }}"
